# 博客文章一有变动（新增 / 修改 / 删除），自动生成英文版 index.en.md 并提交。
# 之后 Cloudflare Pages 自动重新部署，英文界面直接读这份静态英文版，不再依赖浏览器临时机翻。
#
# 手动补翻历史文章：Actions → gen-blog-en → Run workflow（勾 force 可强制全部重译）。
#
# 加固点（2026-10-31 第二轮 —— 修「Actions 打绿勾但仓库里一个字都没生成」）：
#   1. 运行前先 git pull 同步到最新 main。之前 runner 拿到的是「触发这次 push 的那个旧提交」，
#      而这段时间 gen-blog-index 可能已经往 main 推过新版 index.json，
#      两边改同一个文件 → 提交时 pull --rebase 必冲突；
#   2. 提交步骤以前写 `git pull --rebase ... || true`：rebase 冲突被 || true 吞掉，
#      工作区停在「rebase 进行中」的半死状态，后面 3 次 git push 必然全失败，
#      而 for 循环最后一条命令是 sleep、退出码 0 → 步骤照样打绿勾，翻译成果静默丢失。
#      现在 rebase 失败直接标红退出，push 三次不成也 exit 1，绝不装成功；
#   3. 索引只在提交前由本 workflow 统一重建（gen-blog-index 不再由 push 触发），
#      同一时刻只有一个程序写 blog/index.json，从根上消除双写冲突；
#   4. 运行结果写入 Actions 摘要（新增/更新/跳过/失败），不用点进日志也能一眼看清。
name: gen-blog-en
on:
  push:
    paths:
      - "blog/**"
      - "!blog/*.en.md"          # 英文版自身的变化不再触发（否则会自己套自己）
      - "!blog/**/*.en.md"
      - "!blog/index.json"
      - "!blog/thumbs/**"        # 只是缩略图变化，没必要重跑翻译
      - "scripts/gen-blog-en.mjs"
  schedule:
    - cron: "17 */6 * * *"       # 每 6 小时兜底补翻（UTC）
  workflow_dispatch:
    inputs:
      force:
        description: "强制重译全部文章（忽略内容哈希；人工英文版仍不会被覆盖）"
        type: boolean
        default: false

permissions:
  contents: write

# 关键：和 gen-blog-index 用同一个组名，两个 workflow 会排队串行执行
concurrency:
  group: blog-writer
  cancel-in-progress: false      # 翻到一半被掐掉会白烧接口调用，绝不取消

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 先同步到最新 main 再干活：否则本 workflow 是在「触发它的那个旧提交」上跑的，
      # 而这段时间 gen-blog-index 可能已经推过新版 index.json，提交时必冲突
      - name: 同步到最新 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

      - name: 生成 / 更新 / 清理英文版
        env:
          TR_DELAY_MS: "120"     # 每次请求的间隔，防止被限流
        run: node scripts/gen-blog-en.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      # 用 GITHUB_TOKEN 推送的提交不会触发其它 workflow（GitHub 防递归），
      # 所以 gen-blog-index 不会自动跟着跑 —— 在这里顺手重建索引，
      # 让 blog/index.json 的 mdEn / titleEn / descEn / tagsEn 和英文版一起进同一个提交。
      # if: always() —— 翻译失败（上一步已标红）也要把已翻好的部分和索引写回去
      - name: 同步博客索引（带上英文字段）
        if: always()
        run: node scripts/gen-blog-index.mjs

      - name: 提交英文版与索引
        if: always()
        run: |
          git add -A blog
          if git diff --cached --quiet; then
            echo "英文版无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 自动生成博客英文版（index.en.md）并更新索引"

          for i in 1 2 3; do
            if git push; then
              echo "✓ 已推送"
              exit 0
            fi
            # 远端在我们干活期间又有了新提交（多半是另一个定时任务）。
            # 这里不用 pull --rebase 硬碰：blog/index.json 两边都重写过，rebase 十有八九冲突，
            # 而冲突一旦发生，以前那个 || true 会把错误吞掉，push 连败三次还打绿勾。
            # 现在的做法：直接对齐远端最新，然后把刚生成的英文版原样留在工作区，
            # 重新算一遍索引再提交 —— en 文件不会丢，冲突也无从发生。
            echo "push 被拒（远端有新提交），对齐最新 ${GITHUB_REF_NAME} 后重新提交（$i/3）"
            git rebase --abort 2>/dev/null || true
            if ! git fetch origin "${GITHUB_REF_NAME}"; then
              echo "::error::拉取远端分支失败，本次英文版没有推送"
              exit 1
            fi
            if ! git reset --soft "origin/${GITHUB_REF_NAME}"; then
              echo "::error::对齐远端提交失败，本次英文版没有推送"
              exit 1
            fi
            node scripts/gen-blog-index.mjs || true
            git add -A blog
            if git diff --cached --quiet; then
              echo "对齐远端后已无差异（说明这批改动别人已经推过）"
              exit 0
            fi
            git commit -m "chore: 自动生成博客英文版（index.en.md）并更新索引"
            sleep 2
          done

          echo "::error::推送失败 3 次，本次生成的英文版没有进仓库，下次运行会重来"
          exit 1
