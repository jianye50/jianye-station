  const out=lines.slice();
  const jobs=[];
  const tableRows=[];      /* 表格行：整行送翻会把竖线结构弄坏，得按格拆开翻 */
  const mediaRows=[];      /* 媒体指令行：只翻方括号里的标签，@file(路径) 一个字都不能动 */
  let inCode=false;
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(/^\s*(```|~~~)/.test(line)){inCode=!inCode;out[i]=line;continue;}
    if(inCode){out[i]=line;continue;}
    /* @file[演示](demo.mp4) / @motion[循环](loop.mp4) / @gallery[图集](a.jpg,b.jpg)：
       整行送翻会把指令名和路径一起翻坏，媒体直接渲染不出来。只翻标签文字 */
    const md=line.match(/^([ \t]*@(?:file|embed|audio|gallery|motion|link)\[)([^\]]*)(\]\([^)]*\)[ \t]*)$/);
    if(md){
      if(trNeed(md[2],dir))mediaRows.push({i,pre:md[1],label:md[2],post:md[3]});
      continue;
    }
    if(!line.trim()
      ||/^\s*(<|<!--|!\[)/.test(line)
      ||/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)
      ||!trNeed(line,dir)){ out[i]=line; continue; }
    if(/^\s*\|/.test(line)){ tableRows.push({i,line}); continue; }
    jobs.push({i,line});
  }
  /* 先按行分类再分组：只有「连续的纯段落行」才打包合翻；
     标题/列表/引用行有行首结构标记，混进合翻组会被引擎弄坏，必须逐行翻。
     如果先切组再判断「整组都是段落」，段落和结构行一混组就全退化成逐行。 */
  const GROUP=6;
  const isStruct=line=>/^#{1,6}\s/.test(line)||/^\s*([-*+]|\d+[.)])\s/.test(line)||/^>\s?/.test(line);
  /* 行内含行内代码 / 链接 / 图片的行也必须逐行翻：translateLine 会把它们摘成
     占位符再送翻，合组翻译则是整段原样发出去，代码与 URL 容易被翻坏。 */
  const hasInline=/`|!\[|\]\(/;
  const singles=[];        /* 结构行 / 含行内标记的行：逐行翻 */
  const groups=[];         /* 纯段落组：合并成一次请求 */
  let bundle=[];
  const flush=()=>{ if(bundle.length){groups.push(bundle);bundle=[];} };
  for(const j of jobs){
    if(isStruct(j.line)||hasInline.test(j.line)){ flush(); singles.push(j); }
    else{ bundle.push(j); if(bundle.length>=GROUP)flush(); }
  }
  flush();
  const byLine=async g=>{   /* 整组失败的兜底：组内逐行翻，成功几行算几行 */
    await trPool(g,2,async j=>{ out[j.i]=await translateLine(j.line,dir); });
  };
  await trPool(singles,2,async j=>{ out[j.i]=await translateLine(j.line,dir); });
  await trPool(groups,2,async g=>{
    const joined=g.map(j=>j.line).join("\n");
    try{
      const tr=await gTranslate(joined,dir);
      const parts=String(tr).split(/\r?\n/).map(s=>s.trim());
      if(parts.length===g.length&&parts.every(s=>s)){
        g.forEach((j,k)=>{out[j.i]=parts[k];});
      }else{
        await byLine(g);     /* 行数没对齐：这组别硬塞，退回逐行 */
      }
    }catch(e){
      await byLine(g);
    }
  });
  await trPool(tableRows,2,async r=>{ out[r.i]=await translateTableRow(r.line,dir); });
  /* 媒体行的标签：翻失败就保留原标签，指令与路径原样拼回 */
  await trPool(mediaRows,2,async r=>{
    let lab=r.label;
    try{ const t=await gTranslate(r.label,dir); if(t&&t.trim())lab=t.trim(); }catch(e){}
    if(/[\[\]]/.test(lab))lab=r.label;           /* 译文里冒出方括号会破坏语法 */
    out[r.i]=r.pre+lab+r.post;
  });
  return out.join("\n");
}
/* 表格行翻译：把 `| a | b |` 拆成格子逐格翻，再按原顺序拼回去。
   整行送翻最省事，但竖线在译文里会被吞掉或重复，表格直接塌；
   分隔行（| --- | :--: |）没有可翻文字，trNeed 已在上游挡掉。
   单格译文里若冒出竖线，这一格保留原文 —— 宁可一格是原文，不能让整行错列。 */
async function translateTableRow(line,dir){
  const m=String(line).match(/^(\s*\|)([\s\S]*)(\|\s*)$/);
  if(!m)return line;
  const cells=m[2].split("|");
  const idxs=[];
  cells.forEach((c,i)=>{ if(trNeed(c,dir))idxs.push(i); });
  if(!idxs.length)return line;
  await trPool(idxs,3,async i=>{
    const pad=cells[i].match(/^(\s*)([\s\S]*?)(\s*)$/);
    if(!pad)return;
    const t=await translateLine(pad[2],dir);
    if(!t||t.includes("|"))return;              /* 译坏了就留原文，保住列结构 */
    cells[i]=pad[1]+t+pad[3];
  });
  return m[1]+cells.join("|")+m[3];
}
/* 翻译标签数组：目标语言里「待翻」的标签先合并成一次请求（换行分隔、按行对齐），
   行数对不上（不同引擎对换行的处理不一样）就逐个翻，保证标签不会整组卡在原文 */
async function translateTags(tags,dir){
  const arr=(Array.isArray(tags)?tags:[]).map(x=>String(x));
  const idx=arr.map((x,i)=>trNeed(x,dir)?i:-1).filter(i=>i>=0);
  if(!idx.length)return arr;
  try{
    const out=await gTranslate(idx.map(i=>arr[i]).join("\n"),dir);
    const parts=out.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(parts.length===idx.length){
      const res=arr.slice();
      idx.forEach((orig,k)=>res[orig]=parts[k]);
      return res;
    }
  }catch(e){}
  /* 兜底：逐个翻译，成功的替换、失败的原样保留 */
  const res=arr.slice();
  let hit=0;
  await trPool(idx,3,async i=>{
    try{
      const s=await gTranslate(arr[i],dir);
      if(s&&s.trim()){ res[i]=s.trim(); hit++; }
    }catch(e){}
  });
  return hit?res:arr;
}
const TR_MEM=new Map();   /* 本次会话内缓存，避免同一篇文章来回切语言反复请求 */
/* 旧版缓存（jy-tr: / jy-trm:）里可能存着「翻译失败、标题仍是中文」的结果，会让标题一直
   显中文。只在首次运行时清一次并落个标记 —— 以前每打开一次页面都要遍历整库 localStorage，
   而当前用的键是 jy-trb2: / jy-trm2:，这段其实早就空跑了。 */
(function trPurgeOldCache(){
  try{
    if(localStorage.getItem("jy-tr-purged")==="2")return;
    const kill=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&(/^jy-tr:/.test(k)||/^jy-trm:/.test(k)||/^jy-tr2:/.test(k)))kill.push(k);
    }
    kill.forEach(k=>localStorage.removeItem(k));
    localStorage.setItem("jy-tr-purged","2");
  }catch(e){}
})();
/* 写缓存：localStorage 有 5MB 上限，整篇译文很容易把它撑满。
   配额满了就先丢掉正文译文缓存再试一次，别让「翻完了却存不下」白翻一遍 */
function lsPut(k,v){
  try{ localStorage.setItem(k,v); return true; }catch(e){}
  try{
    const kill=[];
    for(let i=0;i<localStorage.length;i++){
      const kk=localStorage.key(i);
      if(kk&&kk!==k&&/^jy-trb/.test(kk))kill.push(kk);
    }
    kill.forEach(kk=>localStorage.removeItem(kk));
    localStorage.setItem(k,v);
    return true;
  }catch(e){ return false; }
}
/* 翻译一篇完整文章：正文与「标题/摘要/标签」分开缓存。
   好处是正文翻译成功就先落盘（下次打开秒出，不再重复消耗额度），
   标题或标签偶发失败也不会连累正文白翻一遍。 */
async function translatePost(slug,title,desc,body,tags,dir){
  tags=Array.isArray(tags)?tags:[];
  dir=dir==="ezh"?"ezh":"zen";
  /* 元信息（标题/摘要/标签）复用列表页那份缓存，两边只翻一次 */
  const meta=await translatePostMeta({slug,title,desc,tags},dir);
  const bkey=trKey("jy-trb2:"+slug+":"+trHash(body),dir);
  let bb=null;
  try{ const c=localStorage.getItem(bkey); if(c)bb=JSON.parse(c).b; }catch(e){}
  if(!bb&&TR_MEM.has(bkey))bb=TR_MEM.get(bkey).b;
  if(!bb){
    bb=await translateMarkdown(body,dir);
    if(bb&&bb!==body){
      TR_MEM.set(bkey,{b:bb});
      lsPut(bkey,JSON.stringify({b:bb}));
    }
  }
  return {t:(meta&&meta.t)||title,d:(meta&&meta.d)||desc,g:(meta&&meta.g)||tags,b:bb||body};
}
/* 列表条目的轻量翻译：只翻标题 + 摘要 + 标签，不碰正文（正文进详情页才翻）。
   独立缓存 jy-trm2:...，与详情页的 jy-tr2:... 互不干扰。
   缓存里存的是 Promise：同一个条目的并发请求（打字筛选时会重渲染列表）共用一次，
   以前每次重渲染都会为同一篇再发一遍翻译请求 */
const TRM_MEM=new Map();
function translatePostMeta(post,dir){
  dir=dir==="ezh"?"ezh":"zen";
  const title=post.title||"",desc=post.desc||"",tags=Array.isArray(post.tags)?post.tags:[];
  /* 目标语言里已经「读得懂」的条目不翻：中文界面不碰中文条目，英文界面不碰英文条目。
     先看整体占比（trNeedDoc）：中文摘要里夹一个产品名的英文条目不值得发请求 */
  if(!trNeedDoc([title,desc,tags.join("\n")].join("\n"),dir))return Promise.resolve(null);
  if(!trNeed(title,dir)&&!trNeed(desc,dir)&&!tags.some(x=>trNeed(x,dir)))return Promise.resolve(null);
  const key=trKey("jy-trm2:"+(post.slug||"")+":"+trHash(title+"\u0000"+desc+"\u0000"+tags.join("\u0000")),dir);
  try{ const c=localStorage.getItem(key); if(c)return Promise.resolve(JSON.parse(c)); }catch(e){}
  if(TRM_MEM.has(key))return TRM_MEM.get(key);
  const job=(async()=>{
    const [tt,gg,dd]=await Promise.all([
      trNeed(title,dir)?gTranslate(title,dir).catch(()=> ""):Promise.resolve(""),
      translateTags(tags,dir),
      desc&&trNeed(desc,dir)?gTranslate(desc,dir).catch(()=> ""):Promise.resolve("")
    ]);
    const r={t:tt||title,g:gg,d:dd||desc};
    /* 标题 / 摘要 / 标签有任意一项该翻却没翻成就不落盘，下次打开重试，别把原文永久当成译文缓存 */
    const okT=!trNeed(title,dir)||!!tt;
    const okD=!desc||!trNeed(desc,dir)||!!dd;
    const okG=tags.every((x,i)=>!trNeed(x,dir)||(gg[i]&&gg[i]!==x));
    if(okT&&okD&&okG)lsPut(key,JSON.stringify(r));
    return r;
  })();
  /* 失败就撤掉这次记录、下次还能再试；同时给调用方一个可用的中文兜底。
     存进缓存的也是这个带兜底的 Promise —— 后来的调用方直接拿它，谁都不会抛 */
  const safe=job.catch(()=>{TRM_MEM.delete(key);return {t:title,g:tags,d:desc};});
  TRM_MEM.set(key,safe);
  return safe;
}
/* 英文界面下批量翻译博客列表：列表先按原文秒出，译文逐张无感替换。
   中文界面同理：碰到英文写的文章，翻成中文替换。
   seq 是列表代次——搜索词一变列表就重渲染，旧的翻译结果不许再写新 DOM */
let blogTrSeq=0;
function translateBlogList(list){
  const seq=++blogTrSeq;   /* 列表每重渲染一次（含切回中文）都让在途翻译全部作废 */
  if(lang!=="en"&&lang!=="zh")return;
  const dir=lang==="en"?"zen":"ezh";   /* 方向跟着界面语言走：原文语言反着翻 */
  if(!Array.isArray(list)||!list.length)return;
  /* 注意：这里不再 trResetFail()。搜索每敲一个字都会重渲染列表，
     每次都清冷却的话，接口一被限流就会「每敲一下重新撞一遍」，反而更糟。
     换文章 / 重新进博客页时已经各清一次了。 */
  const q=blogQuery;
  const slugSel=s=>".post-card[data-slug=\""+((window.CSS&&CSS.escape)?CSS.escape(s):String(s).replace(/"/g,""))+"\"]";
  trPool(list,4,async p=>{
    /* 已有目标语言的静态版：直接用，不必再机翻 */
    if(dir==="zen"&&(p.titleEn||p.descEn))return;
    if(dir==="ezh"&&(p.titleZh||p.descZh))return;
    /* 卡片的语种看标题：标题是中文就是中文文章，中文界面下整张卡都不动。
       否则「把博客放进 git：GitHub + Cloudflare Pages」这种标题里夹满英文术语的
       中文文章，会连标签一起被送去翻 —— 标签「Cloudflare」翻成「云耀」纯属添乱 */
    if(dir==="ezh"&&hasCJK(p.title||""))return;
    if(dir==="zen"&&!/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/.test(p.title||""))return;
    const r=await translatePostMeta(p,dir);
    if(!r||seq!==blogTrSeq)return;               /* 期间列表已重渲染：放弃 */
    p._tr={t:r.t,d:r.d,g:r.g};                   /* 挂到数据上，英文搜索也能命中 */
    const card=document.querySelector(slugSel(p.slug));
    if(!card)return;
    const tagsEl=card.querySelector(".post-tags");
    if(tagsEl&&r.g&&r.g.length)tagsEl.innerHTML=r.g.map(x=>`<span class="tag">${esc(x)}</span>`).join("");
    const ti=card.querySelector(".post-title");
    if(ti&&r.t)ti.innerHTML=hiText(r.t,q);
    const de=card.querySelector(".post-desc");
    if(de&&r.d)de.innerHTML=hiText(r.d,q);
  });
}

/* ---------- 正文媒体：播放与兜底 ----------
   动图式视频（data-mdmotion）一篇里可能有十几个：全部强行自动播放，
   手机发热、流量也扛不住。所以只在「进入视口」时播放，滚走立刻暂停。
   动图就是「会动的画」：不提供暂停，点一下和图片一样放大查看。
   普通视频（data-mdvideo）用原生控件，额外给一个右上角的放大按钮；
   源文件缺失时换成一句人话，而不是留一个点不动的黑框。 */
let mdMotionIO=null;
/* 把正文里所有能看大的东西按 DOM 顺序收成一个列表：
   图片 / GIF / 图集 / 视频 / 循环动图。点任何一个都用同一个灯箱看。 */
function collectPostMedia(root){
  const items=[];
  root.querySelectorAll("img,video").forEach(el=>{
    if(el.closest("a"))return;                       /* 包在链接里的图：点它应该跳转 */
    if(el.tagName==="IMG"){
      const src=el.currentSrc||el.src||"";
      if(!src||/^data:/.test(src))return;            /* 占位图 / 缺图不参与 */
      const alt=el.getAttribute("alt")||"";
      items.push({el,type:"image",motion:false,name:alt||nameOf(src),src,view:src});
    }else{
      const src=el.currentSrc||el.src||"";
      if(!src)return;
      const loop=!!el.closest(".md-motion");
      items.push({el,type:"video",loop,name:el.getAttribute("title")||nameOf(src),src});
    }
  });
  return items;
}
/* 给普通视频补一个「放大」按钮：原生控件已经占了底部，按钮放右上角 */
function addExpandButtons(root){
  root.querySelectorAll(".md-media.md-video, video.md-video-inline").forEach(box=>{
    const host=box.classList.contains("md-media")?box:box.parentElement;
    if(!host||host.querySelector(".md-expand"))return;
    const b=document.createElement("button");
    b.type="button";b.className="md-expand";
    b.title=lang==="zh"?"放大查看":"View larger";
    b.setAttribute("aria-label",b.title);
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>';
    host.appendChild(b);
  });
}
/* ---------- 进度条拖不动 / 点了不回位：把「不可寻址」的媒体换成 blob ----------
   原因不在样式：有的托管线路不返回 Accept-Ranges（带 Range 的请求照样回 200 整包），
   浏览器于是判定这段媒体只能从头播 —— seekable 范围是 0~0，
   进度条点了、拖了都没反应，鼠标一松又弹回去（文件其实早就整份下完了）。
   检测到这种情况就把整段数据 fetch 成 Blob 再挂回同一个 <audio>/<video>：
   blob 一定能随意拖，而且数据本来就在 HTTP 缓存里，几乎不额外走流量。 */
const SEEK_FIX_MAX=80*1024*1024;      /* 超过这个体积就别整包读了，保持原样 */
function mediaSeekable(el){
  try{
    const s=el.seekable;
    if(!s||!s.length)return false;
    return s.end(s.length-1)-s.start(0)>0.5;
  }catch(e){ return false; }
}
function fixMediaSeek(el,limit){
  if(!el||!el.isConnected)return;
  if(el.dataset.seekfix)return;
  if(mediaSeekable(el))return;                    /* 本来就能拖，什么都不做 */
  const src=el.currentSrc||el.getAttribute("src")||"";
  if(!src||/^(blob|data):/i.test(src))return;
  el.dataset.seekfix="1";
  fetch(src,{cache:"force-cache"}).then(r=>{
    if(!r.ok)throw new Error("http "+r.status);
    const len=Number(r.headers.get("content-length"))||0;
    if(len>(limit||SEEK_FIX_MAX))throw new Error("too big");
    return r.blob();
  }).then(blob=>{
    const t=el.currentTime||0, playing=!el.paused, u=URL.createObjectURL(blob);
    el.addEventListener("loadedmetadata",()=>{
      try{ if(t>0.2)el.currentTime=t; }catch(e){}
      if(playing)el.play().catch(()=>{});
    },{once:true});
    el.src=u;
    el.load();
  }).catch(()=>{ delete el.dataset.seekfix; });   /* 拿不到就保持原样，至少还能从头播 */
}
function autoFixSeek(root){
  if(!root)return;
  if(navigator.connection&&navigator.connection.saveData)return;   /* 开了省流量模式就别偷偷整包取 */
  root.querySelectorAll("audio,video").forEach(el=>{
    if(el.classList.contains("post-bg"))return;                 /* 头图背景不需要拖 */
    if(el.hasAttribute("data-mdmotion"))return;                 /* 无声循环动图：没有进度条 */
    /* 用户真的开始听了 / 去点进度条了，才去整包取 —— 没人听就不替人下载 */
    el.addEventListener("play",()=>fixMediaSeek(el));
    el.addEventListener("pointerdown",()=>{ if(!mediaSeekable(el))fixMediaSeek(el); });
    /* 音频体积小，进文章 1.5s 后先悄悄修好：这样第一次点进度条就是有效的，
       不会出现「点一下没反应、要再点一次」 */
    if(el.tagName==="AUDIO"){
      setTimeout(()=>{
        if(!mediaSeekable(el))fixMediaSeek(el,12*1024*1024);
      },1500);
    }
  });
}
function wirePostMedia(postSlug){
  const root=document.querySelector(".post-body");
  if(!root)return;
  const reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
  const motion=Array.from(root.querySelectorAll("video[data-mdmotion]"));
  if(reduce){
    /* 系统开了「减少动态效果」：不自动播放，改成带控件的播放器，想看再点 */
    motion.forEach(v=>{
      v.autoplay=false;v.removeAttribute("data-mdmotion");
      v.controls=true;
    });
  }else if(motion.length){
    if(!mdMotionIO&&"IntersectionObserver" in window){
      mdMotionIO=new IntersectionObserver(entries=>{
        entries.forEach(en=>{
          const v=en.target;
          if(en.isIntersecting){
            if(!v.dataset.userPaused)v.play().catch(()=>{});
          }else v.pause();
        });
      },{rootMargin:"160px 0px",threshold:0.01});
    }
    motion.forEach(v=>{ if(mdMotionIO)mdMotionIO.observe(v); });
  }
  const hero=document.querySelector(".post-hero video.post-bg");
  if(hero&&reduce){hero.autoplay=false;hero.pause();}
  /* 读到真实宽高后修正占位比例（竖屏手机视频尤其需要），顺便挂上时长角标 */
  if(root){
    root.querySelectorAll("video").forEach(v=>{
      const fix=()=>{
        if(v.videoWidth&&v.videoHeight)v.style.aspectRatio=v.videoWidth+" / "+v.videoHeight;
        const box=v.closest(".md-media");
        if(!box||!v.duration||!isFinite(v.duration)||box.querySelector(".md-dur"))return;
        const m=Math.floor(v.duration/60),s=Math.round(v.duration%60);
        const tag=document.createElement("span");
        tag.className="md-badge md-dur";
        tag.textContent=m+":"+String(s).padStart(2,"0");
        box.appendChild(tag);
      };
      if(v.readyState>=1)fix(); else v.addEventListener("loadedmetadata",fix,{once:true});
    });
    /* 图片 / GIF / 图集 / 视频 / 动图 → 点开看大图（同一个灯箱，可左右翻页） */
    const items=collectPostMedia(root);
    items.forEach((p,i)=>{
      const open=e=>{
        if(e){ e.preventDefault(); e.stopPropagation(); }
        openLb(items,i,null);
      };
      if(p.type==="image"){
        p.el.addEventListener("click",open);
        p.el.setAttribute("role","button");
        p.el.setAttribute("tabindex","0");
        p.el.addEventListener("keydown",e=>{
          if(e.key==="Enter"||e.key===" "){e.preventDefault();open(e);}
        });
      }else if(p.loop){
        p.el.addEventListener("click",open);   /* 动图：点一下是放大，不是暂停 */
      }
    });
    addExpandButtons(root);
    root.querySelectorAll(".md-expand").forEach(b=>{
      b.addEventListener("click",e=>{
        e.preventDefault();e.stopPropagation();
        const box=b.closest(".md-media")||b.parentElement;
        const idx=items.findIndex(x=>x.el===box.querySelector("video"));
        if(idx>=0)openLb(items,idx,null);
      });
    });
  }
  autoFixSeek(root);
  wireTaskLists(root,postSlug);
}
/* 待办清单：可以打勾，勾选状态记在浏览器本地（不改文章文件本身）。
   同一个 slug 下次打开还是上次勾的样子。 */
function wireTaskLists(root,slug){
  if(!root)return;
  const boxes=Array.from(root.querySelectorAll("ul.md-task input[type=checkbox]"));
  if(!boxes.length)return;
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem("jy-task:"+(slug||""))||"null"); }catch(e){}
  const paint=(b,on)=>{
    b.checked=on;b.disabled=false;
    const li=b.closest("li");
    if(li)li.classList.toggle("done",on);
  };
  const persist=()=>{
    try{localStorage.setItem("jy-task:"+(slug||""),JSON.stringify(boxes.map(b=>!!b.checked)));}catch(e){}
  };
  boxes.forEach((b,i)=>{
    b.removeAttribute("disabled");
    paint(b,Array.isArray(saved)&&typeof saved[i]==="boolean"?saved[i]:b.checked);
    b.addEventListener("change",()=>{paint(b,b.checked);persist();});
    const span=b.nextElementSibling;
    if(span&&span.tagName==="SPAN")span.addEventListener("click",()=>{paint(b,!b.checked);persist();});
  });
}
/* 视频读不到（文件没传 / 名字写错 / 格式浏览器不认）→ 换成可读的提示 */
document.addEventListener("error",e=>{
  const t=e.target;
  if(!t||t.tagName!=="VIDEO")return;
  /* 头图视频读不到：直接撤掉，让 .post-hero 的渐变兜底露出来，别留一块死黑 */
  if(t.classList&&t.classList.contains("post-bg")){t.remove();return;}
  const fig=t.closest?t.closest(".md-media"):null;
  if(!fig||!fig.parentNode)return;
  const src=t.getAttribute("src")||"";
  let nm="";
  try{ nm=decodeURIComponent(String(src).split("/").pop().split(/[?#]/)[0]); }catch(err){ nm=nameOf(src); }
  const d=document.createElement("div");
  d.className="md-media-fail";
  d.innerHTML=`视频没能加载：<b>${esc(nm||"未知文件")}</b><br>`+
    `<span>${lang==="zh"?"确认这个文件已经和 index.md 一起上传（同名同目录、大小写一致），且是 mp4 / webm 这类浏览器认的格式":"Make sure the file was uploaded next to index.md (same name, same case) and is in a browser-friendly format such as mp4 or webm."}</span>`;
  fig.parentNode.replaceChild(d,fig);
},true);

async function renderPost(slug,gen){
  const t=T();
  app.innerHTML=`<section class="view">
    <div class="post-hero"></div>
    <div class="wrap"><a class="post-back" href="#/blog">${esc(t.blog.back)}</a></div>
  </section>`;
  const stale=()=>gen!==undefined&&gen!==routeGen;   /* await 期间用户已切走 → 放弃渲染 */
  const posts=await loadBlog();
  if(stale())return;
  const post=posts.find(p=>p.slug===slug);
  const fail=msg=>{ if(stale())return; app.innerHTML=`<section class="view"><div class="wrap">
    <div class="blog-empty">${msg}</div>
    <div style="text-align:center"><a class="post-back" href="#/blog">${esc(t.blog.back)}</a></div>
  </div></section>`;};
  if(!post){fail(t.blog.err);return;}
  /* 语言版本只看「界面语言」：界面是英文就读 index.en.md，界面是中文就读 index.zh.md。
     每篇文章都由 CI 预先产出中英两份（原文是哪种语言都产两份），所以正常情况下
     永远命中静态文件，页面从一开始就是访客要的语言——没有「先出原文、再等机翻」的跳变。
     命不中（还没生成 / 体检不合格）才退回原文，必要时后台机翻兜底。 */
  const want=lang==="en"?"en":"zh";
  const altURL=want==="en"
    ?(post.mdURLEn||mdEnURL(post.mdURL))
    :(post.mdURLZh||mdZhURL(post.mdURL));
  let raw="",usedAlt=false;
  try{
    let r=null,text="";
    if(altURL){
      try{ r=await fetch(altURL,{cache:"no-cache"}); }catch(e){ r=null; }
      if(r&&r.ok){
        text=await r.text();
        /* 关键防线：静态另一语言版还没生成时，SPA 兜底会返回 200 + index.html。
           开头是 HTML 或 content-type 是 text/html 的一律当「静态版缺失」，
           走下面的原文 + 后台机翻兜底，而不是把源码当正文渲染出来 */
        if(isHTMLFallbackText(text)||
           (r.headers.get("content-type")||"").toLowerCase().includes("text/html")){
          r=null;text="";
        }
        /* 第二道防线：文件在，但语言不对（自动翻译失败时写出过「只有 front matter
           是英文、正文还全是中文」的半成品）。这种文件一旦当成译文用，
           英文界面就会一直显示中文，而且再也不会触发兜底。
           英文版应该几乎没有中文；中文版应该以中文为主。 */
        else if(!altLangOk(text,want)){
          r=null;text="";
        }
        else usedAlt=true;                        /* 真的拿到了界面语言对应的静态版 */
      }else r=null;                              /* 静态版缺失/没生成：原文兜底 */
    }
    if(!r){
      r=await fetch(post.mdURL,{cache:"no-cache"});
      if(!r.ok)throw new Error(r.status);
      text=await r.text();
      if(isHTMLFallbackText(text))throw new Error("html-fallback");
    }
    raw=text;
  }catch(e){fail(t.blog.err);return;}
  if(stale())return;   /* 正文网络请求最慢，切走后回来绝不能覆盖新页面 */
  const {meta,body}=parsePost(raw);
  const title=meta.title||post.title||t.blog.untitled;
  const desc=meta.desc||post.desc||"";
  /* 最后一道防线：正文本身就已经是访客要读的语言（中文界面看中文文章、
     英文界面看英文文章），那就没有「翻译」这回事。
     index.zh.md 还没生成时，中文文章会先命中上面「静态版缺失 → 原文兜底」，
     如果这里不拦一道，就会掉进机翻分支、顶着「正在翻译成中文…」——
     中文文章在中文界面被翻译成中文，正是这条 bug。
     usedAlt 在这里代表「正文已经是界面语言」，后面就不再机翻、也不挂任何角标。
     只看正文，不看 front matter（title:/tags:/srcHash: 这些行天然是拉丁字母，
     短文会被它们拉高「外语占比」，误判成需要翻译） */
  if(!usedAlt&&isLikelyLang(body,want))usedAlt=true;
  document.title=title+" · "+t.brand;   /* 浏览器标签页 / 历史记录显示文章标题 */
  /* 标签归一化：front matter 里「tags: a, b」这种逗号写法解析出来是字符串，
     直接 .map 会抛 TypeError 导致整篇文章页渲染失败 —— 列表页已归一化，这里补上 */
  let tags=meta.tags||post.tags||[];
  if(typeof tags==="string")tags=tags.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
  if(!Array.isArray(tags))tags=[];
  const date=meta.date||post.date||"";
  const minutes=+meta.minutes||post.minutes||Math.max(1,Math.round(body.replace(/\s/g,"").length/450));
  const bg=meta.background||post.bg||"";
  /* 文章页头图优先用构建时压缩的 1600px WebP 版（bgThumb 是站点相对路径，不要再拼前缀） */
  const bgThumb=(post.bgThumb||meta.bgThumb||"");
  const bgImg=bgThumb?esc(bgThumb):(bg?esc(postSrc(post,bg)):"");
  /* 头图也可以是视频（front matter 写 background: clip.mp4）：
     无声循环自动播放，和图片头图用同一套裁切；尊重「减少动态效果」设置 */
  const bgVideo=(!bgThumb&&bg&&isVideoFile(bg))
    ?`<video class="post-bg" src="${esc(postSrc(post,bg))}" autoplay muted loop playsinline preload="metadata"></video>`
    :"";
  app.innerHTML=`
  <section class="view">
    <div class="post-hero">${bgVideo||(bgImg?`<img class="post-bg" src="${bgImg}" alt="" decoding="async" onerror="this.remove()">`:"")}</div>
    <div class="wrap">
      <a class="post-back" href="#/blog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>${esc(t.blog.back)}</a>
      <header class="post-head">
        ${tags.length?`<div class="post-tags">${tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}
        <h1>${esc(title)}</h1>
        ${desc?`<p class="post-sub">${esc(desc)}</p>`:""}
        <div class="post-meta"><span>${esc(fmtDate(date))}</span><span>·</span><span>${esc(t.blog.minutes(minutes))}</span></div>
      </header>
      <article class="post-body">${mdToHTML(body,post.imgBase,post.imgMap)}</article>
      <div class="post-end">${esc(t.blog.end)}</div>
    </div>
  </section>`;
  wirePostMedia(slug);
  /* 翻译方向只由「访客界面语言」决定，不再看文章整体是什么语言。
     以前是「正文里出现过中文就当整篇是中文」，中英混排的文章会被判成 zh：
     中文界面下 lang===srcLang，整篇一次都不翻，英文段落永远留在英文界面里；
     英文界面下方向变 zen，英文段落又被 trNeed 判为「已是目标语言」跳过。
     现在按段落跑 trNeed：已经是访客语言的段落原样保留，另一种语言的段落才送翻，
     中英混排的稿子因此能各自翻成访客要读的那一半。
     整篇要不要翻用 trNeedDoc 判（按外来行占比，而不是「有一行外文就翻」）——
     否则中文文章里夹一句英文命令，就足以让整页挂上「自动翻译暂不可用」。 */
  const trDir=lang==="en"?"zen":"ezh";
  const needTr=trNeedDoc([title,desc,body].join("\n"),trDir);
  /* 界面语言与原文不同 + 没拿到静态另一语言版：正文先按原文秒出，
     后台机器翻译，完成后无感替换（失败保留原文）。
     usedAlt 为真 = 正文已经是界面语言（静态版命中，或原文本身就是这个语言），
     这种情况绝不机翻，也不挂任何翻译角标 */
  if(!usedAlt&&needTr&&(title||desc||body.trim())){
    const trLabel=trDir==="ezh"?t.blog.translatingZh:t.blog.translating;
    const curGen=gen;
    /* 失败后可点「重试」：同一个 run 复用，不必刷新页面 */
    const run=()=>{
      const old=document.getElementById("trNote");
      if(old)old.innerHTML=`<span class="tr-spin"></span>${esc(trLabel)}`;
      else{
        const pm=document.querySelector(".post-meta");
        if(pm)pm.insertAdjacentHTML("beforeend",
          `<span class="tr-note" id="trNote"><span class="tr-spin"></span>${esc(trLabel)}</span>`);
      }
      /* 兜底：翻译接口被墙 / 限流时请求可能长时间挂着不回，
         15 秒还没结果就给「重试」，别让人一直对着 Translating… 干等 */
      const guard=setTimeout(()=>{
        const n=document.getElementById("trNote");
        if(n&&n.querySelector(".tr-spin"))n.innerHTML=
          `${esc(t.blog.trFail)} <button type="button" class="tr-retry">${esc(t.blog.trRetry)}</button>`;
      },15000);
      translatePost(slug,title,desc,body,tags,trDir).then(r=>{
        clearTimeout(guard);
        if(curGen!==undefined&&curGen!==routeGen)return;   /* 翻译期间用户切走了：别写新页面 */
        const note=document.getElementById("trNote");
        /* 一处都没翻成（通道全挂 / 网络受限）：给个「重试」，别让人对着中文空等 */
        const nothing=!r
          ||(r.b===body&&r.t===title&&(r.g||[]).join("\u0000")===(tags||[]).join("\u0000"));
        if(nothing){
          if(note)note.innerHTML=
            `${esc(t.blog.trFail)} <button type="button" class="tr-retry">${esc(t.blog.trRetry)}</button>`;
          return;
        }
        if(note)note.remove();
        const h1=document.querySelector(".post-head h1");
        if(h1&&r.t)h1.textContent=r.t;
        const pt=document.querySelector(".post-head .post-tags");
        if(pt&&r.g&&r.g.length)pt.innerHTML=r.g.map(x=>`<span class="tag">${esc(x)}</span>`).join("");
        const sub=document.querySelector(".post-sub");
        if(sub&&r.d)sub.textContent=r.d;
        const art=document.querySelector(".post-body");
        const meta=document.querySelector(".post-meta");
        if(r.b&&r.b!==body){
          /* 正文翻成了：整体替换 */
          if(art)art.innerHTML=mdToHTML(r.b,post.imgBase,post.imgMap);
          wirePostMedia(slug);   /* 整块换成新 DOM 了：动图视频要重新接上播放控制 */
          if(meta)meta.insertAdjacentHTML("beforeend",`<span class="tr-mt">${esc(t.blog.machineTrans)}</span>`);
        }else if(art&&body.trim()){
          /* 正文一行都没翻成（限流/网络问题），标题标签却翻好了：
             保留原文，但挂「翻译失败 + 重试」，别挂 Machine-translated 误导人。
             注意 note 可能刚被 remove 掉，得重新查一遍 DOM，别往脱节节点里写 */
          const html=`${esc(t.blog.trFail)} <button type="button" class="tr-retry">${esc(t.blog.trRetry)}</button>`;
          const noteNow=document.getElementById("trNote");
          if(noteNow)noteNow.innerHTML=html;
          else if(meta)meta.insertAdjacentHTML("beforeend",`<span class="tr-note" id="trNote">${html}</span>`);
        }
      }).catch(()=>{
        clearTimeout(guard);
        const note=document.getElementById("trNote");
        if(note)note.innerHTML=
          `${esc(t.blog.trFail)} <button type="button" class="tr-retry">${esc(t.blog.trRetry)}</button>`;
      });
    };
    trResetFail();          /* 新文章：清空上一篇留下的失败记录，所有引擎重新试一遍 */
    trRetry=run;            /* 供「重试」按钮调用 */
    run();
  }
}

/* ---------- 路由 ---------- */
let routeGen=0;   /* 渲染代次：异步渲染（博客列表/文章）await 期间用户可能切走页面，
                     过期的渲染继续写 DOM 会把新页面整个覆盖掉 —— 每个 await 后先校验 */
let pendingScroll=null;   /* 带锚点的路由：渲染后要缓缓滑到的板块 id */
/* 缓速滑动：比浏览器原生 smooth 更从容（约 1 秒），用户滚轮/触摸可随时打断 */
function glideTo(y,dur){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){window.scrollTo(0,y);return;}
  const startY=window.scrollY,d=y-startY,t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;   /* easeInOutCubic：起停都柔 */
  let stop=false;
  const cancel=()=>{stop=true};
  /* once 监听器在动画正常结束时并不会被消费，会一直挂着等下一次滚动；
     挂上 AbortController，结束/打断时主动撤掉，避免多次锚点导航累积监听器 */
  const ac=("AbortController" in window)?new AbortController():null;
  const opt=ac?{once:true,passive:true,signal:ac.signal}:{once:true,passive:true};
  window.addEventListener("wheel",cancel,opt);
  window.addEventListener("touchstart",cancel,opt);
  const root=document.documentElement,prev=root.style.scrollBehavior;
  root.style.scrollBehavior="auto";                    /* 逐帧设值，不能让 CSS smooth 插手 */
  let last=startY;                                     /* 单调钳制：杜绝任何帧间的 1px 回抖 */
  (function step(now){
    if(stop){root.style.scrollBehavior=prev; if(ac)ac.abort(); return;}
    const p=Math.min(1,Math.max(0,(now-t0)/dur));
    const v=startY+d*ease(p);
    last=d>=0?Math.max(last,v):Math.min(last,v);
    window.scrollTo(0,last);
    if(p<1)requestAnimationFrame(step);
    else{root.style.scrollBehavior=prev; if(ac)ac.abort();}
  })(t0);
}
function route(){
  /* 切换路由（含浏览器后退 / 前进）时灯箱还开着 → 先关掉。
     实测复现：在图库开灯箱后按浏览器返回键，背景已换成上一页，
     灯箱却浮在新页面之上，还锁着滚动。 */
  const lbNow=$("#lightbox");
  if(lbNow&&lbNow.classList.contains("open"))closeLb();
  const gen=++routeGen;
  window.__JY_RENDERED=true;   /* 标记：首屏已经真正渲染过（启动流程靠它判断要不要补渲染） */
  const hash=location.hash.replace(/^#\/?/,"");
  const parts=hash.split("/").filter(Boolean);
  let active="home";
  if(parts[0]==="gallery"){
    active="gallery";
    /* 子相册名写进 hash（#/gallery/<相册>）：刷新能停在同一相册，
       浏览器返回键也能从子相册退回「全部」，而不是直接退到站外 */
    let alb="";
    if(parts[1]){ try{ alb=decodeURIComponent(parts.slice(1).join("/")); }catch(e){} }
    galleryFilter=alb;
    renderGallery();
  }
  else   if(parts[0]==="blog"){
    active="blog";
    if(parts[1]){
      /* slug 解码包一层兜底：孤立的 %（链接被截断等）会抛 URIError，别让它卡死路由 */
      let slug="";
      try{ slug=decodeURIComponent(parts.slice(1).join("/")); }catch(e){}
      renderPost(slug,gen);
    }
    else renderBlog(gen);
  }
  else if(parts[0]==="projects"){
    active="projects";renderProjects();
  }
  else if(parts[0]==="about"){
    /* 旧链接 #/about/projects（项目当年嵌在关于页时的锚点）→ 换到新的「项目」页 */
    if(parts[1]==="projects"){location.replace("#/projects");return}
    active="about";renderAbout();
  }
  else renderHome();
  /* 导航高亮：博客 / 相册都归在「记录」这一项下；顺手标 aria-current，读屏能知道当前在哪一页 */
  const navActive=(active==="blog"||active==="gallery")?"records":active;
  document.querySelectorAll(".nav-link").forEach(el=>{
    const on=el.dataset.nav===navActive;
    el.classList.toggle("active",on);
    /* 「记录」是按钮：用 true 表示所在分区；真正的页面链接才用 page */
    if(on)el.setAttribute("aria-current",el.tagName==="BUTTON"?"true":"page");
    else el.removeAttribute("aria-current");
  });
  /* 二级菜单里标出当前真正所在的子页面（博客 / 相册） */
  document.querySelectorAll(".nav-menu-item").forEach(el=>{
    el.classList.toggle("cur",el.dataset.nav===active);
  });
  closeNavDrop();   /* 切页后收起「记录」菜单，别让它悬在新页面上 */
  /* 页脚文案跟随语言（#siteFooter 在所有视图之外，静态默认中文兜底） */
  const ft=$("#siteFooter");
  if(ft)ft.textContent=T().footer;
  /* 每页一个独立标题：浏览器历史记录能区分「博客 / 相册 / 关于」
     （文章页等正文加载后会覆盖成文章标题，见 renderPost） */
  document.title=(active==="home")?T().brand:(T().nav[active]+" · "+T().brand);
  /* 切页回到顶部：html 上挂着 scroll-behavior:smooth，
     这里先临时关掉再滚，免得每次切页都慢慢「滑」上去 */
  const root=document.documentElement,
        prevSmooth=root.style.scrollBehavior;
  root.style.scrollBehavior="auto";
  /* 带锚点的路由（预留能力）：pendingScroll 指定板块 id 时，
     先展示页面顶部，再缓缓下滑到该板块 */
  const anchor=pendingScroll?document.getElementById(pendingScroll):null;
  pendingScroll=null;
  if(anchor){
    const y=anchor.getBoundingClientRect().top+window.scrollY-86;
    window.scrollTo(0,0);
    root.style.scrollBehavior=prevSmooth;
    requestAnimationFrame(()=>glideTo(y,950));
  }else{
    window.scrollTo(0,0);
    root.style.scrollBehavior=prevSmooth;
  }
}
window.addEventListener("hashchange",route);

/* ---------- 导航「记录」二级菜单：悬浮 / 单击都能展开 ----------
   · 桌面（hover:hover + 精确指针）：移入即开，移开稍等 240ms 再收
     （面板与导航只差 2px，鼠标一移开就收会显得太急；这点延时也留出从按钮点到面板的时间）
   · 触屏 / 无精确指针：只认单击切换，避免 tap 之后又被 mouseenter 抢开
   · 点页面空白、按 Esc、点菜单项、切换路由都会收起 */
const navDrop=$("#navDrop"),navDropBtn=$("#navDropBtn"),navMenu=$("#navMenu");
let dropTimer=0;
function canHoverNav(){
  try{return matchMedia("(hover:hover) and (pointer:fine)").matches;}catch(e){return false;}
}
/* 面板在 <nav> 之外：用按钮的屏幕位置把它摆到「记录」正下方居中。
   导航是 position:fixed，滚动不会动，所以只在展开 / 改窗口大小 / 切语言时算一次就够 */
function placeNavMenu(){
  if(!navMenu||!navDropBtn)return;
  const b=navDropBtn.getBoundingClientRect();
  /* 间距从「导航条底边」算，不是从按钮底边算（按钮比条子矮，按按钮算会缩进条子里） */
  const bar=document.getElementById("nav");
  const edge=(bar?bar.getBoundingClientRect().bottom:b.bottom);
  const gap=parseFloat(getComputedStyle(navMenu).getPropertyValue("--nav-gap"))||0;
  navMenu.style.left=(b.left+b.width/2).toFixed(1)+"px";
  navMenu.style.top=(edge+gap).toFixed(1)+"px";
}
function openNavDrop(){
  if(!navDrop)return;
  clearTimeout(dropTimer);
  if(!navDrop.classList.contains("open")){
    /* 歌单面板就挂在导航正下方：别让两个面板叠在一起，先把音乐面板收起来 */
    const mp=$("#mpWrap");
    if(mp&&mp.classList.contains("open")){const b=$("#musicBtn"); if(b)b.click();}
  }
  placeNavMenu();          /* 先摆好位置再加 open，避免在旧位置闪一下 */
  navDrop.classList.add("open");
  if(navMenu)navMenu.classList.add("open");
  if(navDropBtn)navDropBtn.setAttribute("aria-expanded","true");
}
function closeNavDrop(){
  clearTimeout(dropTimer);
  if(!navDrop||!navDrop.classList.contains("open"))return;
  navDrop.classList.remove("open");
  if(navMenu)navMenu.classList.remove("open");
  if(navDropBtn)navDropBtn.setAttribute("aria-expanded","false");
}
function closeNavDropSoon(ms){
  clearTimeout(dropTimer);
  dropTimer=setTimeout(closeNavDrop,ms==null?240:ms);
}
/* ---------- 「记录」⇄「回到顶部」----------
   往下翻页超过一屏，「记录」的文字淡出、向上箭头转进来；点它缓缓回到顶部。
   回到顶部后箭头再变回「记录」，这时点「记录」才是展开二级菜单。
   进入 / 退出用两个阈值（300 / 20），停在临界点时不会来回闪 */
const NAV_TOP_ON=300,NAV_TOP_OFF=20;
let navToTop=false,navScrollRaf=0;
function navTopText(){
  try{const s=T();if(s&&s.backTop)return s.backTop;}catch(e){}
  return "回到顶部";
}
function syncNavTop(onlyLabel){
  /* 启动早期可能还在 const 的 TDZ 里，拿不到就安静跳过 */
  try{ if(!navDrop||!navDropBtn)return; }catch(e){ return; }
  const y=window.scrollY||document.documentElement.scrollTop||0;
  if(onlyLabel){                       /* 切语言：只同步无障碍名称 */
    if(navToTop)navDropBtn.setAttribute("aria-label",navTopText());
    return;
  }
  const want=navToTop?(y>NAV_TOP_OFF):(y>NAV_TOP_ON);
  if(want===navToTop)return;
  navToTop=want;
  navDrop.classList.toggle("to-top",want);
  if(want){
    /* 形变成箭头时，二级菜单不该还开着（启动早期这个函数可能还没就绪，忽略即可） */
    try{ closeNavDrop(); }catch(e){}
    navDropBtn.setAttribute("aria-haspopup","false");
    navDropBtn.removeAttribute("aria-controls");
    navDropBtn.setAttribute("aria-label",navTopText());
  }else{
    navDropBtn.setAttribute("aria-haspopup","true");
    navDropBtn.setAttribute("aria-controls","navMenu");
    navDropBtn.removeAttribute("aria-label");
  }
}
window.addEventListener("scroll",()=>{
  if(navScrollRaf)return;
  navScrollRaf=requestAnimationFrame(()=>{navScrollRaf=0;syncNavTop();});
},{passive:true});
syncNavTop();   /* 带锚点直接落进文章中部（或刷新时已在半途）也要一开始就对 */
if(navDrop&&navDropBtn){
  /* 触屏点按后浏览器会补一轮 mouseenter，别让它把刚点开的菜单又抢着改状态 */
  let lastTouchTs=0;
  window.addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch")lastTouchTs=Date.now();
  },{capture:true,passive:true});
  navDropBtn.addEventListener("click",e=>{
    e.preventDefault();
    /* 回顶形态：这一下只负责回到顶部（菜单保持收起） */
    if(navToTop){
      closeNavDrop();
      glideTo(0,720);
      return;
    }
    const isOpen=navDrop.classList.contains("open");
    /* 鼠标还悬在按钮上时，菜单是 hover 打开的：这一下点击不再收起，
       否则菜单会在指针正上方凭空消失（要收就移开、点空白或按 Esc）。
       触屏 / 键盘的点击（pointerType 不是 mouse）照常切换 */
    const byMouse=e.pointerType?e.pointerType==="mouse":canHoverNav();
    if(isOpen&&byMouse&&navDrop.matches(":hover"))return;
    if(isOpen)closeNavDrop();
    else openNavDrop();
  });
  navDrop.addEventListener("mouseenter",()=>{
    if(navToTop)return;                /* 已是「回到顶部」：悬浮不再弹菜单 */
    if(canHoverNav()&&Date.now()-lastTouchTs>800)openNavDrop();
  });
  navDrop.addEventListener("mouseleave",()=>{if(canHoverNav())closeNavDropSoon(240)});
  /* 面板已不在 navDrop 里，hover 进出得单独挂一份，鼠标移到面板上才不会当成「移开」 */
  if(navMenu){
    navMenu.addEventListener("mouseenter",()=>{
      if(canHoverNav()&&Date.now()-lastTouchTs>800)openNavDrop();
    });
    navMenu.addEventListener("mouseleave",()=>{if(canHoverNav())closeNavDropSoon(240)});
  }
  /* 键盘：焦点在按钮上按 ↓ 展开并进入第一项 */
  navDropBtn.addEventListener("keydown",e=>{
    if(e.key!=="ArrowDown"||navToTop)return;
    e.preventDefault();openNavDrop();
    /* 等一帧再聚焦：面板刚从 visibility:hidden 转成可见，
       同一帧里 focus() 会被浏览器忽略（元素此刻还算不可见） */
    const first=$("#navMenu .nav-menu-item");
    if(first)requestAnimationFrame(()=>{try{first.focus();}catch(err){}});
  });
  /* 点菜单项：hash 照常跳转，菜单立刻收起 */
  if(navMenu){
    navMenu.addEventListener("click",e=>{
      if(e.target.closest(".nav-menu-item"))closeNavDrop();
    });
  }
  /* 点空白处收起：按下就判定，比 click 更早，也不会被后续重绘干扰 */
  document.addEventListener("pointerdown",e=>{
    if(!navDrop.classList.contains("open"))return;
    if(navDrop.contains(e.target))return;
    if(navMenu&&navMenu.contains(e.target))return;
    closeNavDrop();
  },true);
  document.addEventListener("keydown",e=>{
    if(e.key!=="Escape"||!navDrop.classList.contains("open"))return;
    /* 键盘用户（焦点在菜单里）收起后把焦点还给按钮；用鼠标开着、人却在搜索框里打字时别抢焦点 */
    const inDrop=navDrop.contains(document.activeElement)||(navMenu&&navMenu.contains(document.activeElement));
    closeNavDrop();
    if(inDrop){try{navDropBtn.focus();}catch(err){}}
  });
  /* 面板位置跟着按钮走：窗口尺寸变了、字体变了（中英切换）都得重摆 */
  window.addEventListener("resize",()=>{
    if(navDrop.classList.contains("open"))placeNavMenu();
  });
  if(document.fonts&&document.fonts.ready){
    document.fonts.ready.then(()=>{if(navDrop.classList.contains("open"))placeNavMenu()}).catch(()=>{});
  }
}

/* ---------- 交互绑定 ---------- */
$("#langBtn").addEventListener("click",()=>setLang(lang==="zh"?"en":"zh",true));
$("#lbClose").addEventListener("click",closeLb);
$("#lbPrev").addEventListener("click",e=>{e.stopPropagation();stepLb(-1)});
$("#lbNext").addEventListener("click",e=>{e.stopPropagation();stepLb(1)});
$("#lbMotionBtn").addEventListener("click",e=>{e.stopPropagation();lbToggleLive()});
$("#lbSoundBtn").addEventListener("click",e=>{e.stopPropagation();lbToggleSound()});
/* 动态视频解析出来却播不动（罕见坏数据）→ 自动退回静态照片，别卡在黑屏 */
$("#lbVideo").addEventListener("error",()=>{
  if(lbMotionOn){ lbMotionOn=false; applyLbMotion(); }
});
/* Windows 同款：动态效果播完一次自动回到静态照片 */
$("#lbVideo").addEventListener("ended",()=>{
  if(lbMotionOn){ lbMotionOn=false; applyLbMotion(); }
});
$("#lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox")closeLb()});
/* 点图片 = 在「适应屏幕」与「原始尺寸」之间切换；放大后容器可滚动，
   想看哪一块就拖/滚到哪一块（手机上直接双指缩放也行） */
$("#lbImg").addEventListener("click",e=>{
  if(!$("#lightbox").classList.contains("open"))return;
  e.stopPropagation();
  $("#lightbox").classList.toggle("lb-zoom");
});
/* 移动端：灯箱里左右滑动切上一张/下一张。
   垂直位移过大不触发；手势落在箭头/控制条/视频上时不抢（视频可能是在拖进度） */
let lbTouch=null;
$("#lightbox").addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  const t=e.touches[0];
  lbTouch={x:t.clientX,y:t.clientY};
},{passive:true});
$("#lightbox").addEventListener("touchend",e=>{
  if(!lbTouch)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-lbTouch.x,dy=t.clientY-lbTouch.y;
  lbTouch=null;
  if(Math.abs(dx)<48||Math.abs(dx)<Math.abs(dy)*1.5)return;
  if(e.target.closest(".lb-btn,.lb-motion,video"))return;
  if($("#lightbox").classList.contains("lb-zoom"))return;   /* 放大态：滑动是在看局部，别翻页 */
  stepLb(dx<0?1:-1);
},{passive:true});
$("#lightbox").addEventListener("touchcancel",()=>{lbTouch=null;},{passive:true});
document.addEventListener("click",e=>{
  /* 相册页在子相册里时再点导航「相册」（记录 → 相册）→ 回到全部相册（hash 会同步改回 #/gallery） */
  const nav=e.target.closest(".nav-link,.nav-menu-item");
  if(nav&&nav.dataset.nav==="gallery"&&galleryFilter){ openAlbum(""); return; }
  /* 首屏那个滚动提示：点一下平滑滚到相册预览 */
  const sc=e.target.closest("[data-scroll-to]");
  if(sc){
    const target=document.getElementById(sc.dataset.scrollTo);
    if(target)target.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  /* 子相册卡片：进入该相册；返回按钮：回到全部 */
  const alb=e.target.closest("[data-album]");
  if(alb){ openAlbum(alb.dataset.album||""); return; }
  const albBack=e.target.closest("[data-album-back]");
  if(albBack){ openAlbum(""); return; }
  const tile=e.target.closest(".ph-tile");
  if(!tile||tile.dataset.idx===undefined||tile.classList.contains("ph-skel"))return;
  /* 带「+N」角标的瓷砖 → 跳转相册页，而不是开灯箱 */
  if(tile.querySelector(".ph-more")){openAlbum("");return;}
  const grid=tile.closest("[data-photo-grid]");
  lbPreheat(tile);
  openLb((grid&&grid._items)||photos,Number(tile.dataset.idx),grid);
});
/* 手指按下 / 鼠标移上去就先预热（提前发清晰图请求），真正 click 时往往已经在路上 */
document.addEventListener("pointerdown",e=>{
  const tile=e.target.closest&&e.target.closest(".ph-tile");
  if(!tile||tile.classList.contains("ph-skel")||tile.dataset.idx===undefined)return;
  if(tile.querySelector(".ph-more"))return;
  lbPreheat(tile);
},{passive:true});
let lbHoverTimer=0;
document.addEventListener("mouseover",e=>{
  const tile=e.target.closest&&e.target.closest(".ph-tile");
  if(!tile||tile.classList.contains("ph-skel")||tile.dataset.idx===undefined)return;
  if(tile.querySelector(".ph-more"))return;
  /* 悬停 140ms 才算「有意思」，避免鼠标划过整墙时把 view 全下一遍 */
  clearTimeout(lbHoverTimer);
  lbHoverTimer=setTimeout(()=>lbPreheat(tile),140);
});
document.addEventListener("mouseout",e=>{
  const tile=e.target.closest&&e.target.closest(".ph-tile");
  if(tile)clearTimeout(lbHoverTimer);
});
/* 动态瓷砖：悬停播放动态效果，移开还原成静态照片。
   普通图片首次悬停时顺带探测是不是动态照片（内嵌视频），是就升级成动态。 */
document.addEventListener("mouseover",e=>{
  const tile=e.target.closest(".ph-tile");
  if(!tile||tile.classList.contains("ph-skel")||tile.dataset.idx===undefined)return;
  const grid=tile.closest("[data-photo-grid]");
  const p=((grid&&grid._items)||[])[Number(tile.dataset.idx)];
  if(!p)return;
  if(tile.classList.contains("is-live")){
    const v=tile.querySelector(".ph-live-v");
    if(v){ v.style.display="block"; v.play().catch(()=>{}); return; }
    /* 清单里已标为动态照片，但视频还没解析 → 现在按需取这一张的原图 */
    if(p.type==="image"&&p.motion)promoteMotion(p,tile,true);
    return;
  }
  /* 只有「不知道是不是动态」的旧扫描模式才现场探测；
     清单模式已知是静态图，就不必为它下载原图 */
  if(p.type==="image"&&p.motion===undefined)promoteMotion(p,tile,true);
});
document.addEventListener("mouseout",e=>{
  const tile=e.target.closest(".ph-tile.is-live"); if(!tile)return;
  const v=tile.querySelector(".ph-live-v");
  if(v){ v.pause(); try{ v.currentTime=0; }catch(err){} v.style.display="none"; }
});
document.addEventListener("keydown",e=>{
  if($("#lightbox").classList.contains("open")){
    if(e.key==="Escape")closeLb();
    else if(e.key==="ArrowLeft")stepLb(-1);
    else if(e.key==="ArrowRight")stepLb(1);
    else if(e.key==="Tab"){
      /* 焦点圈定：Tab 只在灯箱内可见的按钮间循环，别跑到被遮住的背景页面里。
         不能用 offsetParent 判断 —— 放大态（lb-zoom）下按钮是 position:fixed，
         offsetParent 恒为 null，会把所有按钮误判成不可见、焦点圈定整个失效 */
      const btns=Array.from($("#lightbox").querySelectorAll("button"))
        .filter(b=>(typeof b.getClientRects==="function")?b.getClientRects().length>0:b.offsetParent!==null);
      if(btns.length){
        const first=btns[0],last=btns[btns.length-1];
        if(!$("#lightbox").contains(document.activeElement)){e.preventDefault();first.focus();}
        else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
    }
    return;
  }
  const tile=document.activeElement;
  if(tile&&tile.classList&&tile.classList.contains("ph-tile")&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();
    if(tile.querySelector(".ph-more")){openAlbum("");return;}
    const grid=tile.closest("[data-photo-grid]");
    lbPreheat(tile);
    openLb((grid&&grid._items)||photos,Number(tile.dataset.idx),grid);
  }
});

/* ---------- 启动 ----------
   思路就一句话：加载屏掀开之前，把该准备的全准备好，页面已经是最终样子。
     1) <head> 里先做域名检测（__JY_DOMAIN_CHECK）：判定要跳转就立刻跳，
        加载屏原地转圈，绝不让人看到半成品首页；
     2) 所有配置与数据一起拉（profile / 项目 / 友链 / 游戏 / 相册清单），
        统一等它们到位（最多 3.5 秒）—— 全在加载屏后面读完；
     3) 配置齐了才做第一次、也是唯一一次渲染：站名、背景、板块一次到位；
     4) 等背景大图解码完成 + 页面 load 完成；
     5) 揭幕：加 html.jy-go 让「背景推近 + 文字上浮」两条动画从 0 帧开始播，
        同时极短地淡出加载屏 —— 动画一定看得见。 */
window.__JY_PROFILE_DONE=loadProfile();   /* 站名 / 背景 / 域名 / 个人信息 */
const bootLoads=[                          /* 揭幕前要一起等齐的几路数据 */
  window.__JY_PROFILE_DONE,
  loadPhotos(),      /* 相册清单：首屏图墙要用 */
  loadProjects(),    /* 项目板块 */
  loadFriends(),     /* 友链 */
  loadSteam()        /* 游戏模块 */
];
/* 等首页背景大图真正加载完（加载失败也算完，别卡死） */
function heroBgReady(){
  return new Promise(res=>{
    const img=document.querySelector("#app img.hero-img");
    if(!img)return res();                        /* 没配背景图 / 当前页不是首页 */
    let done=false;
    const finish=()=>{
      if(done)return;
      done=true;
      /* 下载完 ≠ 解码完：再等一次 decode，免得揭幕那一瞬背景"先糊后清"闪一下 */
      if(typeof img.decode==="function")img.decode().then(res,res); else res();
    };
    if(img.complete)return finish();             /* 已加载完 / 已失败：都不必再等 */
    img.addEventListener("load",finish,{once:true});
    img.addEventListener("error",finish,{once:true});
    setTimeout(finish,6000);                     /* 图太慢也别把人永远关在加载屏里 */
  });
}
/* 等页面资源加载完（样式、字体、首屏图都在 load 里），最多等 6 秒 */
function pageLoaded(){
  return new Promise(res=>{
    if(document.readyState==="complete")return res();
    let done=false;
    const fin=()=>{ if(!done){done=true;res();} };
    window.addEventListener("load",fin,{once:true});
    setTimeout(fin,6000);
  });
}
/* 揭幕：放行动画 → 淡出加载屏 */
function revealSite(){
  if(window.__JY_READY)return;
  window.__JY_READY=true;
  /* 关键一步：加上 jy-go，两条入场动画此刻从 0 帧开始（之前一直是 animation:none，
     所以不存在"在加载屏后面偷偷演完"或"演到一半被掐断"） */
  document.documentElement.classList.add("jy-go");
  const b=document.getElementById("boot");
  if(!b)return;
  b.classList.add("off");
  setTimeout(()=>{const x=document.getElementById("boot");if(x)x.remove();},450);
}
(async function(){
  /* 1+2. 域名检测 + 所有配置数据一起等（最多 3.5 秒，慢网也不把人晾着）。
          判定要跳转 → 不渲染、不揭幕，加载屏保持转圈，页面直接跳走。 */
  try{
    const waits=[window.__JY_DOMAIN_CHECK||Promise.resolve("ok")]
      .concat(bootLoads)
      .map(p=>Promise.resolve(p).catch(()=>{}));
    await Promise.race([Promise.all(waits),new Promise(r=>setTimeout(r,3500))]);
  }catch(e){}
  if(window.__JY_REDIRECTING)return;
  /* 3. 第一次、也是唯一一次首屏渲染（配置齐了，一次画到位） */
  window.__JY_STARTED=true;
  if(!window.__JY_RENDERED)setLang(lang,false);
  /* 4. 等背景大图解码完成 + 页面 load 完成 */
  try{ await Promise.all([heroBgReady(),pageLoaded()]); }catch(e){}
  if(window.__JY_REDIRECTING)return;
  /* 5. 揭幕 */
  revealSite();
})();

      kgLoading:"Loading Kugou playlist…", kgNone:"No Kugou playlist yet",
      cloudFail:"Cloud unavailable, using built-in snapshot · ",
      count:n=>" · "+n+" songs",
      synced:n=>"Synced "+n+" songs from the cloud", cloudNone:"Cloud unavailable, using built-in playlist",
      emptySearch:"Type a title or artist and press Enter<br>Results come from NetEase — click to play",
      emptyKg:"<b>No Kugou playlist yet</b><br>It syncs from the cloud automatically when online<br>You can also hit the button at the top right to retry",
      nowTitle:"Now playing / Last played", more:n=>"Load more ("+n+" left)",
      resolving:"Resolving…", loading:"Loading…",
      notFound:n=>"“"+n+"” not found — next", noSrc:n=>"“"+n+"” has no available source",
      allFail:"None of these songs can be found — try again later", playFail:"Playback failed, skipping…",
      repeatedFail:"These songs can't play right now, try again later", emptyList:"This list is empty",
      autoplay:"Autoplay was blocked — tap play",
      noResult:k=>"No results for “"+k+"”", searchFail:m=>"Search failed: "+m,
      searching:"Searching…", searchFailed:"Search failed, try again later",
      netErr:"Network error", httpErr:"API returned HTTP ", modeTitle:"Playback mode: "
    }
  };
  /* 跟随站点语言（lang 由主脚本维护；取不到就退回中文） */
  const mpLang=()=>{ try{ return (typeof lang!=="undefined"&&lang==="en")?"en":"zh"; }catch(e){ return "zh"; } };
  const L=()=>MP_I18N[mpLang()];
  const MODE_TIPS=()=>L().modes;

  const esc2=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const fmt=t=>{ if(!isFinite(t)||t<0)return"--:--"; t=Math.floor(t); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
  const el=id=>document.getElementById(id);

  /* ---------------- 元素 ---------------- */
  const wrap=el("mpWrap"), musicBtn=el("musicBtn"), ringEl=el("mpRing"),
        nameEl=el("mpName"), subEl=el("mpSub"),
        nextBtn=el("mpNext"), modeBtn=el("mpMode"), syncBtn=el("mpSync"),
        panelTitle=el("mpPanelTitle"), metaEl=el("mpMeta"), listEl=el("mpList"),
        tabsEl=el("mpWrap").querySelector(".mp-tabs"), searchBar=el("mpSearchBar"),
        searchInp=el("mpSearchInput"), searchGo=el("mpSearchGo"),
        filterTipEl=el("mpFilterTip"), filterClearBtn=el("mpFilterClear"),
        toastEl=el("mpToast"),
        timeEl=el("mpTime"), seekEl=el("mpSeek"), volEl=el("mpVol");

  const ppBtn=el("mpPP"); ppBtn.innerHTML=ICON_PLAY;
  nextBtn.innerHTML=ICON_NEXT;
  ringEl.style.strokeDashoffset=String(RING_C);

  /* ---------------- 状态 ---------------- */
  const audio=new Audio();
  audio.preload="metadata";
  /* getItem 包一层：禁用存储的环境里抛异常会让整个播放器初始化失败
     （音量允许是 0：拖到静音也是用户的选择，下次打开要保持静音） */
  audio.volume=(function(){ let v=0.85; try{ v=parseFloat(localStorage.getItem(KEY+"-vol")); }catch(e){}
    return (isFinite(v)&&v>=0&&v<=1)?v:0.85; })();
  volEl.value=String(Math.round(audio.volume*100));

  let kgPool=[], searchPool=[];
  let kgMeta=null, cloudState="";     /* '' 未尝试 / loading / ok / fail */
  let tab="kg", shown=LIMIT_STEP, filterKw="";   /* filterKw：酷狗歌单内的筛选词 */
  let q=[], cur=-1, kind="kg";        /* q = 当前播放队列，kind = 队列来自哪个分类 */
  let mode=0, loadedId="", seeking=false, failCount=0, errCount=0;
  let restored=false, lastKw="";
  const resume={pos:null,id:""};        /* 待恢复的播放进度：只有重新挂上同一首歌时才生效 */
  /* 播放意图状态机：
     wantPlay —— 用户「想不想放」，是唯一权威（不再依赖 audio.paused 猜测）；
     gen      —— 加载代次，任何新请求都会作废尚未完成的旧请求（防并发抢播）；
     loadingId—— 正在解析/取地址的曲目，用来区分「加载中」和「已暂停」。 */
  let wantPlay=false, gen=0, loadingId="", swapping=false;
  let quietLoad=false;   /* 正在为「进页面恢复上次那首」做静默预加载（不是用户操作，别当成播放意图） */
  let recentIds=[];      /* 最近放过的曲目 id：随机播放时用来避开重复 */

  /* ---------------- 播放顺序（列表循环 / 单曲循环 / 随机播放） ----------------
     「先读状态，再同步」：一进页面就把存档里的播放顺序读进内存、并把按钮画对，
     而不是先默认成「列表循环」、等歌单读完（restoreState 可能推迟好几秒）再改。
     否则会出两种毛病：
       ① 界面显示的是列表循环，实际按存档里的随机走（或反过来），看着「总是对不上」；
       ② 用户在歌单读好之前手动改了顺序，随后 restoreState 又按存档把它改回去。 */
  let modeUserSet=false;                 /* 用户本次手动改过顺序 → 存档不许再覆盖 */
  function paintMode(){
    const label=L().modeTitle+MODE_TIPS()[mode];
    modeBtn.innerHTML=MODE_ICON[mode];
    modeBtn.title=label;
    modeBtn.setAttribute("aria-label",label);
  }
  function persistMode(){                /* 改一次就落盘：中途刷新 / 直接关标签也不丢 */
    try{ const st=readSaved()||{}; st.mode=mode; localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){}
  }
  (function initMode(){
    const st=readSaved();
    if(st&&typeof st.mode==="number"&&st.mode>=0&&st.mode<=2)mode=st.mode;
    paintMode();
  })();

  const poolOf=k=> k==="kg"?kgPool : searchPool;
  const curTrack=()=> (cur>=0&&cur<q.length)?q[cur]:null;
  const kindLabel=t=> !t?"": t.kg?L().kKind.kg:L().kKind.nc;

  /* ---------------- 轻提示 ----------------
     入口收进了导航栏（一个小音符按钮），没地方写字了，所以提示这样分流：
       · 面板没展开 → 导航栏下方浮一句小气泡（2 秒左右自己消失）；
       · 面板已展开 → 写进面板顶部那行说明里，不额外飘东西。
     flash 是 subFlash 的别名，各处调用保持不变。 */
  function flash(msg){ subFlash(msg); }
  let subHold=false, subTid=null;          /* 副标题（面板里的歌名/歌手行）临时占用 */
  let metaHold=false, metaTid=null;        /* 面板顶部说明行临时占用 */
  let toastTid=null;
  function showToast(msg,ms){
    if(!toastEl)return;
    toastEl.textContent=msg;
    toastEl.classList.add("on");
    clearTimeout(toastTid);
    toastTid=setTimeout(()=>toastEl.classList.remove("on"),ms||2600);
  }
  function subFlash(msg,ms){
    const dur=ms||2600;
    subEl.textContent=msg;
    subHold=true;
    clearTimeout(subTid);
    subTid=setTimeout(()=>{ subHold=false; paintSub(); },dur);
    if(wrap.classList.contains("open")){       /* 面板开着 → 提示写在面板顶部 */
      metaHold=true; metaEl.textContent=msg;
      clearTimeout(metaTid);
      metaTid=setTimeout(()=>{ metaHold=false; paintMeta(); },dur);
    }else{
      showToast(msg,dur);                      /* 面板关着 → 导航栏下方浮一句 */
    }
  }
  /* ---------------- 播放动作统一出口 ---------------- */
  function setPlayUI(on){
    ppBtn.innerHTML=on?ICON_PAUSE:ICON_PLAY;
    musicBtn.classList.toggle("playing",on);   /* 只作状态标记，不再改音符颜色（避免看不清） */
    try{ if("mediaSession" in navigator)
      navigator.mediaSession.playbackState=on?"playing":"paused"; }catch(e){}
  }
  function playAudio(silent){
    return audio.play().then(()=>true).catch(()=>{
      /* 浏览器拦截自动播放：同步回暂停态（自动恢复场景不弹提示，避免打扰） */
      wantPlay=false; setPlayUI(false);
      if(!silent)flash(L().autoplay);
      return false;
    });
  }
  function stopAudio(){
    wantPlay=false;
    try{ if(!audio.paused)audio.pause(); }catch(e){}
    setPlayUI(false);
  }

  /* =====================================================================
   *  ① 酷狗歌单
   * ===================================================================== */
  /* 歌单数据（内置快照 / 云端，格式同为 {name,src,updated,count,songs:["歌名|歌手"]}）装进内存 */
  function applyKg(d,cloud){
    if(!d||!Array.isArray(d.songs)||!d.songs.length)return false;
    const prev=new Map(kgPool.map(t=>[t.id,t]));
    kgMeta={name:d.name||L().myKg,src:d.src||L().kgSrc,
            count:d.songs.length,updated:d.updated||"",cloud:!!cloud};
    kgPool=d.songs.map(line=>{
      const i=String(line).indexOf("|");
      const t=(i<0?line:String(line).slice(0,i)).trim();
      const a=(i<0?"":String(line).slice(i+1)).trim();
      const o=prev.get("kg:"+t+"|"+a);   /* 沿用上次解析好的网易云信息，刷新后不必重新搜 */
      return {online:true,kg:true,id:"kg:"+t+"|"+a,name:t,artist:a,
              album:(o&&o.album)||"",ncId:(o&&o.ncId)||"",src:(o&&o.src)||"",
              srcAt:(o&&o.srcAt)||0,failAt:(o&&o.failAt)||0};
    }).filter(t=>t.name);
    panelTitle.textContent=L().pillName;   /* 标题固定为「鉴业音乐 / Jianye Music」，跟随语言 */
    paintMeta();
    if(tab==="kg")renderList();
    return true;
  }
  /* 内置快照：kugou-playlist.js（和 index.html 同目录或上一级都试一下） */
  function loadSnap(){
    return new Promise(res=>{
      let done=false;
      const finish=v=>{ if(done)return; done=true; res(v); };
      setTimeout(()=>finish(!!window.KUGOU_PLAYLIST),3000);   /* 兜底：脚本卡住也不阻塞「上次播放」的恢复 */
      if(window.KUGOU_PLAYLIST&&applyKg(window.KUGOU_PLAYLIST,false))return finish(true);
      let i=0;
      const next=()=>{
        if(i>=SNAP_FILES.length)return finish(false);
        const s=document.createElement("script");
        s.src=SNAP_FILES[i++];
        s.onload=()=>{ if(window.KUGOU_PLAYLIST&&applyKg(window.KUGOU_PLAYLIST,false)){ finish(true); } else next(); };
        s.onerror=next;
        document.head.appendChild(s);
      };
      next();
    });
  }
  /* 云端 /api/kg：Cloudflare 边缘节点替网页读酷狗「我喜欢的音乐」，云端自己缓存 30 分钟 */
  async function refreshCloud(manual){
    if(cloudState==="loading")return;
    const proto=location.protocol;
    if(proto!=="http:"&&proto!=="https:"){ cloudState="fail"; paintMeta(); return; }
    cloudState="loading";
    if(manual)syncBtn.classList.add("busy");
    paintMeta();
    try{
      const r=await fetch("/api/kg"+(manual?"?refresh=1":""),{cache:"no-store"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();
      if(!d||!d.ok||!Array.isArray(d.songs)||!d.songs.length)throw new Error((d&&d.error)||L().cloudNone);
      applyKg(d,true);
      cloudState="ok";
      if(manual)flash(L().synced(kgPool.length));
      /* 之前只有内置快照为空、只恢复出「上次那首」：云端歌单到了就把队列补全
         （正在加载或有播放意图时不要重建队列，免得打断用户操作；
           自己那条静默预加载不算「用户操作」，可以打断重来） */
      if(restored&&q.length<=1&&!wantPlay&&kgPool.length&&((!loadedId&&!loadingId)||quietLoad)){
        restored=false; q=[]; cur=-1;
        restoreState();
      }
    }catch(e){
      cloudState="fail";
      if(manual)flash(L().cloudNone);
    }
    syncBtn.classList.remove("busy");
    paintMeta();
    if(tab==="kg")renderList();
    restoreState();   /* 云端歌单可能补全了上次的播放队列 */
  }
  function paintMeta(){
    if(metaHold)return;                /* 正在显示一条临时提示，别把它顶掉 */
    const loading=cloudState==="loading";
    const srcTxt=loading?L().cloudLoading:(kgMeta&&kgMeta.cloud?L().cloudLive:(kgMeta?L().cloudSnap:""));
    if(!kgMeta){
      metaEl.textContent=loading?L().kgLoading:L().kgNone;
      return;
    }
    metaEl.textContent=(cloudState==="fail"?L().cloudFail:"")
      +srcTxt+(kgMeta.updated?" · "+kgMeta.updated:"")
      +L().count(kgMeta.count);
  }

  /* =====================================================================
   *  ② 在线搜歌：GD 音乐台「网易云」源（限流 + 会话缓存）
   * ===================================================================== */
  const gdCache=new Map();
  let gdChain=Promise.resolve(), gdLastAt=0;
  function gdFetch(qs){
    const run=async()=>{
      const wait=160-(Date.now()-gdLastAt);
      if(wait>0)await new Promise(r=>setTimeout(r,wait));
      gdLastAt=Date.now();
      const res=await fetch(GD_API+"?"+qs);
      if(!res.ok)throw new Error(L().httpErr+res.status);
      const j=await res.json();
      if(j&&j.detail)throw new Error(j.detail);
      return j;
    };
    gdChain=gdChain.then(run,run);
    return gdChain;
  }
  async function gdSearch(kw,page){
    const key="q|"+kw+"|"+(page||1);
    if(gdCache.has(key))return gdCache.get(key);
    const j=await gdFetch("types=search&source="+GD_SRC+"&name="+encodeURIComponent(kw)+"&count=20&pages="+(page||1));
    const list=Array.isArray(j)?j:[];
    gdCache.set(key,list);
    return list;
  }
  async function gdUrl(id,br){
    const j=await gdFetch("types=url&source="+GD_SRC+"&id="+encodeURIComponent(id)+"&br="+(br||320));
    return (j&&j.url)||"";
  }
  function normOnline(x){
    return {online:true,kg:false,id:"nc:"+x.id,ncId:String(x.id),
            name:x.name||L().unknown,
            artist:Array.isArray(x.artist)?x.artist.join(" / "):(x.artist||""),
            album:x.album||"",src:"",srcAt:0,failAt:0};
  }
  /* 歌名清洗：去掉括号附注（Live / 伴奏 / 翻自…）和多余空白，提高搜索命中率 */
  function cleanName(s){
    return String(s||"")
      .replace(/[【\[（(「].*?[】\]）)」]/g," ")
      .replace(/\s*(feat|ft)\..*$/i," ")
      .replace(/\s+/g," ").trim();
  }
  /* 酷狗歌单只有「歌名 + 歌手」，播放前先解析出对应的网易云曲目。
     找不到不要轻易放弃：依次换「歌名+歌手 → 纯歌名 → 清洗后歌名+歌手 → 清洗后歌名」，
     每次之间稍作停顿（接口有节奏限制，太快反而容易失败）；
     结果里优先挑歌名对得上的那一条，避免拿错同名的歌。 */
  async function kgResolve(t){
    if(!t)return false;
    if(t.ncId)return true;
    if(t.failAt&&Date.now()-t.failAt<10*60*1000)return false;   /* 失败后 10 分钟内不重试 */
    const cn=cleanName(t.name);
    const ar=(t.artist||"").trim();
    const keys=[...new Set([
      (t.name+" "+ar).trim(),
      t.name,
      (cn+" "+ar).trim(),
      cn
    ].map(x=>String(x).trim()).filter(Boolean))];
    try{
      let list=null;
      for(let k=0;k<keys.length;k++){
        list=await gdSearch(keys[k],1);
        if(list&&list.length){
          const hit=list.find(x=>cleanName(x.name)===cn)
              ||list.find(x=>{ const n=cleanName(x.name); return n&&(n.includes(cn)||cn.includes(n)); });
          const o=normOnline(hit||list[0]);
          t.ncId=o.ncId; t.album=o.album||t.album||"";
          if(!t.artist)t.artist=o.artist;
          t.failAt=0;
          return true;
        }
        if(k<keys.length-1)await new Promise(r=>setTimeout(r,500));  /* 缓一下再换关键词 */
      }
      t.failAt=Date.now();
      return false;
    }catch(e){ t.failAt=Date.now(); return false; }
  }

  /* =====================================================================
   *  列表渲染（含歌单内筛选）
   * ===================================================================== */
  /* 筛选：空白分隔的多个关键词需全部命中（歌名或歌手，忽略大小写） */
  function matchFilter(t,kw){
    const s=((t.name||"")+" "+(t.artist||"")).toLowerCase();
    return kw.split(/\s+/).filter(Boolean).every(w=>s.indexOf(w)>=0);
  }
  /* 当前分类实际要显示的歌曲：酷狗按筛选词过滤；在线搜歌用搜索结果 */
  function visiblePool(k){
    const p=poolOf(k);
    if(k==="search"||k!==tab||!filterKw)return p;
    const kw=filterKw.toLowerCase();
    return p.filter(t=>matchFilter(t,kw));
  }
  function setFilter(kw){
    filterKw=String(kw==null?"":kw).trim();
    shown=LIMIT_STEP;
    renderList();
  }
  /* 筛选状态行：关键词 + 命中数，可一键清除 */
  function paintFilterTip(total,hit){
    if(!filterTipEl)return;
    const on=(tab!=="search")&&!!filterKw;
    filterTipEl.classList.toggle("on",on);
    if(!on)return;
    filterTipEl.querySelector("span").textContent=L().filterTip(filterKw,hit);
    filterClearBtn.textContent=L().clearFilter;
  }
  /* 搜索栏三个分类都显示：歌单分类是「筛选」，在线搜歌是「网络搜索」 */
  function paintSearchUI(){
    const isSearch=tab==="search";
    searchInp.placeholder=isSearch?L().searchPh:L().filterPh;
    const lbl=isSearch?L().search:L().filterAria;
    searchGo.title=lbl; searchGo.setAttribute("aria-label",lbl);
    searchInp.setAttribute("aria-label",lbl);
  }
  /* 换分类（酷狗歌单 ↔ 在线搜歌）或换成搜索结果时，整列快速淡入一下，
     内容替换不再是无声闪变。逐字筛选不播——每敲一个字闪一次只会晃眼 */
  let lastListTab=null;
  function paintList(html,swap){
    listEl.innerHTML=html;
    if(!swap)return;
    listEl.classList.remove("mp-swap");
    void listEl.offsetWidth;      /* 强制回流，动画才会从头播 */
    listEl.classList.add("mp-swap");
  }
  function renderList(){
    if(!wrap.classList.contains("open"))return;
    const swap=(lastListTab!==tab);
    lastListTab=tab;
    const full=poolOf(tab);            /* 该分类的完整歌单 */
    const pool=visiblePool(tab);       /* 应用筛选后实际显示的歌 */
    paintFilterTip(full.length,pool.length);
    if(tab==="search"&&!full.length){
      paintList('<div class="mp-empty">'+L().emptySearch+'</div>',swap);
      return;
    }
    if(!full.length){
      paintList('<div class="mp-empty">'+L().emptyKg+'</div>',swap);
      return;
    }
    if(!pool.length){                  /* 歌单里有歌，只是筛不出来 */
      paintList('<div class="mp-empty">'+L().filterEmpty(filterKw)+'</div>',swap);
      return;
    }
    const list=(tab==="kg")?pool.slice(0,shown):pool;
    const now=curTrack();
    /* 当前这首（比如上次播放的那首）不在这个列表里时，置顶显示一行，方便点回来。
       筛选状态下不置顶，免得干扰筛选结果。 */
    let pinned="";
    if(now&&!filterKw&&!list.some(x=>x.id===now.id)){
      pinned='<div class="mp-row on" data-now="1" title="'+L().nowTitle+'">'
        +'<span class="mp-row-n">'+esc2(now.name)+"</span>"
        +(now.artist?'<span class="mp-row-a">'+esc2(now.artist)+"</span>":"")
        +"</div>";
    }
    paintList(pinned+list.map((t,i)=>
      '<div class="mp-row'+(now&&now.id===t.id?" on":"")+'" data-i="'+i+'">'
      +'<span class="mp-row-n">'+esc2(t.name)+"</span>"
      +(t.artist?'<span class="mp-row-a">'+esc2(t.artist)+"</span>":"")
      +"</div>"
    ).join("")+(tab==="kg"&&pool.length>shown
      ? '<button class="mp-more" id="mpMore">'+L().more(pool.length-shown)+'</button>':""),swap);
    const more=el("mpMore");
    if(more)more.onclick=()=>{ shown+=LIMIT_STEP; renderList(); };
  }

  /* =====================================================================
   *  播放核心（意图驱动 + 代次防竞态）
   *  ---------------------------------------------------------------
   *  · 每次加载拿一个自增代次 gen，await 之后若代次已变，说明用户已经
   *    切了别的歌/别的操作，旧请求立刻放弃，绝不碰 audio（防止「点暂停
   *    之后旧的加载流程又把歌放起来」这类竞态）。
   *  · 是否出声只由 wantPlay 决定；用户点暂停会把 wantPlay 置 false，
   *    正在进行的加载完成后也不会再自动播放。
   * ===================================================================== */
  async function loadAndPlay(i,opts){
    if(i<0||i>=q.length)return;
    const opt=opts||{};
    const want=opt.play!==false;        /* 默认：加载好就开始播 */
    const g=++gen;                      /* 作废之前所有未完成的加载 */
    cur=i;
    const t=q[i]; if(!t)return;
    rememberPlayed(t.id);              /* 记进「最近放过」，随机模式下别马上又挑到它 */
    wantPlay=want;
    loadingId=t.id;
    /* 需要解析的歌：解析状态直接显示在副标题（歌手那一行），不用弹窗 */
    subHold=false; clearTimeout(subTid);
    if(want)subEl.textContent=(t.online&&(!t.ncId||!t.src))?L().resolving:(t.artist||"");
    else paintSub();                   /* 只是进页面时的静默预加载 → 别抢副标题，照常显示歌手 */
    renderList();

    const fail=async(msg)=>{
      if(g!==gen)return;                /* 已被新请求取代 */
      loadingId="";
      if(!wantPlay){ paintSub(); return; }   /* 用户已经暂停（或本来就没想放），别再自动跳下一首 */
      failCount++;
      if(failCount>=4){                 /* 连续失败就停手，别连环刷接口 */
        failCount=0; wantPlay=false; setPlayUI(false);
        subFlash(L().allFail,3200);
        return;
      }
      subFlash(msg,2400);
      await new Promise(r=>setTimeout(r,1200));   /* 跳下一首前缓一缓，别连珠炮似的刷接口 */
      if(g!==gen||!wantPlay)return;
      await loadAndPlay((cur+1)%q.length,{play:true});
    };
    /* 酷狗 / 在线歌曲没有现成地址，先解析网易云 id 再取 320k 音源 */
    if(t.online&&!t.ncId){
      const ok=await kgResolve(t);
      if(g!==gen)return;
      if(!ok)return fail(L().notFound(t.name));
    }
    if(t.online&&(!t.src||!t.srcAt||Date.now()-t.srcAt>URL_TTL)){
      let u="";
      try{ u=await gdUrl(t.ncId,320); }catch(e){}
      if(g!==gen)return;
      if(!u){                            /* 取不到别急着放弃：歇 1 秒换个码率再试一次 */
        await new Promise(r=>setTimeout(r,1000));
        if(g!==gen||!wantPlay)return;
        try{ u=await gdUrl(t.ncId,192); }catch(e){}
        if(g!==gen)return;
      }
      if(!u)return fail(L().noSrc(t.name));
      t.src=u; t.srcAt=Date.now();
    }
    if(!t.src)return fail(L().noSrc(t.name));

    failCount=0; errCount=0;
    /* 换了别的歌 → 丢掉残留的「恢复到第几秒」（避免下次再听这首被莫名跳转） */
    if(resume.id&&resume.id!==t.id){ resume.pos=null; resume.id=""; }
    /* 换歌了 → 本会话「可信位置」重新开始（恢复同一首时沿用它的续播点） */
    if(loadedId!==t.id)lastPos=(resume.id===t.id&&resume.pos)?resume.pos:0;
    loadedId=t.id;
    /* 给 audio.src 赋值会让浏览器给正在播放的元素派发一次 pause，
       那是内部换源行为，用 swapping 标记避免被误当成「用户暂停」 */
    if(audio.src!==t.src){
      swapping=true; audio.src=t.src;
      setTimeout(()=>{ swapping=false; },0);
    }
    paintNow(t);
    if(wantPlay)playAudio(opt.silent===true); else setPlayUI(false);
    loadingId="";                     /* 走到这里才算这轮加载结束 */
  }
  /* 按分类整体起播：队列 = 该分类当前列表的快照 */
  /* 按分类起播：list 可选，传入时以它作为队列（用于「筛选结果里播」） */
  function playPool(k,i,list){
    const p=(list&&list.length)?list:poolOf(k);
    if(!p.length){ flash(L().emptyList); return; }
    q=p.slice(); kind=k; cur=Math.max(0,Math.min(i||0,p.length-1));
    loadAndPlay(cur,{play:true});
  }
  /* ---------------- 随机播放：挑一首「别的歌」 ----------------
     要点：不论是点「下一首」还是自动续播，随机模式下都不按列表顺序走；
     并且避开当前这首 + 最近刚放过的几首，避免短时间内来回重复。
     最近记录按「曲目 id」存，所以中途换了歌单/筛选也不会串。 */
  function rememberPlayed(id){
    if(!id)return;
    const k=recentIds.indexOf(id);
    if(k>=0)recentIds.splice(k,1);
    recentIds.push(id);
    if(recentIds.length>60)recentIds.shift();
  }
  function shufflePick(){
    if(q.length<=1)return cur<0?0:cur;
    const ct=curTrack();
    const banned=new Set(ct?[ct.id]:[]);
    /* 最多避开到「只剩一首可挑」为止：再往前避就没人了 */
    const horizon=Math.min(recentIds.length,q.length-1);
    for(let i=0;i<horizon;i++)banned.add(recentIds[recentIds.length-1-i]);
    let cand=[];
    for(let i=0;i<q.length;i++){ if(q[i]&&!banned.has(q[i].id))cand.push(i); }
    if(!cand.length){ for(let i=0;i<q.length;i++){ if(i!==cur)cand.push(i); } }   /* 全都避开了 → 只排除当前这首 */
    if(!cand.length)cand=[Math.max(0,cur)];
    return cand[(Math.random()*cand.length)|0];
  }
  function step(d,fromEnded){
    if(!q.length)return;
    if(fromEnded&&!wantPlay)return;         /* 已经暂停了就别再自动续播 */
    if(mode===1&&fromEnded){ audio.currentTime=0; playAudio(); return; }
    /* 随机播放：点「下一首」和自动续播一样，都随机挑一首「别的歌」 */
    if(mode===2&&q.length>1)return loadAndPlay(shufflePick(),{play:true});
    return loadAndPlay((cur+d+q.length)%q.length,{play:true});
  }
  /* 核心交互：播放 / 暂停。只看 wantPlay，不看 audio.paused（避免竞态误判） */
  function toggle(){
    if(!q.length||cur<0){
      const p=visiblePool(tab);      /* 有筛选就用筛选结果起播 */
      if(p.length)playPool(tab,0,p); else flash(L().emptyList);
      return;
    }
    const t=curTrack();
    /* 正在出声，或正在解析/取地址 → 一律视为「用户要暂停」 */
    if(wantPlay||(loadingId===t.id&&!audio.paused)){ stopAudio(); return; }
    if(loadingId===t.id){                        /* 正在加载这首：等它完成，不再重复起一条加载链 */
      wantPlay=true; setPlayUI(true);
      subFlash(L().loading,1500);
      return;
    }
    wantPlay=true; setPlayUI(true);
    if(loadedId!==t.id||!audio.src){ loadAndPlay(cur,{play:true}); return; }
    /* 进页面时静默预加载拿到的签名地址会过期 → 过期了就重新取一次，别拿旧地址硬放 */
    if(t.online&&t.srcAt&&Date.now()-t.srcAt>URL_TTL){ t.src=""; t.srcAt=0; loadAndPlay(cur,{play:true}); return; }
    playAudio();
  }

  /* ---------------- 界面同步 ---------------- */
  function paintNow(t){
    if(!t)return;
    nameEl.textContent=t.name;
    paintSub();
    if("mediaSession" in navigator){
      try{ navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist||"",album:L().brand}); }catch(e){}
    }
  }
  function paintSub(){
    if(subHold)return;                 /* 正在显示「解析中…」之类的提示，别覆盖 */
    const t=curTrack();
    if(!t){ subEl.textContent=L().pillSub; return; }   /* 还没有歌 → 显示「正在读取歌单…」 */
    subEl.textContent=t.artist||"";
  }
  /* 把「听到第几秒 / 总时长」画到进度环、时间、滑杆上（ct、dur 单位都是秒） */
  function setProgress(ct,dur){
    const p=(isFinite(dur)&&dur>0)?(ct/dur*100):0;
    ringEl.style.strokeDashoffset=String(RING_C*(1-p/100));
    if(seeking)return;
    timeEl.textContent=fmt(ct)+" / "+fmt(dur);
    if(isFinite(dur)&&dur>0)seekEl.value=String(Math.round(p*10));   /* 滑杆量程 0~1000 */
  }
  function earlyPaint(){
    let st=null;
    try{ st=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
    if(!st||!st.track||!st.track.name)return false;
    nameEl.textContent=st.track.name;
    subEl.textContent=st.track.artist||"";
    /* 顺手按上次记录的进度先把环画上（音源还没挂，先用记录里的时长估着），
       等音源就绪再用真实数据校正 —— 一进页面就能看到上次听到哪儿 */
    const pos=(typeof st.pos==="number"&&st.pos>0)?st.pos:0;
    const dur=(typeof st.dur==="number"&&st.dur>0)?st.dur:0;
    if(pos>0&&dur>0)setProgress(pos,dur);
    return true;
  }

  /* ---------------- 播放状态记忆 ----------------
     记住：分类、队列、当前曲目（歌名 / 歌手 / 网易云 id / 本地地址）、
     播放到第几秒、循环模式、音量、离开时是否正在播放。
     在线曲目的音源是带时间戳的签名链接会过期，所以只记 id，下次播放时重取。 */
  let lastPos=0;      /* 本会话「可信」的播放位置：只有 audio 真的装着当前这首时才更新 */
  function readSaved(){
    try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; }
  }
  /* audio 是否真的装载着当前这首、并且已经有了可用的时间轴 */
  function elReady(t){
    if(!t||loadedId!==t.id||!audio.src)return false;
    return audio.readyState>0||(isFinite(audio.duration)&&audio.duration>0);
  }
  function save(){
    try{
      const base={mode:mode,vol:audio.volume,at:Date.now(),tab:tab};   /* tab：当前停留的分类，刷新后原样恢复 */
      const old=readSaved();
      if(!q.length||cur<0||cur>=q.length){
        /* 队列还没恢复出来（刚打开就被刷新 / 切走标签）→ 保住上次那条记录，别清空 */
        if(old&&old.track&&old.track.name){
          base.kind=old.kind||""; base.cur=old.cur||0;
          base.pos=(typeof old.pos==="number"&&old.pos>0)?old.pos:0;
          base.dur=(typeof old.dur==="number"&&old.dur>0)?old.dur:0;
          base.playing=!!old.playing;
          base.track=old.track;
          if(Array.isArray(old.ids))base.ids=old.ids;
          if(old.kw)base.kw=old.kw;
        }else{
          base.kind="";
        }
        localStorage.setItem(KEY,JSON.stringify(base));
        localStorage.setItem(KEY+"-vol",String(audio.volume));
        return;
      }
      const t=q[cur];
      base.kind=kind;
      base.cur=cur;
      /* 进度：只有 audio 确实装着「当前这首」且已就绪时，currentTime 才可信。
         刷新后恢复出来的在线曲目是还没挂音源的（currentTime 恒为 0），
         若直接落盘就会把记住的进度抹成 0 —— 刷几次进度就没了。 */
      const ready=elReady(t);
      let pos=ready?Math.round(audio.currentTime||0):Math.round(lastPos||0);
      if(resume.pos!=null&&resume.id===t.id)pos=Math.max(pos,resume.pos);   /* 还没跳到恢复点，别抹掉 */
      if(!ready&&pos<=0&&old&&old.track&&old.track.id===t.id&&old.pos>0)pos=old.pos;   /* 保住旧记忆 */
      lastPos=pos;
      base.pos=pos;
      /* 时长也记下来：下次一进页面还没取到音源时，也能先把进度环按记录画出来 */
      base.dur=(isFinite(audio.duration)&&audio.duration>0)?Math.round(audio.duration)
              :((old&&typeof old.dur==="number")?old.dur:0);
      base.playing=!audio.paused;                 /* 离开时正在放 → 下次打开尽力接着放 */
      base.track={id:t.id,name:t.name,artist:t.artist||"",ncId:t.ncId||"",src:t.online?"":(t.src||"")};
      if(kind==="search")base.kw=lastKw;         /* 搜索队列留个关键词，下次能把结果捞回来 */
      else base.ids=q.map(x=>x.id).slice(0,400);
      localStorage.setItem(KEY,JSON.stringify(base));
      localStorage.setItem(KEY+"-vol",String(audio.volume));
    }catch(e){}
  }
  /* 保存下来的曲目信息 → 可播放的曲目对象（在线曲目待解析） */
  function rebuildTrack(o){
    if(!o||!o.name)return null;
    return {online:true,kg:/^kg:/.test(o.id||""),id:o.id,name:o.name,artist:o.artist||"",
            album:"",ncId:o.ncId||"",src:"",srcAt:0,failAt:0};
  }
  function restoreState(){
    if(restored)return;
    let st=null;
    try{ st=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
    if(!st||typeof st!=="object"){ restored=true; renderList(); return; }
    /* 当前停留的分类：优先用存档里的 tab（界面上最后看的那个）；
       旧存档没有 tab 字段时，才按队列来源 kind 猜 */
    if(st.tab==="search"||st.tab==="kg")tab=st.tab;
    else if(st.kind==="search")tab="search";
    if(!modeUserSet&&typeof st.mode==="number"&&st.mode>=0&&st.mode<=2)mode=st.mode;
    paintMode();
    /* 分类不管恢复得成不成，标签高亮与搜索栏提示都得跟上：
       之前只在「有上次播放的曲目」分支里才调 setTabUI，没曲目时界面停在默认
       「酷狗歌单」高亮，实际 tab 已是 search，点列表现象对不上 */
    setTabUI();
    if(typeof st.vol==="number"&&st.vol>=0&&st.vol<=1){ audio.volume=st.vol; volEl.value=String(Math.round(st.vol*100)); }
    if(!st.track||!st.track.name){ restored=true; renderList(); paintSub(); return; }
    /* 对应的列表还没读好（酷狗要读云端/快照）就先挂起，读好了再恢复 */
    if(st.kind==="kg"&&!kgDone)return;
    /* 旧版存过「本地音乐」分类：功能已移除，跳过恢复 */
    if(st.kind==="local"){ restored=true; renderList(); paintSub(); return; }

    const t0=rebuildTrack(st.track);
    const list=[];
    if(st.kind==="search"){
      list.push(t0);                     /* 搜索结果不持久化，先把这一首放回来，随后再捞结果 */
    }else{
      const pool=poolOf(st.kind);
      if(Array.isArray(st.ids)&&st.ids.length){
        const map=new Map(pool.map(x=>[x.id,x]));
        st.ids.forEach(id=>{ const x=map.get(id); if(x)list.push(x); });
      }
      if(list.findIndex(x=>x.id===t0.id)<0){
        /* 云端歌单新增/删除了歌曲也没关系：无论如何保证「上次那首」在队列里 */
        list.splice(Math.min(Math.max(st.cur||0,0),list.length),0,t0);
      }
    }
    q=list; kind=st.kind;
    cur=Math.max(0,list.findIndex(x=>x.id===t0.id));
    const t=q[cur];
    shown=Math.max(LIMIT_STEP,cur+1);    /* 展开歌单时能直接看到当前这首 */
    setTabUI();
    panelTitle.textContent=L().pillName;   /* 标题固定为「鉴业音乐 / Jianye Music」，跟随语言 */
    /* 进度接着上次：等音源挂上（loadedmetadata）再跳到那个位置 */
    resume.pos=(st.pos>3)?st.pos:null;
    resume.id=t.id;
    lastPos=(typeof st.pos==="number"&&st.pos>0)?st.pos:0;   /* 记住「上次听到哪儿」，音源没挂上时也不会被抹掉 */
    /* 先用记录里的时长把进度环画出来，取到音源后再用真实数据校正 */
    if(lastPos>0&&typeof st.dur==="number"&&st.dur>0)setProgress(lastPos,st.dur);
    restored=true;
    nameEl.textContent=t.name;
    paintSub();
    renderList();
    /* 不管上次是不是正在播，都把「上次那首」挂好并跳到上次听到的位置：
       —— 进度环 / 时间立刻显示上次的进度，用户点播放就接着听；
       —— 只有上次离开时确实在播，才再尽力自动接着放（被浏览器拦截就安静地停在暂停态）。
       这次预加载是「静默」的：不抢副标题、不改变用户意图，quietLoad 标记它不是用户操作。 */
    const want=!!st.playing;
    if(t.online){
      quietLoad=true;
      Promise.resolve(loadAndPlay(cur,{play:want,silent:true}))
        .catch(()=>{}).then(()=>{ quietLoad=false; });
    }else if(t.src){
      loadedId=t.id; audio.src=t.src; try{ audio.load(); }catch(e){}
      if(want){ wantPlay=true; setPlayUI(true); playAudio(true); }
      else setPlayUI(false);
    }
    /* 搜索来源：把当时那次搜索的结果重新捞回来，队列就完整了 */
    if(st.kind==="search"&&st.kw)restoreSearch(st.kw,t0);
  }
  async function restoreSearch(kw,t0){
    try{
      const list=await gdSearch(kw,1);
      if(!list||!list.length)return;
      searchPool=list.map(normOnline);
      if(tab!=="search")return;
      if(wantPlay&&loadedId&&loadedId!==t0.id)return;   /* 用户已经切歌/在播别的了就别动 */
      let i=searchPool.findIndex(x=>x.id===t0.id);
      if(i<0)i=0;
      q=searchPool.slice(); cur=i; kind="search";
      const t=q[cur];
      if(!t.ncId&&t0.ncId)t.ncId=t0.ncId;
      if(loadedId===t0.id||!loadedId)nameEl.textContent=t.name;
      renderList();
    }catch(e){}
  }

  /* =====================================================================
   *  交互绑定
   * ===================================================================== */
  function setTabUI(){
    tabsEl.querySelectorAll(".mp-tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
    searchBar.style.display="flex";   /* 三个分类都显示：歌单内筛选 / 在线搜歌 */
    paintSearchUI();
  }
  /* 面板宽度 = 导航栏宽度。导航栏是「内容自适应 + 居中」，宽度随语言 / 屏幕变化，
     所以展开前与窗口尺寸变化时都实测一次，写进 CSS 变量 --mp-w。 */
  function syncPanelWidth(){
    try{
      const doc=document;
      if(!doc||typeof doc.querySelector!=="function")return;
      const nav=doc.querySelector(".nav");
      if(!nav||typeof nav.getBoundingClientRect!=="function")return;
      const w=nav.getBoundingClientRect().width;
      if(!w||!isFinite(w))return;
      const vw=(doc.documentElement&&doc.documentElement.clientWidth)||0;
      const max=vw>0?vw-24:0;
      const v=max>0?Math.min(w,max):w;
      wrap.style.setProperty("--mp-w",Math.round(v)+"px");
    }catch(e){}
  }
  try{ window.addEventListener("resize",syncPanelWidth); }catch(e){}
  try{ window.addEventListener("load",syncPanelWidth); }catch(e){}

  /* 面板收起的退场动画时长（毫秒）：.closing 挂这么久再真正隐藏。
     系统开了「减少动态效果」就立刻收，别让人等一个不存在的动画 */
  const MP_OUT_MS=(typeof matchMedia==="function"&&matchMedia("(prefers-reduced-motion: reduce)").matches)?0:190;
  let mpCloseTimer=0;
  function setPanel(open){
    clearTimeout(mpCloseTimer);
    if(open){
      wrap.classList.remove("closing");
      wrap.classList.add("open");                  /* 必须先挂 open：renderList 里有「面板没开就不渲染」的守卫 */
      syncPanelWidth();                            /* 再对齐导航栏宽度，然后展开 */
      if(toastEl)toastEl.classList.remove("on");   /* 面板和气泡在同一块地方，先收起来 */
      renderList();
    }else if(wrap.classList.contains("open")){
      wrap.classList.remove("open");
      if(MP_OUT_MS>0){
        wrap.classList.add("closing");             /* 先播完退场动画再 display:none */
        mpCloseTimer=setTimeout(()=>wrap.classList.remove("closing"),MP_OUT_MS);
      }
    }
    musicBtn.setAttribute("aria-expanded",open?"true":"false");   /* 无障碍：读屏知道面板开着还是关着 */
  }
  /* 点导航栏的音乐入口：开 / 关切换 —— 点一下展开，再点一下收起。
     （点面板外的空白处、按 Esc 也都能收起。）
     键盘触发（e.detail===0）时把焦点送进面板，读屏 / 纯键盘用户不用 Tab 摸半天；
     Esc 收起后焦点还给音乐按钮，别把用户丢到页面开头 */
  musicBtn.addEventListener("click",e=>{
    const willOpen=!wrap.classList.contains("open");
    setPanel(willOpen);
    if(willOpen&&(e.detail===0)){
      const first=wrap.querySelector("button,input");
      if(first){ try{ first.focus(); }catch(err){} }
    }
  });
  /* 点面板外面 → 收起面板（按 Esc 也行）。
     注意这里监听的是「按下」而不是「点击」：
     点击面板内的歌会触发 renderList() 重建列表，等事件冒泡到 document 时，
     被点的那一行已经脱离 DOM，wrap.contains(e.target) 会误判成「点了外部」而把面板关掉。
     按下瞬间 DOM 还没被任何处理器改动，判定一定准确。 */

  seekEl.addEventListener("input",()=>{ seeking=true; });

      audio.currentTime=Number(seekEl.value)/1000*audio.duration;

    seeking=false; save();
  });
  volEl.addEventListener("input",()=>{
    audio.volume=Math.min(Math.max(Number(volEl.value)/100,0),1);
