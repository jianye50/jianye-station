    metaEl.textContent=(cloudState==="fail"?L().cloudFail:"")
      +srcTxt+(kgMeta.updated?" · "+kgMeta.updated:"")
      +L().count(kgMeta.count);
  }

  /* =====================================================================
   *  ② 在线搜歌：GD 音乐台「网易云」源（限流 + 会话缓存）
   * ===================================================================== */
  const gdCache=new Map();
  let gdChain=Promise.resolve(), gdLastAt=0;
  function gdFetch(qs){
    const run=async()=>{
      const wait=160-(Date.now()-gdLastAt);
      if(wait>0)await new Promise(r=>setTimeout(r,wait));
      gdLastAt=Date.now();
      const res=await fetch(GD_API+"?"+qs);
      if(!res.ok)throw new Error(L().httpErr+res.status);
      const j=await res.json();
      if(j&&j.detail)throw new Error(j.detail);
      return j;
    };
    gdChain=gdChain.then(run,run);
    return gdChain;
  }
  async function gdSearch(kw,page){
    const key="q|"+kw+"|"+(page||1);
    if(gdCache.has(key))return gdCache.get(key);
    const j=await gdFetch("types=search&source="+GD_SRC+"&name="+encodeURIComponent(kw)+"&count=20&pages="+(page||1));
    const list=Array.isArray(j)?j:[];
    gdCache.set(key,list);
    return list;
  }
  async function gdUrl(id,br){
    const j=await gdFetch("types=url&source="+GD_SRC+"&id="+encodeURIComponent(id)+"&br="+(br||320));
    return (j&&j.url)||"";
  }
  function normOnline(x){
    return {online:true,kg:false,id:"nc:"+x.id,ncId:String(x.id),
            name:x.name||L().unknown,
            artist:Array.isArray(x.artist)?x.artist.join(" / "):(x.artist||""),
            album:x.album||"",src:"",srcAt:0,failAt:0};
  }
  /* 歌名清洗：去掉括号附注（Live / 伴奏 / 翻自…）和多余空白，提高搜索命中率 */
  function cleanName(s){
    return String(s||"")
      .replace(/[【\[（(「].*?[】\]）)」]/g," ")
      .replace(/\s*(feat|ft)\..*$/i," ")
      .replace(/\s+/g," ").trim();
  }
  /* 酷狗歌单只有「歌名 + 歌手」，播放前先解析出对应的网易云曲目。
     找不到不要轻易放弃：依次换「歌名+歌手 → 纯歌名 → 清洗后歌名+歌手 → 清洗后歌名」，
     每次之间稍作停顿（接口有节奏限制，太快反而容易失败）；
     结果里优先挑歌名对得上的那一条，避免拿错同名的歌。 */
  async function kgResolve(t){
    if(!t)return false;
    if(t.ncId)return true;
    if(t.failAt&&Date.now()-t.failAt<10*60*1000)return false;   /* 失败后 10 分钟内不重试 */
    const cn=cleanName(t.name);
    const ar=(t.artist||"").trim();
    const keys=[...new Set([
      (t.name+" "+ar).trim(),
      t.name,
      (cn+" "+ar).trim(),
      cn
    ].map(x=>String(x).trim()).filter(Boolean))];
    try{
      let list=null;
      for(let k=0;k<keys.length;k++){
        list=await gdSearch(keys[k],1);
        if(list&&list.length){
          const hit=list.find(x=>cleanName(x.name)===cn)
              ||list.find(x=>{ const n=cleanName(x.name); return n&&(n.includes(cn)||cn.includes(n)); });
          const o=normOnline(hit||list[0]);
          t.ncId=o.ncId; t.album=o.album||t.album||"";
          if(!t.artist)t.artist=o.artist;
          t.failAt=0;
          return true;
        }
        if(k<keys.length-1)await new Promise(r=>setTimeout(r,500));  /* 缓一下再换关键词 */
      }
      t.failAt=Date.now();
      return false;
    }catch(e){ t.failAt=Date.now(); return false; }
  }

  /* =====================================================================
   *  列表渲染（含歌单内筛选）
   * ===================================================================== */
  /* 筛选：空白分隔的多个关键词需全部命中（歌名或歌手，忽略大小写） */
  function matchFilter(t,kw){
    const s=((t.name||"")+" "+(t.artist||"")).toLowerCase();
    return kw.split(/\s+/).filter(Boolean).every(w=>s.indexOf(w)>=0);
  }
  /* 当前分类实际要显示的歌曲：酷狗按筛选词过滤；在线搜歌用搜索结果 */
  function visiblePool(k){
    const p=poolOf(k);
    if(k==="search"||k!==tab||!filterKw)return p;
    const kw=filterKw.toLowerCase();
    return p.filter(t=>matchFilter(t,kw));
  }
  function setFilter(kw){
    filterKw=String(kw==null?"":kw).trim();
    shown=LIMIT_STEP;
    renderList();
  }
  /* 筛选状态行：关键词 + 命中数，可一键清除 */
  function paintFilterTip(total,hit){
    if(!filterTipEl)return;
    const on=(tab!=="search")&&!!filterKw;
    filterTipEl.classList.toggle("on",on);
    if(!on)return;
    filterTipEl.querySelector("span").textContent=L().filterTip(filterKw,hit);
    filterClearBtn.textContent=L().clearFilter;
  }
  /* 搜索栏三个分类都显示：歌单分类是「筛选」，在线搜歌是「网络搜索」 */
  function paintSearchUI(){
    const isSearch=tab==="search";
    searchInp.placeholder=isSearch?L().searchPh:L().filterPh;
    const lbl=isSearch?L().search:L().filterAria;
    searchGo.title=lbl; searchGo.setAttribute("aria-label",lbl);
    searchInp.setAttribute("aria-label",lbl);
  }
  function renderList(){
    if(!wrap.classList.contains("open"))return;
    const full=poolOf(tab);            /* 该分类的完整歌单 */
    const pool=visiblePool(tab);       /* 应用筛选后实际显示的歌 */
    paintFilterTip(full.length,pool.length);
    if(tab==="search"&&!full.length){
      listEl.innerHTML='<div class="mp-empty">'+L().emptySearch+'</div>';
      return;
    }
    if(!full.length){
      listEl.innerHTML='<div class="mp-empty">'+L().emptyKg+'</div>';
      return;
    }
    if(!pool.length){                  /* 歌单里有歌，只是筛不出来 */
      listEl.innerHTML='<div class="mp-empty">'+L().filterEmpty(filterKw)+'</div>';
      return;
    }
    const list=(tab==="kg")?pool.slice(0,shown):pool;
    const now=curTrack();
    /* 当前这首（比如上次播放的那首）不在这个列表里时，置顶显示一行，方便点回来。
       筛选状态下不置顶，免得干扰筛选结果。 */
    let pinned="";
    if(now&&!filterKw&&!list.some(x=>x.id===now.id)){
      pinned='<div class="mp-row on" data-now="1" title="'+L().nowTitle+'">'
        +'<span class="mp-row-n">'+esc2(now.name)+"</span>"
        +(now.artist?'<span class="mp-row-a">'+esc2(now.artist)+"</span>":"")
        +"</div>";
    }
    listEl.innerHTML=pinned+list.map((t,i)=>
      '<div class="mp-row'+(now&&now.id===t.id?" on":"")+'" data-i="'+i+'">'
      +'<span class="mp-row-n">'+esc2(t.name)+"</span>"
      +(t.artist?'<span class="mp-row-a">'+esc2(t.artist)+"</span>":"")
      +"</div>"
    ).join("")+(tab==="kg"&&pool.length>shown
      ? '<button class="mp-more" id="mpMore">'+L().more(pool.length-shown)+'</button>':"");
    const more=el("mpMore");
    if(more)more.onclick=()=>{ shown+=LIMIT_STEP; renderList(); };
  }

  /* =====================================================================
   *  播放核心（意图驱动 + 代次防竞态）
   *  ---------------------------------------------------------------
   *  · 每次加载拿一个自增代次 gen，await 之后若代次已变，说明用户已经
   *    切了别的歌/别的操作，旧请求立刻放弃，绝不碰 audio（防止「点暂停
   *    之后旧的加载流程又把歌放起来」这类竞态）。
   *  · 是否出声只由 wantPlay 决定；用户点暂停会把 wantPlay 置 false，
   *    正在进行的加载完成后也不会再自动播放。
   * ===================================================================== */
  async function loadAndPlay(i,opts){
    if(i<0||i>=q.length)return;
    const opt=opts||{};
    const want=opt.play!==false;        /* 默认：加载好就开始播 */
    const g=++gen;                      /* 作废之前所有未完成的加载 */
    cur=i;
    const t=q[i]; if(!t)return;
    rememberPlayed(t.id);              /* 记进「最近放过」，随机模式下别马上又挑到它 */
    wantPlay=want;
    loadingId=t.id;
    /* 需要解析的歌：解析状态直接显示在副标题（歌手那一行），不用弹窗 */
    subHold=false; clearTimeout(subTid);
    if(want)subEl.textContent=(t.online&&(!t.ncId||!t.src))?L().resolving:(t.artist||"");
    else paintSub();                   /* 只是进页面时的静默预加载 → 别抢副标题，照常显示歌手 */
    renderList();

    const fail=async(msg)=>{
      if(g!==gen)return;                /* 已被新请求取代 */
      loadingId="";
      if(!wantPlay){ paintSub(); return; }   /* 用户已经暂停（或本来就没想放），别再自动跳下一首 */
      failCount++;
      if(failCount>=4){                 /* 连续失败就停手，别连环刷接口 */
        failCount=0; wantPlay=false; setPlayUI(false);
        subFlash(L().allFail,3200);
        return;
      }
      subFlash(msg,2400);
      await new Promise(r=>setTimeout(r,1200));   /* 跳下一首前缓一缓，别连珠炮似的刷接口 */
      if(g!==gen||!wantPlay)return;
      await loadAndPlay((cur+1)%q.length,{play:true});
    };
    /* 酷狗 / 在线歌曲没有现成地址，先解析网易云 id 再取 320k 音源 */
    if(t.online&&!t.ncId){
      const ok=await kgResolve(t);
      if(g!==gen)return;
      if(!ok)return fail(L().notFound(t.name));
    }
    if(t.online&&(!t.src||!t.srcAt||Date.now()-t.srcAt>URL_TTL)){
      let u="";
      try{ u=await gdUrl(t.ncId,320); }catch(e){}
      if(g!==gen)return;
      if(!u){                            /* 取不到别急着放弃：歇 1 秒换个码率再试一次 */
        await new Promise(r=>setTimeout(r,1000));
        if(g!==gen||!wantPlay)return;
        try{ u=await gdUrl(t.ncId,192); }catch(e){}
        if(g!==gen)return;
      }
      if(!u)return fail(L().noSrc(t.name));
      t.src=u; t.srcAt=Date.now();
    }
    if(!t.src)return fail(L().noSrc(t.name));

    failCount=0; errCount=0;
    /* 换了别的歌 → 丢掉残留的「恢复到第几秒」（避免下次再听这首被莫名跳转） */
    if(resume.id&&resume.id!==t.id){ resume.pos=null; resume.id=""; }
    /* 换歌了 → 本会话「可信位置」重新开始（恢复同一首时沿用它的续播点） */
    if(loadedId!==t.id)lastPos=(resume.id===t.id&&resume.pos)?resume.pos:0;
    loadedId=t.id;
    /* 给 audio.src 赋值会让浏览器给正在播放的元素派发一次 pause，
       那是内部换源行为，用 swapping 标记避免被误当成「用户暂停」 */
    if(audio.src!==t.src){
      swapping=true; audio.src=t.src;
      setTimeout(()=>{ swapping=false; },0);
    }
    paintNow(t);
    if(wantPlay)playAudio(opt.silent===true); else setPlayUI(false);
    loadingId="";                     /* 走到这里才算这轮加载结束 */
  }
  /* 按分类整体起播：队列 = 该分类当前列表的快照 */
  /* 按分类起播：list 可选，传入时以它作为队列（用于「筛选结果里播」） */
  function playPool(k,i,list){
    const p=(list&&list.length)?list:poolOf(k);
    if(!p.length){ flash(L().emptyList); return; }
    q=p.slice(); kind=k; cur=Math.max(0,Math.min(i||0,p.length-1));
    loadAndPlay(cur,{play:true});
  }
  /* ---------------- 随机播放：挑一首「别的歌」 ----------------
     要点：不论是点「下一首」还是自动续播，随机模式下都不按列表顺序走；
     并且避开当前这首 + 最近刚放过的几首，避免短时间内来回重复。
     最近记录按「曲目 id」存，所以中途换了歌单/筛选也不会串。 */
  function rememberPlayed(id){
    if(!id)return;
    const k=recentIds.indexOf(id);
    if(k>=0)recentIds.splice(k,1);
    recentIds.push(id);
    if(recentIds.length>60)recentIds.shift();
  }
  function shufflePick(){
    if(q.length<=1)return cur<0?0:cur;
    const ct=curTrack();
    const banned=new Set(ct?[ct.id]:[]);
    /* 最多避开到「只剩一首可挑」为止：再往前避就没人了 */
    const horizon=Math.min(recentIds.length,q.length-1);
    for(let i=0;i<horizon;i++)banned.add(recentIds[recentIds.length-1-i]);
    let cand=[];
    for(let i=0;i<q.length;i++){ if(q[i]&&!banned.has(q[i].id))cand.push(i); }
    if(!cand.length){ for(let i=0;i<q.length;i++){ if(i!==cur)cand.push(i); } }   /* 全都避开了 → 只排除当前这首 */
    if(!cand.length)cand=[Math.max(0,cur)];
    return cand[(Math.random()*cand.length)|0];
  }
  function step(d,fromEnded){
    if(!q.length)return;
    if(fromEnded&&!wantPlay)return;         /* 已经暂停了就别再自动续播 */
    if(mode===1&&fromEnded){ audio.currentTime=0; playAudio(); return; }
    /* 随机播放：点「下一首」和自动续播一样，都随机挑一首「别的歌」 */
    if(mode===2&&q.length>1)return loadAndPlay(shufflePick(),{play:true});
    return loadAndPlay((cur+d+q.length)%q.length,{play:true});
  }
  /* 核心交互：播放 / 暂停。只看 wantPlay，不看 audio.paused（避免竞态误判） */
  function toggle(){
    if(!q.length||cur<0){
      const p=visiblePool(tab);      /* 有筛选就用筛选结果起播 */
      if(p.length)playPool(tab,0,p); else flash(L().emptyList);
      return;
    }
    const t=curTrack();
    /* 正在出声，或正在解析/取地址 → 一律视为「用户要暂停」 */
    if(wantPlay||(loadingId===t.id&&!audio.paused)){ stopAudio(); return; }
    if(loadingId===t.id){                        /* 正在加载这首：等它完成，不再重复起一条加载链 */
      wantPlay=true; setPlayUI(true);
      subFlash(L().loading,1500);
      return;
    }
    wantPlay=true; setPlayUI(true);
    if(loadedId!==t.id||!audio.src){ loadAndPlay(cur,{play:true}); return; }
    /* 进页面时静默预加载拿到的签名地址会过期 → 过期了就重新取一次，别拿旧地址硬放 */
    if(t.online&&t.srcAt&&Date.now()-t.srcAt>URL_TTL){ t.src=""; t.srcAt=0; loadAndPlay(cur,{play:true}); return; }
    playAudio();
  }

  /* ---------------- 界面同步 ---------------- */
  function paintNow(t){
    if(!t)return;
    nameEl.textContent=t.name;
    paintSub();
    if("mediaSession" in navigator){
      try{ navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist||"",album:L().brand}); }catch(e){}
    }
  }
  function paintSub(){
    if(subHold)return;                 /* 正在显示「解析中…」之类的提示，别覆盖 */
    const t=curTrack();
    if(!t){ subEl.textContent=L().pillSub; return; }   /* 还没有歌 → 显示「正在读取歌单…」 */
    subEl.textContent=t.artist||"";
  }
  /* 把「听到第几秒 / 总时长」画到进度环、时间、滑杆上（ct、dur 单位都是秒） */
  function setProgress(ct,dur){
    const p=(isFinite(dur)&&dur>0)?(ct/dur*100):0;
    ringEl.style.strokeDashoffset=String(RING_C*(1-p/100));
    if(seeking)return;
    timeEl.textContent=fmt(ct)+" / "+fmt(dur);
    if(isFinite(dur)&&dur>0)seekEl.value=String(Math.round(p*10));   /* 滑杆量程 0~1000 */
  }
  function earlyPaint(){
    let st=null;
    try{ st=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
    if(!st||!st.track||!st.track.name)return false;
    nameEl.textContent=st.track.name;
    subEl.textContent=st.track.artist||"";
    /* 顺手按上次记录的进度先把环画上（音源还没挂，先用记录里的时长估着），
       等音源就绪再用真实数据校正 —— 一进页面就能看到上次听到哪儿 */
    const pos=(typeof st.pos==="number"&&st.pos>0)?st.pos:0;
    const dur=(typeof st.dur==="number"&&st.dur>0)?st.dur:0;
    if(pos>0&&dur>0)setProgress(pos,dur);
    return true;
  }

  /* ---------------- 播放状态记忆 ----------------
     记住：分类、队列、当前曲目（歌名 / 歌手 / 网易云 id / 本地地址）、
     播放到第几秒、循环模式、音量、离开时是否正在播放。
     在线曲目的音源是带时间戳的签名链接会过期，所以只记 id，下次播放时重取。 */
  let lastPos=0;      /* 本会话「可信」的播放位置：只有 audio 真的装着当前这首时才更新 */
  function readSaved(){
    try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; }
  }
  /* audio 是否真的装载着当前这首、并且已经有了可用的时间轴 */
  function elReady(t){
    if(!t||loadedId!==t.id||!audio.src)return false;
    return audio.readyState>0||(isFinite(audio.duration)&&audio.duration>0);
  }
  function save(){
    try{
      const base={mode:mode,vol:audio.volume,at:Date.now(),tab:tab};   /* tab：当前停留的分类，刷新后原样恢复 */
      const old=readSaved();
      if(!q.length||cur<0||cur>=q.length){
        /* 队列还没恢复出来（刚打开就被刷新 / 切走标签）→ 保住上次那条记录，别清空 */
        if(old&&old.track&&old.track.name){
          base.kind=old.kind||""; base.cur=old.cur||0;
          base.pos=(typeof old.pos==="number"&&old.pos>0)?old.pos:0;
          base.dur=(typeof old.dur==="number"&&old.dur>0)?old.dur:0;
          base.playing=!!old.playing;
          base.track=old.track;
          if(Array.isArray(old.ids))base.ids=old.ids;
          if(old.kw)base.kw=old.kw;
        }else{
          base.kind="";
        }
        localStorage.setItem(KEY,JSON.stringify(base));
        localStorage.setItem(KEY+"-vol",String(audio.volume));
        return;
      }
      const t=q[cur];
      base.kind=kind;
      base.cur=cur;
      /* 进度：只有 audio 确实装着「当前这首」且已就绪时，currentTime 才可信。
         刷新后恢复出来的在线曲目是还没挂音源的（currentTime 恒为 0），
         若直接落盘就会把记住的进度抹成 0 —— 刷几次进度就没了。 */
      const ready=elReady(t);
      let pos=ready?Math.round(audio.currentTime||0):Math.round(lastPos||0);
      if(resume.pos!=null&&resume.id===t.id)pos=Math.max(pos,resume.pos);   /* 还没跳到恢复点，别抹掉 */
      if(!ready&&pos<=0&&old&&old.track&&old.track.id===t.id&&old.pos>0)pos=old.pos;   /* 保住旧记忆 */
      lastPos=pos;
      base.pos=pos;
      /* 时长也记下来：下次一进页面还没取到音源时，也能先把进度环按记录画出来 */
      base.dur=(isFinite(audio.duration)&&audio.duration>0)?Math.round(audio.duration)
              :((old&&typeof old.dur==="number")?old.dur:0);
      base.playing=!audio.paused;                 /* 离开时正在放 → 下次打开尽力接着放 */
      base.track={id:t.id,name:t.name,artist:t.artist||"",ncId:t.ncId||"",src:t.online?"":(t.src||"")};
      if(kind==="search")base.kw=lastKw;         /* 搜索队列留个关键词，下次能把结果捞回来 */
      else base.ids=q.map(x=>x.id).slice(0,400);
      localStorage.setItem(KEY,JSON.stringify(base));
      localStorage.setItem(KEY+"-vol",String(audio.volume));
    }catch(e){}
  }
  /* 保存下来的曲目信息 → 可播放的曲目对象（在线曲目待解析） */
  function rebuildTrack(o){
    if(!o||!o.name)return null;
    return {online:true,kg:/^kg:/.test(o.id||""),id:o.id,name:o.name,artist:o.artist||"",
            album:"",ncId:o.ncId||"",src:"",srcAt:0,failAt:0};
  }
  function restoreState(){
    if(restored)return;
    let st=null;
    try{ st=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
    if(!st||typeof st!=="object"){ restored=true; renderList(); return; }
    /* 当前停留的分类：优先用存档里的 tab（界面上最后看的那个）；
       旧存档没有 tab 字段时，才按队列来源 kind 猜 */
    if(st.tab==="search"||st.tab==="kg")tab=st.tab;
    else if(st.kind==="search")tab="search";
    if(!modeUserSet&&typeof st.mode==="number"&&st.mode>=0&&st.mode<=2)mode=st.mode;
    paintMode();
    if(typeof st.vol==="number"&&st.vol>=0&&st.vol<=1){ audio.volume=st.vol; volEl.value=String(Math.round(st.vol*100)); }
    if(!st.track||!st.track.name){ restored=true; renderList(); paintSub(); return; }
    /* 对应的列表还没读好（酷狗要读云端/快照）就先挂起，读好了再恢复 */
    if(st.kind==="kg"&&!kgDone)return;
    /* 旧版存过「本地音乐」分类：功能已移除，跳过恢复 */
    if(st.kind==="local"){ restored=true; renderList(); paintSub(); return; }

    const t0=rebuildTrack(st.track);
    const list=[];
    if(st.kind==="search"){
      list.push(t0);                     /* 搜索结果不持久化，先把这一首放回来，随后再捞结果 */
    }else{
      const pool=poolOf(st.kind);
      if(Array.isArray(st.ids)&&st.ids.length){
        const map=new Map(pool.map(x=>[x.id,x]));
        st.ids.forEach(id=>{ const x=map.get(id); if(x)list.push(x); });
      }
      if(list.findIndex(x=>x.id===t0.id)<0){
        /* 云端歌单新增/删除了歌曲也没关系：无论如何保证「上次那首」在队列里 */
        list.splice(Math.min(Math.max(st.cur||0,0),list.length),0,t0);
      }
    }
    q=list; kind=st.kind;
    cur=Math.max(0,list.findIndex(x=>x.id===t0.id));
    const t=q[cur];
    shown=Math.max(LIMIT_STEP,cur+1);    /* 展开歌单时能直接看到当前这首 */
    setTabUI();
    panelTitle.textContent=L().pillName;   /* 标题固定为「鉴业音乐 / Jianye Music」，跟随语言 */
    /* 进度接着上次：等音源挂上（loadedmetadata）再跳到那个位置 */
    resume.pos=(st.pos>3)?st.pos:null;
    resume.id=t.id;
    lastPos=(typeof st.pos==="number"&&st.pos>0)?st.pos:0;   /* 记住「上次听到哪儿」，音源没挂上时也不会被抹掉 */
    /* 先用记录里的时长把进度环画出来，取到音源后再用真实数据校正 */
    if(lastPos>0&&typeof st.dur==="number"&&st.dur>0)setProgress(lastPos,st.dur);
    restored=true;
    nameEl.textContent=t.name;
    paintSub();
    renderList();
    /* 不管上次是不是正在播，都把「上次那首」挂好并跳到上次听到的位置：
       —— 进度环 / 时间立刻显示上次的进度，用户点播放就接着听；
       —— 只有上次离开时确实在播，才再尽力自动接着放（被浏览器拦截就安静地停在暂停态）。
       这次预加载是「静默」的：不抢副标题、不改变用户意图，quietLoad 标记它不是用户操作。 */
    const want=!!st.playing;
    if(t.online){
      quietLoad=true;
      Promise.resolve(loadAndPlay(cur,{play:want,silent:true}))
        .catch(()=>{}).then(()=>{ quietLoad=false; });
    }else if(t.src){
      loadedId=t.id; audio.src=t.src; try{ audio.load(); }catch(e){}
      if(want){ wantPlay=true; setPlayUI(true); playAudio(true); }
      else setPlayUI(false);
    }
    /* 搜索来源：把当时那次搜索的结果重新捞回来，队列就完整了 */
    if(st.kind==="search"&&st.kw)restoreSearch(st.kw,t0);
  }
  async function restoreSearch(kw,t0){
    try{
      const list=await gdSearch(kw,1);
      if(!list||!list.length)return;
      searchPool=list.map(normOnline);
      if(tab!=="search")return;
      if(wantPlay&&loadedId&&loadedId!==t0.id)return;   /* 用户已经切歌/在播别的了就别动 */
      let i=searchPool.findIndex(x=>x.id===t0.id);
      if(i<0)i=0;
      q=searchPool.slice(); cur=i; kind="search";
      const t=q[cur];
      if(!t.ncId&&t0.ncId)t.ncId=t0.ncId;
      if(loadedId===t0.id||!loadedId)nameEl.textContent=t.name;
      renderList();
    }catch(e){}
  }

  /* =====================================================================
   *  交互绑定
   * ===================================================================== */
  function setTabUI(){
    tabsEl.querySelectorAll(".mp-tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
    searchBar.style.display="flex";   /* 三个分类都显示：歌单内筛选 / 在线搜歌 */
    paintSearchUI();
  }
  /* 面板宽度 = 导航栏宽度。导航栏是「内容自适应 + 居中」，宽度随语言 / 屏幕变化，
     所以展开前与窗口尺寸变化时都实测一次，写进 CSS 变量 --mp-w。 */
  function syncPanelWidth(){
    try{
      const doc=document;
      if(!doc||typeof doc.querySelector!=="function")return;
      const nav=doc.querySelector(".nav");
      if(!nav||typeof nav.getBoundingClientRect!=="function")return;
      const w=nav.getBoundingClientRect().width;
      if(!w||!isFinite(w))return;
      const vw=(doc.documentElement&&doc.documentElement.clientWidth)||0;
      const max=vw>0?vw-24:0;
      const v=max>0?Math.min(w,max):w;
      wrap.style.setProperty("--mp-w",Math.round(v)+"px");
    }catch(e){}
  }
  try{ window.addEventListener("resize",syncPanelWidth); }catch(e){}
  try{ window.addEventListener("load",syncPanelWidth); }catch(e){}

  function setPanel(open){
    wrap.classList.toggle("open",open);
    musicBtn.setAttribute("aria-expanded",open?"true":"false");   /* 无障碍：读屏知道面板开着还是关着 */
    if(open){
      syncPanelWidth();                            /* 先对齐导航栏宽度，再展开 */
      if(toastEl)toastEl.classList.remove("on");   /* 面板和气泡在同一块地方，先收起来 */
      renderList();
    }
  }
  /* 点导航栏的音乐入口：开 / 关切换 —— 点一下展开，再点一下收起。
     （点面板外的空白处、按 Esc 也都能收起。） */
  musicBtn.addEventListener("click",()=>setPanel(!wrap.classList.contains("open")));
  /* 点面板外面 → 收起面板（按 Esc 也行）。
     注意这里监听的是「按下」而不是「点击」：
     点击面板内的歌会触发 renderList() 重建列表，等事件冒泡到 document 时，
     被点的那一行已经脱离 DOM，wrap.contains(e.target) 会误判成「点了外部」而把面板关掉。
     按下瞬间 DOM 还没被任何处理器改动，判定一定准确。 */
  const outsideEvt=(typeof window!=="undefined"&&"PointerEvent" in window)?"pointerdown":"mousedown";
  document.addEventListener(outsideEvt,e=>{
    if(!wrap.classList.contains("open"))return;
    if(wrap.contains(e.target)||musicBtn.contains(e.target))return;
    setPanel(false);
  },true);
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&wrap.classList.contains("open"))setPanel(false);
  });
  ppBtn.addEventListener("click",toggle);
  nextBtn.addEventListener("click",()=>step(1));
  modeBtn.addEventListener("click",()=>{
    mode=(mode+1)%3;
    modeUserSet=true;                  /* 这是用户的选择，之后的 restoreState 不许覆盖 */
    paintMode();
    persistMode();                     /* 立刻落盘，不等退出时才写 */
    flash(L().modeTitle+MODE_TIPS()[mode]);
    save();
  });
  syncBtn.addEventListener("click",()=>refreshCloud(true));
  tabsEl.addEventListener("click",e=>{
    const b=e.target.closest(".mp-tab"); if(!b)return;
    if(b.dataset.tab===tab)return;        /* 点同一个分类：保留当前筛选词 */
    tab=b.dataset.tab; shown=LIMIT_STEP;
    filterKw=""; searchInp.value="";      /* 换分类清空筛选，免得误以为歌单少了歌 */
    setTabUI(); renderList();
    save();   /* 立刻落盘：就算之后没播歌，刷新后也停在你这次选的分类 */
  });
  listEl.addEventListener("click",e=>{
    const r=e.target.closest(".mp-row");
    if(!r)return;
    if(r.dataset.now){ loadAndPlay(cur,{play:true}); return; }   /* 置顶的「正在播放 / 上次播放」 */
    playPool(tab,Number(r.dataset.i),visiblePool(tab));   /* 队列 = 当前看到的那一列 */
  });
  function doSearch(){
    const kw=searchInp.value.trim();
    if(!kw)return;
    lastKw=kw;
    listEl.innerHTML='<div class="mp-empty">'+L().searching+'</div>';
    gdSearch(kw,1).then(list=>{
      searchPool=list.map(normOnline);
      if(!searchPool.length)flash(L().noResult(kw));
      renderList();
    }).catch(err=>{
      searchPool=[]; flash(L().searchFail((err&&err.message)||L().netErr));
      listEl.innerHTML='<div class="mp-empty">'+L().searchFailed+'</div>';
    });
  }
  searchGo.addEventListener("click",()=>{ if(tab==="search")doSearch(); else setFilter(searchInp.value); });
  /* 歌单分类里打字就即时筛选，不用回车 */
  searchInp.addEventListener("input",()=>{ if(tab!=="search")setFilter(searchInp.value); });
  searchInp.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;
    e.preventDefault();
    if(tab==="search")doSearch(); else setFilter(searchInp.value);
  });
  if(filterClearBtn)filterClearBtn.addEventListener("click",()=>{ searchInp.value=""; setFilter(""); });

  /* 进度 / 音量 */
  seekEl.addEventListener("input",()=>{ seeking=true; });
  seekEl.addEventListener("change",()=>{
    if(isFinite(audio.duration)&&audio.duration>0)
      audio.currentTime=Number(seekEl.value)/1000*audio.duration;
    resume.pos=null; resume.id="";        /* 用户手动定位过 → 作废「续播位置」记忆 */
    seeking=false; save();
  });
  volEl.addEventListener("input",()=>{
    audio.volume=Math.min(Math.max(Number(volEl.value)/100,0),1);
    try{ localStorage.setItem(KEY+"-vol",String(audio.volume)); }catch(e){}
  });

  /* 音频事件：UI 跟着真实状态走，播放意图只在明确的用户/系统动作里改变 */
  audio.addEventListener("play",()=>{
    errCount=0; wantPlay=true; swapping=false;
    setPlayUI(true);
    paintSub(); save();
  });
  audio.addEventListener("pause",()=>{
    /* 换源 / 解析过程中浏览器也会派发 pause，那是内部行为，别覆盖用户意图 */
    if(swapping||loadingId)return;
    /* 一首歌自然播完时，浏览器会先把 ended/paused 置真、派发 pause，再派发 ended。
       这一记 pause 不是用户操作 —— 别清掉播放意图，否则随后的 ended 会以为用户已经暂停，
       于是不再自动播下一首。 */
    if(audio.ended)return;
    wantPlay=false;
    setPlayUI(false);
    save();
  });
  audio.addEventListener("ended",()=>{
    /* ended 为真 = 确实播到了结尾（不是用户暂停后残留的事件）→ 恢复播放意图，继续播下一首。
       这样无论浏览器把 pause 派发在 ended 之前还是之后，自动续播都成立。 */
    if(audio.ended)wantPlay=true;
    step(1,true);
  });
  audio.addEventListener("loadedmetadata",()=>{
    /* 恢复上次的播放进度：只有音源还是上次那首歌时才跳 */
    if(resume.pos!=null&&loadedId===resume.id){
      try{ audio.currentTime=resume.pos; }catch(e){}
      /* 只有确实跳过去了才作废这条「续播位置」；没跳成（音源不支持拖动等）就留着，
         下次再试，且落盘时会把这条进度保住，不会被抹成 0 */
      if(Math.abs((audio.currentTime||0)-resume.pos)<2){ lastPos=resume.pos; resume.pos=null; save(); }
    }
    /* 立刻把进度环/时间刷成上次听到的位置（没跳成时按「想跳到的位置」显示，别显示成 0） */
    const shown=(resume.pos!=null&&loadedId===resume.id)?resume.pos:audio.currentTime;
    setProgress(shown,audio.duration);
  });
  audio.addEventListener("timeupdate",()=>{
    const ct=curTrack();
    if(ct&&loadedId===ct.id)lastPos=audio.currentTime||0;   /* 只有确实在放这首时才更新可信位置 */
    setProgress(audio.currentTime,audio.duration);
    if(Date.now()-(audio._s||0)>5000){ audio._s=Date.now(); save(); }   /* 每 5 秒落一次盘 */
  });
  audio.addEventListener("error",()=>{
    if(!q.length||!audio.src||!loadedId)return;
    if(!wantPlay){ setPlayUI(false); return; }   /* 已暂停时出错 → 不要自动跳下一首并播起来 */
    /* 在线音源的签名地址会过期：先当作「地址失效」重取一次（最多两次），别急着跳下一首 */
    const t=curTrack();
    if(t&&t.online&&t.srcAt&&Date.now()-t.srcAt>URL_TTL&&errCount<2){
      errCount++; t.src=""; t.srcAt=0;
      loadAndPlay(cur,{play:true});
      return;
    }
    errCount++;
    if(errCount>=3){
      errCount=0; wantPlay=false; setPlayUI(false);
      subFlash(L().repeatedFail,3200);
      return;
    }
    subFlash(L().playFail,2000);
    const g=gen;
    setTimeout(()=>{ if(gen===g&&wantPlay)step(1,true); },900);
  });
  window.addEventListener("pagehide",save);
  try{
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden")save(); });
  }catch(e){}

  /* 系统媒体键（锁屏 / 蓝牙耳机） */
  if("mediaSession" in navigator){
    try{
      navigator.mediaSession.setActionHandler("play",()=>{
        wantPlay=true; setPlayUI(true);
        if(loadedId&&audio.src&&!loadingId)playAudio();
        else if(q.length)loadAndPlay(Math.max(cur,0),{play:true});
      });
      navigator.mediaSession.setActionHandler("pause",stopAudio);
      navigator.mediaSession.setActionHandler("previoustrack",()=>step(-1));
      navigator.mediaSession.setActionHandler("nexttrack",()=>step(1));
    }catch(e){}
  }

  /* =====================================================================
   *  启动：本地扫描与歌单同步并行 → 恢复上次进度
   * ===================================================================== */
  /* ---------------- 语言切换：把播放器上的文案整体刷新一遍 ---------------- */
  function mpApplyLang(){
    const t=L();
    const DEF_NAMES=["鉴业音乐","Jianye Music",""];
    if(DEF_NAMES.indexOf((nameEl.textContent||"").trim())>=0)nameEl.textContent=t.pillName;
    musicBtn.title=t.navMusic||t.pillName; musicBtn.setAttribute("aria-label",t.navMusic||t.pillName);
    ppBtn.title=t.playPause; ppBtn.setAttribute("aria-label",t.playPause);
    nextBtn.title=t.next; nextBtn.setAttribute("aria-label",t.next);
    syncBtn.title=t.sync; syncBtn.setAttribute("aria-label",t.sync);
    paintMode();   /* 播放顺序按钮：图标 + 提示文案都跟着语言走 */
    paintSearchUI();
    seekEl.setAttribute("aria-label",t.seekAria);
    volEl.setAttribute("aria-label",t.volAria);
    tabsEl.querySelectorAll(".mp-tab").forEach(b=>{ const k=b.dataset.tab; if(t.tabs[k])b.textContent=t.tabs[k]; });
    panelTitle.textContent=t.pillName;   /* 标题固定为「鉴业音乐 / Jianye Music」，跟随语言 */
    if(!curTrack())subEl.textContent=t.pillSub;
    paintMeta(); paintSub(); renderList();
    syncPanelWidth();   /* 中英文切换后导航栏宽度会变，面板跟着重新对齐 */
  }
  /* 站点右上角 EN / 中 切换时同步：优先接管 setLang，另用 <html lang> 监听兜底。
     接管时把所有参数原样转交（setLang 的第二个参数 persist 决定要不要落盘） */
  try{
    if(typeof setLang==="function"){
      const _setLang=setLang;
      setLang=function(){ const r=_setLang.apply(null,arguments); try{ mpApplyLang(); }catch(e){} return r; };
    }
  }catch(e){}
  try{
    new MutationObserver(()=>{ try{ mpApplyLang(); }catch(e){} })
      .observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
  }catch(e){}

  var kgDone=false;
  const CLOUD_WAIT=2000;   /* 云端歌单最多等 2 秒，超时就先用内置快照顶上 */
  (async function boot(){
    setTabUI();              /* 初始分类高亮 + 搜索栏（两个分类都显示） */
    mpApplyLang();           /* 按当前语言把面板文案铺一遍 */
    earlyPaint();            /* 先把上次播放的那首显示出来，歌单慢慢读 */
    /* 歌单优先问云端 /api/kg：内容最新，而且通了就不必再下载 107KB 的内置快照。
       云端不通（离线 / 没部署 Functions）或 2 秒没回来 → 退回内置快照兜底。
       两个来源谁后到谁生效：快照先到、云端后到 → 云端覆盖快照（内容更新）；
       云端先到则根本不会加载快照。 */
    let tid=null;
    const timeout=new Promise(r=>{ tid=setTimeout(()=>r("timeout"),CLOUD_WAIT); });
    const first=await Promise.race([refreshCloud(false).then(()=>cloudState),timeout]);
    clearTimeout(tid);
    if(first!=="ok")await loadSnap();
    kgDone=true;
    if(!kgPool.length&&!kgMeta)paintMeta();
    restoreState();
    if(tab==="kg")renderList();
    paintSub();
  })();
})();

      rmDeny:"rm: 权限不够，而且别删我的网站谢谢",
      catMissing:"cat: 缺少文件名",
      isDir:function(d){ return "cat: "+d+": 这是一个目录（用 ls 看看里面有什么）"; },
      notFound:function(c){ return "bash: "+c+": 未找到命令（试试 'help'）"; },
      noFile:function(f){ return "cat: "+f+": 没有那个文件或目录"; }
    }:{
      dotR:"Close",dotY:"Minimize",dotG:"Zoom",
      BOOT:[
        "[    0.000000] jianye-os 7.7.0-egg booting ...",
        "[    0.421337] Detected 7 consecutive avatar clicks. Access granted.",
        "[    0.888888] Loading personality modules ... OK",
        "",
        "Welcome to jianye-os 7.7 (Egg Edition)  x86_64",
        "",
        "Last login: 7 clicks ago from your cursor",
        "Type 'help' to see available commands."
      ],
      help:[
        "Available commands:",
        "  help          show this help",
        "  ls            list files",
        "  cat <file>    print a file (try about.txt / secret.flag / todo.txt)",
        "  whoami        who am I?",
        "  neofetch      system info",
        "  date          current time",
        "  echo <text>   repeat after me",
        "  pwd           current directory",
        "  uname -a      kernel info",
        "  history       command history",
        "  clear         clear the screen",
        "  exit          close the terminal"
      ],
      FILES:{
        "about.txt":["Jianye","Full-stack developer / hobbyist photographer / occasional writer.","I built this site line by line in plain HTML —","the terminal you are looking at is the proof :)"],
        "secret.flag":["flag{y0u_f0und_th3_7th_cl1ck}","","Congrats! You have found the first easter egg on this site.","Rumor has it clicking the avatar 14 times reveals another one... (it doesn't)"],
        "todo.txt":["[x] Build a personal website","[x] Hide a terminal easter egg","[ ] Learn Rust","[ ] Sleep early (failed 1024 times)"]
      },
      whoami:["visitor","","To be precise: a visitor who clicked the avatar 7 times in a row.","Curiosity is root access — and you already have it."],
      fetch:[
        "       .--.        visitor@jianye",
        "      |o_o |       -----------------",
        "      |:_/ |       OS: jianye-os 7.7 (Egg Edition)",
        "     //   \\ \\      Host: Jianye's personal website",
        "    (|     | )     Kernel: 7.7.0-egg",
        "   /'\\_   _/`\\     Shell: fake-bash 1.0",
        "   \\___)=(___/     Uptime: since your 7th click",
        "                   Achievement: 🥚 Easter Egg Hunter"
      ],
      sudo:["visitor is not in the sudoers file.","This incident will be reported.","","(Just kidding — nothing is logged here :) )"],
      rmNice:"nice try. This filesystem is read-only 🙃",
      rmDeny:"rm: permission denied — and please don't delete my website",
      catMissing:"cat: missing file operand",
      isDir:function(d){ return "cat: "+d+": Is a directory (try ls)"; },
      notFound:function(c){ return "bash: "+c+": command not found (try 'help')"; },
      noFile:function(f){ return "cat: "+f+": No such file or directory"; }
    };
    var ov=document.createElement("div");
    ov.className="egg-term-ov";
    ov.innerHTML=
      '<div class="egg-term">'+
        '<div class="egg-term-bar">'+
          '<span class="egg-dot r" title="'+T.dotR+'"></span><span class="egg-dot y" title="'+T.dotY+'"></span><span class="egg-dot g" title="'+T.dotG+'"></span>'+
          '<span class="egg-term-title">visitor@jianye: ~</span>'+
          '<span class="egg-bar-sp"></span>'+
        '</div>'+
        '<div class="egg-term-body"></div>'+
      '</div>';
    document.body.appendChild(ov);
    document.body.style.overflow="hidden";

    var win=ov.querySelector(".egg-term"),
        body=ov.querySelector(".egg-term-body"),
        bar=ov.querySelector(".egg-term-bar");

    function print(text,cls){
      var d=document.createElement("div");
      d.className="t-line"+(cls?" "+cls:"");
      if(text!=null&&text!=="")d.textContent=text;
      /* 输入行固定在底部：新输出一律插到它上面 */
      if(inputRow)body.insertBefore(d,inputRow);
      else body.appendChild(d);
      body.scrollTop=body.scrollHeight;
      return d;
    }
    function printAll(lines,cls){ lines.forEach(function(l){ print(l,cls); }); }

    /* --- 开机动画 --- */
    var BOOT=T.BOOT;
    var bi=0;
    (function typeBoot(){
      if(bi<BOOT.length){ print(BOOT[bi++],"t-dim"); setTimeout(typeBoot,90); }
      else{ mountInput(); }
    })();

    /* --- 输入行（始终保持在最底部） --- */
    var inputRow=null,inputEl;
    function mountInput(){
      inputRow=document.createElement("div");
      inputRow.className="t-line t-input-row";
      inputRow.innerHTML='<span class="t-prompt">visitor@jianye:~$ </span>';
      inputEl=document.createElement("input");
      inputEl.className="t-input";
      inputEl.autocomplete="off"; inputEl.spellcheck=false;
      inputRow.appendChild(inputEl);
      body.appendChild(inputRow);
      body.scrollTop=body.scrollHeight;
      inputEl.focus();
      inputEl.addEventListener("keydown",function(ev){
        if(ev.key==="Enter"){
          var cmd=inputEl.value.trim();
          inputEl.value="";
          print("visitor@jianye:~$ "+cmd,"t-cmd");
          if(cmd)run(cmd);
          body.scrollTop=body.scrollHeight;
        }
      });
    }
    ov.addEventListener("mouseup",function(){ if(opened&&inputEl)inputEl.focus(); });

    /* --- 命令 --- */
    var HISTORY=[];
    function run(raw){
      HISTORY.push(raw);
      var parts=raw.split(/\s+/), cmd=parts[0].toLowerCase(), arg=parts.slice(1).join(" ");
      switch(cmd){
        case "help":
          printAll(T.help); break;
        case "ls":
          print("about.txt    secret.flag    todo.txt    blog/    photos/    music/"); break;
        case "cat":
          if(!arg){ print(T.catMissing,"t-err"); }
          else if(/\/$/.test(arg)||/^(blog|photos|music)$/.test(arg)){ print(T.isDir(arg),"t-err"); }
          else if(T.FILES[arg]){ printAll(T.FILES[arg]); }
          else{ print(T.noFile(arg),"t-err"); }
          break;
        case "whoami":
          printAll(T.whoami); break;
        case "neofetch":
          printAll(T.fetch); break;
        case "date":
          print(new Date().toLocaleString(zh?"zh-CN":"en-US",{dateStyle:"full",timeStyle:"medium"})); break;
        case "echo":
          print(arg||""); break;
        case "pwd":
          print("/home/jianye"); break;
        case "uname":
          print(arg.indexOf("a")>=0
            ? "Linux jianye-website 7.7.0-egg #1 SMP PREEMPT x86_64 GNU/Linux"
            : "Linux"); break;
        case "history":
          HISTORY.forEach(function(h,i){ print("  "+(i+1)+"  "+h); }); break;
        case "sudo":
          printAll(T.sudo,"t-err"); break;
        case "rm":
          printAll(arg.indexOf("-rf")>=0||arg.indexOf("/")==0 ? T.rmNice : T.rmDeny,"t-err"); break;
        case "clear":
          body.innerHTML=""; mountInput(); break;
        case "exit": case "quit": case "q": case "logout":
          closeTerm(); break;
        default:
          print(T.notFound(cmd),"t-err");
      }
    }

    /* --- 拖动（标题栏） --- */
    var drag=null;
    bar.addEventListener("pointerdown",function(ev){
      if(ev.target.classList.contains("egg-dot"))return;   /* 点红绿灯不触发拖动 */
      /* 窗口原本靠 flex 居中，left/top 不生效；先切到 fixed 定位并写回当前真实位置，拖动才跟手 */
      var r=win.getBoundingClientRect();
      win.style.position="fixed";
      win.style.margin="0";
      win.style.left=r.left+"px";
      win.style.top=r.top+"px";
      drag={x:ev.clientX,y:ev.clientY,l:r.left,t:r.top};
      bar.setPointerCapture(ev.pointerId);
    });
    bar.addEventListener("pointermove",function(ev){
      if(!drag)return;
      var nl=drag.l+ev.clientX-drag.x,
          nt=drag.t+ev.clientY-drag.y;
      /* 边界钳制：至少留 60px 标题栏在可视区内，防止拖丢 */
      nl=Math.min(Math.max(nl,60-win.offsetWidth),window.innerWidth-60);
      nt=Math.min(Math.max(nt,0),window.innerHeight-40);
      win.style.left=nl+"px";
      win.style.top=nt+"px";
    });
    bar.addEventListener("pointerup",function(){ drag=null; });
    bar.addEventListener("pointercancel",function(){ drag=null; });

    /* --- 关闭（带动画：窗口缩小下沉 + 遮罩淡出，动画结束再移除 DOM） --- */
    var closing=false;
    function closeTerm(){
      if(!opened||closing)return;
      closing=true;
      ov.classList.add("egg-closing");
      document.removeEventListener("keydown",onKey);
      setTimeout(function(){
        ov.remove(); document.body.style.overflow="";
        opened=false; closing=false;
      },210);
    }
    function onKey(ev){ if(ev.key==="Escape")closeTerm(); }
    document.addEventListener("keydown",onKey);
    /* macOS 语义：红点关闭、黄点收起成标题栏、绿点放大 */
    /* 尺寸状态机：收起(mini) 优先于放大(big)，统一用内联样式写入，避免样式表优先级打架 */
    function applySize(){
      var mini=win.classList.contains("egg-term-mini"),
          big=win.classList.contains("egg-term-big");
      win.style.width  = (big&&!mini) ? "min(900px,96vw)" : "";
      win.style.height = mini ? "39px" : (big ? "min(88vh,760px)" : "");
      if(!mini)body.scrollTop=body.scrollHeight;
    }
    ov.querySelector(".egg-dot.r").addEventListener("click",closeTerm);
    ov.querySelector(".egg-dot.y").addEventListener("click",function(){
      win.classList.toggle("egg-term-mini"); applySize();
    });
    ov.querySelector(".egg-dot.g").addEventListener("click",function(){
      win.classList.toggle("egg-term-big"); applySize();
    });
    ov.addEventListener("click",function(ev){ if(ev.target===ov)closeTerm(); });
  }
})();
</script>

<style>
/* ---------- 彩蛋终端样式 ---------- */
.egg-term-ov{
  position:fixed;inset:0;z-index:2147483000;
  display:flex;align-items:center;justify-content:center;
  background:rgba(2,6,12,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:egg-fade .18s ease;
}
@keyframes egg-fade{from{opacity:0}to{opacity:1}}
/* 关闭动画：遮罩淡出 + 窗口缩小下沉 */
.egg-term-ov.egg-closing{animation:egg-fade-out .2s ease forwards;pointer-events:none}
.egg-term-ov.egg-closing .egg-term{animation:egg-sink .2s cubic-bezier(.4,0,.7,1) forwards}
@keyframes egg-fade-out{to{opacity:0}}
@keyframes egg-sink{to{opacity:0;transform:translateY(12px) scale(.95)}}
@keyframes egg-rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
/* ---------- 头像点击反馈：弹性按压 + 涟漪 ---------- */
@keyframes egg-press{
  0%{transform:scale(1)}
  30%{transform:scale(.88)}
  70%{transform:scale(1.045)}
  100%{transform:scale(1)}
}
.avatar.egg-press{animation:egg-press .5s cubic-bezier(.22,1,.36,1)}
.egg-ripple{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 0 18px rgba(122,59,255,.55),inset 0 0 12px rgba(255,255,255,.35);
  animation:egg-rip .6s cubic-bezier(.2,.6,.35,1) forwards;
}
@keyframes egg-rip{
  from{transform:scale(.72);opacity:.95}
  to{transform:scale(1.85);opacity:0}
}
.egg-term{
  width:min(720px,92vw);height:min(480px,78vh);
  display:flex;flex-direction:column;
  background:#0d1117;border:1px solid #30363d;border-radius:12px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  overflow:hidden;position:relative;
  font-family:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
  animation:egg-rise .22s ease;
}
.egg-term-bar{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:#161b22;border-bottom:1px solid #30363d;
  cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
}
.egg-term-bar:active{cursor:grabbing}
.egg-dot{width:12px;height:12px;border-radius:50%;flex:none;cursor:pointer;position:relative;
  transition:filter .15s,transform .15s}
.egg-dot:hover{filter:brightness(1.25)}
.egg-dot:active{transform:scale(.86)}
.egg-dot.r{background:#ff5f57}.egg-dot.y{background:#febc2e}.egg-dot.g{background:#28c840}
/* 悬停标题栏时圆点浮现符号：红 × 关闭 / 黄 − 最小化 / 绿 + 放大 */
.egg-dot::before{
  content:"×";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:rgba(0,0,0,.55);font-size:11px;font-weight:800;line-height:1;opacity:0;transition:opacity .12s;
}
.egg-dot.y::before{content:"−"}
.egg-dot.g::before{content:"+"}
.egg-dot.r::before{color:#5a0400}
.egg-term-bar:hover .egg-dot::before{opacity:1}
.egg-bar-sp{flex:none;width:52px}   /* 与左侧三个圆点等宽，让标题保持视觉居中 */
.egg-term-title{
  flex:1;text-align:center;font-size:12.5px;color:#8b949e;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 黄点：收起成一条标题栏；绿点：放大（mini 规则放在 big 之后，两者同时存在时收起优先） */
.egg-term{transition:width .28s cubic-bezier(.3,1,.4,1),height .28s cubic-bezier(.3,1,.4,1)}
.egg-term.egg-term-big{width:min(900px,96vw);height:calc(92vh - 40px)}
.egg-term.egg-term-mini{height:39px}
.egg-term.egg-term-mini .egg-term-body{display:none}
.egg-term-body{
  flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 16px;font-size:13px;line-height:1.72;color:#c9d1d9;
}
.egg-term-body::-webkit-scrollbar{width:8px}
.egg-term-body::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
.t-line{white-space:pre-wrap;word-break:break-all;min-height:1.72em}
.t-dim{color:#6e7681}
.t-cmd{color:#79c0ff}
.t-err{color:#ff7b72}
.t-prompt{color:#7ee787;font-weight:700}
.t-input{
  flex:1;min-width:60px;background:transparent;border:none;outline:none;
  font:inherit;color:#c9d1d9;caret-color:#7ee787;padding:0;
}
.t-input-row{display:flex;align-items:baseline}
@media (max-width:560px){
  .egg-term-body{font-size:11.5px;padding:10px 12px}
}
</style>
