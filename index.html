/* =====================================================================
 *  相册：扫描目录 → 相册/照片墙 → 灯箱
 * ===================================================================== */

/* 读取一个目录的条目（媒体文件 + 子文件夹）：优先解析服务器的目录列表页。
   子文件夹会被当作独立相册，媒体文件按类型（图片/视频）识别。 */
async function listEntries(dir){
  try{
    const base=new URL(dir,location.href);
    const res=await fetch(base.href);
    if(res.ok){
      const doc=new DOMParser().parseFromString(await res.text(),"text/html");
      const files=new Set(),dirs=new Set();
      doc.querySelectorAll("a[href]").forEach(a=>{
        let h=a.getAttribute("href"); if(!h)return;
        h=h.split("#")[0].split("?")[0];
        if(!h||h==="."||h===".."||/\/(\.|\.\.)\/?$/.test(h))return;
        if(/\/$/.test(h)){
          let n="";
          try{ n=decodeURIComponent(h.replace(/\/$/,"").split("/").pop()); }catch(e){ n=h.replace(/\/$/,"").split("/").pop(); }
          if(n)dirs.add(n);
        }else if(MEDIA_RE.test(h)){
          files.add(new URL(h,base.href).href);
        }
      });
      if(files.size||dirs.size)return {files:Array.from(files),dirs:Array.from(dirs)};
    }
  }catch(e){}
  return null;
}
/* GitHub API：列出仓库里某个目录的媒体文件与子文件夹（静态托管没有目录列表时兜底） */
async function listEntriesGH(dir){
  try{
    const path=dir.split("/").filter(Boolean).map(encodeURIComponent).join("/");
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return null;
    const arr=await r.json();
    if(!Array.isArray(arr))return null;
    const names=arr.filter(x=>x.type==="file"&&MEDIA_RE.test(x.name)).map(x=>x.name);
    const dirs=arr.filter(x=>x.type==="dir").map(x=>x.name);
    const files=await resolveGHUrls(dir,names);
    return {files:files,dirs:dirs};
  }catch(e){ return null; }
}
/* GitHub 给的是仓库相对路径，直链拼法要靠探针验证：
   先试页面相对路径，再试域名根路径，都不行就用 raw 直链。 */
async function resolveGHUrls(dir,names){
  if(!names.length)return [];
  const dirEnc=dir.split("/").filter(Boolean).map(encodeURIComponent).join("/")+"/";
  const bases=[
    new URL(dirEnc,location.href),
    new URL("/"+dirEnc,location.origin)
  ];
  for(const base of bases){
    let ok=false;
    try{
      const probe=await fetch(new URL(encodeURIComponent(names[0]),base).href,{method:"HEAD"});
      /* 关键：SPA 回退会让不存在的路径也返回 200 + 网页 HTML（Cloudflare Pages 就是），
         只看状态码会误判「文件可直链」，导致视频/图片地址指向网页、永远加载失败。
         必须连 content-type 一起验：是网页的一律不算数，退回 raw 直链 */
      const ct=(probe.headers.get("content-type")||"").toLowerCase();
      ok=probe.ok&&!ct.includes("text/html");
    }catch(e){}
    if(ok)return names.map(n=>new URL(encodeURIComponent(n),base).href);
  }
  const raw=dir.split("/").filter(Boolean).map(encodeURIComponent).join("/");
  return names.map(n=>`https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}/${raw}/${encodeURIComponent(n)}`);
}
function nameOf(src){
  const raw=String(src).split("/").pop().split("?")[0];
  try{ return decodeURIComponent(raw); }catch(e){ return raw; }   /* 文件名含孤立 % 时别让整个图库挂掉 */
}

/* 装载整个相册库（下面的兜底扫描版本）：
   ① 扫 Photo Album 根目录（图片/视频 = 「全部」；子文件夹 = 子相册）
   ② 逐个扫描子相册里的媒体
   ③ 同一相册里「同名图片 + 同名视频」自动配成 Live Photo（视频不再单独显示）
   ④ 汇总 photos 与 albums（相册封面取该相册第一张媒体） */
/* 装载相册：优先读构建期清单（快、稳），读不到再退回运行时目录扫描。
   清单模式下的数据形状与扫描模式完全一致，后面的渲染/灯箱代码不用区分。 */
async function loadPhotos(){
  if(await loadPhotosFromManifest())return;
  await loadPhotosByScan();
}
async function loadPhotosFromManifest(){
  try{
    const res=await fetch(PHOTO_MANIFEST,{cache:"no-cache"});
    if(!res.ok)return false;
    const data=await res.json();
    if(!data||!Array.isArray(data.photos))return false;
    const list=data.photos.map(p=>({
      name:p.name,
      album:p.album||"",
      type:p.type||"image",
      src:p.src,                                  /* 原图：只在播放动态/下载时用 */
      thumb:p.thumb||p.src,
      thumb2x:p.thumb2x||p.thumb||p.src,
      view:p.view||p.src,                         /* 灯箱用图（预缩放，别用原图） */
      blur:p.blur||"",                            /* 占位小图（data URI） */
      live:p.live||"",
      motion:!!p.motion,
      w:p.w||0, h:p.h||0, fb:""
    }));
    if(!list.length)return false;
    photos=list;
    albums=(data.albums||[]).map(a=>({name:a.name,count:a.count,cover:a.cover,blur:a.coverBlur||""}));
    photosStatus="ready";
    paintPhotoGrids();
    return true;
  }catch(e){ return false; }
}
/* 以下为兜底：运行时扫目录 / GitHub API（慢一点，但不跑脚本也能显示） */
async function loadPhotosByScan(){
  const isFile=location.protocol==="file:";
  let root=null,rootBase=PHOTO_DIRS[0];
  for(const dir of PHOTO_DIRS){
    const r=await listEntries(dir);
    if(r){ root=r; rootBase=dir; break; }
  }
  if(!root&&!isFile)root=await listEntriesGH(PHOTO_DIRS[0].replace(/\/$/,""));
  if(!root){
    if(isFile&&PHOTO_FALLBACK.length){
      /* 直接双击打开：读不到目录，用兜底清单（只覆盖根目录图片） */
      photos=PHOTO_FALLBACK.map(file=>({
        src:PHOTO_DIRS[0]+encodeURIComponent(file),
        name:file.replace(/\.[^.]+$/,""),
        album:"",type:"image",live:"",fb:file
      }));
      photosStatus="ready";
      paintPhotoGrids();
      return;
    }
    photos=[]; albums=[]; photosStatus="error";
    paintPhotoGrids();
    return;
  }
  const ghDir=PHOTO_DIRS[0].replace(/\/$/,"");
  const items=[];
  root.files.forEach(u=>items.push({src:u,album:""}));
  const rootDirs=root.dirs||[];
  for(const dname of rootDirs){
    let r=await listEntries(rootBase+dname+"/");
    if(!r&&!isFile)r=await listEntriesGH(ghDir+"/"+dname);
    if(!r||!r.files||!r.files.length)continue;   /* 空相册 / 读不到 → 先不显示 */
    r.files.forEach(u=>items.push({src:u,album:dname}));
  }
  /* 分类：视频 / 图片 */
  items.forEach(it=>{
    const f=nameOf(it.src);
    it.name=f.replace(/\.[^.]+$/,"");
    it.type=VID_RE.test(f)?"video":"image";
    it.live=""; it.fb="";
  });
  /* Live Photo 配对：同名（忽略大小写）且在同一相册（根目录也算一个"相册"） */
  const vidMap=new Map();
  items.forEach(it=>{ if(it.type==="video")vidMap.set((it.album+"|"+it.name).toLowerCase(),it); });
  const out=[];
  items.forEach(it=>{
    if(it.type==="video"){
      const paired=items.some(x=>x.type==="image"&&x.album===it.album
        &&x.name.toLowerCase()===it.name.toLowerCase());
      if(paired)return;                 /* 配成 Live Photo 的视频不单独显示 */
    }
    out.push(it);
  });
  out.forEach(it=>{
    if(it.type==="image"){
      const v=vidMap.get((it.album+"|"+it.name).toLowerCase());
      if(v){ it.type="live"; it.live=v.src; }
    }
  });
  /* 相册汇总（封面优先取图片，其次视频首帧） */
  const amap=new Map();
  out.forEach(it=>{
    if(!it.album)return;
    let a=amap.get(it.album);
    if(!a){ a={name:it.album,count:0,cover:""}; amap.set(it.album,a); }
    a.count++;
    if(!a.cover&&it.type!=="video")a.cover=it.src;
    if(!a.cover)a.cover=it.src;
  });
  albums=Array.from(amap.values())
    .sort((a,b)=>a.name.localeCompare(b.name,"zh-Hans-CN",{numeric:true}));
  photos=out;
  photos.sort((a,b)=>b.name.localeCompare(a.name,"zh-Hans-CN",{numeric:true}));
  photosStatus="ready";
  paintPhotoGrids();
}

/* 当前要显示的媒体：子相册之间互相独立 ——
   没选相册时只显示 Photo Album 根目录的内容，子相册里的只在点进去后显示 */
function viewList(){
  return galleryFilter?photos.filter(p=>p.album===galleryFilter):photos.filter(p=>!p.album);
}
/* ---------- 动态照片（手机「动态图片 / Motion Photo / Live Photo」单文件）----------
   这类「动态图片」是一张内嵌了带声音视频的 JPG：XMP 带 MotionPhoto 标记，
   视频以 mp4 盒子（ftyp…）附在文件尾部。浏览器只把它渲染成普通图片，
   这里把内嵌的 mp4 抠出来转成 Blob URL，供悬停预览与灯箱播放（有声音）。
   识别结果缓存在照片对象上，一张图只解析一次。 */
const motionCache=new Map();   /* src -> Promise<blobURL|""> */
function motionVideoURL(src){
  let p=motionCache.get(src);
  if(p)return p;
  p=(async()=>{
    try{
      const res=await fetch(src);
      if(!res.ok)return "";
      const buf=new Uint8Array(await res.arrayBuffer());
      const n=buf.length;
      /* 从尾部往前找 mp4 盒子的 "ftyp" 标记（动态照片的视频都附在文件末尾；
         跳过开头 1KB，避免误把 EXIF 缩略图里的数据当成视频） */
      for(let i=n-12;i>1024;i--){
        if(buf[i]===0x66&&buf[i+1]===0x74&&buf[i+2]===0x79&&buf[i+3]===0x70){
          const blob=new Blob([buf.subarray(i-4,n)],{type:"video/mp4"});
          return URL.createObjectURL(blob);
        }
      }
      return "";
    }catch(e){ return ""; }
  })();
  motionCache.set(src,p);
  return p;
}
/* 动态照片的「是否动态」改由构建期判定（photos.json 里的 motion 字段），
   页面打开时不再逐张探测。原来那套 Range 探测在静态托管上代价极高：
   服务器不认 Range 时每张图都会整份下载，十几张就是十几兆的额外流量。
   现在只有用户真的悬停 / 打开某张动态照片时，才会去取那一张的原图。 */
/* 把普通图片升级成动态照片：识别成功就改成 live 类型；
   传入 tile 时顺手塞进悬停用的动态视频层（autoplay=true 立即播放） */
function promoteMotion(p,tile,autoplay){
  if(!p||p.type!=="image"||p._motionTried)return Promise.resolve("");
  p._motionTried=true;
  return motionVideoURL(p.src).then(url=>{
    if(!url)return "";
    if(p.type==="image"){ p.type="live"; p.live=url; }
    if(tile){
      tile.classList.add("is-live");
      const v=document.createElement("video");
      v.className="ph-live-v"; v.src=url; v.muted=true; v.loop=true;
      v.playsInline=true; v.preload="auto";
      const cap=tile.querySelector(".ph-cap");
      if(cap)tile.insertBefore(v,cap); else tile.appendChild(v);
      if(autoplay){ v.style.display="block"; v.play().catch(()=>{}); }
    }
    /* 解析完成时灯箱可能已经打开（悬停触发的解析比点击慢）→ 补上动态播放 */
    lbPlayMotion(p);
    return url;
  });
}
/* 瓷砖内容：图片用缩略图（srcset 给高分屏）+ 模糊占位底；视频抓首帧；
   Live Photo 静态图 + 悬停播放动态视频。
   注意：列表里绝不加载原图 —— 原图只在播放动态照片时按需取一次。 */
function mediaTileTag(p,i){
  if(p.type==="video"){
    /* #t=0.1：让浏览器去抓第 0.1 秒的画面当封面。
       只写 preload="metadata" 时，不少浏览器（尤其 iOS Safari）只显示一片黑 */
    const vsrc=p.thumb||p.src;
    const src=vsrc.indexOf("#")<0?vsrc+"#t=0.1":vsrc;
    return `<video src="${esc(src)}" preload="metadata" muted playsinline
      onerror="this.style.display='none'"></video>`;
  }
  const src=p.thumb||p.src;
  const srcset=(p.thumb2x&&p.thumb2x!==src)
    ? ` srcset="${esc(src)} 480w, ${esc(p.thumb2x)} 960w" sizes="(max-width:620px) 46vw,(max-width:900px) 31vw,320px"`
    : "";
  /* 首屏前几张直接取，其余懒加载（缩略图只有十几 KB，但也没必要一次全拉） */
  const eager=i<4;
  const blur=p.blur?` style="background-image:url('${p.blur}')"`:"";
  const liveV=(p.type==="live"&&p.live)
    ? `<video class="ph-live-v" src="${esc(p.live)}" muted playsinline loop preload="none"></video>`:"";
  const err=p.fb
    ? `this.dataset.s?(this.style.display='none'):(this.dataset.s=1,this.src=this.dataset.alt)`
    : `this.style.display='none'`;
  const fbAttr=p.fb?` data-alt="${esc(PHOTO_DIRS[0]+encodeURIComponent(p.fb))}"`:"";
  return `<img src="${esc(src)}"${srcset} alt="${esc(p.name)}"${blur}
    loading="${eager?"eager":"lazy"}"${eager?' fetchpriority="high"':""} decoding="async"${fbAttr}
    onerror="${err}">${liveV}`;
}
function photoTilesHtml(list,limit){
  if(photosStatus==="loading"){
    const n=Math.min(limit||8,8);
    return Array.from({length:n}).map(()=>`<div class="ph-tile ph-skel"></div>`).join("");
  }
  if(!list.length){
    const msg=photosStatus==="error"?T().gallery.err:T().gallery.empty;
    return `<div class="ph-empty">${msg}</div>`;
  }
  const total=limit>0?Math.min(limit,list.length):list.length;
  return list.slice(0,total).map((p,i)=>{
    const more=(limit>0 && limit<list.length && i===limit-1);
    /* 动态照片 = 已配对的 Live Photo，或构建期判定为内嵌视频的 Motion Photo */
    const isLive=p.type==="live"||p.motion;
    const badge=isLive?`<span class="ph-badge">${esc(T().gallery.liveTag)}</span>`
      :p.type==="video"?`<span class="ph-badge">${esc(T().gallery.videoTag)}</span>`:"";
    return `<div class="ph-tile${isLive?" is-live":""}" data-idx="${i}" role="button" tabindex="0" aria-label="${esc(p.name)}">
      ${mediaTileTag(p,i)}${badge}
      <span class="ph-cap">${esc(p.name)}</span>
      ${more?`<div class="ph-more">+${list.length-limit}</div>`:""}
    </div>`;
  }).join("");
}
/* 子相册卡片（相册页顶部；进入某个相册后隐藏，靠「← 全部相册」返回） */
function albumStripHtml(){
  if(!albums.length||galleryFilter)return "";
  const t=T().gallery;
  return `<div class="album-label">${esc(t.albums)}</div>
  <div class="album-grid">
    ${albums.map(a=>`
    <button class="al-card" data-album="${esc(a.name)}" type="button" aria-label="${esc(a.name)}">
      <span class="al-cover">${
        a.cover?(VID_RE.test(a.cover)
          ?`<video src="${esc(a.cover.indexOf("#")<0?a.cover+"#t=0.1":a.cover)}" preload="metadata" muted playsinline></video>`
          :`<img src="${esc(a.cover)}" alt="" loading="lazy" decoding="async"${a.blur?` style="background-image:url('${a.blur}')"`:""} onerror="this.remove()">`)
        :`<span class="al-folder">📁</span>`}</span>
      <span class="al-name">${esc(a.name)}</span>
      <span class="al-count">${esc(t.albumCount(a.count))}</span>
    </button>`).join("")}
  </div>`;
}
/* 把页面上所有占位容器填上媒体（首页预览用 limit+全部，相册页用当前相册） */
function paintPhotoGrids(){
  document.querySelectorAll("[data-photo-grid]").forEach(el=>{
    const limit=Number(el.dataset.photoGrid)||0;
    const list=limit>0?photos.filter(p=>!p.album):viewList();   /* 首页预览也只取根目录 */
    el.innerHTML=photoTilesHtml(list,limit);
    el._items=list;                     /* 灯箱要按这份清单导航 */
  });
  const strip=$("#albumStrip");
  if(strip)strip.innerHTML=albumStripHtml();
  const sub=$("#gallerySub");
  if(sub){
    const list=viewList();
    sub.textContent=list.length?T().gallery.sub(list.length):"";
  }
}

/* ---------- 灯箱（图片 / 视频 / Live Photo） ---------- */
let lbIndex=0, lbFocus=null, lbItems=[], lbGrid=null;
/* 灯箱控制条图标（描边风格，与按钮 stroke 一致）；
   动态图标用苹果 Live Photo 同款同心圆（微软照片也是这个），不是刷新箭头 */
const ICON_MOTION='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>';
const ICON_SND_ON='<svg viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path d="M18.4 6.5a8 8 0 0 1 0 11"/></svg>';
const ICON_SND_OFF='<svg viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';
/* 灯箱动态状态：lbMotionOn 当前是否在播动态；lbSoundOn 声音开关（默认开） */
let lbMotionOn=false, lbSoundOn=true;
function paintMotionBtn(){
  const p=lbItems[lbIndex];
  const btn=$("#lbMotionBtn");
  if(!btn||!p||p.type!=="live")return;
  /* 文字固定显示「动态」，播放中只靠高亮表示状态（点击总是重新播一次） */
  btn.innerHTML=ICON_MOTION+"<span>"+esc(T().gallery.motion)+"</span>";
  btn.title=T().gallery.motion;
  btn.classList.toggle("on",lbMotionOn);
}
function paintSoundBtn(){
  const snd=$("#lbSoundBtn");
  if(!snd)return;
  snd.innerHTML=lbSoundOn?ICON_SND_ON:ICON_SND_OFF;
  snd.title=lbSoundOn?T().gallery.soundOff:T().gallery.soundOn;
  snd.setAttribute("aria-label",snd.title);
  snd.classList.toggle("on",false);
}
/* 按当前状态应用动态/静态显示 */
function applyLbMotion(){
  const p=lbItems[lbIndex];
  if(!p||p.type!=="live")return;
  const img=$("#lbImg"), vid=$("#lbVideo");
  if(lbMotionOn){
    img.style.display="none"; vid.style.display="";
    vid.controls=false; vid.loop=false;    /* Windows 同款：点一下只播一次，播完自动回静态 */
    vid.muted=!lbSoundOn;
    vid.currentTime=0;
    /* vid.src 读出来恒为绝对地址，p.live 可能是相对路径 ——
       直接比较永远不等，每次切换都会重新赋 src 触发重载；规范化后再比 */
    let liveAbs=p.live;
    try{ liveAbs=new URL(p.live,location.href).href; }catch(e){}
    if(vid.src!==liveAbs)vid.src=p.live;
    lbWaitMedia(vid);                      /* 动态视频没加载出来前先转圈，不播黑屏 */
    vid.play().catch(()=>{
      /* 出声自动播放被拦 → 先静音播起来（声音开关还亮着，用户再点一下即可） */
      if(!vid.muted){ vid.muted=true; vid.play().catch(()=>{}); }
    });
  }else{
    try{ vid.pause(); }catch(e){}
    vid.style.display="none"; img.style.display="";
  }
  paintMotionBtn();
}
/* 动态/静态切换（Windows 照片同款：左上角「动态」按钮） */
function lbToggleLive(){
  const p=lbItems[lbIndex];
  if(!p||p.type!=="live")return;
  lbMotionOn=!lbMotionOn;
  applyLbMotion();
}
/* 声音开关 */
function lbToggleSound(){
  lbSoundOn=!lbSoundOn;
  const vid=$("#lbVideo");
  vid.muted=!lbSoundOn;
  /* 静音状态下被浏览器拦住的播放，开声后补一次播放尝试 */
  if(lbMotionOn&&vid.paused&&lbSoundOn)vid.play().catch(()=>{});
  paintSoundBtn();
}
/* 动态照片解析完成时补一手：若灯箱正开着这张，立刻显示控制条并播动态。
   修复：悬停会先于点击触发原图解析（promoteMotion），等灯箱打开时那次调用
   因 _motionTried 立即返回空，解析结果又只更新了图墙瓷砖 ——
   若不在这里补上，第一次打开就只有静态图，控制条也不出现，得关掉重开才有。 */
function lbPlayMotion(p){
  if(!p||p.type!=="live"||!p.live)return;
  if(!$("#lightbox").classList.contains("open"))return;
  if(lbItems[lbIndex]!==p)return;
  $("#lbMotionBar").style.display="";
  paintSoundBtn();
  lbMotionOn=true;
  applyLbMotion();
}
/* ---------- 灯箱取图 ----------
   两个要求同时满足：① 等的过程绝不能残留上一张；② 等的时间要尽可能短。
   做法：
     ⓪ 切图同一帧就换上「属于这张图」的内容 —— 优先用图墙里**已经解码好的同一张
        位图**（p._cache，同一 URL 命中内存缓存，0 请求 0 等待），没有才用内联的
        24px 模糊占位；同时按原始比例占好版式，画面绝不残留上一张、也不会跳版。
     ① 缩略图与清晰图**并行**请求（不是串行等待），谁先到先用谁，清晰图到了再升级；
     ② 全程 token 校验 + 档位 rank，旧的/低清的回调永远盖不掉新的。
   注：原来先等缩略图再拉 view，等于多付一次完整往返 —— 慢网下就是「一直转圈」，
   现在改成并行后少一个 RTT，且首帧往往直接命中缓存。 */
let lbImgToken=0;
let lbAnimDir=0;    /* 灯箱切换方向（stepLb 设置）：>0 下一张、<0 上一张、0=非切换打开（不播滑入） */
let lbVidToken=0;   /* 视频/动态视频的等待代次：换片后旧回调不得误撤新片的转圈 */
/* 视频类媒体（普通视频 / 动态照片的动态视频）加载期间显示转圈，
   直到真正有帧数据（loadeddata）或确认失败（error）才撤 ——
   让用户明确知道当前看到的还不是完整内容。已就绪（回看/切回）时不加圈。 */
function lbWaitMedia(el){
  if(el.readyState>=2)return;        /* HAVE_CURRENT_DATA 及以上：画面已经有了 */
  const vtok=++lbVidToken, lb=$("#lightbox");
  lb.classList.add("lb-busy");
  const done=()=>{ if(vtok===lbVidToken)lb.classList.remove("lb-busy"); };
  el.addEventListener("loadeddata",done,{once:true});
  el.addEventListener("error",done,{once:true});
}
function lbImgReset(){
  const img=$("#lbImg");
  img.onload=img.onerror=null;
  img.removeAttribute("src");
  img.classList.remove("lb-ph");
  img.style.removeProperty("width");
  img.style.removeProperty("height");
  /* 兜底换图的状态标记一并清掉：上一张用过 data-alt 兜底后若不清 data-s，
     下一张带兜底的图会命中「已失败过」分支直接被隐藏 */
  img.removeAttribute("data-alt");
  delete img.dataset.s;
}
/* 灯箱图片的最终显示尺寸：视口约束内保持比例，且不超过清晰图原生尺寸（不拉伸放大）。
   有清晰图原生尺寸记录（p._vw/_vh，预取或首次加载时记下）就用它；
   没有记录时按原图尺寸估 —— 原图远大于视口，算出的就是约束框，与最终一致 */
function lbBoxDims(p){
  const nw=p._vw||p.w||0, nh=p._vh||p.h||0;
  if(!nw||!nh)return null;
  const aspect=nw/nh;
  const w=Math.min(innerWidth*0.88, nw, innerHeight*0.8*aspect);
  return [w, w/aspect];
}
function showLbImage(p){
  const img=$("#lbImg");
  const token=++lbImgToken;
  const view=p.view||p.src||"";
  const mid=(p._cache&&p._cache!==view)?p._cache
           :(p.thumb2x&&p.thumb2x!==view)?p.thumb2x
           :(p.thumb&&p.thumb!==view)?p.thumb:"";
  img.onload=img.onerror=null;

  /* ⓪ 同一帧铺上这张图自己的画面；外框先按已知信息估一个，
     之后每级画面（缩略图/清晰图）到位都会按「实际画面的真实比例」校正外框 ——
     显示内容永远不会被裁剪或拉伸。此前外框只信元数据估算值，比例一旦估错，
     占位图被 object-fit:cover 裁掉一块，要等清晰图到了才「变全」 */
  img.classList.add("lb-ph");
  const dims=lbBoxDims(p);
  if(dims){
    img.style.width=dims[0]+"px";
    img.style.height=dims[1]+"px";
  }else{
    img.style.removeProperty("width");
    img.style.removeProperty("height");
  }
  /* rank：0=模糊占位 1=缩略图 2=清晰图，只允许往上换 */
  let rank=0;
  if(p._cache&&p._cacheReady&&p._cache!==view){
    img.src=p._cache; rank=1;          /* 图墙里已经解码好，立刻就是清晰画面 */
  }else if(p.blur){
    img.src=p.blur;
  }else{
    img.removeAttribute("src");
  }
  /* 转圈直到「清晰图真正落地」才撤（见 paint / Promise.all）——
     之前缩略图一到就撤，用户会误以为看到的低清画面就是最终效果 */
  $("#lightbox").classList.add("lb-busy");

  const load=(url,saveDims)=>new Promise(res=>{
    if(!url)return res(null);
    const i=new Image();
    i.decoding="async";
    i.onload=()=>{
      /* 记下清晰图原生尺寸：本次及之后切回这张时，占位框直接按最终尺寸算 */
      if(saveDims){ p._vw=i.naturalWidth; p._vh=i.naturalHeight; }
      res({url:url,w:i.naturalWidth,h:i.naturalHeight});
    };
    i.onerror=()=>res(null);
    i.src=url;
  });
  /* 按实际画面的宽高比校正外框：
     keepScale=true（缩略图级）→ 保持当前宽度、只修高度，尺寸不跳；
     keepScale=false（清晰图级）→ 这就是最终真实尺寸，完整重算 */
  const fixBox=(nw,nh,keepScale)=>{
    if(!nw||!nh)return;
    const aspect=nw/nh;
    const curW=parseFloat(img.style.width)||0;
    const w=(keepScale&&curW)?curW:Math.min(innerWidth*0.88, nw, innerHeight*0.8*aspect);
    img.style.width=w+"px";
    img.style.height=(w/aspect)+"px";
  };
  const paint=(pic,r)=>{
    if(!pic||token!==lbImgToken||r<rank)return;
    rank=r;
    img.classList.remove("lb-ph");
    fixBox(pic.w,pic.h,r===1);
    img.src=pic.url;
    if(r===2)$("#lightbox").classList.remove("lb-busy");   /* 清晰图落地才撤转圈 */
  };
  /* ① 两路并行：缩略图先到先上（顺带校正比例），清晰图到了再升级 */
  const jobs=[];
  if(mid)jobs.push(load(mid).then(pic=>paint(pic,1)));
  jobs.push(load(view,true).then(pic=>{ if(pic)paint(pic,2); }));
  Promise.all(jobs).then(()=>{
    if(token!==lbImgToken)return;
    $("#lightbox").classList.remove("lb-busy");
    /* 当前这张已经落地，再去预取前后两张 —— 不在下载途中抢带宽 */
    clearTimeout(lbNeighborTimer);
    lbNeighborTimer=setTimeout(preloadLbNeighbors,60);
  });
}
/* 预取前后各一张，连点箭头基本瞬开（只多下载两张，不影响首屏） */
let lbNeighborTimer=0;
function preloadLbNeighbors(){
  const n=lbItems.length;
  if(n<2)return;
  [lbIndex+1,lbIndex-1].forEach(k=>{
    const p=lbItems[(k+n)%n];
    if(!p||p.type==="video")return;
    const view=p.view||p.src;
    if(view){
      const a=new Image(); a.decoding="async";
      /* 顺手记下原生尺寸：等真切到这张时，占位框第一次就能按最终尺寸画 */
      if(!p._vw)a.onload=()=>{ p._vw=a.naturalWidth; p._vh=a.naturalHeight; };
      a.src=view;
    }
  });
}
/* 点击/悬停时「预热」：把瓷砖里已经解码好的那张位图记到 p 上（灯箱可直接复用），
   并提前开始拉清晰图 —— 比等 click 再发请求快一拍，慢网下尤其明显。 */
function lbPreheat(tile){
  if(!tile||tile.dataset.idx===undefined)return null;
  const grid=tile.closest("[data-photo-grid]");
  const list=(grid&&grid._items)||photos;
  const p=list[Number(tile.dataset.idx)];
  if(!p)return null;
  const im=tile.querySelector("img");
  if(im&&im.currentSrc){
    p._cache=im.currentSrc;
    p._cacheReady=!!im.complete&&im.naturalWidth>0;
  }
  if(p.type!=="video"&&!p._viewPreloaded){
    p._viewPreloaded=true;
    const a=new Image(); a.decoding="async";
    if(!p._vw)a.onload=()=>{ p._vw=a.naturalWidth; p._vh=a.naturalHeight; };
    a.src=p.view||p.src;
  }
  return p;
}
function setLbMedia(p){
  const img=$("#lbImg"), vid=$("#lbVideo"), bar=$("#lbMotionBar");
  lbMotionOn=false;
  bar.style.display="none";
  /* 先停掉上一条的动态视频，防止切换后还在放 */
  try{ vid.pause(); }catch(e){}
  vid.removeAttribute("src"); vid.load();
  /* 切图滑动过渡：只有方向键/箭头切换（stepLb 设了 lbAnimDir）才播，首次打开不播。
     先摘类 → 强制 reflow → 再加类，才能保证同一方向连按时动画每次都重播 */
  const applyLbSlide=el=>{
    el.classList.remove("lb-in-l","lb-in-r");
    if(lbAnimDir){
      void el.offsetWidth;
      el.classList.add(lbAnimDir>0?"lb-in-r":"lb-in-l");   /* 往下一张：新图从右滑入 */
    }
  };
  if(p.type==="video"){
    lbImgToken++;                 /* 作废还没回来的图片回调 */
    lbImgReset();
    img.style.display="none";
    vid.style.display="";
    applyLbSlide(vid);
    vid.controls=true; vid.muted=false; vid.loop=false;   /* 只播一遍，播完停在结尾 */
    lbWaitMedia(vid);             /* 转圈直到视频真正出画面（loadeddata），加载中不装作已就绪 */
    vid.src=p.src;
    /* 打开视频默认自动播放一遍；带声播放被浏览器拦时先静音播起来 */
    vid.play().catch(()=>{ vid.muted=true; vid.play().catch(()=>{}); });
  }else{
    vid.style.display="none";
    img.style.display="";
    applyLbSlide(img);
    img.removeAttribute("data-alt");
    delete img.dataset.s;   /* 清掉上一张遗留的兜底失败标记，避免下一张兜底失效 */
    /* 先秒出已缓存的缩略图，再换清晰的 view 图 —— 切图不再空白 / 停在上一张 */
    showLbImage(p);
    if(p.fb){
      img.dataset.alt=PHOTO_DIRS[0]+encodeURIComponent(p.fb);
      img.onerror=function(){
        if(img.dataset.s){img.onerror=null;return}
        img.dataset.s="1"; img.src=img.dataset.alt;
      };
    }
    if(p.type==="live"){
      /* 已识别的动态照片（配对 Live Photo / 内嵌视频 Motion Photo）→ 显示控制条
         并自动先播一遍动态效果，之后想再看再点「动态」 */
      bar.style.display="";
      paintSoundBtn();
      lbMotionOn=true;
      applyLbMotion();
    }else if(p.type==="image"&&p.motion!==false){
      /* motion 未知（旧扫描模式）时才现场探测；清单模式已知不是动态照片就跳过，
         免得为了一张静态图去整份下载原图。
         注意：悬停可能已经触发过解析（_motionTried 已置位），promoteMotion 会
         立即返回空 —— 所以这里必须再挂到真正的解析 promise 上，出结果后补播 */
      promoteMotion(p,null,false);
      motionVideoURL(p.src).then(()=>lbPlayMotion(p));
    }
  }
  lbAnimDir=0;    /* 方向只对本张生效，消费掉：之后的重渲染/动态补播不得再触发滑入 */
}
function openLb(items,i,grid){
  lbItems=items||[];
  if(!lbItems.length)return;
  lbGrid=grid||null;                              /* 记住灯箱是从哪个网格打开的（找缓存位图要用） */
  lbIndex=(i+lbItems.length)%lbItems.length;
  showLb();
  /* 关掉灯箱后把焦点还给触发元素。已在灯箱内部（如用方向键切图时 openLb 被再次调用）
     就保留最初记下的那个，别把焦点目标覆盖成灯箱里的按钮 */
  if(!$("#lightbox").contains(document.activeElement))lbFocus=document.activeElement;
  $("#lightbox").classList.add("open");
  document.body.classList.add("lb-lock");         /* 锁住背景滚动 */
  try{ $("#lbClose").focus(); }catch(e){}
}
function showLb(){
  const p=lbItems[lbIndex];
  if(!p)return;
  clearTimeout(lbNeighborTimer);       /* 上一张的邻居预取作废，别抢当前这张的带宽 */
  /* 用方向键 / 滑动切图时没经过点击，这里补一次：把图墙里那张已解码的位图记下来复用。
     必须校验「网格里这个下标对应的就是这张照片」，避免拿到别的相册的同下标照片 */
  if(!p._cache&&lbGrid){
    const tile=lbGrid.querySelector(`.ph-tile[data-idx="${lbIndex}"]`);
    const list=lbGrid._items||photos;
    if(tile&&list[Number(tile.dataset.idx)]===p)lbPreheat(tile);
  }
  setLbMedia(p);
  $("#lbImg").alt=p.name;
  $("#lbCount").textContent=`${lbIndex+1} / ${lbItems.length} · ${p.name}`;
  /* 图片的邻居预取放在这张加载完之后（见 showLbImage）；视频没有加载回调，直接预取 */
  if(p.type==="video")preloadLbNeighbors();
}
function closeLb(){
  lbImgToken++;                                   /* 作废还没回来的取图回调 */
  $("#lightbox").classList.remove("lb-busy");
  try{ $("#lbVideo").pause(); }catch(e){}
  $("#lightbox").classList.remove("open");
  document.body.classList.remove("lb-lock");
  if(lbFocus&&typeof lbFocus.focus==="function"){ try{ lbFocus.focus(); }catch(e){} }
  lbFocus=null;
}
function stepLb(d){
  lbAnimDir=d;                       /* 记下切换方向，setLbMedia 里据此播「从左/右滑入」过渡 */
  openLb(lbItems,lbIndex+d,lbGrid);
}

 *  博客：文章就是 blog 文件夹里的内容本身，不需要任何清单文件

 *    ① 本地服务器 / 支持目录列表的托管 → 解析目录页里的文件夹与 .md 文件（本地、实时）
 *    ② 静态托管没有目录列表（如 Cloudflare Pages）→ 走 GitHub 仓库目录 ＋ raw 直链

function samePosts(a,b){return JSON.stringify(a)===JSON.stringify(b);}
/* ⓪ 部署环境优先读静态清单 blog/index.json：一次几 KB 的请求＝整份列表，
      图片与正文全部走本站域名（Cloudflare CDN），不再碰 GitHub API / raw。
      清单由 scripts/gen-blog-index.mjs 自动生成（GitHub Action 或 Pages 构建命令运行），无需手动维护 */
async function manifestPosts(){
  try{
    /* no-cache（而非 no-store + 时间戳）：保留 304 协商缓存，新鲜度不变，
       部署环境不再每次全量回源下载清单 */
    const r=await fetch("blog/index.json",{cache:"no-cache"});
    if(!r.ok)return null;
    const j=await r.json();
    if(!j||!Array.isArray(j.posts))return null;
    return j.posts.filter(p=>p&&p.slug&&p.md).map(p=>({
      slug:String(p.slug),
      mdURL:encodeURI(String(p.md)),
      imgBase:encodeURI(String(p.imgBase||"")),
      title:p.title||p.slug,desc:p.desc||"",
      tags:Array.isArray(p.tags)?p.tags:[],
      date:p.date||"",
      minutes:+p.minutes||1,
      cover:p.cover||"",bg:p.bg||p.background||"",
      coverThumb:p.coverThumb?encodeURI(String(p.coverThumb)):"",
      bgThumb:p.bgThumb?encodeURI(String(p.bgThumb)):"",
      imgMap:(p.imgs&&typeof p.imgs==="object")?p.imgs:null,
      /* 静态英文版（由 GitHub Action 自动生成）：英文界面直接读它，
         不再逐条机器翻译，首屏不会先闪中文再换英文 */
      mdURLEn:p.mdEn?encodeURI(String(p.mdEn)):"",
      titleEn:p.titleEn||"",descEn:p.descEn||"",
      tagsEn:Array.isArray(p.tagsEn)?p.tagsEn:[]
    })).sort(byDateDesc);
  }catch(e){return null;}
}

/* 解析「目录列表」页 → [{name,dir}]；不是目录列表就返回 null */
async function listingItems(base){
  try{
    const r=await fetch(base+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return null;
    if(!(r.headers.get("content-type")||"").toLowerCase().includes("html"))return null;
    const html=await r.text();
    const items=[],seen=new Set();
    new DOMParser().parseFromString(html,"text/html").querySelectorAll("a[href]").forEach(a=>{
      let h=(a.getAttribute("href")||"").split(/[?#]/)[0].replace(/^\.\//,"");
      if(!h||/^[a-z][a-z0-9+.-]*:/i.test(h)||h.startsWith("/")||h.startsWith(".."))return;
      const dir=h.endsWith("/");
      let name=h.replace(/\/+$/,"");
      try{name=decodeURIComponent(name);}catch(e){}
      if(!name||name.includes("/"))return;
      if(!dir&&!/\.md$/i.test(name))return;
      if(seen.has(name))return;seen.add(name);
      items.push({name:name,dir:dir});
    });
    const isListing=items.length>0||/directory listing for|index of\s*\/|<h1>\s*index\b/i.test(html);
    return isListing?items:null;
  }catch(e){return null;}
}
/* 把一篇 Markdown 读成文章对象（mdURL = 正文地址，imgBase = 图片前缀） */
async function grabPost(slug,mdURL,imgBase,found){
  if(!slug||found.has(slug))return;
  let raw;
  try{
    /* no-cache：服务器没更新时走 304，不再每次全量拉正文 */
    const r=await fetch(mdURL,{cache:"no-cache"});
    if(!r.ok)return;
    raw=await r.text();
    /* SPA 兜底把不存在的 md 也回 200 + index.html：跳过，别让站点源码混进文章列表 */
    if(isHTMLFallbackText(raw))return;
  }catch(e){return;}
  const {meta,body}=parsePost(raw);
  const tags=Array.isArray(meta.tags)?meta.tags
    :(meta.tags?String(meta.tags).split(/[,，]/).map(x=>x.trim()).filter(Boolean):[]);
  found.set(slug,{
    slug,mdURL,imgBase,
    title:meta.title||slug,desc:meta.desc||"",tags,
    date:meta.date||"",
    minutes:+meta.minutes||Math.max(1,Math.round(body.replace(/\s/g,"").length/450)),
    cover:meta.cover||"",bg:meta.background||""
  });
}
/* ① 扫本地 / 托管的目录列表（多篇并行抓取） */
async function scanWebDir(absBase,found){
  const items=await listingItems(absBase);
  if(!items)return false;
  await Promise.all(items.map(it=>{
    const seg=encodeURIComponent(it.name);
    return grabPost(it.dir?it.name:it.name.replace(/\.md$/i,""),
      absBase+seg+(it.dir?"/index.md":""),
      absBase+(it.dir?seg+"/":""),found);
  }));
  return true;
}
/* ② 静态托管没有目录列表时，按仓库目录扫（GitHub API ＋ raw 直链，多篇并行） */
async function scanGitHubDir(repoDir,found){
  let arr;
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${repoDir}?ref=${GH_BRANCH}`,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return false;
    arr=await r.json();
  }catch(e){return false;}
  if(!Array.isArray(arr))return false;
  await Promise.all(arr.map(it=>{
    const seg=encodeURIComponent(it.name);
    if(it.type==="dir")
      return grabPost(it.name,`${GH_RAW}${repoDir}/${seg}/index.md`,`${GH_RAW}${repoDir}/${seg}/`,found);
    if(it.type==="file"&&/\.md$/i.test(it.name))
      return grabPost(it.name.replace(/\.md$/i,""),`${GH_RAW}${repoDir}/${seg}`,`${GH_RAW}${repoDir}/`,found);
    return Promise.resolve();
  }));
  return true;
}
/* 扫描链路：本地/托管目录列表 → GitHub 兜底 */
async function fetchBlogData(){
  const found=new Map(),seen=new Set();let ok=false;
  for(const base of BLOG_WEB_DIRS){
    let abs;
    try{abs=new URL(base,location.href).href;}catch(e){continue;}
    if(seen.has(abs))continue;          /* 站点就在根目录时，两个基址是同一个地址 */
    seen.add(abs);
    try{ if(await scanWebDir(abs,found))ok=true; }catch(e){}
  }
  if(!found.size){
    for(const dir of BLOG_REPO_DIRS){
      try{ if(await scanGitHubDir(dir,found))ok=true; }catch(e){}
      if(found.size)break;
    }
  }
  return {posts:Array.from(found.values()).sort(byDateDesc),ok};
}
async function loadBlog(){
  /* 只认「非空」的缓存：之前失败过一次留下空数组，空数组是 truthy，
     会把后面的重试全部挡掉 —— 断网进来过就再也刷不出文章，只能整页刷新 */
  if(blogCache&&blogCache.length)return blogCache;
  /* 部署环境：优先读静态清单（一次请求、走 CDN，最快） */
  if(!IS_LOCAL){
    const m=await manifestPosts();
    if(m&&m.length){blogCache=m;blogErr=false;lsSave(m);return blogCache;}
  }
  /* 本地：目录列表实时可用，直接扫，保证「写完刷新就能看到」 */
  if(IS_LOCAL){
    const r=await fetchBlogData();
    blogCache=r.posts;blogErr=!r.ok&&!r.posts.length;
    return blogCache;
  }
  /* 部署但没有清单：先吃 10 分钟内的本地缓存秒开，同时后台静默刷新 */
  const ls=lsRead();
  if(ls&&Date.now()-ls.t<LS_BLOG_TTL){
    blogCache=ls.posts;blogErr=false;
    refreshBlogInBackground();
    return blogCache;
  }
  const r=await fetchBlogData();
  if(r.posts.length){blogCache=r.posts;blogErr=false;lsSave(r.posts);}
  else if(ls){blogCache=ls.posts;blogErr=false;}   /* 网络抽风也有旧列表兜底 */
  else{blogCache=[];blogErr=true;}
  return blogCache;
}
/* 后台静默刷新：拿到新列表后就地更新（不重滚页面、不丢搜索词） */
let blogBgBusy=false;
async function refreshBlogInBackground(){
  if(blogBgBusy)return;blogBgBusy=true;
  try{
    const r=await fetchBlogData();
    if(r.posts.length&&!samePosts(r.posts,blogCache)){
      blogCache=r.posts;
      if(!IS_LOCAL)lsSave(r.posts);
      window.dispatchEvent(new CustomEvent("bloglist"));
    }
  }catch(e){}
  blogBgBusy=false;
}
/* 首页闲时预取清单：等你点进「博客」时列表已经在手里了 */
let blogPreAt=0;
function prefetchBlog(){
  if(IS_LOCAL||(blogCache&&blogCache.length)||location.hash.indexOf("#/blog")===0)return;
  const now=Date.now();
  if(now-blogPreAt<120000)return;blogPreAt=now;
  manifestPosts().then(m=>{if(m&&m.length){blogCache=m;blogErr=false;}});
}
/* 解析 front matter（--- 包围的元信息）与正文 */
/* SPA 兜底识别：静态托管常把不存在的路径也回 200 + index.html（_redirects / SPA 模式），
   拿到这种响应时"正文"其实是一整份站点源码，绝不能当 Markdown 渲染。
   特征：开头 120 字符内就是 <!DOCTYPE / <html / <head / <body（允许 BOM 与空白） */
function isHTMLFallbackText(t){
  return /^\s*(?:\ufeff)?\s*<(!doctype|html|head|body)/i.test(String(t).slice(0,120));
}
function parsePost(raw){
  const meta={};
  /* 先清掉 BOM 与开头的空行：记事本之类另存会加 BOM，手抖先敲个回车也很常见，
     不处理的话 ^--- 匹配不上，整段 front matter 会当正文渲染出来（标题/标签也全丢） */
  let body=String(raw==null?"":raw).replace(/^\ufeff/,"").replace(/^(?:[ \t]*\r?\n)+/,"");
  const m=body.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if(m){
    m[1].split(/\r?\n/).forEach(line=>{
      const kv=line.match(/^([A-Za-z][\w-]*):\s*(.*)$/);
      if(!kv)return;
      let v=kv[2].trim();
      if(/^\[.*\]$/.test(v)){
        try{v=JSON.parse(v);}
        catch(e){v=v.slice(1,-1).split(",").map(s=>s.trim().replace(/^["']|["']$/g,"")).filter(Boolean);}
      }else v=v.replace(/^["']|["']$/g,"");
      /* 同时存原始键与小写键：title/cover 等小写键照常命中，
         bgThumb 这类驼峰键也能按原样读到（只存小写会让它永远查不到） */
      meta[kv[1]]=v;
      meta[kv[1].toLowerCase()]=v;
    });
    body=m[2];
  }
  return {meta,body};
}
/* 极简 Markdown 渲染：标题/引用/代码块/列表/图片/链接/加粗/斜体/行内码/分隔线 */
function mdToHTML(md,imgBase,imgMap){
  /* 正文图片缩略图映射：文件名 → 构建时压缩的 WebP 版本 */
  /* 行内文本先做过 HTML 转义，路径里的 & < > 等已变成 &amp; 等 ——
     查 imgMap / 拼地址前要先还原，否则带这些字符的文件名永远匹配不上 */
  const unesc=t=>String(t).replace(/&amp;/g,"&").replace(/&lt;/g,"<")
    .replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  const imgHit=src=>{
    if(!imgMap)return null;
    if(imgMap[src])return imgMap[src];
    const t=unesc(src);
    if(imgMap[t])return imgMap[t];
    try{ return imgMap[decodeURIComponent(t)]||null; }catch(e){ return null; }
  };
  const inline=s=>{
    s=esc(s);
    /* 行内代码先摘成占位符：否则里面的 * _ 会被下面的强调规则当成标记，
       `a*b*c` 会被渲染成 a<em>b</em>c（代码内容被改坏）。译后统一还原。 */
    const codes=[];
    s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return "\u0001K"+(codes.length-1)+"\u0001";});
    /* 图片/链接路径允许空格与一层括号（Windows 截图等文件名常带空格/括号） */
    s=s.replace(/!\[([^\]]*)\]\(((?:[^()]|\([^()]*\))+)\)/g,(m,alt,src)=>{
      src=src.trim();
      let u;
      if(/^(https?:|data:|\/)/.test(src))u=unesc(src);
      else{
        const hit=imgHit(src);
        u=hit?encodeURI(hit):imgBase+unesc(src);
      }
      return `<img src="${esc(u)}" alt="${alt}" loading="lazy" decoding="async">`;
    });
    s=s.replace(/\[([^\]]+)\]\(((?:[^()]|\([^()]*\))+)\)/g,(m,txt,href)=>{
      const u=href.trim();
      /* 协议白名单：禁掉 javascript: / vbscript: / data: 等危险 scheme，防止文章里藏 XSS 链接 */
      if(/^(javascript|vbscript|data)\s*:/i.test(u))return txt;
      return `<a href="${u}" target="_blank" rel="noopener">${txt}</a>`;
    });
    s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
       .replace(/\*([^*]+)\*/g,"<em>$1</em>");
    s=s.replace(/\u0001K(\d+)\u0001/g,(m,i)=>{
      const c=codes[+i];
      return c===undefined?m:"<code>"+c+"</code>";
    });
    return s;
  };
  const lines=md.split(/\r?\n/),out=[];let i=0;
  const BLOCK=/^(#{1,4})\s+|^```|^\s*>|^\s*[-*+]\s+|^\s*\d+[.)]\s+|^\s*(---+|\*\*\*+)\s*$|^\s*\|/;
  const ALIGN={l:"left",c:"center",r:"right"};
  while(i<lines.length){
    const L=lines[i];
    if(/^```/.test(L)){
      const buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);continue;
    }
    /* 表格：连续以 | 开头的行，且第二行是分隔行（|---|---| / |:--:|）才认。
       行尾竖线可省略（GFM 允许）；不是标准表格的竖线行照旧按普通段落渲染，
       避免把「|l 文字」这类对齐段误判 */
    if(/^\s*\|/.test(L)){
      const rows=[];let k=i;
      while(k<lines.length&&/^\s*\|/.test(lines[k])){rows.push(lines[k]);k++;}
      const isSep=r=>/^\s*\|[\s:|-]*$/.test(r)&&/-/.test(r);
      if(rows.length>=2&&isSep(rows[1])){
        const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim());
        const head=cells(rows[0]);
        const align=cells(rows[1]).map(a=>{
          const l=/^:/.test(a), r=/:$/.test(a);
          return (l&&r)?"center":r?"right":l?"left":"";
        });
        const body=rows.slice(2).map(cells);
        const st=j=>align[j]?` style="text-align:${align[j]}"`:"";
        out.push('<div class="md-table"><table><thead><tr>'+
          head.map((c,j)=>`<th${st(j)}>${inline(c)}</th>`).join("")+
          '</tr></thead><tbody>'+
          body.map(r=>"<tr>"+head.map((_,j)=>`<td${st(j)}>${inline(r[j]||"")}</td>`).join("")+"</tr>").join("")+
          '</tbody></table></div>');
        i=k;continue;
      }
    }
    /* 对齐段落：|l 文字 / |c 文字 / |r 文字（连续几行算一段） */
    const am=L.match(/^\|([lcr])\s+(.*)/);
    if(am){
      const buf=[am[2]];i++;
      while(i<lines.length&&!/^\s*$/.test(lines[i])&&!BLOCK.test(lines[i])){buf.push(lines[i]);i++;}
      out.push(`<p style="text-align:${ALIGN[am[1]]}">${inline(buf.join(" "))}</p>`);
      continue;
    }
    const h=L.match(/^(#{1,4})\s+(.*)/);
    if(h){const lv=h[1].length+1;out.push(`<h${lv}>${inline(h[2])}</h${lv}>`);i++;continue;}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(L)){out.push("<hr>");i++;continue;}
    if(/^\s*>\s?/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`);continue;
    }
    if(/^\s*[-*+]\s+/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){buf.push(lines[i].replace(/^\s*[-*+]\s+/,""));i++;}
      out.push(`<ul>${buf.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`);continue;
    }
    if(/^\s*\d+[.)]\s+/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){buf.push(lines[i].replace(/^\s*\d+[.)]\s+/,""));i++;}
      out.push(`<ol>${buf.map(x=>`<li>${inline(x)}</li>`).join("")}</ol>`);continue;
    }
    if(/^\s*$/.test(L)){i++;continue;}
    const buf=[];
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!BLOCK.test(lines[i])){buf.push(lines[i]);i++;}
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("");
}
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(d,short){
  const m=(d||"").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m)return d||"";
  const mo=+m[2],day=+m[3];
  if(!(mo>=1&&mo<=12)||!(day>=1&&day<=31))return d||"";   /* 日期写错就原样显示，别输出 undefined */
  return lang==="zh"
    ?(short?`${mo} 月 ${day} 日`:`${m[1]} 年 ${mo} 月 ${day} 日`)
    :(short?`${MONTHS[mo-1]} ${day}`:`${MONTHS[mo-1]} ${day}, ${m[1]}`);
}
function postSrc(p,f){ return /^(https?:|data:|\/)/.test(f)?f:((p&&p.imgBase)||"")+f; }
/* 由中文原文地址推出英文版地址：blog/x/index.md → blog/x/index.en.md */
function mdEnURL(u){
  if(!u||typeof u!=="string")return "";
  if(/\/index\.md$/i.test(u))return u.replace(/\/index\.md$/i,"/index.en.md");
  if(/\.md$/i.test(u))return u.replace(/\.md$/i,".en.md");
  return "";
}

/* 博客列表骨架屏：形状/尺寸与真实卡片一致（缩略图块、标签条、标题条、摘要条、日期条） */
function blogSkeletonHTML(){
  const card=(pw,tw,dw)=>`
    <div class="skl-card">
      <span class="skl skl-thumb"></span>
      <span class="skl-mid">
        <span class="skl skl-pill" style="width:${pw}%"></span>
        <span class="skl skl-title" style="width:${tw}%"></span>
        <span class="skl skl-desc" style="width:${dw}%"></span>
      </span>
      <span class="skl-side">
        <span class="skl skl-meta" style="width:54px"></span>
        <span class="skl skl-meta" style="width:40px"></span>
      </span>
    </div>`;
  return `<div class="skl-wrap" id="blogSkl" aria-hidden="true">
    <div class="blog-list">
      <div class="skl skl-year"></div>
      ${card(22,58,72)}${card(14,66,64)}${card(26,52,78)}${card(18,61,70)}${card(24,56,75)}${card(16,63,66)}
    </div>
    <div class="skl-beam"></div>
  </div>`;
}
/* ---------- 博客搜索 ---------- */
let blogPosts=[];        /* 最近一次加载的文章列表 */
let blogQuery="";        /* 搜索词：会话内保留，看完文章返回博客还在 */
function blogMatch(p,q){
  if(!q)return true;
  const tr=p._tr||{};   /* 译文（英文界面翻译完成后挂上）：英文关键词也能搜到中文文章 */
  const hay=((p.title||"")+" "+(p.desc||"")+" "+((p.tags||[]).join(" "))+" "+(p.slug||"")
    +" "+(p.titleEn||"")+" "+(p.descEn||"")+" "+((p.tagsEn||[]).join(" "))
    +" "+(tr.t||"")+" "+(tr.d||"")+" "+((tr.g||[]).join(" "))).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
/* 转义后高亮：命中片段包 <mark>，不会引入 HTML 注入 */
function hiText(str,q){
  const s=esc(str||"");
  const words=(q||"").trim().split(/\s+/).filter(Boolean);
  if(!words.length)return s;
  const safe=words.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).filter(Boolean);
  if(!safe.length)return s;
  const pat=new RegExp("("+safe.join("|")+")","gi");
  /* 只在「非实体」片段里高亮：整串直接替换的话，搜 "amp" 会把 &amp; 拆成
     "&<mark>amp</mark>;"，页面就露出一个裸分号。 */
  return s.split(/(&[#a-zA-Z0-9]+;)/).map(part=>
    /^&[#a-zA-Z0-9]+;$/.test(part)?part:part.replace(pat,"<mark>$1</mark>")
  ).join("");
}
function blogListHTML(list,q,stagger){
  const t=T();
  if(!list.length)return `<div class="blog-empty">${esc(t.blog.noResult(q||""))}</div>`;
  let html="",lastYear="",i=0;
  list.forEach(p=>{
    const y=(p.date||"").slice(0,4)||"····";
    if(y!==lastYear){

/* ---------- 文章自动翻译：英文界面下把中文文章机器翻译成英文 ----------
   做法：文章先按中文原样秒出，后台用免费的 Google 翻译接口（无需密钥）逐段翻译，
   完成后无感替换正文；译文按「slug+内容指纹」缓存在 localStorage，第二次打开秒出。
   Markdown 结构保护：代码块 / 图片 / 行内代码 / 链接地址 / 表格 / HTML 块不送翻，
   行内元素用 SnPt<序号> 占位符摘出、译后还原；某一行翻译失败就保留原文，绝不白屏。 */
const TR_TOKEN=/SnPt\s*(\d+)/g;
function trHash(s){
  let h=5381;
  for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
  return (h>>>0).toString(36);
}
function hasCJK(s){return /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/.test(String(s));}
/* 判断「还有没有真正需要翻译的中文」：代码块、行内代码、图片路径、链接地址、HTML 标签
   里的中文一律不算 —— 静态英文版里的 ![屏幕截图_x](屏幕截图_x.jpg)、cover: 中文文件名.jpg
   这类是资源名，本来就不该翻，却被 hasCJK 误判成「没翻译」，于是整页又去走临时机翻 */
function hasCJKText(s){
  const t=String(s==null?"":s)
    .replace(/```[\s\S]*?```/g,"")        /* 围栏代码块 */
    .replace(/~~~[\s\S]*?~~~/g,"")
    .replace(/`[^`\n]*`/g,"")             /* 行内代码 */
    .replace(/!\[[^\]]*\]\([^)]*\)/g,"")  /* 图片：alt 与路径都不算正文 */
    .replace(/\[([^\]]*)\]\([^)]*\)/g,"$1")/* 链接：只留链接文字 */
    .replace(/<[^>]*>/g,"")               /* HTML 标签（含属性里的中文） */
    .replace(/\bhttps?:\/\/\S+/g,"");     /* 裸链 */
  return hasCJK(t);
}
/* 翻译引擎链（全部免密钥、无日配额，已不再使用有每日限额的 MyMemory）：
   ① 浏览器本地模型：Chrome 138+ 内置的 Translator API，模型在本地，零网络请求、
      零次数限制，离线也能翻；模型没装好就自动跳过，不会偷偷下载几十 MB。
   ② 本站代理：Cloudflare Pages Function（/api/translate），由边缘节点去调 Google，
      国内网络不受墙影响 —— 这是线上主通道。
   ③ Google 直连：境外网络或开了代理的访客直接命中，最快。
   三路都失败才保留中文原文；第一次成功的引擎会被记住，后续请求优先走它。 */
const TR_PROXY="/api/translate";
let trProxyDead=false;          /* 代理 404 一次就永久跳过（本地开发场景） */
let trEngineId="";              /* 上次成功的引擎 id */
let trLocalState="";            /* ""=未探测 | available | downloadable */
let trLocalReady=false;         /* 本地模型已就绪：优先用它，零请求零延迟 */
let trLocal=null;               /* 本地翻译器实例（只建一次） */
let trRetry=null;               /* 当前文章「重新翻译」入口（失败提示里的按钮用） */
try{ trEngineId=localStorage.getItem("jy-tr-engine")||""; }catch(e){}
/* 开机就悄悄探一下本地模型（只是查询状态，不会触发下载） */
if("Translator" in self){
  Promise.resolve().then(async()=>{
    try{
      const av=await self.Translator.availability({sourceLanguage:"zh",targetLanguage:"en"});
      trLocalState = av==="available" ? "available" : "downloadable";
      if(trLocalState==="available")trLocalReady=true;
    }catch(e){ trLocalState="downloadable"; }
  }).catch(()=>{});
}
function trTimeout(ms){
  const ac=new AbortController();
  const timer=setTimeout(()=>ac.abort(),ms);
  return {signal:ac.signal,done:()=>clearTimeout(timer)};
}
/* 引擎 1：本站 Pages Function 代理（同域，国内可用） */
async function trViaProxy(text){
  if(trProxyDead){const e=new Error("no proxy");e.skip=true;throw e;}   /* 环境问题，不计数 */
  const tk=trTimeout(9000);
  try{
    const r=await fetch(TR_PROXY,{method:"POST",signal:tk.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q:text,from:"zh-CN",to:"en"})});
    if(r.status===404){trProxyDead=true;const e=new Error("no proxy");e.skip=true;throw e;}
    if(!r.ok)throw new Error("proxy "+r.status);
    const j=await r.json();
    if(!j||typeof j.text!=="string"||!j.text.trim())throw new Error("proxy bad");
    return j.text;
  }finally{ tk.done(); }
}
/* 引擎 2：Google 翻译公开接口直连（境外网络/有代理时可用）
   超时压到 6 秒：国内被墙时请求会一直挂着，等满 9 秒纯属干耗，短一点能更快放弃 */
async function trViaGoogle(text){
  const tk=trTimeout(6000);
  try{
    const r=await fetch("https://translate.googleapis.com/translate_a/single"
      +"?client=gtx&sl=zh-CN&tl=en&dt=t&q="+encodeURIComponent(text),
      {cache:"no-cache",signal:tk.signal});
    if(!r.ok)throw new Error("google "+r.status);
    const j=await r.json();
    if(!Array.isArray(j)||!Array.isArray(j[0]))throw new Error("google bad response");
    const out=j[0].map(p=>(p&&typeof p[0]==="string")?p[0]:"").join("");
    if(!out.trim())throw new Error("google empty");
    return out;
  }finally{ tk.done(); }
}
/* 按句子切块：本地模型单次输入不宜过长，长段落切成几块分别翻再拼回去 */
function trChunks(text,max){
  const out=[];let rest=String(text);
  while(rest.length>max){
    let cut=-1;
    for(let i=max;i>Math.floor(max*0.5);i--){
      if(/[。！？；\n.!?;]/.test(rest.charAt(i))){cut=i+1;break;}
    }
    if(cut<0)cut=max;
    out.push(rest.slice(0,cut));rest=rest.slice(cut);
  }
  if(rest)out.push(rest);
  return out;
}
/* 引擎 1：浏览器内置翻译（Chrome 138+ 的 Translator API）
   —— 模型跑在本机，不联网、不花额度、不限次数，是「无限量」这条需求的根本上解。
   只在模型已经就绪（availability === "available"）时才用：不替用户偷偷下载模型。
   Firefox / Safari 暂不支持，会瞬间跳过，不影响其它引擎。 */
async function trViaLocal(text){
  const notReady=msg=>{const e=new Error(msg);e.skip=true;return e;};
  if(trLocalState==="downloadable")throw notReady("local model not ready");
  if(!("Translator" in self)){trLocalState="downloadable";throw notReady("no local translator");}
  if(!trLocalState){
    let av="";
    try{ av=await self.Translator.availability({sourceLanguage:"zh",targetLanguage:"en"}); }
    catch(e){ av=""; }
    /* available=可直接用；downloadable/downloading/unavailable=这轮先不用 */
    trLocalState = av==="available" ? "available" : "downloadable";
  }
  if(trLocalState!=="available")throw notReady("local model not ready");
  trLocalReady=true;
  if(!trLocal){
    trLocal=await self.Translator.create({sourceLanguage:"zh",targetLanguage:"en"});
  }
  const parts=trChunks(text,900);
  const outs=[];
  for(const p of parts){
    const s=await trLocal.translate(p);
    if(typeof s!=="string"||!s.trim())throw new Error("local empty");
    outs.push(s.trim());
  }
  return outs.join(" ").trim();
}
/* 引擎顺序：本地模型优先（零成本零延迟），其次同域代理，最后直连 */
const TR_ENGINES=[{id:"local",run:trViaLocal},{id:"proxy",run:trViaProxy},{id:"google",run:trViaGoogle}];
/* 引擎失败计数：只用来避免「同一篇文章内」反复撞死通道。
   换一篇文章必定清零 —— 绝不能因为上一篇某几段失败，就把引擎冷却到下一篇。
   只有「真的连不上、被拒」才计数；「本地模型没装 / 代理不存在」这类环境性原因
   直接标记 skip，不参与计数，也不影响其它引擎。 */
const trFail={};
const TR_COOL_MS=90*1000;      /* 冷却时长：短一点，网络抖动后能很快恢复 */
const TR_FAIL_MAX=3;           /* 同一篇内连续失败 3 次才冷却 */
function trCooling(id){
  const f=trFail[id];
  return !!f&&f.until>Date.now();
}
function trMarkFail(id,err){
  if(err&&err.skip)return;
  const now=Date.now();
  const f=trFail[id]||(trFail[id]={n:0,until:0,since:now});
  if(now-f.since>60000){f.n=0;f.since=now;}   /* 不是连续失败：重新计数 */
  f.n++;
  if(f.n>=TR_FAIL_MAX)f.until=now+TR_COOL_MS;
}
function trMarkOk(id){
  const f=trFail[id];
  if(f){f.n=0;f.until=0;f.since=0;}
}
/* 换文章 / 重新渲染列表时调用：把上一轮的所有失败记录清空 */
function trResetFail(){
  for(const k in trFail)delete trFail[k];
}
/* 「重试」按钮：清空冷却与失败记录后重跑当前文章的翻译（不刷新页面） */
document.addEventListener("click",e=>{
  const el=e.target&&e.target.closest?e.target.closest(".tr-retry"):null;
  if(!el)return;
  el.disabled=true;
  trResetFail();
  if(typeof trRetry==="function")trRetry();
});
/* 统一入口：按「上次成功的引擎优先」依次尝试，全失败才抛错（调用方保留原文） */
async function gTranslate(text){
  /* 排序：本地模型就绪→最前（不花流量、不等网络）；其次上次成功的引擎；其余按原序 */
  const rank=e=>(e.id==="local"&&trLocalReady)?0:(e.id===trEngineId?1:2);
  const order=TR_ENGINES.slice().sort((a,b)=>rank(a)-rank(b));
  let lastErr=null;
  for(const e of order){
    if(trCooling(e.id))continue;
    try{
      const out=await e.run(text);
      if(out&&out.trim()){
        trMarkOk(e.id);
        if(trEngineId!==e.id){
          trEngineId=e.id;
          try{ localStorage.setItem("jy-tr-engine",e.id); }catch(_){}
        }
        return out;
      }
    }catch(err){
      lastErr=err;
      trMarkFail(e.id,err);
    }
  }
  throw lastErr||new Error("no engine");
}
/* 小型并发池：同时最多 limit 个任务，单个失败不影响其它。
   注意空任务列表必须立刻 resolve —— next() 只在下面的 for 里首次调用，
   空列表时它一次都不会跑，漏了这步整个 Promise 永远挂着（正文纯段落时
   「标题/列表行」分组就是空的，全篇无可翻行的文章也会卡在这）。 */
function trPool(items,limit,fn){
  return new Promise(res=>{
    if(!items||!items.length){res();return;}
    let idx=0,act=0;
    const next=()=>{
      if(idx>=items.length){ if(!act)res(); return; }
      const it=items[idx++]; act++;
      Promise.resolve().then(()=>fn(it)).catch(()=>{}).finally(()=>{act--;next();});
    };
    for(let k=0;k<limit&&k<items.length;k++)next();
  });
}
/* 翻译一行：先把行内代码 / 图片 / 链接地址摘成占位符，只送纯文字去翻，译后还原 */
async function translateLine(line){
  const keep=[];
  const stash=s=>{keep.push(s);return "SnPt"+(keep.length-1);};
  try{
    let work=line
      .replace(/`[^`]+`/g,m=>stash(m))                                   /* 行内代码原样保留 */
      .replace(/!\[[^\]]*\]\([^)\s]+[^)]*\)/g,m=>stash(m))               /* 图片原样保留 */
      .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,(m,txt,u)=>"["+txt+stash("]("+u+")")); /* 链接只翻文字 */
    if(!hasCJK(work))return line;                                        /* 摘完没有中文了（纯链接行等） */
    let out=await gTranslate(work);
    out=out.replace(TR_TOKEN,(m,n)=>keep[+n]!==undefined?keep[+n]:m);
    if(TR_TOKEN.test(out)){TR_TOKEN.lastIndex=0;return line;}            /* 占位符没还原干净 → 保原文 */
    TR_TOKEN.lastIndex=0;
    /* 链接结构被译坏（[ 数量对不上）也回退原文，宁可显示中文也不显示破图 */
    const br=s=>(s.match(/\[/g)||[]).length;
    if(br(out)!==br(line))return line;
    return out;
  }catch(e){ return line; }
}
/* 整篇 Markdown 翻译：按行分发，代码块 / 表格 / HTML / 纯图片行直接跳过。
   不能一行一个请求 —— 标题摘要三五个请求能过，正文十几行并发打出去
   必触发接口限流，连续失败还会把引擎冷却掉，整篇正文全留在中文。
   所以把可翻的行打包成组（6 行一组、换行分隔）一次翻一组；
   返回行数对不上（引擎吞行/并行不同）就整组退回逐行翻，再不行才保留原文。
   标签翻译走的正是这种「合并-对齐」路数，实测可靠。 */
async function translateMarkdown(md){
  const lines=String(md).split(/\r?\n/);
  const out=lines.slice();
  const jobs=[];
  let inCode=false;
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(/^\s*(```|~~~)/.test(line)){inCode=!inCode;out[i]=line;continue;}
    if(inCode){out[i]=line;continue;}
    if(!line.trim()
      ||/^\s*(<|<!--|\||!\[)/.test(line)
      ||/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)
      ||!hasCJK(line)){ out[i]=line; continue; }
    jobs.push({i,line});
  }
  /* 先按行分类再分组：只有「连续的纯段落行」才打包合翻；
     标题/列表/引用行有行首结构标记，混进合翻组会被引擎弄坏，必须逐行翻。
     如果先切组再判断「整组都是段落」，段落和结构行一混组就全退化成逐行。 */
  const GROUP=6;
  const isStruct=line=>/^#{1,6}\s/.test(line)||/^\s*([-*+]|\d+[.)])\s/.test(line)||/^>\s?/.test(line);
  /* 行内含行内代码 / 链接 / 图片的行也必须逐行翻：translateLine 会把它们摘成
     占位符再送翻，合组翻译则是整段原样发出去，代码与 URL 容易被翻坏。 */
  const hasInline=/`|!\[|\]\(/;
  const singles=[];        /* 结构行 / 含行内标记的行：逐行翻 */
  const groups=[];         /* 纯段落组：合并成一次请求 */
  let bundle=[];
  const flush=()=>{ if(bundle.length){groups.push(bundle);bundle=[];} };
  for(const j of jobs){
    if(isStruct(j.line)||hasInline.test(j.line)){ flush(); singles.push(j); }
    else{ bundle.push(j); if(bundle.length>=GROUP)flush(); }
  }
  flush();
  const byLine=async g=>{   /* 整组失败的兜底：组内逐行翻，成功几行算几行 */
    await trPool(g,2,async j=>{ out[j.i]=await translateLine(j.line); });
  };
  await trPool(singles,3,async j=>{ out[j.i]=await translateLine(j.line); });
  await trPool(groups,2,async g=>{
    const joined=g.map(j=>j.line).join("\n");
    try{
      const tr=await gTranslate(joined);
      const parts=String(tr).split(/\r?\n/).map(s=>s.trim());
      if(parts.length===g.length&&parts.every(s=>s)){
        g.forEach((j,k)=>{out[j.i]=parts[k];});
      }else{
        await byLine(g);     /* 行数没对齐：这组别硬塞，退回逐行 */
      }
    }catch(e){
      await byLine(g);
    }
  });
  return out.join("\n");
}
/* 翻译标签数组：带中文的标签先合并成一次请求（换行分隔、按行对齐），
   行数对不上（不同引擎对换行的处理不一样）就逐个翻，保证标签不会整组卡在中文 */
async function translateTags(tags){
  const arr=(Array.isArray(tags)?tags:[]).map(x=>String(x));
  const idx=arr.map((x,i)=>hasCJK(x)?i:-1).filter(i=>i>=0);
  if(!idx.length)return arr;
  try{
    const out=await gTranslate(idx.map(i=>arr[i]).join("\n"));
    const parts=out.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(parts.length===idx.length){
      const res=arr.slice();
      idx.forEach((orig,k)=>res[orig]=parts[k]);
      return res;
    }
  }catch(e){}
  /* 兜底：逐个翻译，成功的替换、失败的原样保留 */
  const res=arr.slice();
  let hit=0;
  await trPool(idx,3,async i=>{
    try{
      const s=await gTranslate(arr[i]);
      if(s&&s.trim()){ res[i]=s.trim(); hit++; }
    }catch(e){}
  });
  return hit?res:arr;
}
const TR_MEM=new Map();   /* 本次会话内缓存，避免同一篇文章来回切语言反复请求 */
/* 旧版缓存（jy-tr: / jy-trm:）里可能存着「翻译失败、标题仍是中文」的结果，会让标题一直
   显中文。只在首次运行时清一次并落个标记 —— 以前每打开一次页面都要遍历整库 localStorage，
   而当前用的键是 jy-trb2: / jy-trm2:，这段其实早就空跑了。 */
(function trPurgeOldCache(){
  try{
    if(localStorage.getItem("jy-tr-purged")==="2")return;
    const kill=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&(/^jy-tr:/.test(k)||/^jy-trm:/.test(k)||/^jy-tr2:/.test(k)))kill.push(k);
    }
    kill.forEach(k=>localStorage.removeItem(k));
    localStorage.setItem("jy-tr-purged","2");
  }catch(e){}
})();
/* 写缓存：localStorage 有 5MB 上限，整篇译文很容易把它撑满。
   配额满了就先丢掉正文译文缓存再试一次，别让「翻完了却存不下」白翻一遍 */
function lsPut(k,v){
  try{ localStorage.setItem(k,v); return true; }catch(e){}
  try{
    const kill=[];
    for(let i=0;i<localStorage.length;i++){
      const kk=localStorage.key(i);
      if(kk&&kk!==k&&/^jy-trb/.test(kk))kill.push(kk);
    }
    kill.forEach(kk=>localStorage.removeItem(kk));
    localStorage.setItem(k,v);
    return true;
  }catch(e){ return false; }
}
/* 翻译一篇完整文章：正文与「标题/摘要/标签」分开缓存。
   好处是正文翻译成功就先落盘（下次打开秒出，不再重复消耗额度），
   标题或标签偶发失败也不会连累正文白翻一遍。 */
async function translatePost(slug,title,desc,body,tags){
  tags=Array.isArray(tags)?tags:[];
  /* 元信息（标题/摘要/标签）复用列表页那份缓存，两边只翻一次 */
  const meta=await translatePostMeta({slug,title,desc,tags});
  const bkey="jy-trb2:"+slug+":"+trHash(body);
  let bb=null;
  try{ const c=localStorage.getItem(bkey); if(c)bb=JSON.parse(c).b; }catch(e){}
  if(!bb&&TR_MEM.has(bkey))bb=TR_MEM.get(bkey).b;
  if(!bb){
    bb=await translateMarkdown(body);
    if(bb&&bb!==body){
      TR_MEM.set(bkey,{b:bb});
      lsPut(bkey,JSON.stringify({b:bb}));
    }
  }
  return {t:(meta&&meta.t)||title,d:(meta&&meta.d)||desc,g:(meta&&meta.g)||tags,b:bb||body};
}
/* 列表条目的轻量翻译：只翻标题 + 摘要 + 标签，不碰正文（正文进详情页才翻）。
   独立缓存 jy-trm2:...，与详情页的 jy-tr2:... 互不干扰。
   缓存里存的是 Promise：同一个条目的并发请求（打字筛选时会重渲染列表）共用一次，
   以前每次重渲染都会为同一篇再发一遍翻译请求 */
const TRM_MEM=new Map();
function translatePostMeta(post){
  const title=post.title||"",desc=post.desc||"",tags=Array.isArray(post.tags)?post.tags:[];
  if(!hasCJK(title+desc+tags.join("")))return Promise.resolve(null);   /* 全英文条目不用翻 */
  const key="jy-trm2:"+(post.slug||"")+":"+trHash(title+"\u0000"+desc+"\u0000"+tags.join("\u0000"));
  try{ const c=localStorage.getItem(key); if(c)return Promise.resolve(JSON.parse(c)); }catch(e){}
  if(TRM_MEM.has(key))return TRM_MEM.get(key);
  const job=(async()=>{
    const [tt,gg,dd]=await Promise.all([
      hasCJK(title)?gTranslate(title).catch(()=> ""):Promise.resolve(""),
      translateTags(tags),
      desc&&hasCJK(desc)?gTranslate(desc).catch(()=> ""):Promise.resolve("")
    ]);
    const r={t:tt||title,g:gg,d:dd||desc};
    /* 标题 / 摘要 / 标签有任意一项没翻成就不落盘，下次打开重试，别把中文永久当成译文缓存 */
    const okT=!hasCJK(title)||!!tt;
    const okD=!desc||!hasCJK(desc)||!!dd;
    const okG=tags.every((x,i)=>!hasCJK(x)||(gg[i]&&gg[i]!==x));
    if(okT&&okD&&okG)lsPut(key,JSON.stringify(r));
    return r;
  })();
  /* 失败就撤掉这次记录、下次还能再试；同时给调用方一个可用的中文兜底。
     存进缓存的也是这个带兜底的 Promise —— 后来的调用方直接拿它，谁都不会抛 */
  const safe=job.catch(()=>{TRM_MEM.delete(key);return {t:title,g:tags,d:desc};});
  TRM_MEM.set(key,safe);
  return safe;
}
/* 英文界面下批量翻译博客列表：列表先按中文秒出，译文逐张无感替换。
   seq 是列表代次——搜索词一变列表就重渲染，旧的翻译结果不许再写新 DOM */
let blogTrSeq=0;
function translateBlogList(list){
  const seq=++blogTrSeq;   /* 列表每重渲染一次（含切回中文）都让在途翻译全部作废 */
  if(lang!=="en"||!Array.isArray(list)||!list.length)return;
  /* 注意：这里不再 trResetFail()。搜索每敲一个字都会重渲染列表，
     每次都清冷却的话，接口一被限流就会「每敲一下重新撞一遍」，反而更糟。
     换文章 / 重新进博客页时已经各清一次了。 */
  const q=blogQuery;
  const slugSel=s=>".post-card[data-slug=\""+((window.CSS&&CSS.escape)?CSS.escape(s):String(s).replace(/"/g,""))+"\"]";
  trPool(list,4,async p=>{
    if(p.titleEn||p.descEn)return;               /* 已有静态英文版：直接用，不必再机翻 */
    const r=await translatePostMeta(p);
    if(!r||seq!==blogTrSeq)return;               /* 期间列表已重渲染：放弃 */
    p._tr={t:r.t,d:r.d,g:r.g};                   /* 挂到数据上，英文搜索也能命中 */
    const card=document.querySelector(slugSel(p.slug));
    if(!card)return;
    const tagsEl=card.querySelector(".post-tags");
    if(tagsEl&&r.g&&r.g.length)tagsEl.innerHTML=r.g.map(x=>`<span class="tag">${esc(x)}</span>`).join("");
    const ti=card.querySelector(".post-title");
    if(ti&&r.t)ti.innerHTML=hiText(r.t,q);
    const de=card.querySelector(".post-desc");
    if(de&&r.d)de.innerHTML=hiText(r.d,q);
  });
}

async function renderPost(slug,gen){
  const t=T();
  app.innerHTML=`<section class="view">
    <div class="post-hero"></div>
    <div class="wrap"><a class="post-back" href="#/blog">${esc(t.blog.back)}</a></div>
  </section>`;
  const stale=()=>gen!==undefined&&gen!==routeGen;   /* await 期间用户已切走 → 放弃渲染 */
  const posts=await loadBlog();
  if(stale())return;
  const post=posts.find(p=>p.slug===slug);
  const fail=msg=>{ if(stale())return; app.innerHTML=`<section class="view"><div class="wrap">
    <div class="blog-empty">${msg}</div>
    <div style="text-align:center"><a class="post-back" href="#/blog">${esc(t.blog.back)}</a></div>
  </div></section>`;};
  if(!post){fail(t.blog.err);return;}
  /* 英文界面优先读静态英文版（index.en.md），读不到再回退中文原文 + 浏览机翻 */
  const enURL=(lang==="en")?(post.mdURLEn||mdEnURL(post.mdURL)):"";
  let raw="",usedEn=false;
  try{
    let r=null,text="";
    if(enURL){
      try{ r=await fetch(enURL,{cache:"no-cache"}); }catch(e){ r=null; }
      if(r&&r.ok){
        text=await r.text();
        /* 关键防线：英文版还没生成时，SPA 兜底会返回 200 + index.html。
           开头是 HTML 或 content-type 是 text/html 的一律当「英文版缺失」，
           走下面的中文原文 + 后台机翻兜底，而不是把源码当正文渲染出来 */
        if(isHTMLFallbackText(text)||
           (r.headers.get("content-type")||"").toLowerCase().includes("text/html")){
          r=null;text="";
        }else usedEn=true;                       /* 真的拿到了静态英文版 */
      }else r=null;                              /* 英文版缺失/没生成：中文原文兜底 */
    }
    if(!r){
      r=await fetch(post.mdURL,{cache:"no-cache"});
      if(!r.ok)throw new Error(r.status);
      text=await r.text();
      if(isHTMLFallbackText(text))throw new Error("html-fallback");
    }
    raw=text;
  }catch(e){fail(t.blog.err);return;}
  if(stale())return;   /* 正文网络请求最慢，切走后回来绝不能覆盖新页面 */
  const {meta,body}=parsePost(raw);
  const title=meta.title||post.title||t.blog.untitled;
  const desc=meta.desc||post.desc||"";
  document.title=title+" · "+t.brand;   /* 浏览器标签页 / 历史记录显示文章标题 */
  /* 标签归一化：front matter 里「tags: a, b」这种逗号写法解析出来是字符串，
     直接 .map 会抛 TypeError 导致整篇文章页渲染失败 —— 列表页已归一化，这里补上 */
  let tags=meta.tags||post.tags||[];
  if(typeof tags==="string")tags=tags.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
  if(!Array.isArray(tags))tags=[];
  const date=meta.date||post.date||"";
  const minutes=+meta.minutes||post.minutes||Math.max(1,Math.round(body.replace(/\s/g,"").length/450));
  const bg=meta.background||post.bg||"";
  /* 文章页头图优先用构建时压缩的 1600px WebP 版（bgThumb 是站点相对路径，不要再拼前缀） */
  const bgThumb=(post.bgThumb||meta.bgThumb||"");
  const bgImg=bgThumb?esc(bgThumb):(bg?esc(postSrc(post,bg)):"");
  app.innerHTML=`
  <section class="view">
    <div class="post-hero">${bgImg?`<img class="post-bg" src="${bgImg}" alt="" decoding="async" onerror="this.remove()">`:""}</div>
    <div class="wrap">
      <a class="post-back" href="#/blog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>${esc(t.blog.back)}</a>
      <header class="post-head">
        ${tags.length?`<div class="post-tags">${tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}
        <h1>${esc(title)}</h1>
        ${desc?`<p class="post-sub">${esc(desc)}</p>`:""}
        <div class="post-meta"><span>${esc(fmtDate(date))}</span><span>·</span><span>${esc(t.blog.minutes(minutes))}</span></div>
      </header>
      <article class="post-body">${mdToHTML(body,post.imgBase,post.imgMap)}</article>
      <div class="post-end">${esc(t.blog.end)}</div>
    </div>
  </section>`;
  /* 英文界面 + 中文文章：正文先按原文秒出，后台机器翻译，完成后无感替换（失败保留原文）
     已经拿到静态英文版（index.en.md）就绝不再机翻——那份就是权威译文，
     里面残留的中文只是图片文件名、代码注释之类不该翻的内容 */
  if(lang==="en"&&!usedEn&&(hasCJKText(body)||hasCJKText(title)||hasCJKText(desc))){
    const curGen=gen;
    /* 失败后可点「重试」：同一个 run 复用，不必刷新页面 */
    const run=()=>{
      const old=document.getElementById("trNote");
      if(old)old.innerHTML=`<span class="tr-spin"></span>${esc(t.blog.translating)}`;
      else{
        const pm=document.querySelector(".post-meta");
        if(pm)pm.insertAdjacentHTML("beforeend",
          `<span class="tr-note" id="trNote"><span class="tr-spin"></span>${esc(t.blog.translating)}</span>`);
      }
      /* 兜底：翻译接口被墙 / 限流时请求可能长时间挂着不回，
         15 秒还没结果就给「重试」，别让人一直对着 Translating… 干等 */
      const guard=setTimeout(()=>{
        const n=document.getElementById("trNote");
        if(n&&n.querySelector(".tr-spin"))n.innerHTML=
          `${esc(t.blog.trFail)} <button type="button" class="tr-retry">${esc(t.blog.trRetry)}</button>`;
      },15000);
      translatePost(slug,title,desc,body,tags).then(r=>{
        clearTimeout(guard);
        if(curGen!==undefined&&curGen!==routeGen)return;   /* 翻译期间用户切走了：别写新页面 */
        const note=document.getElementById("trNote");
        /* 一处都没翻成（通道全挂 / 网络受限）：给个「重试」，别让人对着中文空等 */
        const nothing=!r
          ||(r.b===body&&r.t===title&&(r.g||[]).join("\u0000")===(tags||[]).join("\u0000"));
        if(nothing){
          if(note)note.innerHTML=
            `${esc(t.blog.trFail)} <button type="button" class="tr-retry">${esc(t.blog.trRetry)}</button>`;
          return;
        }
        if(note)note.remove();
        const h1=document.querySelector(".post-head h1");
        if(h1&&r.t)h1.textContent=r.t;
        const pt=document.querySelector(".post-head .post-tags");
        if(pt&&r.g&&r.g.length)pt.innerHTML=r.g.map(x=>`<span class="tag">${esc(x)}</span>`).join("");
        const sub=document.querySelector(".post-sub");
        if(sub&&r.d)sub.textContent=r.d;
        const art=document.querySelector(".post-body");
        const meta=document.querySelector(".post-meta");
        if(r.b&&r.b!==body){
          /* 正文翻成了：整体替换 */
          if(art)art.innerHTML=mdToHTML(r.b,post.imgBase,post.imgMap);
          if(meta)meta.insertAdjacentHTML("beforeend",`<span class="tr-mt">${esc(t.blog.machineTrans)}</span>`);
        }else if(art&&hasCJKText(body)){
          /* 正文一行都没翻成（限流/网络问题），标题标签却翻好了：
             保留中文原文，但挂「翻译失败 + 重试」，别挂 Machine-translated 误导人。
             注意 note 可能刚被 remove 掉，得重新查一遍 DOM，别往脱节节点里写 */
          const html=`${esc(t.blog.trFail)} <button type="button" class="tr-retry">${esc(t.blog.trRetry)}</button>`;
          const noteNow=document.getElementById("trNote");
          if(noteNow)noteNow.innerHTML=html;
          else if(meta)meta.insertAdjacentHTML("beforeend",`<span class="tr-note" id="trNote">${html}</span>`);
        }
      }).catch(()=>{
        clearTimeout(guard);
        const note=document.getElementById("trNote");
        if(note)note.innerHTML=
          `${esc(t.blog.trFail)} <button type="button" class="tr-retry">${esc(t.blog.trRetry)}</button>`;
      });
    };
    trResetFail();          /* 新文章：清空上一篇留下的失败记录，所有引擎重新试一遍 */
    trRetry=run;            /* 供「重试」按钮调用 */
    run();
  }
}

/* ---------- 路由 ---------- */
let routeGen=0;   /* 渲染代次：异步渲染（博客列表/文章）await 期间用户可能切走页面，
                     过期的渲染继续写 DOM 会把新页面整个覆盖掉 —— 每个 await 后先校验 */
let pendingScroll=null;   /* 带锚点的路由：渲染后要缓缓滑到的板块 id */
/* 缓速滑动：比浏览器原生 smooth 更从容（约 1 秒），用户滚轮/触摸可随时打断 */
function glideTo(y,dur){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){window.scrollTo(0,y);return;}
  const startY=window.scrollY,d=y-startY,t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;   /* easeInOutCubic：起停都柔 */
  let stop=false;
  const cancel=()=>{stop=true};
  /* once 监听器在动画正常结束时并不会被消费，会一直挂着等下一次滚动；
     挂上 AbortController，结束/打断时主动撤掉，避免多次锚点导航累积监听器 */
  const ac=("AbortController" in window)?new AbortController():null;
  const opt=ac?{once:true,passive:true,signal:ac.signal}:{once:true,passive:true};
  window.addEventListener("wheel",cancel,opt);
  window.addEventListener("touchstart",cancel,opt);
  const root=document.documentElement,prev=root.style.scrollBehavior;
  root.style.scrollBehavior="auto";                    /* 逐帧设值，不能让 CSS smooth 插手 */
  let last=startY;                                     /* 单调钳制：杜绝任何帧间的 1px 回抖 */
  (function step(now){
    if(stop){root.style.scrollBehavior=prev; if(ac)ac.abort(); return;}
    const p=Math.min(1,Math.max(0,(now-t0)/dur));
    const v=startY+d*ease(p);
    last=d>=0?Math.max(last,v):Math.min(last,v);
    window.scrollTo(0,last);
    if(p<1)requestAnimationFrame(step);
    else{root.style.scrollBehavior=prev; if(ac)ac.abort();}
  })(t0);
}
function route(){
  const gen=++routeGen;
  const hash=location.hash.replace(/^#\/?/,"");
  const parts=hash.split("/").filter(Boolean);
  let active="home";
  if(parts[0]==="gallery"){
    active="gallery";
    /* 子相册名写进 hash（#/gallery/<相册>）：刷新能停在同一相册，
       浏览器返回键也能从子相册退回「全部」，而不是直接退到站外 */
    let alb="";
    if(parts[1]){ try{ alb=decodeURIComponent(parts.slice(1).join("/")); }catch(e){} }
    galleryFilter=alb;
    renderGallery();
  }
  else   if(parts[0]==="blog"){
    active="blog";
    if(parts[1]){
      /* slug 解码包一层兜底：孤立的 %（链接被截断等）会抛 URIError，别让它卡死路由 */
      let slug="";
      try{ slug=decodeURIComponent(parts.slice(1).join("/")); }catch(e){}
      renderPost(slug,gen);
    }
    else renderBlog(gen);
  }
  else if(parts[0]==="about"){
    active="about";renderAbout();
    /* #/about/projects → 渲染后平滑滚到项目板块 */
    if(parts[1]==="projects")pendingScroll="aboutProjects";
  }
  else if(parts[0]==="projects"){location.replace("#/about/projects");return}  /* 旧链接兜底：项目已并入关于页 */
  else renderHome();
  /* 导航高亮：顺手标 aria-current，读屏能知道当前在哪一页 */
  document.querySelectorAll(".nav-link").forEach(el=>{
    const on=el.dataset.nav===active;
    el.classList.toggle("active",on);
    if(on)el.setAttribute("aria-current","page"); else el.removeAttribute("aria-current");
  });
  /* 每页一个独立标题：浏览器历史记录能区分「博客 / 相册 / 关于」
     （文章页等正文加载后会覆盖成文章标题，见 renderPost） */
  document.title=(active==="home")?T().brand:(T().nav[active]+" · "+T().brand);
  /* 切页回到顶部：html 上挂着 scroll-behavior:smooth，
     这里先临时关掉再滚，免得每次切页都慢慢「滑」上去 */
  const root=document.documentElement,
        prevSmooth=root.style.scrollBehavior;
  root.style.scrollBehavior="auto";
  /* 带锚点的路由（如 #/about/projects）：先正常展示「关于」页顶部，
     然后页面再缓缓下滑到项目板块 */
  const anchor=pendingScroll?document.getElementById(pendingScroll):null;
  pendingScroll=null;
  if(anchor){
    const y=anchor.getBoundingClientRect().top+window.scrollY-86;
    window.scrollTo(0,0);
    root.style.scrollBehavior=prevSmooth;
    requestAnimationFrame(()=>glideTo(y,950));
  }else{
    window.scrollTo(0,0);
    root.style.scrollBehavior=prevSmooth;
  }
}

/* ---------- 交互绑定 ---------- */
$("#langBtn").addEventListener("click",()=>setLang(lang==="zh"?"en":"zh",true));
$("#lbClose").addEventListener("click",closeLb);
$("#lbPrev").addEventListener("click",e=>{e.stopPropagation();stepLb(-1)});
$("#lbNext").addEventListener("click",e=>{e.stopPropagation();stepLb(1)});
$("#lbMotionBtn").addEventListener("click",e=>{e.stopPropagation();lbToggleLive()});
$("#lbSoundBtn").addEventListener("click",e=>{e.stopPropagation();lbToggleSound()});
/* 动态视频解析出来却播不动（罕见坏数据）→ 自动退回静态照片，别卡在黑屏 */
$("#lbVideo").addEventListener("error",()=>{
  if(lbMotionOn){ lbMotionOn=false; applyLbMotion(); }
});
/* Windows 同款：动态效果播完一次自动回到静态照片 */
$("#lbVideo").addEventListener("ended",()=>{
  if(lbMotionOn){ lbMotionOn=false; applyLbMotion(); }
});
$("#lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox")closeLb()});
/* 移动端：灯箱里左右滑动切上一张/下一张。
   垂直位移过大不触发；手势落在箭头/控制条/视频上时不抢（视频可能是在拖进度） */
let lbTouch=null;
$("#lightbox").addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  const t=e.touches[0];
  lbTouch={x:t.clientX,y:t.clientY};
},{passive:true});
$("#lightbox").addEventListener("touchend",e=>{
  if(!lbTouch)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-lbTouch.x,dy=t.clientY-lbTouch.y;
  lbTouch=null;
  if(Math.abs(dx)<48||Math.abs(dx)<Math.abs(dy)*1.5)return;
  if(e.target.closest(".lb-btn,.lb-motion,video"))return;
  stepLb(dx<0?1:-1);
},{passive:true});
$("#lightbox").addEventListener("touchcancel",()=>{lbTouch=null;},{passive:true});
document.addEventListener("click",e=>{
  /* 相册页在子相册里时再点导航「相册」→ 回到全部相册（hash 会同步改回 #/gallery） */
  const nav=e.target.closest(".nav-link");
  if(nav&&nav.dataset.nav==="gallery"&&galleryFilter){ openAlbum(""); return; }
  /* 首屏那个滚动提示：点一下平滑滚到相册预览 */
  const sc=e.target.closest("[data-scroll-to]");
  if(sc){
    const target=document.getElementById(sc.dataset.scrollTo);
    if(target)target.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  /* 子相册卡片：进入该相册；返回按钮：回到全部 */
  const alb=e.target.closest("[data-album]");
  if(alb){ openAlbum(alb.dataset.album||""); return; }
  const albBack=e.target.closest("[data-album-back]");
  if(albBack){ openAlbum(""); return; }
  const tile=e.target.closest(".ph-tile");
  if(!tile||tile.dataset.idx===undefined||tile.classList.contains("ph-skel"))return;
  /* 带「+N」角标的瓷砖 → 跳转相册页，而不是开灯箱 */
  if(tile.querySelector(".ph-more")){openAlbum("");return;}
  const grid=tile.closest("[data-photo-grid]");
  lbPreheat(tile);
  openLb((grid&&grid._items)||photos,Number(tile.dataset.idx),grid);
});
/* 手指按下 / 鼠标移上去就先预热（提前发清晰图请求），真正 click 时往往已经在路上 */
document.addEventListener("pointerdown",e=>{
  const tile=e.target.closest&&e.target.closest(".ph-tile");
  if(!tile||tile.classList.contains("ph-skel")||tile.dataset.idx===undefined)return;
  if(tile.querySelector(".ph-more"))return;
  lbPreheat(tile);
},{passive:true});
let lbHoverTimer=0;
document.addEventListener("mouseover",e=>{
  const tile=e.target.closest&&e.target.closest(".ph-tile");
  if(!tile||tile.classList.contains("ph-skel")||tile.dataset.idx===undefined)return;
  if(tile.querySelector(".ph-more"))return;
  /* 悬停 140ms 才算「有意思」，避免鼠标划过整墙时把 view 全下一遍 */
  clearTimeout(lbHoverTimer);
  lbHoverTimer=setTimeout(()=>lbPreheat(tile),140);
});
document.addEventListener("mouseout",e=>{
  const tile=e.target.closest&&e.target.closest(".ph-tile");
  if(tile)clearTimeout(lbHoverTimer);
});
/* 动态瓷砖：悬停播放动态效果，移开还原成静态照片。
   普通图片首次悬停时顺带探测是不是动态照片（内嵌视频），是就升级成动态。 */
document.addEventListener("mouseover",e=>{
  const tile=e.target.closest(".ph-tile");
  if(!tile||tile.classList.contains("ph-skel")||tile.dataset.idx===undefined)return;
  const grid=tile.closest("[data-photo-grid]");
  const p=((grid&&grid._items)||[])[Number(tile.dataset.idx)];
  if(!p)return;
  if(tile.classList.contains("is-live")){
    const v=tile.querySelector(".ph-live-v");
    if(v){ v.style.display="block"; v.play().catch(()=>{}); return; }
    /* 清单里已标为动态照片，但视频还没解析 → 现在按需取这一张的原图 */
    if(p.type==="image"&&p.motion)promoteMotion(p,tile,true);
    return;
  }
  /* 只有「不知道是不是动态」的旧扫描模式才现场探测；
     清单模式已知是静态图，就不必为它下载原图 */
  if(p.type==="image"&&p.motion===undefined)promoteMotion(p,tile,true);
});
document.addEventListener("mouseout",e=>{
  const tile=e.target.closest(".ph-tile.is-live"); if(!tile)return;
  const v=tile.querySelector(".ph-live-v");
  if(v){ v.pause(); try{ v.currentTime=0; }catch(err){} v.style.display="none"; }
});
document.addEventListener("keydown",e=>{
  if($("#lightbox").classList.contains("open")){
    if(e.key==="Escape")closeLb();
    else if(e.key==="ArrowLeft")stepLb(-1);
    else if(e.key==="ArrowRight")stepLb(1);
    else if(e.key==="Tab"){
      /* 焦点圈定：Tab 只在灯箱内可见的按钮间循环，别跑到被遮住的背景页面里 */
      const btns=Array.from($("#lightbox").querySelectorAll("button"))
        .filter(b=>b.offsetParent!==null);
      if(btns.length){
        const first=btns[0],last=btns[btns.length-1];
        if(!$("#lightbox").contains(document.activeElement)){e.preventDefault();first.focus();}
        else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
    }
    return;
  }
  const tile=document.activeElement;
  if(tile&&tile.classList&&tile.classList.contains("ph-tile")&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();
    if(tile.querySelector(".ph-more")){openAlbum("");return;}
    const grid=tile.closest("[data-photo-grid]");
    lbPreheat(tile);
    openLb((grid&&grid._items)||photos,Number(tile.dataset.idx),grid);
  }
});

                            （persist=false：启动这次不写盘，首次访问继续跟随系统语言） */

/* 首屏与导航文案就绪 → 淡出启动加载屏（顺带移除 DOM）
   先打标记：上面的兜底计时器靠它判断「主脚本已经接管」，不会再抢着揭幕 */
(function(){
  window.__JY_READY=true;
  const b=document.getElementById("boot");
  if(!b)return;
  b.classList.add("off");

  /* 歌单数据（内置快照 / 云端，格式同为 {name,src,updated,count,songs:["歌名|歌手"]}）装进内存 */
  function applyKg(d,cloud){
    if(!d||!Array.isArray(d.songs)||!d.songs.length)return false;
    const prev=new Map(kgPool.map(t=>[t.id,t]));
    kgMeta={name:d.name||L().myKg,src:d.src||L().kgSrc,
            count:d.songs.length,updated:d.updated||"",cloud:!!cloud};
    kgPool=d.songs.map(line=>{
      const i=String(line).indexOf("|");
      const t=(i<0?line:String(line).slice(0,i)).trim();
      const a=(i<0?"":String(line).slice(i+1)).trim();
      const o=prev.get("kg:"+t+"|"+a);   /* 沿用上次解析好的网易云信息，刷新后不必重新搜 */
      return {online:true,kg:true,id:"kg:"+t+"|"+a,name:t,artist:a,

    paintMeta();

    return true;

  /* 内置快照：kugou-playlist.js（和 index.html 同目录或上一级都试一下） */
  function loadSnap(){
    return new Promise(res=>{
      let done=false;
      const finish=v=>{ if(done)return; done=true; res(v); };
      setTimeout(()=>finish(!!window.KUGOU_PLAYLIST),3000);   /* 兜底：脚本卡住也不阻塞「上次播放」的恢复 */
      if(window.KUGOU_PLAYLIST&&applyKg(window.KUGOU_PLAYLIST,false))return finish(true);
      let i=0;
      const next=()=>{
        if(i>=SNAP_FILES.length)return finish(false);
        const s=document.createElement("script");
        s.src=SNAP_FILES[i++];
        s.onload=()=>{ if(window.KUGOU_PLAYLIST&&applyKg(window.KUGOU_PLAYLIST,false)){ finish(true); } else next(); };
        s.onerror=next;
        document.head.appendChild(s);
      };
      next();
    });
  }
  /* 云端 /api/kg：Cloudflare 边缘节点替网页读酷狗「我喜欢的音乐」，云端自己缓存 30 分钟 */
  async function refreshCloud(manual){
    if(cloudState==="loading")return;
    const proto=location.protocol;

    cloudState="loading";

    paintMeta();
    try{
      const r=await fetch("/api/kg"+(manual?"?refresh=1":""),{cache:"no-store"});

      const d=await r.json();
      if(!d||!d.ok||!Array.isArray(d.songs)||!d.songs.length)throw new Error((d&&d.error)||L().cloudNone);
      applyKg(d,true);
      cloudState="ok";
      if(manual)flash(L().synced(kgPool.length));
      /* 之前只有内置快照为空、只恢复出「上次那首」：云端歌单到了就把队列补全

      if(restored&&q.length<=1&&!wantPlay&&kgPool.length&&((!loadedId&&!loadingId)||quietLoad)){

      cloudState="fail";
      if(manual)flash(L().cloudNone);
    }

  }
