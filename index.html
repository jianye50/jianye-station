/* 语言：首次访问跟随操作系统/浏览器语言 —— 中文（zh、zh-CN、zh-TW、zh-HK…）显示中文，
   其它语言一律显示英文；用户在导航栏手动切换过以后，以本地保存的选择为准。 */
function detectLang(){
  try{
    const saved=localStorage.getItem("jy-lang");
    if(saved==="zh"||saved==="en")return saved;
  }catch(e){}
  let list=[];
  try{
    list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
  }catch(e){ list=[""]; }
  for(const raw of list){
    const l=String(raw||"").replace(/_/g,"-").toLowerCase();
    if(/^zh\b/.test(l)||l==="zh")return "zh";   /* 各种中文（含繁体、港澳台）都用中文 */
    if(/^en\b/.test(l)||l==="en")return "en";
  }
  return "en";                                   /* 其余语言统一英文 */
}
let lang=(function(){
  try{ const pre=window.__JY_LANG; if(pre==="zh"||pre==="en")return pre; }catch(e){}
  return detectLang();
})();
/* 站点固定深色：<html data-theme="dark"> 直接写在标签上，
   不再有浅色皮肤，也没有主题切换按钮（那个位置现在放音乐入口）。 */

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=()=>I18N[lang];

/* ---------- 工具函数 ---------- */
function setLang(v,persist){
  lang=v;
  document.documentElement.lang=v==="zh"?"zh-CN":"en";
  document.title=T().brand;
  /* 只有用户自己点 EN/中 才落盘（persist!==false）。启动时那句 setLang 不写，
     否则第一次访问就把「系统语言探测结果」固定下来，之后换系统语言也再不跟随 */
  if(persist!==false){ try{ localStorage.setItem("jy-lang",v); }catch(e){} }
  $("#langBtn").textContent=v==="zh"?"EN":"中";
  $("#langBtn").title=T().langTip||"Switch language";
  $("#langBtn").setAttribute("aria-label",$("#langBtn").title);
  $("#navBrand").textContent=T().brand;
  /* 导航标签：一级项 + 「记录」下拉里的两项（都挂了 data-navlabel） */
  document.querySelectorAll("[data-navlabel]").forEach(el=>{
    const k=el.dataset.navlabel,v=T().nav[k];
    if(v)el.textContent=v;
  });
  const navMenuEl=$("#navMenu");
  if(navMenuEl)navMenuEl.setAttribute("aria-label",T().nav.records);
  /* 「回到顶部」形态的无障碍名称也跟着换语言 */
  if(typeof syncNavTop==="function")syncNavTop(true);
  route(); // 重新渲染当前视图
  /* 中英切换会改变导航宽度，「记录」按钮跟着挪位：面板开着就重摆一次 */
  const dd=document.getElementById("navDrop");
  if(dd&&dd.classList.contains("open")&&typeof placeNavMenu==="function"){
    requestAnimationFrame(placeNavMenu);
  }
}

/* =====================================================================
 *  相册：扫描目录 → 相册/照片墙 → 灯箱
 * ===================================================================== */

/* 读取一个目录的条目（媒体文件 + 子文件夹）：优先解析服务器的目录列表页。
   子文件夹会被当作独立相册，媒体文件按类型（图片/视频）识别。 */
async function listEntries(dir){
  try{
    const base=new URL(dir,location.href);
    const res=await fetch(base.href);
    if(res.ok){
      const doc=new DOMParser().parseFromString(await res.text(),"text/html");
      const files=new Set(),dirs=new Set();
      doc.querySelectorAll("a[href]").forEach(a=>{
        let h=a.getAttribute("href"); if(!h)return;
        h=h.split("#")[0].split("?")[0];
        if(!h||h==="."||h===".."||/\/(\.|\.\.)\/?$/.test(h))return;
        if(/\/$/.test(h)){
          let n="";
          try{ n=decodeURIComponent(h.replace(/\/$/,"").split("/").pop()); }catch(e){ n=h.replace(/\/$/,"").split("/").pop(); }
          if(n)dirs.add(n);
        }else if(MEDIA_RE.test(h)){
          files.add(new URL(h,base.href).href);
        }
      });
      if(files.size||dirs.size)return {files:Array.from(files),dirs:Array.from(dirs)};
    }
  }catch(e){}
  return null;
}
/* GitHub API：列出仓库里某个目录的媒体文件与子文件夹（静态托管没有目录列表时兜底） */
async function listEntriesGH(dir){
  try{
    const path=dir.split("/").filter(Boolean).map(encodeURIComponent).join("/");
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return null;
    const arr=await r.json();
    if(!Array.isArray(arr))return null;
    const names=arr.filter(x=>x.type==="file"&&MEDIA_RE.test(x.name)).map(x=>x.name);
    const dirs=arr.filter(x=>x.type==="dir").map(x=>x.name);
    const files=await resolveGHUrls(dir,names);
    return {files:files,dirs:dirs};
  }catch(e){ return null; }
}
/* GitHub 给的是仓库相对路径，直链拼法要靠探针验证：
   先试页面相对路径，再试域名根路径，都不行就用 raw 直链。 */
async function resolveGHUrls(dir,names){
  if(!names.length)return [];
  const dirEnc=dir.split("/").filter(Boolean).map(encodeURIComponent).join("/")+"/";
  const bases=[
    new URL(dirEnc,location.href),
    new URL("/"+dirEnc,location.origin)
  ];
  for(const base of bases){
    let ok=false;
    try{
      const probe=await fetch(new URL(encodeURIComponent(names[0]),base).href,{method:"HEAD"});
      /* 关键：SPA 回退会让不存在的路径也返回 200 + 网页 HTML（Cloudflare Pages 就是），
         只看状态码会误判「文件可直链」，导致视频/图片地址指向网页、永远加载失败。
         必须连 content-type 一起验：是网页的一律不算数，退回 raw 直链 */
      const ct=(probe.headers.get("content-type")||"").toLowerCase();
      ok=probe.ok&&!ct.includes("text/html");
    }catch(e){}
    if(ok)return names.map(n=>new URL(encodeURIComponent(n),base).href);
  }
  const raw=dir.split("/").filter(Boolean).map(encodeURIComponent).join("/");
  return names.map(n=>`https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}/${raw}/${encodeURIComponent(n)}`);
}
function nameOf(src){
  const raw=String(src).split("/").pop().split("?")[0];
  try{ return decodeURIComponent(raw); }catch(e){ return raw; }   /* 文件名含孤立 % 时别让整个图库挂掉 */
}

/* 装载整个相册库（下面的兜底扫描版本）：
   ① 扫 Photo Album 根目录（图片/视频 = 「全部」；子文件夹 = 子相册）
   ② 逐个扫描子相册里的媒体
   ③ 同一相册里「同名图片 + 同名视频」自动配成 Live Photo（视频不再单独显示）
   ④ 汇总 photos 与 albums（相册封面取该相册第一张媒体） */
/* 装载相册：优先读构建期清单（快、稳），读不到再退回运行时目录扫描。
   清单模式下的数据形状与扫描模式完全一致，后面的渲染/灯箱代码不用区分。 */
async function loadPhotos(){
  if(await loadPhotosFromManifest())return;
  await loadPhotosByScan();
}
async function loadPhotosFromManifest(){
  try{
    const res=await fetch(PHOTO_MANIFEST,{cache:"no-cache"});
    if(!res.ok)return false;
    const data=await res.json();
    if(!data||!Array.isArray(data.photos))return false;
    const list=data.photos.map(p=>({
      name:p.name,
      album:p.album||"",
      type:p.type||"image",
      src:p.src,                                  /* 原图：只在播放动态/下载时用 */
      thumb:p.thumb||p.src,
      thumb2x:p.thumb2x||p.thumb||p.src,
      view:p.view||p.src,                         /* 灯箱用图（预缩放，别用原图） */
      blur:p.blur||"",                            /* 占位小图（data URI） */
      live:p.live||"",
      motion:!!p.motion,
      w:p.w||0, h:p.h||0, fb:""
    }));
    if(!list.length)return false;
    photos=list;
    albums=(data.albums||[]).map(a=>({name:a.name,count:a.count,cover:a.cover,blur:a.coverBlur||""}));
    photosStatus="ready";
    paintPhotoGrids();
    return true;
  }catch(e){ return false; }
}
/* 以下为兜底：运行时扫目录 / GitHub API（慢一点，但不跑脚本也能显示） */
async function loadPhotosByScan(){
  const isFile=location.protocol==="file:";
  /* 本地预览（localhost / 127.0.0.1）没有 photos.json，也不该去扫远端仓库：
     那条路要逐目录打 GitHub API、再逐个探 HEAD，目录一多就把渲染进程拖死
     （实测 #/gallery 会直接崩溃）。开发时想要真的相册数据，放一份 photos.json 就行 */
  const isDev=/^(localhost|127\.0\.0\.1|::1|\[::1\])$/.test(location.hostname||"");
  let root=null,rootBase=PHOTO_DIRS[0];
  for(const dir of PHOTO_DIRS){
    const r=await listEntries(dir);
    if(r){ root=r; rootBase=dir; break; }
  }
  if(!root&&!isFile&&!isDev)root=await listEntriesGH(PHOTO_DIRS[0].replace(/\/$/,""));
  if(!root){
    if(isFile&&PHOTO_FALLBACK.length){
      /* 直接双击打开：读不到目录，用兜底清单（只覆盖根目录图片） */
      photos=PHOTO_FALLBACK.map(file=>({
        src:PHOTO_DIRS[0]+encodeURIComponent(file),
        name:file.replace(/\.[^.]+$/,""),
        album:"",type:"image",live:"",fb:file
      }));
      photosStatus="ready";
      paintPhotoGrids();
      return;
    }
    photos=[]; albums=[]; photosStatus="error";
    paintPhotoGrids();
    return;
  }
  const ghDir=PHOTO_DIRS[0].replace(/\/$/,"");
  const items=[];
  root.files.forEach(u=>items.push({src:u,album:""}));
  /* 目录上限：正常相册十几二十个，出现几百个基本是目录结构异常，
     继续逐个扫只会把请求数乘上去（每个目录还要探直链），直接截断更安全 */
  const rootDirs=(root.dirs||[]).slice(0,60);
  for(const dname of rootDirs){
    let r=await listEntries(rootBase+dname+"/");
    if(!r&&!isFile&&!isDev)r=await listEntriesGH(ghDir+"/"+dname);
    if(!r||!r.files||!r.files.length)continue;   /* 空相册 / 读不到 → 先不显示 */
    r.files.forEach(u=>items.push({src:u,album:dname}));
  }
  /* 分类：视频 / 图片 */
  items.forEach(it=>{
    const f=nameOf(it.src);
    it.name=f.replace(/\.[^.]+$/,"");
    it.type=VID_RE.test(f)?"video":"image";
    it.live=""; it.fb="";
  });
  /* Live Photo 配对：同名（忽略大小写）且在同一相册（根目录也算一个"相册"） */
  const vidMap=new Map();
  items.forEach(it=>{ if(it.type==="video")vidMap.set((it.album+"|"+it.name).toLowerCase(),it); });
  const out=[];
  items.forEach(it=>{
    if(it.type==="video"){
      const paired=items.some(x=>x.type==="image"&&x.album===it.album
        &&x.name.toLowerCase()===it.name.toLowerCase());
      if(paired)return;                 /* 配成 Live Photo 的视频不单独显示 */
    }
    out.push(it);
  });
  out.forEach(it=>{
    if(it.type==="image"){
      const v=vidMap.get((it.album+"|"+it.name).toLowerCase());
      if(v){ it.type="live"; it.live=v.src; }
    }
  });
  /* 相册汇总（封面优先取图片，其次视频首帧） */
  const amap=new Map();
  out.forEach(it=>{
    if(!it.album)return;
    let a=amap.get(it.album);
    if(!a){ a={name:it.album,count:0,cover:""}; amap.set(it.album,a); }
    a.count++;
    if(!a.cover&&it.type!=="video")a.cover=it.src;
    if(!a.cover)a.cover=it.src;
  });
  albums=Array.from(amap.values())
    .sort((a,b)=>a.name.localeCompare(b.name,"zh-Hans-CN",{numeric:true}));
  photos=out;
  photos.sort((a,b)=>b.name.localeCompare(a.name,"zh-Hans-CN",{numeric:true}));
  photosStatus="ready";
  paintPhotoGrids();
}

/* 当前要显示的媒体：子相册之间互相独立 ——
   没选相册时只显示 Photo Album 根目录的内容，子相册里的只在点进去后显示 */
function viewList(){
  return galleryFilter?photos.filter(p=>p.album===galleryFilter):photos.filter(p=>!p.album);
}
/* ---------- 动态照片（手机「动态图片 / Motion Photo / Live Photo」单文件）----------
   这类「动态图片」是一张内嵌了带声音视频的 JPG：XMP 带 MotionPhoto 标记，
   视频以 mp4 盒子（ftyp…）附在文件尾部。浏览器只把它渲染成普通图片，
   这里把内嵌的 mp4 抠出来转成 Blob URL，供悬停预览与灯箱播放（有声音）。
   识别结果缓存在照片对象上，一张图只解析一次。 */
const motionCache=new Map();   /* src -> Promise<blobURL|""> */
function motionVideoURL(src){
  let p=motionCache.get(src);
  if(p)return p;
  p=(async()=>{
    try{
      const res=await fetch(src);
      if(!res.ok)return "";
      const buf=new Uint8Array(await res.arrayBuffer());
      const n=buf.length;
      /* 从尾部往前找 mp4 盒子的 "ftyp" 标记（动态照片的视频都附在文件末尾；
         跳过开头 1KB，避免误把 EXIF 缩略图里的数据当成视频） */
      for(let i=n-12;i>1024;i--){
        if(buf[i]===0x66&&buf[i+1]===0x74&&buf[i+2]===0x79&&buf[i+3]===0x70){
          const blob=new Blob([buf.subarray(i-4,n)],{type:"video/mp4"});
          return URL.createObjectURL(blob);
        }
      }
      return "";
    }catch(e){ return ""; }
  })();
  motionCache.set(src,p);
  return p;
}
/* 动态照片的「是否动态」改由构建期判定（photos.json 里的 motion 字段），
   页面打开时不再逐张探测。原来那套 Range 探测在静态托管上代价极高：
   服务器不认 Range 时每张图都会整份下载，十几张就是十几兆的额外流量。
   现在只有用户真的悬停 / 打开某张动态照片时，才会去取那一张的原图。 */
/* 把普通图片升级成动态照片：识别成功就改成 live 类型；
   传入 tile 时顺手塞进悬停用的动态视频层（autoplay=true 立即播放） */
function promoteMotion(p,tile,autoplay){
  if(!p||p.type!=="image"||p._motionTried)return Promise.resolve("");
  p._motionTried=true;
  return motionVideoURL(p.src).then(url=>{
    if(!url)return "";
    if(p.type==="image"){ p.type="live"; p.live=url; }
    if(tile){
      tile.classList.add("is-live");
      const v=document.createElement("video");
      v.className="ph-live-v"; v.src=url; v.muted=true; v.loop=true;
      v.playsInline=true; v.preload="auto";
      const cap=tile.querySelector(".ph-cap");
      if(cap)tile.insertBefore(v,cap); else tile.appendChild(v);
      if(autoplay){ v.style.display="block"; v.play().catch(()=>{}); }
    }
    /* 解析完成时灯箱可能已经打开（悬停触发的解析比点击慢）→ 补上动态播放 */
    lbPlayMotion(p);
    return url;
  });
}
/* 瓷砖内容：图片用缩略图（srcset 给高分屏）+ 模糊占位底；视频抓首帧；
   Live Photo 静态图 + 悬停播放动态视频。
   注意：列表里绝不加载原图 —— 原图只在播放动态照片时按需取一次。 */
function mediaTileTag(p,i){
  if(p.type==="video"){
    /* #t=0.1：让浏览器去抓第 0.1 秒的画面当封面。
       只写 preload="metadata" 时，不少浏览器（尤其 iOS Safari）只显示一片黑。
       thumb 若是图片（构建期生成的海报帧），只能当 poster 用 —— 拼进 src 会让
       <video> 去加载一张图片，直接触发 onerror 黑块 */
    const vsrc=p.src;
    const src=vsrc.indexOf("#")<0?vsrc+"#t=0.1":vsrc;
    const poster=(p.thumb&&!VID_RE.test(p.thumb))?` poster="${esc(p.thumb)}"`:"";
    return `<video src="${esc(src)}"${poster} preload="metadata" muted playsinline
      onerror="this.style.display='none'"></video>`;
  }
  const src=p.thumb||p.src;
  const srcset=(p.thumb2x&&p.thumb2x!==src)
    ? ` srcset="${esc(src)} 480w, ${esc(p.thumb2x)} 960w" sizes="(max-width:620px) 46vw,(max-width:900px) 31vw,320px"`
    : "";
  /* 首屏前几张直接取，其余懒加载（缩略图只有十几 KB，但也没必要一次全拉） */
  const eager=i<4;
  const blur=p.blur?` style="background-image:url('${p.blur}')"`:"";
  const liveV=(p.type==="live"&&p.live)
    ? `<video class="ph-live-v" src="${esc(p.live)}" muted playsinline loop preload="none"></video>`:"";
  const err=p.fb
    ? `this.dataset.s?(this.style.display='none'):(this.dataset.s=1,this.src=this.dataset.alt)`
    : `this.style.display='none'`;
  const fbAttr=p.fb?` data-alt="${esc(PHOTO_DIRS[0]+encodeURIComponent(p.fb))}"`:"";
  return `<img src="${esc(src)}"${srcset} alt="${esc(p.name)}"${blur}
    loading="${eager?"eager":"lazy"}"${eager?' fetchpriority="high"':""} decoding="async"${fbAttr}
    onerror="${err}">${liveV}`;
}
function photoTilesHtml(list,limit){
  if(photosStatus==="loading"){
    const n=Math.min(limit||8,8);
    return Array.from({length:n}).map(()=>`<div class="ph-tile ph-skel"></div>`).join("");
  }
  if(!list.length){
    const msg=photosStatus==="error"?T().gallery.err:T().gallery.empty;
    return `<div class="ph-empty">${msg}</div>`;
  }
  const total=limit>0?Math.min(limit,list.length):list.length;
  return list.slice(0,total).map((p,i)=>{
    const more=(limit>0 && limit<list.length && i===limit-1);
    /* 动态照片 = 已配对的 Live Photo，或构建期判定为内嵌视频的 Motion Photo */
    const isLive=p.type==="live"||p.motion;
    const isGif=p.type==="image"&&isGifFile(p.thumb||p.src);
    const badge=isLive?`<span class="ph-badge">${esc(T().gallery.liveTag)}</span>`
      :p.type==="video"?`<span class="ph-badge">${esc(T().gallery.videoTag)}</span>`
      :isGif?`<span class="ph-badge">GIF</span>`:"";
    return `<div class="ph-tile${isLive?" is-live":""}" style="--i:${Math.min(i,8)}" data-idx="${i}" role="button" tabindex="0" aria-label="${esc(p.name)}">
      ${mediaTileTag(p,i)}${badge}
      <span class="ph-cap">${esc(p.name)}</span>
      ${more?`<div class="ph-more">+${list.length-limit}</div>`:""}
    </div>`;
  }).join("");
}
/* 子相册卡片（相册页顶部；进入某个相册后隐藏，靠「← 全部相册」返回） */
function albumStripHtml(){
  if(!albums.length||galleryFilter)return "";
  const t=T().gallery;
  return `<div class="album-label">${esc(t.albums)}</div>
  <div class="album-grid">
    ${albums.map((a,i)=>`
    <button class="al-card" style="--i:${Math.min(i,8)}" data-album="${esc(a.name)}" type="button" aria-label="${esc(a.name)}">
      <span class="al-cover">${
        a.cover?(VID_RE.test(a.cover)
          ?`<video src="${esc(a.cover.indexOf("#")<0?a.cover+"#t=0.1":a.cover)}" preload="metadata" muted playsinline></video>`
          :`<img src="${esc(a.cover)}" alt="" loading="lazy" decoding="async"${a.blur?` style="background-image:url('${a.blur}')"`:""} onerror="this.remove()">`)
        :`<span class="al-folder">📁</span>`}</span>
      <span class="al-name">${esc(a.name)}</span>
      <span class="al-count">${esc(t.albumCount(a.count))}</span>
    </button>`).join("")}
  </div>`;
}
/* 把页面上所有占位容器填上媒体（首页预览用 limit+全部，相册页用当前相册） */
function paintPhotoGrids(){
  document.querySelectorAll("[data-photo-grid]").forEach(el=>{
    const limit=Number(el.dataset.photoGrid)||0;
    const list=limit>0?photos.filter(p=>!p.album):viewList();   /* 首页预览也只取根目录 */
    el.innerHTML=photoTilesHtml(list,limit);
    el._items=list;                     /* 灯箱要按这份清单导航 */
  });
  const strip=$("#albumStrip");
  if(strip)strip.innerHTML=albumStripHtml();
  const sub=$("#gallerySub");
  if(sub){
    const list=viewList();
    sub.textContent=list.length?T().gallery.sub(list.length):"";
  }
}

/* ---------- 灯箱（图片 / 视频 / Live Photo） ---------- */
let lbIndex=0, lbFocus=null, lbItems=[], lbGrid=null;
/* 灯箱控制条图标（描边风格，与按钮 stroke 一致）；
   动态图标用苹果 Live Photo 同款同心圆（微软照片也是这个），不是刷新箭头 */
const ICON_MOTION='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>';
const ICON_SND_ON='<svg viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path d="M18.4 6.5a8 8 0 0 1 0 11"/></svg>';
const ICON_SND_OFF='<svg viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';
/* 灯箱动态状态：lbMotionOn 当前是否在播动态；lbSoundOn 声音开关（默认开） */
let lbMotionOn=false, lbSoundOn=true;
function paintMotionBtn(){
  const p=lbItems[lbIndex];
  const btn=$("#lbMotionBtn");
  if(!btn||!p||p.type!=="live")return;
  /* 文字固定显示「动态」，播放中只靠高亮表示状态（点击总是重新播一次） */
  btn.innerHTML=ICON_MOTION+"<span>"+esc(T().gallery.motion)+"</span>";
  btn.title=T().gallery.motion;
  btn.classList.toggle("on",lbMotionOn);
}
function paintSoundBtn(){
  const snd=$("#lbSoundBtn");
  if(!snd)return;
  snd.innerHTML=lbSoundOn?ICON_SND_ON:ICON_SND_OFF;
  snd.title=lbSoundOn?T().gallery.soundOff:T().gallery.soundOn;
  snd.setAttribute("aria-label",snd.title);
  snd.classList.toggle("on",false);
}
/* 按当前状态应用动态/静态显示 */
function applyLbMotion(){
  const p=lbItems[lbIndex];
  if(!p||p.type!=="live")return;
  const img=$("#lbImg"), vid=$("#lbVideo");
  if(lbMotionOn){
    img.style.display="none"; vid.style.display="";
    vid.controls=false; vid.loop=false;    /* Windows 同款：点一下只播一次，播完自动回静态 */
    vid.muted=!lbSoundOn;
    vid.currentTime=0;
    /* vid.src 读出来恒为绝对地址，p.live 可能是相对路径 ——
       直接比较永远不等，每次切换都会重新赋 src 触发重载；规范化后再比 */
    let liveAbs=p.live;
    try{ liveAbs=new URL(p.live,location.href).href; }catch(e){}
    if(vid.src!==liveAbs)vid.src=p.live;
    lbWaitMedia(vid);                      /* 动态视频没加载出来前先转圈，不播黑屏 */
    vid.play().catch(()=>{
      /* 出声自动播放被拦 → 先静音播起来（声音开关还亮着，用户再点一下即可） */
      if(!vid.muted){ vid.muted=true; vid.play().catch(()=>{}); }
    });
  }else{
    try{ vid.pause(); }catch(e){}
    vid.style.display="none"; img.style.display="";
  }
  paintMotionBtn();
}
/* 动态/静态切换（Windows 照片同款：左上角「动态」按钮） */
function lbToggleLive(){
  const p=lbItems[lbIndex];
  if(!p||p.type!=="live")return;
  lbMotionOn=!lbMotionOn;
  applyLbMotion();
}
/* 声音开关 */
function lbToggleSound(){
  lbSoundOn=!lbSoundOn;
  const vid=$("#lbVideo");
  vid.muted=!lbSoundOn;
  /* 静音状态下被浏览器拦住的播放，开声后补一次播放尝试 */
  if(lbMotionOn&&vid.paused&&lbSoundOn)vid.play().catch(()=>{});
  paintSoundBtn();
}
/* 动态照片解析完成时补一手：若灯箱正开着这张，立刻显示控制条并播动态。
   修复：悬停会先于点击触发原图解析（promoteMotion），等灯箱打开时那次调用
   因 _motionTried 立即返回空，解析结果又只更新了图墙瓷砖 ——
   若不在这里补上，第一次打开就只有静态图，控制条也不出现，得关掉重开才有。 */
function lbPlayMotion(p){
  if(!p||p.type!=="live"||!p.live)return;
  if(!$("#lightbox").classList.contains("open"))return;
  if(lbItems[lbIndex]!==p)return;
  $("#lbMotionBar").style.display="";
  paintSoundBtn();
  lbMotionOn=true;
  applyLbMotion();
}
/* ---------- 灯箱取图 ----------
   两个要求同时满足：① 等的过程绝不能残留上一张；② 等的时间要尽可能短。
   做法：
     ⓪ 切图同一帧就换上「属于这张图」的内容 —— 优先用图墙里**已经解码好的同一张
        位图**（p._cache，同一 URL 命中内存缓存，0 请求 0 等待），没有才用内联的
        24px 模糊占位；同时按原始比例占好版式，画面绝不残留上一张、也不会跳版。
     ① 缩略图与清晰图**并行**请求（不是串行等待），谁先到先用谁，清晰图到了再升级；
     ② 全程 token 校验 + 档位 rank，旧的/低清的回调永远盖不掉新的。
   注：原来先等缩略图再拉 view，等于多付一次完整往返 —— 慢网下就是「一直转圈」，
   现在改成并行后少一个 RTT，且首帧往往直接命中缓存。 */
let lbImgToken=0;
let lbAnimDir=0;    /* 灯箱切换方向（stepLb 设置）：>0 下一张、<0 上一张、0=非切换打开（不播滑入） */
let lbVidToken=0;   /* 视频/动态视频的等待代次：换片后旧回调不得误撤新片的转圈 */
/* 视频类媒体（普通视频 / 动态照片的动态视频）加载期间显示转圈，
   直到真正有帧数据（loadeddata）或确认失败（error）才撤 ——
   让用户明确知道当前看到的还不是完整内容。已就绪（回看/切回）时不加圈。 */
function lbWaitMedia(el){
  if(el.readyState>=2)return;        /* HAVE_CURRENT_DATA 及以上：画面已经有了 */
  const vtok=++lbVidToken, lb=$("#lightbox");
  lb.classList.add("lb-busy");
  const done=()=>{ if(vtok===lbVidToken)lb.classList.remove("lb-busy"); };
  el.addEventListener("loadeddata",done,{once:true});
  el.addEventListener("error",done,{once:true});
}
function lbImgReset(){
  const img=$("#lbImg");
  img.onload=img.onerror=null;
  img.removeAttribute("src");
  img.classList.remove("lb-ph");
  img.style.removeProperty("width");
  img.style.removeProperty("height");
  /* 兜底换图的状态标记一并清掉：上一张用过 data-alt 兜底后若不清 data-s，
     下一张带兜底的图会命中「已失败过」分支直接被隐藏 */
  img.removeAttribute("data-alt");
  delete img.dataset.s;
}
/* 灯箱图片的最终显示尺寸：视口约束内保持比例，且不超过清晰图原生尺寸（不拉伸放大）。
   有清晰图原生尺寸记录（p._vw/_vh，预取或首次加载时记下）就用它；
   没有记录时按原图尺寸估 —— 原图远大于视口，算出的就是约束框，与最终一致 */
function lbBoxDims(p){
  const nw=p._vw||p.w||0, nh=p._vh||p.h||0;
  if(!nw||!nh)return null;
  const aspect=nw/nh;
  const w=Math.min(innerWidth*0.88, nw, innerHeight*0.8*aspect);
  return [w, w/aspect];
}
function showLbImage(p){
  const img=$("#lbImg");
  const token=++lbImgToken;
  const view=p.view||p.src||"";
  const mid=(p._cache&&p._cache!==view)?p._cache
           :(p.thumb2x&&p.thumb2x!==view)?p.thumb2x
           :(p.thumb&&p.thumb!==view)?p.thumb:"";
  img.onload=img.onerror=null;

  /* ⓪ 同一帧铺上这张图自己的画面；外框先按已知信息估一个，
     之后每级画面（缩略图/清晰图）到位都会按「实际画面的真实比例」校正外框 ——
     显示内容永远不会被裁剪或拉伸。此前外框只信元数据估算值，比例一旦估错，
     占位图被 object-fit:cover 裁掉一块，要等清晰图到了才「变全」 */
  img.classList.add("lb-ph");
  const dims=lbBoxDims(p);
  if(dims){
    img.style.width=dims[0]+"px";
    img.style.height=dims[1]+"px";
  }else{
    img.style.removeProperty("width");
    img.style.removeProperty("height");
  }
  /* rank：0=模糊占位 1=缩略图 2=清晰图，只允许往上换 */
  let rank=0;
  if(p._cache&&p._cacheReady&&p._cache!==view){
    img.src=p._cache; rank=1;          /* 图墙里已经解码好，立刻就是清晰画面 */
  }else if(p.blur){
    img.src=p.blur;
  }else{
    img.removeAttribute("src");
  }
  /* 转圈直到「清晰图真正落地」才撤（见 paint / Promise.all）——
     之前缩略图一到就撤，用户会误以为看到的低清画面就是最终效果 */
  $("#lightbox").classList.add("lb-busy");

  const load=(url,saveDims)=>new Promise(res=>{
    if(!url)return res(null);
    const i=new Image();
    i.decoding="async";
    i.onload=()=>{
      /* 记下清晰图原生尺寸：本次及之后切回这张时，占位框直接按最终尺寸算 */
      if(saveDims){ p._vw=i.naturalWidth; p._vh=i.naturalHeight; }
      res({url:url,w:i.naturalWidth,h:i.naturalHeight});
    };
    i.onerror=()=>res(null);
    i.src=url;
  });
  /* 按实际画面的宽高比校正外框：
     keepScale=true（缩略图级）→ 保持当前宽度、只修高度，尺寸不跳；
     keepScale=false（清晰图级）→ 这就是最终真实尺寸，完整重算 */
  const fixBox=(nw,nh,keepScale)=>{
    if(!nw||!nh)return;
    const aspect=nw/nh;
    const curW=parseFloat(img.style.width)||0;
    const w=(keepScale&&curW)?curW:Math.min(innerWidth*0.88, nw, innerHeight*0.8*aspect);
    img.style.width=w+"px";
    img.style.height=(w/aspect)+"px";
  };
  const paint=(pic,r)=>{
    if(!pic||token!==lbImgToken||r<rank)return;
    rank=r;
    img.classList.remove("lb-ph");
    fixBox(pic.w,pic.h,r===1);
    img.src=pic.url;
    if(r===2)$("#lightbox").classList.remove("lb-busy");   /* 清晰图落地才撤转圈 */
  };
  /* ① 两路并行：缩略图先到先上（顺带校正比例），清晰图到了再升级 */
  const jobs=[];
  if(mid)jobs.push(load(mid).then(pic=>paint(pic,1)));
  jobs.push(load(view,true).then(pic=>{ if(pic)paint(pic,2); }));
  Promise.all(jobs).then(()=>{
    if(token!==lbImgToken)return;
    $("#lightbox").classList.remove("lb-busy");
    /* 当前这张已经落地，再去预取前后两张 —— 不在下载途中抢带宽 */
    clearTimeout(lbNeighborTimer);
    lbNeighborTimer=setTimeout(preloadLbNeighbors,60);
  });
}
/* 预取前后各一张，连点箭头基本瞬开（只多下载两张，不影响首屏） */
let lbNeighborTimer=0;
function preloadLbNeighbors(){
  const n=lbItems.length;
  if(n<2)return;
  [lbIndex+1,lbIndex-1].forEach(k=>{
    const p=lbItems[(k+n)%n];
    if(!p||p.type==="video")return;
    const view=p.view||p.src;
    if(view){
      const a=new Image(); a.decoding="async";
      /* 顺手记下原生尺寸：等真切到这张时，占位框第一次就能按最终尺寸画 */
      if(!p._vw)a.onload=()=>{ p._vw=a.naturalWidth; p._vh=a.naturalHeight; };
      a.src=view;
    }
  });
}
/* 点击/悬停时「预热」：把瓷砖里已经解码好的那张位图记到 p 上（灯箱可直接复用），
   并提前开始拉清晰图 —— 比等 click 再发请求快一拍，慢网下尤其明显。 */
function lbPreheat(tile){
  if(!tile||tile.dataset.idx===undefined)return null;
  const grid=tile.closest("[data-photo-grid]");
  const list=(grid&&grid._items)||photos;
  const p=list[Number(tile.dataset.idx)];
  if(!p)return null;
  const im=tile.querySelector("img");
  if(im&&im.currentSrc){
    p._cache=im.currentSrc;
    p._cacheReady=!!im.complete&&im.naturalWidth>0;
  }
  if(p.type!=="video"&&!p._viewPreloaded){
    p._viewPreloaded=true;
    const a=new Image(); a.decoding="async";
    if(!p._vw)a.onload=()=>{ p._vw=a.naturalWidth; p._vh=a.naturalHeight; };
    a.src=p.view||p.src;
  }
  return p;
}
function setLbMedia(p){
  const img=$("#lbImg"), vid=$("#lbVideo"), bar=$("#lbMotionBar");
  lbMotionOn=false;
  bar.style.display="none";
  /* 换图时退出「原始尺寸」放大态：否则下一张会以 100% 尺寸溢出屏幕 */
  $("#lightbox").classList.remove("lb-zoom");
  /* 先停掉上一条的动态视频，防止切换后还在放 */
  try{ vid.pause(); }catch(e){}
  vid.removeAttribute("src"); vid.load();
  /* 切图滑动过渡：只有方向键/箭头切换（stepLb 设了 lbAnimDir）才播，首次打开不播。
     先摘类 → 强制 reflow → 再加类，才能保证同一方向连按时动画每次都重播 */
  const applyLbSlide=el=>{
    el.classList.remove("lb-in-l","lb-in-r");
    if(lbAnimDir){
      void el.offsetWidth;
      el.classList.add(lbAnimDir>0?"lb-in-r":"lb-in-l");   /* 往下一张：新图从右滑入 */
    }
  };
  if(p.type==="video"){
    lbImgToken++;                 /* 作废还没回来的图片回调 */
    lbImgReset();
    img.style.display="none";
    vid.style.display="";
    applyLbSlide(vid);
    if(p.loop){
      /* 动图：无声循环、不给控件 —— 它只是「会动的画」，不该能暂停 */
      vid.controls=false; vid.muted=true; vid.loop=true;
    }else{
      vid.controls=true; vid.muted=false; vid.loop=false;   /* 只播一遍，播完停在结尾 */
    }
    lbWaitMedia(vid);             /* 转圈直到视频真正出画面（loadeddata），加载中不装作已就绪 */
    vid.src=p.src;
    /* 打开视频默认自动播放一遍；带声播放被浏览器拦时先静音播起来 */
    vid.play().catch(()=>{ vid.muted=true; vid.play().catch(()=>{}); });
  }else{
    vid.style.display="none";
    img.style.display="";
    applyLbSlide(img);
    img.removeAttribute("data-alt");
    delete img.dataset.s;   /* 清掉上一张遗留的兜底失败标记，避免下一张兜底失效 */
    /* 先秒出已缓存的缩略图，再换清晰的 view 图 —— 切图不再空白 / 停在上一张 */
    showLbImage(p);
    if(p.fb){
      img.dataset.alt=PHOTO_DIRS[0]+encodeURIComponent(p.fb);
      img.onerror=function(){
        if(img.dataset.s){img.onerror=null;return}
        img.dataset.s="1"; img.src=img.dataset.alt;
      };
    }
    if(p.type==="live"){
      /* 已识别的动态照片（配对 Live Photo / 内嵌视频 Motion Photo）→ 显示控制条
         并自动先播一遍动态效果，之后想再看再点「动态」 */
      bar.style.display="";
      paintSoundBtn();
      lbMotionOn=true;
      applyLbMotion();
    }else if(p.type==="image"&&p.motion!==false){
      /* motion 未知（旧扫描模式）时才现场探测；清单模式已知不是动态照片就跳过，
         免得为了一张静态图去整份下载原图。
         注意：悬停可能已经触发过解析（_motionTried 已置位），promoteMotion 会
         立即返回空 —— 所以这里必须再挂到真正的解析 promise 上，出结果后补播 */
      promoteMotion(p,null,false);
      motionVideoURL(p.src).then(()=>lbPlayMotion(p));
    }
  }
  lbAnimDir=0;    /* 方向只对本张生效，消费掉：之后的重渲染/动态补播不得再触发滑入 */
}
function openLb(items,i,grid){
  lbItems=items||[];
  if(!lbItems.length)return;
  lbGrid=grid||null;                              /* 记住灯箱是从哪个网格打开的（找缓存位图要用） */
  lbIndex=(i+lbItems.length)%lbItems.length;
  showLb();
  /* 关掉灯箱后把焦点还给触发元素。已在灯箱内部（如用方向键切图时 openLb 被再次调用）
     就保留最初记下的那个，别把焦点目标覆盖成灯箱里的按钮 */
  if(!$("#lightbox").contains(document.activeElement))lbFocus=document.activeElement;
  $("#lightbox").classList.add("open");
  $("#lightbox").classList.remove("closing");      /* 快速开关：别让上一次的退场动画把入场顶掉 */
  clearTimeout(lbCloseTimer);
  $("#lightbox").classList.toggle("lb-single",lbItems.length<2);
  document.body.classList.add("lb-lock");         /* 锁住背景滚动 */
  try{ $("#lbClose").focus(); }catch(e){}
}
function showLb(){
  const p=lbItems[lbIndex];
  if(!p)return;
  clearTimeout(lbNeighborTimer);       /* 上一张的邻居预取作废，别抢当前这张的带宽 */
  /* 用方向键 / 滑动切图时没经过点击，这里补一次：把图墙里那张已解码的位图记下来复用。
     必须校验「网格里这个下标对应的就是这张照片」，避免拿到别的相册的同下标照片 */
  if(!p._cache&&lbGrid){
    const tile=lbGrid.querySelector(`.ph-tile[data-idx="${lbIndex}"]`);
    const list=lbGrid._items||photos;
    if(tile&&list[Number(tile.dataset.idx)]===p)lbPreheat(tile);
  }
  setLbMedia(p);
  $("#lbImg").alt=p.name;
  $("#lbCount").textContent=`${lbIndex+1} / ${lbItems.length} · ${p.name}`;
  /* 图片的邻居预取放在这张加载完之后（见 showLbImage）；视频没有加载回调，直接预取 */
  if(p.type==="video")preloadLbNeighbors();
}
/* 灯箱退场动画时长（毫秒）：系统开了「减少动态效果」就立刻隐藏 */
const LB_OUT_MS=(typeof matchMedia==="function"&&matchMedia("(prefers-reduced-motion: reduce)").matches)?0:180;
let lbCloseTimer=0;
function closeLb(){
  lbImgToken++;                                   /* 作废还没回来的取图回调 */
  $("#lightbox").classList.remove("lb-busy","lb-zoom");
  try{ $("#lbVideo").pause(); }catch(e){}
  const lb=$("#lightbox");
  lb.classList.remove("open");
  document.body.classList.remove("lb-lock");
  if(LB_OUT_MS>0){
    lb.classList.add("closing");                  /* 先播完淡出再 display:none */
    clearTimeout(lbCloseTimer);
    lbCloseTimer=setTimeout(()=>lb.classList.remove("closing"),LB_OUT_MS);
  }
  if(lbFocus&&typeof lbFocus.focus==="function"){ try{ lbFocus.focus(); }catch(e){} }
  lbFocus=null;
}
function stepLb(d){
  /* 只有一张时没有别的可切：箭头已隐藏，但键盘左右键还是会到这里 ——
     不拦住的话每次按键都整张重载（视频尤其会从头黑一下） */
  if(lbItems.length<2)return;
  lbAnimDir=d;                       /* 记下切换方向，setLbMedia 里据此播「从左/右滑入」过渡 */
  openLb(lbItems,lbIndex+d,lbGrid);
}

   状态存 localStorage；没存过时默认手机端收起、桌面端展开 */
const COLL_KEY="aboutCollapse";
const COLL_CHEV=`<svg class="coll-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;
function aboutCollapseDefault(){
  try{return matchMedia("(max-width:640px)").matches;}catch(e){return false;}  /* 手机端默认收起 */
}
function applyAboutCollapse(){
  /* 折叠动画需要单一网格行：把 coll-body 里的零散子元素包进一个 .coll-inner。
     about 页每次重渲染 DOM 都是新拼的，所以这里每次都要检查一遍 */
  document.querySelectorAll(".about-card.collapsible>.coll-body").forEach(b=>{
    if(b.firstElementChild&&b.firstElementChild.classList.contains("coll-inner"))return;
    const w=document.createElement("div");
    w.className="coll-inner";
    while(b.firstChild)w.appendChild(b.firstChild);
    b.appendChild(w);
  });
  let saved={};
  try{saved=JSON.parse(localStorage.getItem(COLL_KEY)||"{}");}catch(e){}
  document.querySelectorAll(".about-card.collapsible[id]").forEach(c=>{
    const on=typeof saved[c.id]==="boolean"?saved[c.id]:aboutCollapseDefault();
    c.classList.toggle("collapsed",on);
  });
}
function saveAboutCollapse(){
  const s={};
  document.querySelectorAll(".about-card.collapsible[id]").forEach(c=>{s[c.id]=c.classList.contains("collapsed");});
  try{localStorage.setItem(COLL_KEY,JSON.stringify(s));}catch(e){}
}
/* 事件委托：点击标题行切换折叠；标题行里的链接 / 按钮（如“前往 Steam 主页”、刷新）不触发 */
document.addEventListener("click",e=>{
  const head=e.target.closest(".coll-head");
  if(!head||e.target.closest("a,button"))return;
  const card=head.closest(".about-card.collapsible");
  if(!card)return;
  card.classList.toggle("collapsed");
  saveAboutCollapse();
});
/* 键盘可达：标题行聚焦时 Enter / 空格同样切换 */
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const head=e.target.closest?e.target.closest(".coll-head"):null;
  if(!head||e.target.closest("a,button"))return;
  const card=head.closest(".about-card.collapsible");
  if(!card)return;
  e.preventDefault();
  card.classList.toggle("collapsed");
  saveAboutCollapse();
});

/* ⓪ 部署环境优先读静态清单 blog/index.json：一次几 KB 的请求＝整份列表，
      图片与正文全部走本站域名（Cloudflare CDN），不再碰 GitHub API / raw。
      清单由 scripts/gen-blog-index.mjs 自动生成（GitHub Action 或 Pages 构建命令运行），无需手动维护 */
async function manifestPosts(){
  try{
    /* no-cache（而非 no-store + 时间戳）：保留 304 协商缓存，新鲜度不变，
       部署环境不再每次全量回源下载清单 */
    const r=await fetch("blog/index.json",{cache:"no-cache"});
    if(!r.ok)return null;
    const j=await r.json();
    if(!j||!Array.isArray(j.posts))return null;
    return j.posts.filter(p=>p&&p.slug&&p.md).map(p=>({
      slug:String(p.slug),
      mdURL:encodeURI(String(p.md)),
      imgBase:encodeURI(String(p.imgBase||"")),
      title:p.title||p.slug,desc:p.desc||"",
      tags:Array.isArray(p.tags)?p.tags:[],
      date:p.date||"",
      minutes:+p.minutes||1,
      cover:p.cover||"",bg:p.bg||p.background||"",
      coverThumb:p.coverThumb?encodeURI(String(p.coverThumb)):"",
      bgThumb:p.bgThumb?encodeURI(String(p.bgThumb)):"",
      imgMap:(p.imgs&&typeof p.imgs==="object")?p.imgs:null,
      /* 静态英文版（由 GitHub Action 自动生成）：英文界面直接读它，
         不再逐条机器翻译，首屏不会先闪中文再换英文。
         英文写的文章同理用静态中文版（index.zh.md，约定字段 mdZh/titleZh，没生成也不影响） */
      mdURLEn:p.mdEn?encodeURI(String(p.mdEn)):"",
      titleEn:p.titleEn||"",descEn:p.descEn||"",
      tagsEn:Array.isArray(p.tagsEn)?p.tagsEn:[],
      mdURLZh:p.mdZh?encodeURI(String(p.mdZh)):"",
      titleZh:p.titleZh||"",descZh:p.descZh||"",
      tagsZh:Array.isArray(p.tagsZh)?p.tagsZh:[]
    })).sort(byDateDesc);
  }catch(e){return null;}
}

/* 解析「目录列表」页 → [{name,dir}]；不是目录列表就返回 null */
async function listingItems(base){
  try{
    const r=await fetch(base+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return null;
    if(!(r.headers.get("content-type")||"").toLowerCase().includes("html"))return null;
    const html=await r.text();
    const items=[],seen=new Set();
    new DOMParser().parseFromString(html,"text/html").querySelectorAll("a[href]").forEach(a=>{
      let h=(a.getAttribute("href")||"").split(/[?#]/)[0].replace(/^\.\//,"");
      if(!h||/^[a-z][a-z0-9+.-]*:/i.test(h)||h.startsWith("/")||h.startsWith(".."))return;
      const dir=h.endsWith("/");
      let name=h.replace(/\/+$/,"");
      try{name=decodeURIComponent(name);}catch(e){}
      if(!name||name.includes("/"))return;
      if(!dir&&!/\.md$/i.test(name))return;
      if(seen.has(name))return;seen.add(name);
      items.push({name:name,dir:dir});
    });
    const isListing=items.length>0||/directory listing for|index of\s*\/|<h1>\s*index\b/i.test(html);
    return isListing?items:null;
  }catch(e){return null;}
}
/* 把一篇 Markdown 读成文章对象（mdURL = 正文地址，imgBase = 图片前缀） */
async function grabPost(slug,mdURL,imgBase,found){
  if(!slug||found.has(slug))return;
  let raw;
  try{
    /* no-cache：服务器没更新时走 304，不再每次全量拉正文 */
    const r=await fetch(mdURL,{cache:"no-cache"});
    if(!r.ok)return;
    raw=await r.text();
    /* SPA 兜底把不存在的 md 也回 200 + index.html：跳过，别让站点源码混进文章列表 */
    if(isHTMLFallbackText(raw))return;
  }catch(e){return;}
  const {meta,body}=parsePost(raw);
  const tags=Array.isArray(meta.tags)?meta.tags
    :(meta.tags?String(meta.tags).split(/[,，]/).map(x=>x.trim()).filter(Boolean):[]);
  found.set(slug,{
    slug,mdURL,imgBase,
    title:meta.title||slug,desc:meta.desc||"",tags,
    date:meta.date||"",
    minutes:+meta.minutes||Math.max(1,Math.round(body.replace(/\s/g,"").length/450)),
    cover:meta.cover||"",bg:meta.background||""
  });
}
/* ① 扫本地 / 托管的目录列表（多篇并行抓取） */
async function scanWebDir(absBase,found){
  const items=await listingItems(absBase);
  if(!items)return false;
  await Promise.all(items.map(it=>{
    const seg=encodeURIComponent(it.name);
    return grabPost(it.dir?it.name:it.name.replace(/\.md$/i,""),
      absBase+seg+(it.dir?"/index.md":""),
      absBase+(it.dir?seg+"/":""),found);
  }));
  return true;
}
/* ② 静态托管没有目录列表时，按仓库目录扫（GitHub API ＋ raw 直链，多篇并行） */
async function scanGitHubDir(repoDir,found){
  let arr;
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${repoDir}?ref=${GH_BRANCH}`,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return false;
    arr=await r.json();
  }catch(e){return false;}
  if(!Array.isArray(arr))return false;
  await Promise.all(arr.map(it=>{
    const seg=encodeURIComponent(it.name);
    if(it.type==="dir")
      return grabPost(it.name,`${GH_RAW}${repoDir}/${seg}/index.md`,`${GH_RAW}${repoDir}/${seg}/`,found);
    if(it.type==="file"&&/\.md$/i.test(it.name))
      return grabPost(it.name.replace(/\.md$/i,""),`${GH_RAW}${repoDir}/${seg}`,`${GH_RAW}${repoDir}/`,found);
    return Promise.resolve();
  }));
  return true;
}
/* 扫描链路：本地/托管目录列表 → GitHub 兜底 */
async function fetchBlogData(){
  const found=new Map(),seen=new Set();let ok=false;
  for(const base of BLOG_WEB_DIRS){
    let abs;
    try{abs=new URL(base,location.href).href;}catch(e){continue;}
    if(seen.has(abs))continue;          /* 站点就在根目录时，两个基址是同一个地址 */
    seen.add(abs);
    try{ if(await scanWebDir(abs,found))ok=true; }catch(e){}
  }
  if(!found.size){
    for(const dir of BLOG_REPO_DIRS){
      try{ if(await scanGitHubDir(dir,found))ok=true; }catch(e){}
      if(found.size)break;
    }
  }
  return {posts:Array.from(found.values()).sort(byDateDesc),ok};
}
async function loadBlog(){
  /* 只认「非空」的缓存：之前失败过一次留下空数组，空数组是 truthy，
     会把后面的重试全部挡掉 —— 断网进来过就再也刷不出文章，只能整页刷新 */
  if(blogCache&&blogCache.length)return blogCache;
  /* 部署环境：优先读静态清单（一次请求、走 CDN，最快） */
  if(!IS_LOCAL){
    const m=await manifestPosts();
    if(m&&m.length){blogCache=m;blogErr=false;lsSave(m);return blogCache;}
  }
  /* 本地：目录列表实时可用，直接扫，保证「写完刷新就能看到」 */
  if(IS_LOCAL){
    const r=await fetchBlogData();
    blogCache=r.posts;blogErr=!r.ok&&!r.posts.length;
    return blogCache;
  }
  /* 部署但没有清单：先吃 10 分钟内的本地缓存秒开，同时后台静默刷新 */
  const ls=lsRead();
  if(ls&&Date.now()-ls.t<LS_BLOG_TTL){
    blogCache=ls.posts;blogErr=false;
    refreshBlogInBackground();
    return blogCache;
  }
  const r=await fetchBlogData();
  if(r.posts.length){blogCache=r.posts;blogErr=false;lsSave(r.posts);}
  else if(ls){blogCache=ls.posts;blogErr=false;}   /* 网络抽风也有旧列表兜底 */
  else{blogCache=[];blogErr=true;}
  return blogCache;
}
/* 后台静默刷新：拿到新列表后就地更新（不重滚页面、不丢搜索词） */
let blogBgBusy=false;
async function refreshBlogInBackground(){
  if(blogBgBusy)return;blogBgBusy=true;
  try{
    const r=await fetchBlogData();
    if(r.posts.length&&!samePosts(r.posts,blogCache)){
      blogCache=r.posts;
      if(!IS_LOCAL)lsSave(r.posts);
      window.dispatchEvent(new CustomEvent("bloglist"));
    }
  }catch(e){}
  blogBgBusy=false;
}
/* 首页闲时预取清单：等你点进「博客」时列表已经在手里了 */
let blogPreAt=0;
function prefetchBlog(){
  if(IS_LOCAL||(blogCache&&blogCache.length)||location.hash.indexOf("#/blog")===0)return;
  const now=Date.now();
  if(now-blogPreAt<120000)return;blogPreAt=now;
  manifestPosts().then(m=>{if(m&&m.length){blogCache=m;blogErr=false;}});
}
/* 解析 front matter（--- 包围的元信息）与正文 */
/* SPA 兜底识别：静态托管常把不存在的路径也回 200 + index.html（_redirects / SPA 模式），
   拿到这种响应时"正文"其实是一整份站点源码，绝不能当 Markdown 渲染。
   特征：开头 120 字符内就是 <!DOCTYPE / <html / <head / <body（允许 BOM 与空白） */
function isHTMLFallbackText(t){
  return /^\s*(?:\ufeff)?\s*<(!doctype|html|head|body)/i.test(String(t).slice(0,120));
}
function parsePost(raw){
  const meta={};
  /* 先清掉 BOM 与开头的空行：记事本之类另存会加 BOM，手抖先敲个回车也很常见，
     不处理的话 ^--- 匹配不上，整段 front matter 会当正文渲染出来（标题/标签也全丢） */
  let body=String(raw==null?"":raw).replace(/^\ufeff/,"").replace(/^(?:[ \t]*\r?\n)+/,"");
  const m=body.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if(m){
    m[1].split(/\r?\n/).forEach(line=>{
      const kv=line.match(/^([A-Za-z][\w-]*):\s*(.*)$/);
      if(!kv)return;
      let v=kv[2].trim();
      if(/^\[.*\]$/.test(v)){
        try{v=JSON.parse(v);}
        catch(e){v=v.slice(1,-1).split(",").map(s=>s.trim().replace(/^["']|["']$/g,"")).filter(Boolean);}
      }else v=v.replace(/^["']|["']$/g,"");
      /* 同时存原始键与小写键：title/cover 等小写键照常命中，
         bgThumb 这类驼峰键也能按原样读到（只存小写会让它永远查不到） */
      meta[kv[1]]=v;
      meta[kv[1].toLowerCase()]=v;
    });
    body=m[2];
  }
  return {meta,body};
}
/* ---------- 正文媒体：视频 / 动图 / 音频 ----------
   站点是纯静态的，视频文件就和图片一样放在文章文件夹里，正文用相对文件名引用即可：
     ![说明](clip.mp4)                → 视频播放器（点播放，带进度条与全屏）
     ![说明](clip.mp4 "封面.jpg")      → 同上，自定义封面
     @motion[说明](clip.mp4)          → 动图式播放：无声、自动循环、不需要点
     ![说明](anim.gif)                → GIF 原图直接动起来，左上角挂 GIF 角标
     @audio[说明](voice.mp3)          → 音频小卡片
   视频不会被构建脚本压成 WebP（那会变成静止画面），也不会去查 imgMap 缩略图映射。 */
const VIDEO_FILE_RE=/\.(mp4|m4v|webm|ogv|ogg|mov|qt)(?=$|[?#])/i;
const AUDIO_FILE_RE=/\.(mp3|m4a|aac|wav|flac|oga|opus)(?=$|[?#])/i;
const GIF_FILE_RE=/\.gif(?=$|[?#])/i;
const isVideoFile=u=>VIDEO_FILE_RE.test(String(u||""));
const isAudioFile=u=>AUDIO_FILE_RE.test(String(u||""));
const isGifFile=u=>GIF_FILE_RE.test(String(u||""));
/* 附件（pdf / 压缩包 / 办公文档 …）：独立成行时渲染成下载卡 */
const FILE_FILE_RE=/\.(pdf|zip|rar|7z|docx?|xlsx?|pptx?|txt|csv|epub|psd|ai|sketch|fig|ttf|otf|woff2?)(?=$|[?#])/i;
const isAttachFile=u=>FILE_FILE_RE.test(String(u||""));
/* 极简 Markdown 渲染：标题/引用/代码块/列表/图片/链接/加粗/斜体/行内码/分隔线 */
function mdToHTML(md,imgBase,imgMap){
  /* 正文图片缩略图映射：文件名 → 构建时压缩的 WebP 版本 */
  /* 行内文本先做过 HTML 转义，路径里的 & < > 等已变成 &amp; 等 ——
     查 imgMap / 拼地址前要先还原，否则带这些字符的文件名永远匹配不上 */
  const unesc=t=>String(t).replace(/&amp;/g,"&").replace(/&lt;/g,"<")
    .replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  const imgHit=src=>{
    if(!imgMap)return null;
    if(imgMap[src])return imgMap[src];
    const t=unesc(src);
    if(imgMap[t])return imgMap[t];
    try{ return imgMap[decodeURIComponent(t)]||null; }catch(e){ return null; }
  };
  /* 媒体地址：视频 / GIF / 音频一律走原文件，不查 imgMap ——
     构建脚本生成的 WebP 只会留下静帧，GIF 变不动、视频直接打不开 */
  const mediaURL=(src,useMap)=>{
    src=String(src||"").trim();
    if(/^(https?:|data:|blob:|file:|\/)/i.test(src))return unesc(src);
    if(useMap){
      const hit=imgHit(src);
      if(hit)return encodeURI(hit);
    }
    return (imgBase||"")+unesc(src);
  };
  const badgeMotion=lang==="zh"?"动图":"LOOP";
  const badgeVideo=lang==="zh"?"视频":"VIDEO";
  /* ---------- 链接卡 / 嵌入 / 提示块的公共小工具 ---------- */
  const linkHost=u=>{
    if(/^mailto:/i.test(u))return String(u).replace(/^mailto:/i,"");
    try{return new URL(u).host.replace(/^www\./,"");}
    catch(e){return String(u||"").replace(/^[a-z]+:\/\//i,"").split("/")[0];}
  };
  /* 域名 → 稳定色相：同一个站点永远是同一个颜色，看着像有记忆 */
  const hueOf=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h;};
  /* 只放行 http(s)：javascript: / vbscript: / data: 一律不生成卡片，防止正文里藏 XSS */
  const safeURL=u=>{
    u=String(u||"").trim();
    if(!u)return "";
    if(/^\/\//.test(u))return "https:"+u;
    return /^(https?:\/\/|mailto:)/i.test(u)?u:"";
  };
  const linkCardHTML=(url,title,desc)=>{
    const host=linkHost(url)||url, t=title||host;
    return `<a class="md-linkcard" href="${esc(url)}" target="_blank" rel="noopener nofollow" style="--h:${hueOf(host)}">`+
      `<span class="lc-mark">${esc((host[0]||"?").toUpperCase())}</span>`+
      `<span class="lc-body"><span class="lc-title">${esc(t)}</span>`+
      (desc?`<span class="lc-desc">${esc(desc)}</span>`:"")+
      `<span class="lc-host">${esc(host)}</span></span>`+
      `<span class="lc-arrow">↗</span></a>`;
  };
  /* B 站 / YouTube / Vimeo 的常规分享地址 → 可直接 iframe 的播放器地址 */
  const embedSrc=u=>{
    u=String(u||"").trim();
    let m=u.match(/bilibili\.com\/video\/(BV[0-9A-Za-z]+)/);
    if(m)return "https://player.bilibili.com/player.html?bvid="+m[1]+"&autoplay=0&high_quality=1";
    m=u.match(/(?:youtube\.com\/watch\?[^#]*v=|youtu\.be\/)([\w-]{6,})/);
    if(m)return "https://www.youtube.com/embed/"+m[1];
    m=u.match(/vimeo\.com\/(\d+)/);
    if(m)return "https://player.vimeo.com/video/"+m[1];
    return "";
  };
  const CALLOUT_META={
    note:{icon:"ℹ️",zh:"说明",en:"NOTE"},
    tip:{icon:"💡",zh:"提示",en:"TIP"},
    important:{icon:"❗",zh:"重要",en:"IMPORTANT"},
    warning:{icon:"⚠️",zh:"警告",en:"WARNING"},
    caution:{icon:"🚫",zh:"小心",en:"CAUTION"}
  };
  /* 附件下载卡：左边是扩展名色块，右边文件名 + 原始路径 */
  const fileHTML=(name,src)=>{
    const ext=(String(src).match(/\.([a-z0-9]+)(?=$|[?#])/i)||["","FILE"])[1].toUpperCase().slice(0,4);
    return `<a class="md-file" href="${esc(mediaURL(src,false))}" download target="_blank" rel="noopener">`+
      `<span class="mf-ico">${esc(ext)}</span>`+
      `<span class="mf-name">${esc(name||src)}<span class="mf-sub">${esc(src)}</span></span>`+
      `<span class="lc-arrow">⬇</span></a>`;
  };
  const embedHTML=(title,url)=>{
    const e=embedSrc(url);
    if(!e)return linkCardHTML(url,title,"");     /* 认不出的站点：退化成链接卡，不留白框 */
    return `<div class="md-embed"><div class="me-bar">📺 ${esc(title||linkHost(url))}</div>`+
      `<div class="me-ratio"><iframe src="${esc(e)}" loading="lazy" allowfullscreen referrerpolicy="no-referrer"></iframe></div></div>`;
  };
  /* 统一容器：视频 / GIF / 循环动图 / 音频都套 .md-media，样式一致 */
  const mediaHTML=(kind,alt,src,poster)=>{
    alt=alt||"";
    const cap=alt?`<figcaption>${esc(alt)}</figcaption>`:"";
    if(kind==="audio"){
      const u=mediaURL(src,false);
      return `<div class="md-media md-audio">`+
        (alt?`<div class="md-audio-cap"><span>AUDIO</span>${esc(alt)}</div>`:"")+
        `<audio src="${esc(u)}" controls preload="metadata"></audio></div>`;
    }
    const u=mediaURL(src,false);
    if(kind==="gif"){
      return `<figure class="md-media md-gif"><img src="${esc(u)}" alt="${esc(alt)}" loading="lazy" decoding="async">`+
        `<span class="md-badge">GIF</span>${cap}</figure>`;
    }
    const p=poster?mediaURL(poster,true):"";
    const pAttr=p?` poster="${esc(p)}"`:"";
    if(kind==="motion"){
      return `<figure class="md-media md-motion"><video src="${esc(u)}"${pAttr} autoplay muted loop playsinline preload="metadata" data-mdmotion></video>`+
        `<span class="md-badge live">${esc(badgeMotion)}</span>${cap}</figure>`;
    }
    return `<figure class="md-media md-video"><video src="${esc(u)}"${pAttr} controls playsinline preload="metadata" data-mdvideo></video>`+
      `<span class="md-badge">${esc(badgeVideo)}</span>${cap}</figure>`;
  };
  /* 整行只有一个媒体 / 链接 / 嵌入 / 附件标记 → 按「块」渲染；返回 null 表示这行不是块，
     仍按普通段落处理（行内的图片不受影响） */
  const parseMediaLine=line=>{
    const m=String(line).match(/^\s*(?:@([A-Za-z]+)\s*)?(!?\[([^\]]*)\])\s*\(\s*((?:[^()]|\([^()]*\))+)\s*\)\s*$/)
      /* 宽容版：标题里带 ] 、网址里嵌套两层以上括号时，严格版认不出来，
         退一步用「最后的 ] 后跟 ( …… 最后一个 )」再试一次，别把卡片丢成原文 */
      ||String(line).match(/^\s*(?:@([A-Za-z]+)\s*)?(!?\[([\s\S]*)\]\s*\(\s*([\s\S]+)\s*\))\s*$/);
    if(!m)return null;
    const tag=(m[1]||"").toLowerCase();
    const alt=m[3]||"";
    let inner=(m[4]||"").trim(),extra="";
    /* 「地址 "补充信息"」：文件名可能带空格，所以只在结尾是引号串时才拆开。
       链接块里这串是「描述」，媒体块里是「封面图」 */
    const q=inner.match(/^(.*?)\s+["']([^"']+)["']$/);
    if(q&&q[1].trim()){inner=q[1].trim();extra=q[2].trim();}
    if(!inner)return null;
    /* 链接 / 嵌入 / 附件：后面跟的不是本地文件，直接当块处理 */
    if(tag==="link"||tag==="embed"||tag==="file")return {kind:tag,alt,src:inner,extra};
    /* ?loop 后缀 = 当动图循环播放（作者不用记 @motion 也行） */
    const LOOP_RE=/([?#&])loop(?:=1|=\d+)?(?=&|$)/i;
    const loop=LOOP_RE.test(inner);
    const src=inner.replace(LOOP_RE,"$1").replace(/[?#&]$/,"");
    let kind="";
    if(tag==="video"||tag==="audio"||tag==="motion"||tag==="loop"||tag==="gif")
      kind=(tag==="loop")?"motion":tag;
    else if(tag)return null;                      /* 不认识的 @标签：交回普通段落，别乱吃内容 */
    if(!kind){
      if(isVideoFile(src))kind=loop?"motion":"video";
      else if(isAudioFile(src))kind="audio";
      else if(isGifFile(src))kind="gif";
      else if(isAttachFile(src))kind="file";      /* 单独一行的说明书 / 压缩包 */
      else return null;                           /* 普通图片：走原来的图片逻辑 */
    }
    if(kind==="motion"&&isGifFile(src))kind="gif";   /* GIF 本身就是动的，不必套视频 */

      else{

      return `<img src="${esc(u)}" alt="${alt}"${tip?` title="${esc(tip)}"`:""} loading="lazy" decoding="async">`;
    });
    s=s.replace(/\[([^\]]+)\]\(((?:[^()]|\([^()]*\))+)\)/g,(m,txt,href)=>{
      const u=href.trim();
      /* 协议白名单：禁掉 javascript: / vbscript: / data: 等危险 scheme，防止文章里藏 XSS 链接 */
      if(/^(javascript|vbscript|data)\s*:/i.test(u))return txt;
      return `<a href="${u}" target="_blank" rel="noopener">${txt}</a>`;

       .replace(/\*([^*]+)\*/g,"<em>$1</em>");

      const c=codes[+i];
      return c===undefined?m:"<code>"+c+"</code>";
    });
    return s;
  };
  const lines=md.split(/\r?\n/),out=[];let i=0,hops=0;
  const BLOCK=/^(#{1,4})\s+|^```|^\s*>|^\s*[-*+]\s+|^\s*\d+[.)]\s+|^\s*(---+|\*\*\*+)\s*$|^\s*\||^@(?:video|motion|audio|gif|loop|link|embed|file|gallery)\s*[\[(]/i;

       「某个分支忘了 i++」把整页卡死——文章页卡死比排版错误严重得多 */
    if(++hops>lines.length*4+64)break;

    const tL=L.trim();

    const gm=L.match(/^\s*@gallery\[(.+)\]\s*$/i);
    if(gm){
      const items=gm[1].split(/[,，]/).map(x=>x.trim().replace(/^["']|["']$/g,"")).filter(Boolean);
      if(items.length){

          items.map(x=>{
            const hit=imgHit(x);

      if(rows.length>=2&&isSep(rows[1])){
        const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim());
        const head=cells(rows[0]);

          head.map((c,j)=>`<th${st(j)}>${inline(c)}</th>`).join("")+
          '</tr></thead><tbody>'+
          body.map(r=>"<tr>"+head.map((_,j)=>`<td${st(j)}>${inline(r[j]||"")}</td>`).join("")+"</tr>").join("")+
          '</tbody></table></div>');

    }
    /* 对齐段落：|l 文字 / |c 文字 / |r 文字（连续几行算一段） */
    const am=L.match(/^\|([lcr])\s+(.*)/);
    if(am){
      const buf=[am[2]];i++;
      while(i<lines.length&&!/^\s*$/.test(lines[i])&&!BLOCK.test(lines[i])){buf.push(lines[i]);i++;}
      out.push(`<p style="text-align:${ALIGN[am[1]]}">${inline(buf.join(" "))}</p>`);
      continue;
    }
    const h=L.match(/^(#{1,4})\s+(.*)/);
    if(h){const lv=h[1].length+1;out.push(`<h${lv}>${inline(h[2])}</h${lv}>`);i++;continue;}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(L)){out.push("<hr>");i++;continue;}
    if(/^\s*>\s?/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      /* GitHub 风格提示块：> [!TIP] 换行写内容 */
      const cm=buf.length?buf[0].trim().match(/^\[!(\w+)\]\s*$/):null;
      if(cm&&CALLOUT_META[cm[1].toLowerCase()]){
        const k=cm[1].toLowerCase(),meta=CALLOUT_META[k];
        const txt=buf.slice(1).join(" ").trim();
        out.push(`<div class="md-callout ${k}"><span class="mc-ico">${meta.icon}</span>`+
          `<div class="mc-body"><div class="mc-t">${lang==="zh"?meta.zh:meta.en}</div>`+
          `<p>${inline(txt)}</p></div></div>`);
        continue;
      }
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`);continue;
    }
    /* 任务清单：- [ ] / - [x]（必须排在普通无序列表之前判断） */
    if(/^\s*[-*+]\s+\[[ xX]\]\s+/.test(L)){
      const rows=[];
      while(i<lines.length&&/^\s*[-*+]\s+\[[ xX]\]\s+/.test(lines[i])){
        const m=lines[i].match(/^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/);
        rows.push({done:m[1].toLowerCase()==="x",text:m[2]});
        i++;
      }
      out.push('<ul class="md-task">'+rows.map(r=>
        `<li class="${r.done?"done":""}"><input type="checkbox"${r.done?" checked":""}><span>${inline(r.text)}</span></li>`).join("")+'</ul>');
      continue;
    }
    if(/^\s*[-*+]\s+/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){buf.push(lines[i].replace(/^\s*[-*+]\s+/,""));i++;}
      out.push(`<ul>${buf.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`);continue;
    }
    if(/^\s*\d+[.)]\s+/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){buf.push(lines[i].replace(/^\s*\d+[.)]\s+/,""));i++;}
      out.push(`<ol>${buf.map(x=>`<li>${inline(x)}</li>`).join("")}</ol>`);continue;
    }
    if(/^\s*$/.test(L)){i++;continue;}
    const buf=[];
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!BLOCK.test(lines[i])){buf.push(lines[i]);i++;}
    /* 兜底：这一行命中了「块起始」规则，却没有分支真正消费它（未闭合的 @link、
       孤立的 |、写错的 @gallery 等）。必须在这里吃掉它并前进，否则 i 永远不动，
       循环空转，整个页面直接卡死。 */
    if(!buf.length){buf.push(L);i++;}
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("");
}
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(d,short){
  const m=(d||"").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m)return d||"";
  const mo=+m[2],day=+m[3];
  if(!(mo>=1&&mo<=12)||!(day>=1&&day<=31))return d||"";   /* 日期写错就原样显示，别输出 undefined */
  return lang==="zh"
    ?(short?`${mo} 月 ${day} 日`:`${m[1]} 年 ${mo} 月 ${day} 日`)
    :(short?`${MONTHS[mo-1]} ${day}`:`${MONTHS[mo-1]} ${day}, ${m[1]}`);
}
function postSrc(p,f){ return /^(https?:|data:|\/)/.test(f)?f:((p&&p.imgBase)||"")+f; }
/* 由中文原文地址推出英文版地址：blog/x/index.md → blog/x/index.en.md */
function mdEnURL(u){
  if(!u||typeof u!=="string")return "";
  if(/\/index\.md$/i.test(u))return u.replace(/\/index\.md$/i,"/index.en.md");
  if(/\.md$/i.test(u))return u.replace(/\.md$/i,".en.md");
  return "";
}
/* 由英文原文地址推出中文版地址：blog/x/index.md → blog/x/index.zh.md
   （英文写的文章配套的静态中文版，约定同 index.en.md，有没有都行，没有就走机翻） */
function mdZhURL(u){
  if(!u||typeof u!=="string")return "";
  if(/\/index\.md$/i.test(u))return u.replace(/\/index\.md$/i,"/index.zh.md");
  if(/\.md$/i.test(u))return u.replace(/\.md$/i,".zh.md");
  return "";
}
/* 静态语言版的「语言体检」：文件存在 ≠ 内容是这个语言。
   自动翻译被限流时会写出「front matter 换了语言、正文还是原文」的半成品，
   这种文件必须当它不存在，否则界面永远显示另一种语言、也不再走兜底。
   want = 这份文件「应该」是什么语言：中文文件的中文占比要高，英文文件的几乎不能有中文 */
function altLangOk(text,want){
  /* want = 这份文件「应该」是什么语言，判据是「需要被翻掉的行」占了多少。
     半成品（front matter 换了语言、正文还是原文）的外来行占比接近 1，
     正常译文即使夹着术语也远低于 0.75 */
  return trShare(text,want==="zh"?"ezh":"zen")<0.75;
}
/* 正文本身就像访客要读的语言吗？
   中文界面看中文文章、英文界面看英文文章 —— 这种情况根本不存在「翻译」，
   不该去找静态度、更不该挂「正在翻译成…」。外来行不到一半就算「已经是这个语言」，
   留出余量给「中文段落里夹英文术语」和「整段英文引用」这类正常写法 */
function isLikelyLang(text,want){
  return trShare(text,want==="zh"?"ezh":"zen")<0.5;
}

/* 博客列表骨架屏：形状/尺寸与真实卡片一致（缩略图块、标签条、标题条、摘要条、日期条） */

/* ---------- 博客搜索 ---------- */
let blogPosts=[];        /* 最近一次加载的文章列表 */
let blogQuery="";        /* 搜索词：会话内保留，看完文章返回博客还在 */
function blogMatch(p,q){
  if(!q)return true;
  const tr=p._tr||{};   /* 译文（界面语言对应的翻译完成后挂上）：两种语言的关键词都能搜到 */
  const hay=((p.title||"")+" "+(p.desc||"")+" "+((p.tags||[]).join(" "))+" "+(p.slug||"")
    +" "+(p.titleEn||"")+" "+(p.descEn||"")+" "+((p.tagsEn||[]).join(" "))
    +" "+(p.titleZh||"")+" "+(p.descZh||"")+" "+((p.tagsZh||[]).join(" "))
    +" "+(tr.t||"")+" "+(tr.d||"")+" "+((tr.g||[]).join(" "))).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));

/* 转义后高亮：命中片段包 <mark>，不会引入 HTML 注入 */
function hiText(str,q){
  const s=esc(str||"");
  const words=(q||"").trim().split(/\s+/).filter(Boolean);
  if(!words.length)return s;
  const safe=words.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).filter(Boolean);
  if(!safe.length)return s;
  const pat=new RegExp("("+safe.join("|")+")","gi");
  /* 只在「非实体」片段里高亮：整串直接替换的话，搜 "amp" 会把 &amp; 拆成
     "&<mark>amp</mark>;"，页面就露出一个裸分号。 */
  return s.split(/(&[#a-zA-Z0-9]+;)/).map(part=>
    /^&[#a-zA-Z0-9]+;$/.test(part)?part:part.replace(pat,"<mark>$1</mark>")
  ).join("");
}
function blogListHTML(list,q,stagger){
  const t=T();
  if(!list.length)return `<div class="blog-empty">${esc(t.blog.noResult(q||""))}</div>`;
  let html="",lastYear="",i=0;
  list.forEach(p=>{
    const y=(p.date||"").slice(0,4)||"····";
    if(y!==lastYear){
      html+=`<div class="blog-year ${stagger?"rv":""}"${stagger?` style="animation-delay:${(i++)*60}ms"`:""}>${y}</div>`;
      lastYear=y;
    }
    const dly=stagger?` style="animation-delay:${(i++)*60}ms"`:"";
    /* 英文界面 + 有静态英文版 → 直接用英文标题/摘要/标签；
       中文界面 + 英文文章有静态中文版 → 同理，免得先闪原文再机翻 */
    const sm=lang==="en"
      ?{t:p.titleEn,d:p.descEn,g:p.tagsEn}
      :{t:p.titleZh,d:p.descZh,g:p.tagsZh};
    const useAlt=!!(sm.t||sm.d);
    const cTitle=useAlt&&sm.t?sm.t:(p.title||t.blog.untitled);
    const cDesc=useAlt&&sm.d?sm.d:(p.desc||"");
    const cTags=(useAlt&&(sm.g||[]).length)?sm.g:(p.tags||[]);

      ?`<video src="${esc(coverSrc+(coverSrc.indexOf("#")<0?"#t=0.1":""))}" preload="metadata" muted playsinline onerror="this.onerror=null;this.parentNode.innerHTML='🎬'"></video>`
      :(p.coverThumb||p.cover)
        ?`<img src="${esc(coverSrc)}" alt="" loading="lazy" decoding="async" onerror="this.onerror=null;this.parentNode.innerHTML='🖼️'">`
        :"🖼️";
    html+=`
    <a class="post-card ${stagger?"rv":"rvf"}"${dly} href="#/blog/${encodeURIComponent(p.slug)}" data-slug="${esc(p.slug)}">

      <span class="post-mid">
        <span class="post-tags">${cTags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</span>
        <span class="post-title">${hiText(cTitle,q)}</span>

      </span>
    </a>`;
  });

}

function bindBlogSearch(){

      const it=items[idx++]; act++;
      Promise.resolve().then(()=>fn(it)).catch(()=>{}).finally(()=>{act--;next();});

      .replace(/!\[[^\]]*\]\([^)\s]+[^)]*\)/g,m=>stash(m))               /* 图片原样保留 */
      .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,(m,txt,u)=>"["+txt+stash("]("+u+")")); /* 链接只翻文字 */
    if(!trNeed(work,dir))return line;                                    /* 摘完没有可翻内容（纯链接行等） */
