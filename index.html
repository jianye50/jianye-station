<!-- 默认文案兜底：profile.txt 里的站名/描述读到后会覆盖这些值；
     配置缺失或未到达时，标签页标题与 SEO/分享卡片也不会是空白 -->
<meta name="description" content="记录拍过的照片、写下的文字，以及正在做的小东西。Photos, words, and little things I build.">
<!-- 站名 / 描述 / 图标（favicon）都由 profile.txt 配置，JS 启动后填到这里 -->
<link rel="apple-touch-icon" href="icon.png">
<!-- 移动端地址栏配色（站点固定深色） -->
<meta name="theme-color" content="#0b0d12">
<!-- ============ 强制站点域名 ============
     访客用「不是正式域名」的地址打开时（比如 xxx.pages.dev、旧域名、备用 CDN 域名），
     自动跳到 profile.txt 里「域名」那一行配置的正式网址，保证大家都停在同一个地方。
       · 路径 / ?参数 / #锚点 全部原样带过去，hash 路由的页面不会丢；
       · 只比域名（忽略大小写与 www.），同域名绝不跳，不会死循环；
       · 用 replace 跳转，不会在浏览器后退历史里留下那个错误域名；
       · file:// 打开、localhost / 127.0.0.1 本地预览 一律不跳；
       · 地址后加 ?dev=1 或控制台执行 localStorage.setItem("jy-dev","1") 也不跳（站长自测用）；
       · profile.txt 读不到、或「域名」那行留空 / 删掉 → 功能整体关闭，绝不影响正常访问。
     这段放在 <head> 最前面执行，尽量在页面渲染前就跳走；顺手把这次 profile.txt
     请求存到 window.__JY_PROFILE_TEXT，主脚本直接复用，不会重复下载一次。 -->
<script>
(function(){
  var p;
  try{ p=fetch("profile.txt",{cache:"no-cache"}).then(function(r){ return r.ok?r.text():""; }); }
  catch(e){ return; }
  window.__JY_PROFILE_TEXT=p;      /* 主脚本 loadProfile() 复用这次请求 */

  /* 站长自测开关 / 本地环境：不跳 */
  var skip=false;
  try{
    if(/[?&]dev=1(?:&|$)/.test(location.search))skip=true;
    if(localStorage.getItem("jy-dev")==="1")skip=true;
  }catch(e){}
  if(location.protocol==="file:")skip=true;
  if(/^(localhost|127\.0\.0\.1|::1|0\.0\.0\.0)$/.test(String(location.hostname).toLowerCase()))skip=true;
  if(skip){ window.__JY_DOMAIN_CHECK=Promise.resolve("skip"); return; }

  /* 域名检测的结果承诺：主脚本揭幕前会等它 ——
     判定要跳转就既不渲染也不揭幕，加载屏原地留着，直接跳走，绝不让人先看到半成品首页 */
  window.__JY_DOMAIN_CHECK=p.then(function(t){
    if(!t||/^\s*</.test(t))return "ok";                  /* 读到的不是配置（404 兜底页等）→ 放弃 */
    var lines=String(t).split(/\r?\n/), target="", i;
    for(i=0;i<lines.length;i++){
      var line=lines[i].trim();
      if(!line||line.charAt(0)==="#")continue;
      var f=line.split("|"), k=(f[0]||"").trim().toLowerCase(), v=(f[1]||"").trim();
      if(!v)continue;
      if(k==="域名"||k==="主域名"||k==="站点地址"||k==="domain"||k==="siteurl"||k==="url"){ target=v; break; }
    }
    if(!target)return "ok";                              /* 没配置 → 不跳 */
    var u;
    try{ u=new URL(/^[a-z][a-z0-9+.\-]*:\/\//i.test(target)?target:"https://"+target); }
    catch(e){ return "ok"; }                             /* 配置写错 → 悄悄放弃，别把站点跳坏 */
    var want=u.hostname.toLowerCase().replace(/^www\./,""),
        now=String(location.hostname).toLowerCase().replace(/^www\./,"");
    if(!want||want===now)return "ok";                    /* 域名本来就对 → 不跳 */
    /* 配置写歪了（少点、有怪字符）就一律不跳，宁可不动也不能把人带到坏地址 */
    if(!/^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/.test(want))return "ok";
    var base=u.origin+(u.pathname&&u.pathname!=="/"?u.pathname.replace(/\/+$/,""):"");
    var path=location.pathname||"/";
    var dest=base+(path.charAt(0)==="/"?path:"/"+path)+(location.search||"")+(location.hash||"");
    /* 先打标记 → 主脚本看到就停止渲染/揭幕，加载屏保持转圈，然后立刻跳 */
    window.__JY_REDIRECTING=true;
    try{ location.replace(dest); }catch(e){ location.href=dest; }
    return "redirect";
  },function(){ return "ok"; });
})();
</script>

<!-- 语言：首次访问先按系统语言定好（中文→中文，其它语言→英文），
     免得英文用户先看到一闪而过的中文标题 / 语言标记。手动切换过的以本地保存为准。 -->
<script>
(function(){
  var s=null; try{ s=localStorage.getItem("jy-lang"); }catch(e){}
  if(s!=="zh"&&s!=="en"){
    var list=[], i;
    try{ list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""]; }
    catch(e){ list=[""]; }
    s="en";                                   /* 默认英文：非中文一律英文 */
    for(i=0;i<list.length;i++){
      var l=String(list[i]||"").replace(/_/g,"-").toLowerCase();
      if(l.indexOf("zh")===0){ s="zh"; break; }   /* zh / zh-CN / zh-TW / zh-HK… 都算中文 */
      if(l.indexOf("en")===0){ s="en"; break; }
    }
  }
  window.__JY_LANG=s;
  document.documentElement.lang=(s==="zh")?"zh-CN":"en";
  if(s!=="zh") document.title="Jianye's Corner";
})();
</script>
<!-- ============ 开发者工具拦截 ============
     先把话说清楚：浏览器端没有任何办法真正「禁止」打开开发者工具。
     F12 能被拦——那是网页的键盘事件；但浏览器菜单里那项「开发者工具」
     是浏览器自己的界面，网页碰不到，拦不了。所以思路改成「一开就发现」：
       1) 屏蔽 F12 / Ctrl+Shift+I·J·C·K / Ctrl+U·S 等快捷键与右键菜单；
       2) 静音 console，避免顺手翻看输出；
       3) 每 1.2 秒检测一次面板是否被打开 —— 停靠式量视口尺寸，
          浮动窗口用 debugger 探针，命中就盖遮罩挡住页面并要求关闭，
          关闭后自动恢复，不需要刷新。
     站长自己调试：地址后加 ?dev=1，或控制台执行 localStorage.setItem("jy-dev","1")。 -->
<script>
(function(){
  if(window.__JY_GUARD)return; window.__JY_GUARD=1;

  /* 站长调试开关：整体放行 */
  try{
    if(/[?&]dev=1(?:&|$)/.test(location.search))return;
    if(localStorage.getItem("jy-dev")==="1")return;
  }catch(e){}

  /* ---------- 1. 快捷键：F12 / 检查面板 / 查看源码 / 保存网页 ---------- */
  var INSPECT={73:1,74:1,67:1,75:1};                 /* I J C K */
  document.addEventListener("keydown",function(e){
    var k=e.keyCode||e.which||0;
    var mod=e.ctrlKey||e.metaKey;
    var hit=false;
    if(k===123)hit=true;                                       /* F12 */
    else if(mod&&e.shiftKey&&INSPECT[k])hit=true;               /* Ctrl/Cmd+Shift+I J C K */
    else if(mod&&e.altKey&&INSPECT[k])hit=true;                 /* macOS Cmd+Option+I J C */
    else if(mod&&!e.shiftKey&&!e.altKey&&(k===85||k===83))hit=true; /* Ctrl+U 源码 / Ctrl+S 保存 */
    if(hit){ e.preventDefault(); e.stopPropagation(); }
  },true);

  /* ---------- 2. 右键菜单：输入框、可编辑区域放行，别影响正常复制粘贴 ---------- */
  document.addEventListener("contextmenu",function(e){
    var t=e.target||{}, tag=(t.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||t.isContentEditable)return;
    e.preventDefault();
  },true);

  /* ---------- 3. 控制台静音 ---------- */
  try{
    var mute=function(){};
    ["log","info","warn","debug","table","dir","trace","clear"].forEach(function(m){
      try{ console[m]=mute; }catch(e){}
    });
  }catch(e){}

  /* ---------- 4. 屏蔽层：文案 + 遮罩 DOM ---------- */
  var TXT={
    zh:{title:"请先关闭开发者工具",
        desc:"检测到浏览器开发者工具处于打开状态。为保护站点内容，页面暂时不可用；关闭面板后会自动恢复。",
        hint:"内容受保护 · 请尊重原创"},
    en:{title:"Close DevTools to continue",
        desc:"Browser developer tools were detected. The page is paused to protect its content and will resume once the panel is closed.",
        hint:"Content protected"}
  };
  /* 语言跟随当前站点语言：<html lang> 会随右上角 EN/中 切换实时变化，
     而 window.__JY_LANG 只在首次加载时赋值，切换后不会更新，不能用它。 */
  function tx(){
    var l="";
    try{ l=document.documentElement.getAttribute("lang")||""; }catch(e){}
    if(!l)l=(window.__JY_LANG==="en")?"en":"zh-CN";
    return l.indexOf("zh")===0?TXT.zh:TXT.en;
  }

  function build(){
    if(box)return box;
    box=document.createElement("div");
    box.id="jy-guard";
    box.setAttribute("role","alertdialog");
    box.setAttribute("aria-live","assertive");
    box.innerHTML=
      '<div class="jg-card">'+
        '<span class="jg-lock" aria-hidden="true">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
            '<rect x="4" y="10.5" width="16" height="10.5" rx="2.4"/>'+
            '<path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/>'+
          '</svg>'+
        '</span>'+
        '<h2 class="jg-title"></h2>'+
        '<p class="jg-desc"></p>'+
        '<span class="jg-hint"></span>'+
      '</div>';
    (document.body||document.documentElement).appendChild(box);
    return box;
  }
  function paint(){
    if(!box)return;
    var t=tx();
    box.querySelector(".jg-title").textContent=t.title;
    box.querySelector(".jg-desc").textContent=t.desc;
    box.querySelector(".jg-hint").textContent=t.hint;
    box.setAttribute("aria-label",t.title);
  }
  function show(){
    if(!document.body)return;      /* 脚本在 head 里跑，body 还没出来时下一轮轮询再补 */
    on=true;
    build();
    paint();                       /* 先建后写，否则首次弹出是空标题 */
    box.classList.add("on");
    document.documentElement.classList.add("jy-guard-on");
  }
  function hide(){
    on=false;
    if(box)box.classList.remove("on");
    document.documentElement.classList.remove("jy-guard-on");
  }

  /* ---------- 4. 打开检测 ----------
     A. 停靠式面板：outer 与 inner 的尺寸差会突然变大，直接量出来；
     B. 浮动窗口 / 独立窗口：视口尺寸不变，量不出来，
        只能用 debugger 探针 —— 面板附着时 debugger 语句会让脚本停住
        （浏览器会在页面顶部提示「Script execution paused」），
        关掉面板后从那一行继续，耗时差就暴露了面板的存在。
        副作用是面板开着时页面会周期性卡住，这正是要的效果。 */
  var on=false, box=null, probing=false;

  function docked(){
    if(window.innerWidth<820)return false;          /* 窄屏设备基本打不开，跳过免得误判 */
    if(!window.outerWidth)return false;             /* headless / 沙箱环境 */
    return (window.outerWidth-window.innerWidth>160)||
           (window.outerHeight-window.innerHeight>160);
  }
  function probe(){
    if(probing)return false;
    probing=true;
    var t0=performance.now();
    debugger;                                       /* 面板开着 → 停在这里 */
    var dt=performance.now()-t0;
    probing=false;
    return dt>90;                                   /* 正常执行只要零点几毫秒 */
  }
  function watch(){
    if(!document.body)return;                       /* head 阶段还没 body，等下一轮 */
    if(document.hidden)return;                      /* 切到后台就别做探针了 */
    var hit=docked();
    if(!hit)hit=probe();
    if(hit&&!on)show();
    else if(!hit&&on)hide();
  }
  setInterval(watch,1200);
  window.addEventListener("resize",watch);
  document.addEventListener("DOMContentLoaded",watch);
  document.addEventListener("visibilitychange",watch);
  watch();

  /* 语言切换的实时跟进：<html lang> 一变就重写遮罩文案（若正显示着） */
  try{
    new MutationObserver(function(){ if(on)paint(); })
      .observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
  }catch(e){}
})();
</script>
<style>
/* ============ 开发者工具拦截遮罩（#jy-guard） ============ */
#jy-guard{
  position:fixed;inset:0;z-index:2147483647;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(6,8,13,.985);
  -webkit-backdrop-filter:blur(18px) saturate(120%);
  backdrop-filter:blur(18px) saturate(120%);
  opacity:0;visibility:hidden;
  transition:opacity .18s ease,visibility .18s;
  font-family:var(--font,system-ui,sans-serif);
}
#jy-guard.on{opacity:1;visibility:visible}
html.jy-guard-on,html.jy-guard-on body{overflow:hidden!important}
.jg-card{
  width:min(460px,100%);padding:34px 30px 28px;text-align:center;
  border-radius:var(--radius,20px);
  background:var(--card,#151923);
  border:1px solid var(--card-border,rgba(255,255,255,.08));
  box-shadow:var(--shadow-lg,0 24px 60px rgba(0,0,0,.55));
}
.jg-lock{
  width:54px;height:54px;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
  border-radius:16px;color:var(--accent,#4d8dff);
  background:var(--accent-soft,rgba(77,141,255,.14));
}
.jg-lock svg{width:26px;height:26px}
.jg-card h2{margin:0 0 10px;font-size:19px;font-weight:650;line-height:1.4;color:var(--text-1,#f4f5f7)}
.jg-card p{margin:0;font-size:13.5px;line-height:1.75;color:var(--text-2,rgba(244,245,247,.68))}
.jg-hint{
  display:block;margin-top:18px;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-3,rgba(244,245,247,.42));
}
</style>
<style>
/* ===================== 主题变量 =====================
   站点固定深色（<html data-theme="dark">），不再有浅色皮肤，
   所以这里只保留深色一套变量。 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
         "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;

  --bg:#0b0d12;
  --bg-2:#10131a;

  --text-2:rgba(244,245,247,.68);
  --text-3:rgba(244,245,247,.42);

  --glass-grad:linear-gradient(120deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.07) 38%,rgba(255,255,255,.12) 62%,rgba(255,255,255,.05) 100%);
  --glass-blur:blur(22px) saturate(200%) brightness(1.12);

}

/* ===================== 悬浮胶囊导航（Apple 液态玻璃） ===================== */
.nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:100;
  display:flex;align-items:center;gap:2px;
  height:48px;padding:0 10px 0 18px;
  border-radius:999px;
  white-space:nowrap;
  max-width:calc(100vw - 24px);
  isolation:isolate;
  /* 液态玻璃基体：高透 + 折射感模糊 + 提亮 */
  background:var(--glass-grad);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:none;
  /* 液态玻璃棱边：外圈微光 + 顶部受光高光 + 底部收光 + 落影 */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  transition:box-shadow .35s ease,transform .35s ease;
}
/* 斜向流光切面：一层扫过玻璃面的柔和高光 */
.nav::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  background:linear-gradient(
    105deg,
    rgba(255,255,255,.30) 0%,
    rgba(255,255,255,.06) 22%,
    transparent 46%,
    transparent 68%,
    rgba(255,255,255,.10) 100%);
  mix-blend-mode:screen;
  opacity:.8;
}
/* 玻璃厚度感：底部内侧一道暗折射 */
.nav::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  box-shadow:inset 0 -10px 14px -12px rgba(0,0,0,.35);
}
.nav>*{position:relative;z-index:1}

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.30),
    inset 0 1.5px .5px -1px rgba(255,255,255,.8),
    inset 0 -1px .5px -1px rgba(255,255,255,.34),
    inset 0 12px 18px -12px rgba(255,255,255,.38),

}
.nav-link:hover{color:var(--text-1);background:var(--chip)}
.nav-link.active{color:var(--accent);font-weight:600}
/* ---------- 「记录」下拉：鼠标悬浮或单击展开，展开 / 收起都带过渡 ---------- */
/* 拉伸到导航满高：面板的 top:100% 才是「导航底边」，间距不随文字高低变化 */
.nav-drop{position:relative;display:flex;align-items:center;align-self:stretch}
.nav-drop-btn{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:inherit;line-height:1;
}
/* 「记录」⇄「回到顶部」：往下翻页时这个入口形变成向上箭头，点击回顶后再变回文字。
   文字只淡出、箭头绝对定位，按钮宽度一点不变 —— 导航其余项不会跟着左右挪 */
.nav-drop-btn>[data-navlabel]{
  display:inline-block;
  transition:opacity .18s ease,transform .3s cubic-bezier(.3,.9,.35,1),filter .2s ease;
}
.nav-drop.to-top .nav-drop-btn>[data-navlabel]{
  opacity:0;filter:blur(2px);
  transform:translateY(-7px) scale(.78);
}
.nav-top-ico{
  position:absolute;left:50%;top:50%;
  width:17px;height:17px;
  opacity:0;pointer-events:none;color:inherit;
  /* 收起态：从下方偏转着缩着，展开时转正、放大、落到位 */
  transform:translate(-50%,-50%) translateY(8px) scale(.6) rotate(-40deg);
  transition:opacity .18s ease,transform .36s cubic-bezier(.22,1.2,.32,1);
}
.nav-top-ico svg{
  display:block;width:100%;height:100%;
  fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
}
.nav-drop.to-top .nav-top-ico{
  opacity:1;
  transform:translate(-50%,-50%) scale(1) rotate(0deg);
}
.nav-drop.to-top .nav-drop-btn:hover{color:var(--text-1);background:var(--chip)}
.nav-drop.to-top .nav-drop-btn:active .nav-top-ico{transform:translate(-50%,-50%) scale(.86)}
.nav-drop.open>.nav-drop-btn{color:var(--text-1);background:var(--chip)}
/* 触屏点按后别留一圈默认焦点框，键盘 Tab 过来才显示 */
.nav-drop-btn:focus{outline:none}
.nav-drop-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 面板：与导航条完全同一套液态玻璃材质（同底色、同模糊、同棱边、同流光）。
   脱离 <nav> 后是 position:fixed，left/top 由 JS 按按钮位置写入；
   层级压在导航条下面（nav 是 100），展开时像从条子底下钻出来 */
.nav-menu{
  --nav-gap:3px;                 /* 面板与导航底边的间距 */
  position:fixed;left:0;top:0;z-index:99;
  display:flex;align-items:center;gap:2px;
  padding:5px;
  border-radius:999px;
  isolation:isolate;
  /* 液态玻璃基体：与 .nav 完全一致，无额外暗底 */
  background:var(--glass-grad);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  /* 液态玻璃棱边：外圈微光 + 顶部受光高光 + 底部收光 + 落影 */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  /* 收起过程中仍可命中：鼠标在收回半途又探回来能立刻重新展开，
     真正的「不可点」由 visibility 在过渡结束时接管 */
  opacity:0;visibility:hidden;
  /* 收起态：压扁 + 缩窄 + 往上顶一点，大半藏在导航条背后，像被吸回条子里 */
  transform:translateX(-50%) translateY(-6px) scale(.78,.5);
  transform-origin:top center;
  transition:opacity .28s ease,transform .36s cubic-bezier(.4,0,.6,1),visibility 0s linear .36s;
}
/* 斜向流光切面：与导航同一道扫过玻璃面的高光 */
.nav-menu::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  background:linear-gradient(
    105deg,
    rgba(255,255,255,.30) 0%,
    rgba(255,255,255,.06) 22%,
    transparent 46%,
    transparent 68%,
    rgba(255,255,255,.10) 100%);
  mix-blend-mode:screen;
  opacity:.8;
}
/* 玻璃厚度感：底部内侧同样收一道暗折射 */
.nav-menu::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  box-shadow:inset 0 -10px 14px -12px rgba(0,0,0,.35);
}
.nav-menu>*{position:relative;z-index:1}
.nav-menu.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transform:translateX(-50%) translateY(0) scale(1,1);
  /* 展开比收起更慢一点：先快速显形，再带轻微回弹地落定（像从条子里脱出来）。
     visibility 用 0s 立刻可见（隐藏才延时到收起结束），
     否则键盘 ↓ 聚焦时面板还算「不可见」，focus() 会被忽略 */
  transition:opacity .16s ease-out,transform .42s cubic-bezier(.16,1.16,.3,1),visibility 0s;
}
.nav-menu-item{
  display:block;padding:8px 15px;border-radius:999px;
  font-size:13.5px;color:rgba(244,245,247,.88);white-space:nowrap;
  opacity:0;transform:translateY(-6px) scale(.92);
  transition:opacity .18s ease,transform .24s cubic-bezier(.2,.9,.3,1),color .18s ease,background .18s ease;
}
/* 逐项错峰浮现：等面板先脱出来，文字再依次亮起，收起时一起淡出 */
.nav-menu.open .nav-menu-item{opacity:1;transform:none}
.nav-menu.open .nav-menu-item:nth-of-type(1){transition-delay:.1s}
.nav-menu.open .nav-menu-item:nth-of-type(2){transition-delay:.16s}
.nav-menu-item:hover,.nav-menu-item:focus-visible{color:var(--text-1);background:var(--chip);outline:none}
.nav-menu-item.cur{color:var(--accent);font-weight:600}
/* 系统开了「减少动态效果」：去掉位移形变，只保留一段很短的淡入淡出（不要瞬间硬切） */
@media (prefers-reduced-motion:reduce){
  .nav-menu{transition:opacity .12s linear,visibility 0s linear .12s!important}
  .nav-menu.open{transition:opacity .12s linear,visibility 0s!important}
  .nav-menu-item{transition:opacity .12s linear!important;transform:none}
  .nav-menu.open .nav-menu-item{transition-delay:0s!important}
  /* 「记录」⇄ 箭头：只留淡入淡出，不做旋转与位移 */
  .nav-drop-btn>[data-navlabel],.nav-top-ico{transition:opacity .12s linear!important}
  .nav-drop.to-top .nav-drop-btn>[data-navlabel]{transform:none;filter:none}
  .nav-top-ico,.nav-drop.to-top .nav-top-ico,.nav-drop.to-top .nav-drop-btn:active .nav-top-ico{
    transform:translate(-50%,-50%)!important;
  }
}
.nav-sep{width:1px;height:20px;background:rgba(255,255,255,.22);margin:0 8px;box-shadow:1px 0 0 rgba(0,0,0,.10)}
.nav-icon{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-2);font-size:14px;
  transition:color .2s,background .2s,transform .3s;
}
.nav-icon:hover{color:var(--text-1);background:var(--chip)}
.nav-icon:active{transform:scale(.9)}
.nav-icon svg{width:17px;height:17px;fill:currentColor}
@media (max-width:640px){
  .nav{gap:0;padding:0 8px}
  .nav-brand{display:none}   /* 手机端站名不显示，占位也一并去掉，内容才能左右居中 */
  .nav-link{padding:7px 9px;font-size:13px}
  .nav-menu{padding:4px}
  .nav-menu-item{padding:7px 12px;font-size:13px}
}
/* ===================== 视图容器与动画 ===================== */
#app{min-height:100vh}
.view{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 18px}}

/* ===================== 首页 Hero ===================== */
.hero{
  position:relative;min-height:100vh;
  display:flex;align-items:center;
  background:var(--hero-fallback);
  overflow:hidden;
}
.hero-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
  animation:heroIn 1.6s cubic-bezier(.2,.7,.2,1) both;
}
/* 首屏背景：缓缓推近。起始透明度不能太低（原来是 .4）——
   揭幕那一刻如果背景从 40% 透明度开始，视觉上就是"暗一下再亮"的闪。.92 几乎看不出跳变 */
@keyframes heroIn{from{transform:scale(1.08);opacity:.92}to{transform:none;opacity:1}}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(8,12,24,.62) 0%,rgba(8,12,24,.34) 46%,rgba(8,12,24,.14) 100%),
             linear-gradient(to top,rgba(8,12,24,.42),transparent 36%);
}
.hero-inner{position:relative;z-index:2;animation:fadeUp .9s .15s cubic-bezier(.2,.7,.2,1) both}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 15px;border-radius:999px;
  /* 液态玻璃材质（同导航栏）：高透渐变 + 折射模糊 + 棱边高光 */
  background:var(--glass-grad);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:none;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  color:rgba(255,255,255,.92);
  font-size:12.5px;letter-spacing:.14em;font-weight:600;
}
.hero-badge .pulse{
  width:7px;height:7px;border-radius:50%;
  background:#35d07f;
  box-shadow:0 0 0 0 rgba(53,208,127,.5);
  animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(53,208,127,.5)}
  70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}
  100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}
}
.hero h1{
  margin:26px 0 18px;
  font-size:clamp(44px,7.5vw,84px);
  font-weight:800;letter-spacing:-.02em;color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.25);
}
.hero p{
  font-size:clamp(16px,2vw,19px);line-height:1.7;
  color:rgba(255,255,255,.86);max-width:480px;
  text-shadow:0 2px 14px rgba(0,0,0,.3);
}
.hero-actions{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;border-radius:12px;
  font-size:15px;font-weight:600;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
/* Gemini 同款彩虹光晕按钮：深色底 + 流动彩虹描边 + 彩虹外发光（形状不变） */
.btn-primary{
  position:relative;z-index:0;
  color:#fff;
  border:1.5px solid transparent;
  background:
    linear-gradient(#0b0f1a,#0b0f1a) padding-box,
    linear-gradient(115deg,#4d8dff,#b44dff,#ff5fa2,#ff8a3d,#ffd23f,#4d8dff) border-box;
  background-size:100% 100%,300% 100%;
  animation:rb-border 6s linear infinite;
}
@keyframes rb-border{
  from{background-position:0% 50%,0% 50%}
  to{background-position:0% 50%,300% 50%}
}
.btn-primary::before{
  content:"";position:absolute;inset:-3px;z-index:-1;
  border-radius:inherit;
  background:linear-gradient(115deg,#4d8dff,#b44dff,#ff5fa2,#ff8a3d,#ffd23f,#4d8dff);
  background-size:300% 100%;
  filter:blur(16px);opacity:.55;
  animation:rb-glow 6s linear infinite;
  transition:opacity .25s,filter .25s;
}
@keyframes rb-glow{
  from{background-position:0% 50%}
  to{background-position:300% 50%}
}
.btn-primary:hover{box-shadow:none}
.btn-primary:hover::before{opacity:.85;filter:blur(20px)}
.btn-ghost{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.24);
  color:#fff;backdrop-filter:blur(8px);
}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
/* 向下浏览提示：同一位置、同一点击区，按设备类型换形态
   · 电脑（有鼠标）→ 鼠标滚轮图形
   · 触屏（手机/平板）→ 向下滑动箭头（触屏用户没有滚轮，但同样需要知道可以往下翻） */
.scroll-hint{
  position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  z-index:5;cursor:pointer;display:none;place-items:center;
  color:#fff;text-align:center;
  /* 提示整体加一点投影，压过首屏的明暗渐变，任何背景上都清晰 */
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}
.sh-mouse{
  display:none;position:relative;
  width:26px;height:42px;
  border:2px solid rgba(255,255,255,.95);
  border-radius:999px;
  /* 玻璃质感填充：不透明白色衬底，深浅背景上都看得清 */
  background:rgba(255,255,255,.14);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.18),
    inset 0 8px 12px -6px rgba(255,255,255,.35);
}
.sh-mouse::before{
  content:"";position:absolute;left:50%;top:8px;
  width:4px;height:9px;margin-left:-2px;border-radius:99px;
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,.9);
  animation:wheel 1.8s ease-in-out infinite;
}
.sh-arrow{
  display:none;width:30px;height:30px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
  animation:shBob 1.8s ease-in-out infinite;
}
.sh-label{
  display:none;margin-top:2px;font-size:11.5px;letter-spacing:.08em;
  color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);
}
/* 电脑：能悬停 + 精确指针 */
@media (hover:hover) and (pointer:fine){
  .scroll-hint{display:grid}
  .sh-mouse{display:block}
}
/* 触屏：无悬停 或 粗指针 */
@media (hover:none),(pointer:coarse){
  .scroll-hint{display:grid}
  .sh-arrow,.sh-label{display:block}
}
@keyframes wheel{
  0%{transform:translateY(0);opacity:1}
  60%{transform:translateY(12px);opacity:0}
  100%{transform:translateY(0);opacity:0}
}
@keyframes shBob{
  0%,100%{transform:translateY(-3px);opacity:.65}
  50%{transform:translateY(5px);opacity:1}
}

/* ===================== 区块标题 ===================== */
.section{padding:64px 0 8px}
.section-label{
  display:flex;align-items:center;gap:14px;
  font-size:12.5px;font-weight:700;letter-spacing:.22em;
  color:var(--text-2);text-transform:uppercase;
  margin-bottom:22px;
}
.section-label::before{
  content:"";width:34px;height:2.5px;border-radius:99px;
  background:var(--accent);
}

/* ===================== 图库：照片墙 ===================== */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  padding:4px 0 10px;
}
@media (max-width:900px){.photo-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media (max-width:620px){.photo-grid{grid-template-columns:repeat(2,1fr);gap:10px}}

.ph-tile{
  position:relative;aspect-ratio:1;
  border-radius:16px;overflow:hidden;
  background:var(--img-placeholder);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
  cursor:zoom-in;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;
  /* 入场：按 --i 错峰淡入上浮（渲染时写入索引）。backwards 让延迟期间就停在起点，
     动画结束后交还给 :hover 的 transform，两者不打架 */
  animation:tileIn .42s cubic-bezier(.2,.7,.2,1) backwards;
  animation-delay:calc(var(--i,0) * 30ms);
}
@keyframes tileIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ph-tile{animation:none}}
.ph-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.ph-tile:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.ph-tile img{
  width:100%;height:100%;object-fit:cover;
  /* 底图是内联的 24px 模糊占位（photos.json 里的 blur），图片加载完就被盖住 */
  background-size:cover;background-position:center;
  transition:transform .6s cubic-bezier(.2,.7,.2,1);
}
.ph-tile:hover img{transform:scale(1.06)}
.ph-cap{
  position:absolute;left:10px;right:10px;bottom:9px;
  font-size:11.5px;font-weight:600;color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,.75);
  opacity:0;transform:translateY(5px);
  transition:opacity .25s,transform .25s;
  pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ph-tile:hover .ph-cap{opacity:1;transform:none}
.ph-tile::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(6,10,22,.5),transparent 46%);
  opacity:0;transition:opacity .25s;
}
.ph-tile:hover::after{opacity:1}
.ph-more{
  position:absolute;inset:0;z-index:2;
  display:grid;place-items:center;
  background:rgba(6,10,22,.52);
  backdrop-filter:blur(3px);
  color:#fff;font-size:20px;font-weight:750;letter-spacing:.02em;
}
.ph-skel{animation:skel 1.5s ease-in-out infinite;border-color:transparent}
@keyframes skel{0%,100%{opacity:.55}50%{opacity:.9}}
.ph-empty{
  grid-column:1/-1;
  padding:52px 24px;text-align:center;
  border:1px dashed var(--card-border);border-radius:var(--radius);
  background:var(--card);
  color:var(--text-2);font-size:14px;line-height:1.95;
}
.ph-empty b{color:var(--text-1);font-weight:700}
.ph-empty code{
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:.9em;background:var(--chip);padding:2px 7px;border-radius:6px;
}
.section-more{text-align:center;padding:16px 0 30px}
.link-more{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 26px;border-radius:999px;
  border:1px solid var(--card-border);background:var(--card);
  font-size:14px;font-weight:600;color:var(--text-1);
  box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,color .2s;
}
.link-more:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);color:var(--accent)}

/* ===================== 灯箱 ===================== */
.lightbox{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(3,7,20,.9);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  align-items:center;justify-content:center;
}
.lightbox.open{display:flex;animation:fadeIn .22s ease}
/* 关灯箱也走动画：.closing 挂着播完淡出再真正隐藏（见 closeLb 的 lbCloseTimer）。
   没有这一步的话，图片在眼前瞬间蒸发，观感像「闪退」 */
.lightbox.closing{display:flex;animation:lbFadeOut .18s ease both;pointer-events:none}
@keyframes lbFadeOut{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .lightbox.open,.lightbox.closing{animation:none}
}
/* 灯箱打开时锁住背景滚动 */
body.lb-lock{overflow:hidden}
.lightbox img{
  position:relative;z-index:1;   /* 图片必须显式压到按钮之下 */
  max-width:88vw;max-height:80vh;border-radius:16px;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  /* 注意：这里绝不能加动画 —— 切图时会先加 lb-ph（animation:none）再移除，
     animation 属性一变就会从头重播，fadeUp 的 opacity:0 起始帧会让画面闪黑一下。
     灯箱的入场淡入由 .lightbox.open 的 fadeIn 负责。 */
}
.lb-btn{
  position:absolute;z-index:2;width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.1);
  display:grid;place-items:center;color:#fff;
  transition:background .2s,transform .2s;
}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-btn:active{transform:scale(.92)}
.lb-btn svg{width:22px;height:22px}
/* 扩大箭头有效点击区：按钮外一圈 22px 的隐形热区，避免点偏误触背景关闭 */
.lb-btn::before{content:"";position:absolute;inset:-22px;border-radius:inherit}
.lb-prev{left:26px;top:50%;transform:translateY(-50%)}
.lb-next{right:26px;top:50%;transform:translateY(-50%)}
.lb-close{right:22px;top:22px}
/* :active 的 scale 不能覆盖 prev/next 的 translateY，否则按下瞬间按钮会跳位 */
.lb-prev:active{transform:translateY(-50%) scale(.92)}
.lb-next:active{transform:translateY(-50%) scale(.92)}
.lb-count{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  z-index:2;
  font-size:13px;color:rgba(255,255,255,.78);
  background:rgba(255,255,255,.1);padding:6px 14px;border-radius:999px;
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 切图时的「等待」态：模糊占位铺满占位框 + 中间转圈。
   目的：新图没解码完之前，画面上绝不会残留上一张，让人以为点错了。
   转圈延迟 150ms 才淡入 —— 命中缓存时不会闪一下白圈 */
.lightbox img.lb-ph{object-fit:cover;animation:none;filter:saturate(105%)}
/* 切图滑动过渡（stepLb 设方向后播一次）：下一张从右滑入（lb-in-r）/ 上一张从左滑入（lb-in-l）。
   注意：这两条必须放在上面 .lb-ph 规则之后 —— 切图时 img 同时带 lb-ph + lb-in-*，
   同优先级下后写的这里胜出，等摘掉 lb-ph 换清晰图时 animation 值不变、不会从头重播
   （否则又回到之前 fadeUp 那种闪黑问题）。首次打开灯箱不播滑入，由容器 fadeIn 负责。 */
@keyframes lbInL{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes lbInR{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
.lightbox img.lb-in-l,.lightbox video.lb-in-l{animation:lbInL .26s cubic-bezier(.2,.7,.2,1)}
.lightbox img.lb-in-r,.lightbox video.lb-in-r{animation:lbInR .26s cubic-bezier(.2,.7,.2,1)}
.lb-spin{
  position:absolute;z-index:2;pointer-events:none;
  width:36px;height:36px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.9);
  animation:lbSpin .8s linear infinite;
  opacity:0;transition:opacity .16s ease;
}
.lightbox.lb-busy .lb-spin{opacity:1;transition-delay:.15s}
@keyframes lbSpin{to{transform:rotate(360deg)}}
/* 放大查看：点图片在「适应屏幕」与「原始尺寸」之间切换。
   放大后容器变成可滚动，按钮固定在视口上，随时能关掉 / 翻页。 */
.lightbox img{cursor:zoom-in}
.lightbox.lb-zoom{display:block;overflow:auto;padding:26px;text-align:center}
.lightbox.lb-zoom img{
  max-width:none;max-height:none;width:auto!important;height:auto!important;
  margin:0;display:inline-block;cursor:zoom-out;animation:none;
}
.lightbox.lb-zoom .lb-btn,.lightbox.lb-zoom .lb-count{position:fixed}
.lightbox.lb-zoom .lb-spin{position:fixed;left:50%;top:50%;margin:-18px 0 0 -18px}
/* 只有一张时没有「上一张 / 下一张」可翻，箭头直接藏掉 */
.lightbox.lb-single .lb-prev,.lightbox.lb-single .lb-next{display:none}
@media (max-width:640px){
  .lb-prev{left:8px}.lb-next{right:8px}
  .lb-btn{width:42px;height:42px}
}
/* 系统开了「减少动态效果」时，切图滑入也一并关闭（回退为直接换图） */
@media (prefers-reduced-motion:reduce){
  .lightbox img.lb-in-l,.lightbox img.lb-in-r,
  .lightbox video.lb-in-l,.lightbox video.lb-in-r{animation:none}
}

/* ===================== 相册：子相册卡片 / 视频与 Live Photo ===================== */
/* 瓷砖里的视频：抓首帧当封面，铺满正方形 */
.ph-tile video{
  width:100%;height:100%;object-fit:cover;display:block;
  background:#000;
}
/* Live Photo：静态图上盖一层动态视频，悬停（电脑）时播放，平时只露静态图 */
.ph-tile .ph-live-v{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:none;pointer-events:none;background:#000;
}
.ph-tile:hover .ph-live-v{display:block}
/* 瓷砖角标：LIVE / 视频 */
.ph-badge{
  position:absolute;left:8px;top:8px;z-index:3;
  padding:3px 9px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#fff;
  background:rgba(8,12,24,.55);backdrop-filter:blur(6px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  pointer-events:none;
}
/* 子相册卡片网格 */
.album-label{
  display:flex;align-items:center;gap:14px;
  font-size:12.5px;font-weight:700;letter-spacing:.22em;
  color:var(--text-2);text-transform:uppercase;
  margin:6px 0 16px;
}
.album-label::before{
  content:"";width:34px;height:2.5px;border-radius:99px;
  background:var(--accent);
}
.album-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;margin-bottom:34px;
}
.al-card{
  position:relative;text-align:left;
  border-radius:16px;overflow:hidden;
  background:var(--card);border:1px solid var(--card-border);
  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s;
  /* 与照片磁贴同一套错峰入场，相册列表不再是「啪」地整片出现 */
  animation:tileIn .42s cubic-bezier(.2,.7,.2,1) backwards;
  animation-delay:calc(var(--i,0) * 30ms);
}
@media (prefers-reduced-motion:reduce){.al-card{animation:none}}
.al-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.al-card:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.al-cover{
  display:block;position:relative;aspect-ratio:4/3;
  background:var(--img-placeholder);
}
.al-cover img{width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center}
.al-cover video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.al-folder{display:grid;place-items:center;height:100%;font-size:34px}
.al-name{
  display:block;margin:10px 12px 0;
  font-size:14px;font-weight:700;color:var(--text-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.al-count{
  display:block;margin:3px 12px 12px;
  font-size:11.5px;color:var(--text-3);
}
/* 相册页里的返回按钮（进入子相册后出现） */
.al-back{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:16px;padding:8px 18px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--text-2);
  background:var(--card);border:1px solid var(--card-border);
  transition:color .2s,background .2s,transform .2s;
}
.al-back:hover{color:var(--accent);background:var(--accent-soft)}
.al-back:active{transform:scale(.96)}
/* 灯箱：视频与动态照片控制条（仿 Windows 照片的「动态 + 声音」胶囊） */
.lightbox video{
  position:relative;z-index:1;
  max-width:88vw;max-height:80vh;border-radius:16px;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  background:#000;
  /* 同 img：不加动画，避免切视频时 fadeUp 重播闪黑（入场由容器 fadeIn 负责） */
}
.lb-motion{
  position:absolute;left:22px;top:22px;z-index:2;
  display:flex;align-items:center;gap:2px;
  height:48px;padding:0 8px;border-radius:999px;   /* 与右上角 ✕ 同高同顶，保持同一平面 */
  /* 液态玻璃胶囊（同导航栏材质，统一走 --glass 变量） */
  background:var(--glass-grad),rgba(16,20,30,.35);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.55),
    0 4px 14px rgba(6,10,25,.30);
}
.lb-mbtn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:999px;
  font-size:13px;font-weight:650;color:#fff;
  transition:background .2s,color .2s;
}
.lb-mbtn:hover{background:rgba(255,255,255,.14)}
.lb-mbtn:active{transform:scale(.95)}
.lb-mbtn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb-mbtn.on{background:var(--accent-soft);color:var(--accent)}
.lb-mic{padding:7px 10px}
.lb-msep{width:1px;height:16px;background:rgba(255,255,255,.22);flex:none}
@media (max-width:640px){
  /* 手机端：动态控制条与右上角关闭按钮同高（42px）同顶对齐（12px 边距） */
  .lb-motion{left:12px;top:12px;height:42px}
  .lb-close{right:12px;top:12px}
}

/* ===================== 内页标题 ===================== */
.page-head{padding:130px 0 30px}
.page-head h1{
  font-size:clamp(44px,6vw,60px);font-weight:800;
  letter-spacing:-.02em;color:var(--accent);
}
.page-head .sub{margin-top:12px;color:var(--text-2);font-size:15px;line-height:1.7}

/* ===================== 关于页 ===================== */
.about-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:44px 42px;margin-bottom:26px;
}
.avatar{
  position:relative;overflow:hidden;
  width:84px;height:84px;border-radius:50%;
  display:grid;place-items:center;
  font-size:32px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),#7a3bff);
  box-shadow:0 12px 30px rgba(77,141,255,.35);
  margin-bottom:22px;
}
.avatar img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.about-card .tagline{font-size:14.5px;color:var(--text-3);margin:-8px 0 16px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 6px}
.chips span{
  font-size:13px;color:var(--text-2);
  border:1px solid var(--card-border);border-radius:999px;
  padding:5px 13px;background:var(--bg-2);
}
.socials{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.socials a{
  display:flex;align-items:center;gap:8px;
  padding:11px 14px;border-radius:12px;
  border:1px solid var(--card-border);background:var(--bg-2);
  font-size:13.5px;color:var(--text-2);font-weight:600;
  transition:transform .2s,box-shadow .2s,color .2s;
}
.socials a:hover{transform:translateY(-2px);box-shadow:var(--shadow);color:var(--text-1)}
.socials a .dot{width:8px;height:8px;border-radius:50%;flex:none}
/* Steam 游戏模块（关于页）：竖版海报卡片网格，数据来自站点根目录 steam.json（GitHub Actions 每 6 小时生成推送） */
.steam-link{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.steam-link:hover{text-decoration:underline}
.steam-refresh{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:28px;height:28px;border-radius:8px;margin-left:6px;
  border:1px solid var(--card-border);background:var(--bg-2);
  color:var(--text-2);cursor:pointer;padding:0;
  transition:color .2s,border-color .2s,box-shadow .2s;
}
.steam-refresh:hover{color:#66c0f4;border-color:rgba(102,192,244,.45);box-shadow:var(--shadow)}
.steam-refresh svg{width:14px;height:14px}
.steam-refresh.spinning svg{animation:steamSpin .8s linear infinite}
@keyframes steamSpin{to{transform:rotate(360deg)}}
.steam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:14px;margin-top:18px}
.steam-game{
  position:relative;overflow:hidden;display:block;
  aspect-ratio:2/3;border-radius:16px;
  border:1px solid var(--card-border);background:var(--bg-2);
  transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s;
}
.steam-game:hover{transform:translateY(-4px);border-color:rgba(102,192,244,.5);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.steam-game .steam-bg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .5s cubic-bezier(.2,.7,.2,1);
}
.steam-game:hover .steam-bg{transform:scale(1.06)}
.steam-game .steam-shade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,10,15,0) 42%,rgba(8,10,15,.55) 68%,rgba(8,10,15,.93) 100%);
}
.steam-info{position:absolute;left:0;right:0;bottom:0;padding:14px 15px}
.steam-info h4{
  font-size:14.5px;font-weight:700;color:#fff;margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 8px rgba(0,0,0,.6);transition:color .2s;
}
.steam-game:hover .steam-info h4{color:#66c0f4}
.steam-info p{font-size:12px;color:rgba(255,255,255,.78);line-height:1.55;margin:0 0 8px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.steam-ach{display:flex;align-items:center;gap:8px}
.steam-ach-bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.steam-ach-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4d8dff,#66c0f4)}
.steam-ach span{font-size:11px;color:rgba(255,255,255,.85);font-weight:600;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.steam-sec{
  display:flex;align-items:center;gap:9px;
  margin:22px 0 0;font-size:13px;font-weight:700;color:var(--text-2);letter-spacing:.03em;
}
.steam-sec::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--accent);opacity:.7}
.steam-sec:first-of-type{margin-top:0}
/* 好友：头像胶囊 + 状态点（灰=离线 绿=在线 蓝=游戏中） */
.steam-friends{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.steam-friend{
  display:flex;align-items:center;gap:9px;padding:7px 12px 7px 7px;
  border-radius:12px;border:1px solid var(--card-border);background:var(--bg-2);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.steam-friend:hover{transform:translateY(-2px);border-color:rgba(102,192,244,.45);box-shadow:var(--shadow)}
.steam-friend.sf-off{opacity:.62}
.sf-ava{position:relative;width:30px;height:30px;flex:none}
.sf-ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--card)}
.sf-dot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg-2)}
.sf-dot.on{background:#57cb76}
.sf-dot.play{background:#66c0f4}
.sf-dot.off{background:#5b6472}
.sf-info{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.sf-info b{
  font-size:12.5px;font-weight:600;color:var(--text-1);
  max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.steam-friend:hover .sf-info b{color:#66c0f4}
.sf-info small{
  font-size:10.5px;color:#66c0f4;
  max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 友情链接（关于页底部）：自适应网格，加新朋友改站点根目录的 friends.txt 即可 */
.friends-head{display:flex;align-items:center;gap:10px}
.friends-count{
  font-size:11.5px;font-weight:700;line-height:1;
  color:var(--accent);background:var(--accent-soft);
  padding:4px 9px;border-radius:999px;
}
.friend-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(226px,1fr));
  gap:11px;margin-top:16px;
}
.friend{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:13px;
  padding:13px 15px;border-radius:16px;
  border:1px solid var(--card-border);
  background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,0) 58%),var(--bg-2);
  transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s;
}
.friend::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130px 96px at 92% -18%,var(--accent-soft),transparent 72%);
  opacity:0;transition:opacity .3s;
}
.friend:hover{
  transform:translateY(-3px);
  border-color:rgba(77,141,255,.42);
  box-shadow:0 12px 30px rgba(0,0,0,.42);
}
.friend:hover::before{opacity:1}
.friend-logo{
  position:relative;overflow:hidden;flex:none;
  width:44px;height:44px;border-radius:13px;
  display:grid;place-items:center;
  font-size:18px;font-weight:800;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(140deg,var(--accent),#8b5cf6);
  box-shadow:0 6px 16px rgba(77,141,255,.25),inset 0 0 0 1px rgba(255,255,255,.16);
  transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s;
}
.friend-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.friend:hover .friend-logo{
  transform:scale(1.07) rotate(-3deg);
  box-shadow:0 10px 24px rgba(77,141,255,.4),inset 0 0 0 1px rgba(255,255,255,.22);
}
.friend-info{min-width:0;flex:1;padding-right:12px}
.friend .friend-info h4{
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .22s;
}
.friend .friend-info p{
  font-size:12.5px;color:var(--text-3);line-height:1.5;margin:3px 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .22s;
}
.friend:hover .friend-info h4{color:var(--accent)}
.friend:hover .friend-info p{color:var(--text-2)}
.friend-arrow{
  position:absolute;top:11px;right:11px;width:13px;height:13px;
  color:var(--accent);opacity:0;transform:translate(-4px,4px);
  transition:opacity .25s,transform .25s;
}
.friend:hover .friend-arrow{opacity:1;transform:none}
/* 最后一张「交换友链」申请卡 */
.friend-apply{border-style:dashed;background:none}
.friend-apply::before{display:none}
.friend-apply .friend-logo{
  background:var(--chip);color:var(--text-2);box-shadow:none;
}
.friend-apply:hover .friend-logo{
  background:var(--accent-soft);color:var(--accent);
  transform:scale(1.07);box-shadow:none;
}
.friend-apply:hover{border-color:rgba(77,141,255,.42);box-shadow:none}
.friend-apply:hover .friend-info h4{color:var(--accent)}
.friends-sub{margin:8px 0 0;font-size:13px;color:var(--text-3)}
/* 可折叠卡片（关于页：项目 / 友情链接 / 游戏）：点标题行整行收起或展开 */
.about-card.collapsible>.coll-head{
  display:flex;align-items:center;gap:10px;   /* flex 才能让箭头 margin-left:auto 顶到卡片最右侧 */
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.coll-chev{
  width:16px;height:16px;margin-left:auto;flex:none;color:var(--text-3);
  transition:transform .25s cubic-bezier(.2,.7,.2,1),color .2s;
}
.coll-head:hover .coll-chev{color:var(--text-2)}
.about-card.collapsed .coll-chev{transform:rotate(-90deg)}
/* 折叠动画：body 用 grid 行高 1fr ↔ 0fr 插值做平滑收展（不用 JS 量高度，
   里面图片加载多少都不影响）。收起时 visibility 延迟到动画结束再隐藏，
   展开时立刻可见 —— 既保证键盘焦点不会落进收起的内容里，又不吃掉入场动画 */
.about-card.collapsible>.coll-body{
  display:grid;grid-template-rows:1fr;overflow:hidden;
  visibility:visible;

.skl-beam::before{content:"";position:absolute;top:-15%;bottom:-15%;left:0;width:38%;
  background:linear-gradient(105deg,transparent 0%,rgba(122,162,255,.08) 28%,rgba(173,206,255,.22) 50%,rgba(122,162,255,.08) 72%,transparent 100%);

   animation 的 forwards 会一直压着 transform，把 .post-card:hover 的上浮整个吃掉 */

/* 加载屏还盖着的时候，首屏（背景图 + 文字）提前渲染好、按最终样子摆在那儿，

html:not(.jy-go) .hero-img,
html:not(.jy-go) .hero-inner{animation:none}

.hero.quiet .hero-inner{animation:none}
/* 盖住初始化期间的一切闪烁（导航语言未统一、首屏未渲染），

#boot{position:fixed;inset:0;z-index:9999;background:var(--bg);

<!-- ============ 启动加载屏（站点就绪后淡出） ============ -->
<div id="boot" aria-hidden="true">
  <div class="boot-inner">
    <span class="boot-dot"></span>
    <span class="boot-bar"><i></i></span>
  </div>
</div>
<script>
/* 兜底：主脚本出了意外（初始化卡死 / 脚本报错）时，启动屏也要能自己淡出，
   别让人对着黑屏。但不能太急 —— 加载屏的职责就是盖住「配置未到 / 背景未加载」
   的中间状态，主脚本会等 配置就绪 + 首屏渲染 + 背景大图加载完 才揭幕；
   只有主脚本 12 秒还没接管（window.__JY_READY 一直没出现）才在这里强行揭开。 */
(function(){
  var t0=Date.now();
  function tick(){
    var b=document.getElementById("boot");
    if(!b||window.__JY_READY)return;                 /* 已接管 / 已移除 */
    if(window.__JY_REDIRECTING)return;               /* 正在跳转到正式域名：加载屏留着，别揭开 */
    if(document.readyState!=="complete"&&Date.now()-t0<15000)return setTimeout(tick,300);
    if(Date.now()-t0<12000)return setTimeout(tick,300);
    document.documentElement.classList.add("jy-go"); /* 顺手放行首屏入场动画，别留着空画面 */
    b.classList.add("off");
  }
  setTimeout(tick,300);
})();
</script>

<script>
/* =====================================================================
 *  鉴业の小站（Jianye）
 *  单文件实现：hash 路由 / 明暗主题 / 中英切换 / 图库
 * ===================================================================== */

/* ---------- 项目：内容在站点根目录的 projects.txt 里配置 ----------
   每行一个项目，字段用 | 隔开，支持的字段见 projects.txt 顶部注释。
   这里不放任何项目数据，一切以 projects.txt 为准 —— 增删改项目只需改配置文件。
   配置读不到（file:// 本地双击打开 / 离线 / 忘了上传 / 删了文件）时，
   首页与关于页的项目板块整体隐藏，页面其余功能不受影响。
   注意：项目链接请用根相对路径（如 "/os"），换域名无需改配置 */
let PROJECTS=[];         /* 由 loadProjects() 从 projects.txt 读入 */
/* ---------- 个人信息：内容在站点根目录的 profile.txt 里配置 ----------
   每行一项，字段用 | 隔开，支持的字段见 profile.txt 顶部注释。
   这里不放任何个人信息，一切以 profile.txt 为准 —— 改信息只需改配置文件。
   配置读不到（file:// 本地双击打开 / 离线 / 忘了上传 / 删了文件）时，
   关于页的个人介绍卡整体隐藏，页面其余功能不受影响。 */
let PROFILE=null;        /* 由 loadProfile() 从 profile.txt 读入 */
let quietRender=false;   /* 配置晚到触发的「静默重绘」：不播首屏入场动画，避免又闪一下 */
let SITE={name:null,icon:"",bg:"",badge:null,desc:null,domain:""};   /* 站点级配置：站名/图标/背景/徽章/描述/域名 */

/* 解析 profile.txt 的行式配置（键名不区分大小写，中文英文键名都认） */
function parseProfileText(text){
  const out={hello:null,tagline:null,bios:[],avatar:"",email:"",chips:[],socials:[],
             name:null,icon:"",bg:"",badge:null,desc:null,domain:""};
  String(text||"").split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line||line.charAt(0)==="#")return;
    const p=line.split("|").map(s=>s.trim());
    const k=p[0].toLowerCase();
    if(k==="问候"||k==="hello"){ if(p[1]||p[2])out.hello={zh:p[1]||p[2],en:p[2]||p[1]}; }
    else if(k==="签名"||k==="tagline"){ if(p[1]||p[2])out.tagline={zh:p[1]||p[2],en:p[2]||p[1]}; }
    else if(k==="简介"||k==="bio"){ if(p[1]||p[2])out.bios.push({zh:p[1]||p[2],en:p[2]||p[1]}); }
    else if(k==="头像"||k==="avatar"){ if(p[1])out.avatar=p[1]; }
    else if(k==="邮箱"||k==="email"){ if(p[1])out.email=p[1]; }
    else if(k==="标签"||k==="chip"){ if(p[2])out.chips.push({i:p[1]||"",zh:p[2]||p[3]||"",en:p[3]||p[2]||""}); }
    else if(k==="社交"||k==="social"){ if(p[3])out.socials.push({zh:p[1]||p[2],en:p[2]||p[1],u:p[3],c:p[4]||"#8b949e"}); }
    else if(k==="站名"||k==="site"||k==="sitename"){ if(p[1]||p[2])out.name={zh:p[1]||p[2],en:p[2]||p[1]}; }
    else if(k==="图标"||k==="icon"||k==="favicon"){ if(p[1])out.icon=p[1]; }
    else if(k==="背景"||k==="bg"||k==="background"){ if(p[1])out.bg=p[1]; }
    else if(k==="徽章"||k==="badge"){ if(p[1]||p[2])out.badge={zh:p[1]||p[2],en:p[2]||p[1]}; }
    else if(k==="描述"||k==="desc"||k==="description"){ if(p[1]||p[2])out.desc={zh:p[1]||p[2],en:p[2]||p[1]}; }
    else if(k==="域名"||k==="主域名"||k==="站点地址"||k==="domain"||k==="siteurl"||k==="url"){ if(p[1])out.domain=p[1]; }
  });
  return out;
}
/* 站点级配置（站名/徽章/描述/图标/背景）回填到页面各处：
   站名进语言表后，浏览器标签页标题、导航品牌名、文章页标题等原有逻辑自动跟上 */
function applySiteConfig(){
  /* 已经判定要跳转到正式域名了 → 什么都别干：不渲染、不改标题，
     加载屏原地转圈，页面马上就走，用户不会看到半成品首页 */
  if(window.__JY_REDIRECTING)return;
  if(SITE.name){I18N.zh.brand=SITE.name.zh;I18N.en.brand=SITE.name.en;}
  if(SITE.badge){I18N.zh.hero.badge=SITE.badge.zh;I18N.en.hero.badge=SITE.badge.en;}
  if(SITE.desc){I18N.zh.hero.sub=SITE.desc.zh;I18N.en.hero.sub=SITE.desc.en;}
  /* 启动流程完成前不在这里触发渲染：启动流程会等配置到位后统一渲染一次，
     否则首页会被画两遍、背景图重新解码（闪两下）。
     启动流程已经揭幕后（配置晚到）→ 这里的重绘走静默模式，不重播入场动画 */
  if(window.__JY_STARTED){
    quietRender=true;
    try{ setLang(lang,false); } finally{ quietRender=false; }   /* 重铺标签标题 / 导航品牌名（不写盘） */
  }
  const brand=T().brand||"";
  /* 浏览器标签页图标（favicon）：删掉旧的再按配置插一张 */
  if(SITE.icon){
    document.querySelectorAll("link[rel='icon']").forEach(l=>l.remove());
    const l=document.createElement("link");
    l.rel="icon";
    if(/\.ico$/i.test(SITE.icon)){l.sizes="any";}else{l.type="image/png";}
    l.href=SITE.icon;
    document.head.appendChild(l);
    const at=document.querySelector("link[rel='apple-touch-icon']");
    if(at&&!/\.ico$/i.test(SITE.icon))at.href=SITE.icon;
  }
  /* meta 描述 / 分享卡片（og）：文案取纯文本，图片用背景图 */
  const plain=s=>String(s||"").replace(/<br\s*\/?>/gi," ").replace(/<[^>]+>/g,"").trim();
  const d=plain(lang==="zh"?(SITE.desc&&SITE.desc.zh):(SITE.desc&&SITE.desc.en));
  const md=document.querySelector("meta[name='description']");
  if(md)md.content=brand?(d?brand+" —— "+d:brand):d;
  const q=s=>document.querySelector(s);
  const ogs=q("meta[property='og:site_name']"),ogt=q("meta[property='og:title']"),
        ogd=q("meta[property='og:description']"),ogi=q("meta[property='og:image']");
  if(ogs)ogs.content=brand;
  if(ogt)ogt.content=brand;
  if(ogd)ogd.content=d;
  if(ogi&&SITE.bg)ogi.content=SITE.bg;
  /* 站点域名：canonical 与 og:url 跟着 profile.txt 的「域名」走（跳转本身在 <head> 里先做过） */
  if(SITE.domain){
    let origin="";
    try{
      const raw=/^[a-z][a-z0-9+.\-]*:\/\//i.test(SITE.domain)?SITE.domain:"https://"+SITE.domain;
      origin=new URL(raw).origin;
    }catch(e){}
    if(origin){
      const cn=document.querySelector("link[rel='canonical']");
      if(cn)cn.href=origin+"/";
      const ogu=document.querySelector("meta[property='og:url']");
      if(ogu)ogu.content=origin+"/";
    }
  }
}
/* 读取个人信息配置：no-cache 保证改完配置刷新立即生效（没更新时走 304，不重复下载）。
   文件读不到或整份是空的 → PROFILE 保持 null，关于页的个人介绍卡不渲染；
   404 兜底页可能是 200 的 HTML，一并排除 */
async function loadProfile(){
  let j=null;
  try{
    let text="";
    if(window.__JY_PROFILE_TEXT){
      /* <head> 里为了做域名跳转已经下过一次，这里直接复用，不重复请求 */
      text=(await window.__JY_PROFILE_TEXT)||"";
    }else{
      const r=await fetch("profile.txt",{cache:"no-cache"});
      if(r.ok)text=await r.text();
    }
    j=/^\s*</.test(String(text))?null:parseProfileText(text);
  }catch(e){}
  if(!j)return;
  const valid=j.hello||j.tagline||j.bios.length||j.avatar||j.email||j.chips.length||j.socials.length
             ||j.name||j.icon||j.bg||j.badge||j.desc||j.domain;
  if(!valid)return;
  PROFILE=j;
  /* 站点级字段单独存一份，回填到标题 / 图标 / meta / 首屏 */
  SITE={name:j.name,icon:j.icon,bg:j.bg,badge:j.badge,desc:j.desc,domain:j.domain||""};
  applySiteConfig();
  /* 配置到达时正停在首页 / 关于页 → 原地重绘（保住滚动位置，不打断浏览）。
     __JY_STARTED：启动流程自己会等本配置到位后再做第一次渲染，
     那之前不要抢着重绘 —— 否则首页会被画两遍，背景图跟着加载两遍（闪两下） */
  const h=location.hash;
  if(window.__JY_STARTED&&(/^#\/about/.test(h)||h===""||h==="#"||h==="#/")){
    const redraw=/^#\/about/.test(h)?renderAbout:renderHome;
    const root=document.documentElement,prev=root.style.scrollBehavior;
    root.style.scrollBehavior="auto";
    const y=window.scrollY;
    quietRender=true; try{ redraw(); } finally{ quietRender=false; }
    window.scrollTo(0,y);
    root.style.scrollBehavior=prev;
  }
}

/* 解析 projects.txt 的行式配置（图标、渐变色可省略，省略时用默认值） */
function parseProjectsText(text){
  const out=[];
  String(text||"").split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line||line.charAt(0)==="#")return;
    const p=line.split("|").map(s=>s.trim());
    if(!p[5])return;   /* 网址是必填项 */
    out.push({zh:p[1]||p[2],en:p[2]||p[1],
      dzh:p[3]||p[4]||"",den:p[4]||p[3]||"",u:p[5],
      ic:p[6]||"🧩",c:p[7]||"linear-gradient(135deg,#5b8cff,#3a4fd6)"});
  });
  return out;
}

/* ---------- 友情链接：内容在站点根目录的 friends.txt 里配置 ----------
   每行一位朋友，字段用 | 隔开，顺序固定：
     中文名|英文名|中文描述|英文描述|网址|图标地址
   图标一栏可省略；行首带 # 的是注释；「表单|网址」单独一行设置申请表单。
   加朋友直接另起一行保存即可，不用动本文件（名称/描述里别用 | 字符）。
   本文件里不放任何友链数据，一切以 friends.txt 为准 */
let FRIENDS=[];          /* 由 loadFriends() 从 friends.txt 读入 */
let FRIEND_FORM="";      /* 友链申请表单地址，来自 friends.txt 的「表单|网址」行 */
/* 解析 friends.txt 的行式配置 */
function parseFriendsText(text){
  const out={form:"",friends:[]};
  String(text||"").split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line||line.charAt(0)==="#")return;
    const p=line.split("|").map(s=>s.trim());
    if(/^(表单|form)$/i.test(p[0])){ if(p[1])out.form=p[1]; return; }
    if(p.length>=5&&p[4]){
      out.friends.push({zh:p[0]||p[1],en:p[1]||p[0],
        dzh:p[2]||p[3]||"",den:p[3]||p[2]||"",u:p[4],logo:p[5]||""});
    }
  });
  return (out.friends.length||out.form)?out:null;
}
/* 读取友链配置：no-cache 保证改完配置刷新立即生效（没更新时走 304，不重复下载）。
   配置读不到（file:// / 离线 / 忘了上传）时友链区保持隐藏，页面其余功能不受影响 */
async function loadFriends(){
  let j=null;
  try{
    const r=await fetch("friends.txt",{cache:"no-cache"});
    if(r.ok){
      const text=await r.text();
      j=/^\s*\{/.test(text)?null:parseFriendsText(text);
    }
  }catch(e){}
  if(!j)return;
  if(typeof j.form==="string"&&j.form)FRIEND_FORM=j.form;
  if(Array.isArray(j.friends)&&j.friends.length)FRIENDS=j.friends;
  /* 配置到达时正停在关于页 → 原地重绘友链区（保住滚动位置，不打断浏览；启动完成前不抢渲染） */
  if(window.__JY_STARTED&&/^#\/about/.test(location.hash)){
    const root=document.documentElement,prev=root.style.scrollBehavior;
    root.style.scrollBehavior="auto";
    const y=window.scrollY;
    renderAbout();
    window.scrollTo(0,y);
    root.style.scrollBehavior=prev;
  }
}

/* ---------- Steam 游戏模块：数据来自站点根目录的 steam.json ----------
   两条通道：
   · 部署环境优先走 /api/steam（Cloudflare Pages Function）：点模块里的手动刷新按钮时实时拉取，
     边缘缓存 5 分钟；Steam 接口不允许浏览器跨域直连，必须经自己的域名代理；
   · 实时接口不可用 / 本地 file:// 预览 → 退回静态 steam.json（GitHub Actions 每小时生成）。
   都读不到时整个模块隐藏，不影响其它区域 */
let STEAM=null;          /* 由 loadSteam() 读入 */
async function fetchSteam(){
  /* IS_LOCAL 在后面（博客区）才定义，这里调用时才求值；
     部署环境优先实时接口，失败逐级退回静态 steam.json（函数没部署/没配 Key 也不空） */
  const srcs=(typeof IS_LOCAL!=="undefined"&&IS_LOCAL)?["steam.json"]:["api/steam","steam.json"];
  for(const src of srcs){
    try{
      const r=await fetch(src,{cache:"no-cache"});
      if(!r.ok)continue;
      const ct=r.headers.get("content-type")||"";
      if(ct&&!ct.includes("json"))continue;   /* 404 兜底页可能是 200 的 HTML */
      const j=await r.json();
      if(j&&Array.isArray(j.recent)&&j.recent.length)return j;
    }catch(e){}
  }
  return null;
}
/* 数据到达时如正停在关于页 → 原地重绘游戏区（保住滚动位置，不打断浏览；启动完成前不抢渲染） */
function applySteam(j){
  STEAM=j;
  if(window.__JY_STARTED&&/^#\/about/.test(location.hash)){
    const root=document.documentElement,prev=root.style.scrollBehavior;
    root.style.scrollBehavior="auto";
    const y=window.scrollY;
    renderAbout();
    window.scrollTo(0,y);
    root.style.scrollBehavior=prev;
  }
}
async function loadSteam(){
  const j=await fetchSteam();
  if(j)applySteam(j);
}
/* 手动刷新按钮：点一下实时拉一次最新数据（接口侧有 5 分钟边缘缓存） */
async function manualSteamRefresh(btn){
  if(btn.dataset.busy)return;
  btn.dataset.busy="1";
  btn.classList.add("spinning");
  const j=await fetchSteam();
  btn.classList.remove("spinning");
  delete btn.dataset.busy;
  if(j){applySteam(j);return;}   /* 重绘后按钮是新的，无需复原状态 */
  const t=T();
  btn.title=t.about.steamRefreshFail||"";
  setTimeout(()=>{btn.title=t.about.steamRefresh;},2000);
}
/* Steam 模块的 HTML：最近玩过的游戏卡片（封面 / 时长 / 成就进度条） */
/* Steam 时长格式化：原始数据是浮点小时数（如 20.616666…），展示时保留一位小数、去掉多余的 .0 */
const fmtHours=h=>{
  const n=Number(h);
  if(!isFinite(n))return h;
  return String(Math.round(n*10)/10);
};
function steamModuleHTML(){

    const cover=g.cover||g.capsule||"";

      <button class="steam-refresh" type="button" title="${esc(t.about.steamRefresh)}" aria-label="${esc(t.about.steamRefresh)}" onclick="manualSteamRefresh(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
      ${COLL_CHEV}
    </div>
    <div class="coll-body">
    ${sub.length?`<p class="friends-sub">${esc(sub.join(" · "))}</p>`:""}
    ${s.recent.length?`

      ${s.recent.map(gameRow).join("")}
