<!-- 语言：首次访问先按系统语言定好（中文→中文，其它语言→英文），
     免得英文用户先看到一闪而过的中文标题 / 语言标记。手动切换过的以本地保存为准。 -->
<script>
(function(){
  var s=null; try{ s=localStorage.getItem("jy-lang"); }catch(e){}
  if(s!=="zh"&&s!=="en"){
    var list=[], i;
    try{ list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""]; }
    catch(e){ list=[""]; }
    s="en";                                   /* 默认英文：非中文一律英文 */
    for(i=0;i<list.length;i++){
      var l=String(list[i]||"").replace(/_/g,"-").toLowerCase();
      if(l.indexOf("zh")===0){ s="zh"; break; }   /* zh / zh-CN / zh-TW / zh-HK… 都算中文 */
      if(l.indexOf("en")===0){ s="en"; break; }
    }
  }
  window.__JY_LANG=s;
  document.documentElement.lang=(s==="zh")?"zh-CN":"en";
  if(s!=="zh") document.title="Jianye's Corner";
})();
</script>
<!-- ============ 开发者工具拦截 ============
     先把话说清楚：浏览器端没有任何办法真正「禁止」打开开发者工具。
     F12 能被拦——那是网页的键盘事件；但浏览器菜单里那项「开发者工具」
     是浏览器自己的界面，网页碰不到，拦不了。所以思路改成「一开就发现」：
       1) 屏蔽 F12 / Ctrl+Shift+I·J·C·K / Ctrl+U·S 等快捷键与右键菜单；
       2) 静音 console，避免顺手翻看输出；
       3) 每 1.2 秒检测一次面板是否被打开 —— 停靠式量视口尺寸，
          浮动窗口用 debugger 探针，命中就盖遮罩挡住页面并要求关闭，
          关闭后自动恢复，不需要刷新。
     站长自己调试：地址后加 ?dev=1，或控制台执行 localStorage.setItem("jy-dev","1")。 -->
<script>
(function(){
  if(window.__JY_GUARD)return; window.__JY_GUARD=1;

  /* 站长调试开关：整体放行 */
  try{
    if(/[?&]dev=1(?:&|$)/.test(location.search))return;
    if(localStorage.getItem("jy-dev")==="1")return;
  }catch(e){}

  /* ---------- 1. 快捷键：F12 / 检查面板 / 查看源码 / 保存网页 ---------- */
  var INSPECT={73:1,74:1,67:1,75:1};                 /* I J C K */
  document.addEventListener("keydown",function(e){
    var k=e.keyCode||e.which||0;
    var mod=e.ctrlKey||e.metaKey;
    var hit=false;
    if(k===123)hit=true;                                       /* F12 */
    else if(mod&&e.shiftKey&&INSPECT[k])hit=true;               /* Ctrl/Cmd+Shift+I J C K */
    else if(mod&&e.altKey&&INSPECT[k])hit=true;                 /* macOS Cmd+Option+I J C */
    else if(mod&&!e.shiftKey&&!e.altKey&&(k===85||k===83))hit=true; /* Ctrl+U 源码 / Ctrl+S 保存 */
    if(hit){ e.preventDefault(); e.stopPropagation(); }
  },true);

  /* ---------- 2. 右键菜单：输入框、可编辑区域放行，别影响正常复制粘贴 ---------- */
  document.addEventListener("contextmenu",function(e){
    var t=e.target||{}, tag=(t.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||t.isContentEditable)return;
    e.preventDefault();
  },true);

  /* ---------- 3. 控制台静音 ---------- */
  try{
    var mute=function(){};
    ["log","info","warn","debug","table","dir","trace","clear"].forEach(function(m){
      try{ console[m]=mute; }catch(e){}
    });
  }catch(e){}

  /* ---------- 4. 屏蔽层：文案 + 遮罩 DOM ---------- */
  var TXT={
    zh:{title:"请先关闭开发者工具",
        desc:"检测到浏览器开发者工具处于打开状态。为保护站点内容，页面暂时不可用；关闭面板后会自动恢复。",
        hint:"内容受保护 · 请尊重原创"},
    en:{title:"Close DevTools to continue",
        desc:"Browser developer tools were detected. The page is paused to protect its content and will resume once the panel is closed.",
        hint:"Content protected"}
  };
  /* 语言跟随当前站点语言：<html lang> 会随右上角 EN/中 切换实时变化，
     而 window.__JY_LANG 只在首次加载时赋值，切换后不会更新，不能用它。 */
  function tx(){
    var l="";
    try{ l=document.documentElement.getAttribute("lang")||""; }catch(e){}
    if(!l)l=(window.__JY_LANG==="en")?"en":"zh-CN";
    return l.indexOf("zh")===0?TXT.zh:TXT.en;
  }

  function build(){
    if(box)return box;
    box=document.createElement("div");
    box.id="jy-guard";
    box.setAttribute("role","alertdialog");
    box.setAttribute("aria-live","assertive");
    box.innerHTML=
      '<div class="jg-card">'+
        '<span class="jg-lock" aria-hidden="true">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
            '<rect x="4" y="10.5" width="16" height="10.5" rx="2.4"/>'+
            '<path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/>'+
          '</svg>'+
        '</span>'+
        '<h2 class="jg-title"></h2>'+
        '<p class="jg-desc"></p>'+
        '<span class="jg-hint"></span>'+
      '</div>';
    (document.body||document.documentElement).appendChild(box);
    return box;
  }
  function paint(){
    if(!box)return;
    var t=tx();
    box.querySelector(".jg-title").textContent=t.title;
    box.querySelector(".jg-desc").textContent=t.desc;
    box.querySelector(".jg-hint").textContent=t.hint;
    box.setAttribute("aria-label",t.title);
  }
  function show(){
    if(!document.body)return;      /* 脚本在 head 里跑，body 还没出来时下一轮轮询再补 */
    on=true;
    build();
    paint();                       /* 先建后写，否则首次弹出是空标题 */
    box.classList.add("on");
    document.documentElement.classList.add("jy-guard-on");
  }
  function hide(){
    on=false;
    if(box)box.classList.remove("on");
    document.documentElement.classList.remove("jy-guard-on");
  }

  /* ---------- 4. 打开检测 ----------
     A. 停靠式面板：outer 与 inner 的尺寸差会突然变大，直接量出来；
     B. 浮动窗口 / 独立窗口：视口尺寸不变，量不出来，
        只能用 debugger 探针 —— 面板附着时 debugger 语句会让脚本停住
        （浏览器会在页面顶部提示「Script execution paused」），
        关掉面板后从那一行继续，耗时差就暴露了面板的存在。
        副作用是面板开着时页面会周期性卡住，这正是要的效果。 */
  var on=false, box=null, probing=false;

  function docked(){
    if(window.innerWidth<820)return false;          /* 窄屏设备基本打不开，跳过免得误判 */
    if(!window.outerWidth)return false;             /* headless / 沙箱环境 */
    return (window.outerWidth-window.innerWidth>160)||
           (window.outerHeight-window.innerHeight>160);
  }
  function probe(){
    if(probing)return false;
    probing=true;
    var t0=performance.now();
    debugger;                                       /* 面板开着 → 停在这里 */
    var dt=performance.now()-t0;
    probing=false;
    return dt>90;                                   /* 正常执行只要零点几毫秒 */
  }
  function watch(){
    if(!document.body)return;                       /* head 阶段还没 body，等下一轮 */
    if(document.hidden)return;                      /* 切到后台就别做探针了 */
    var hit=docked();
    if(!hit)hit=probe();
    if(hit&&!on)show();
    else if(!hit&&on)hide();
  }
  setInterval(watch,1200);
  window.addEventListener("resize",watch);
  document.addEventListener("DOMContentLoaded",watch);
  document.addEventListener("visibilitychange",watch);
  watch();

  /* 语言切换的实时跟进：<html lang> 一变就重写遮罩文案（若正显示着） */
  try{
    new MutationObserver(function(){ if(on)paint(); })
      .observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
  }catch(e){}
})();
</script>
<style>
/* ============ 开发者工具拦截遮罩（#jy-guard） ============ */
#jy-guard{
  position:fixed;inset:0;z-index:2147483647;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(6,8,13,.985);
  -webkit-backdrop-filter:blur(18px) saturate(120%);
  backdrop-filter:blur(18px) saturate(120%);
  opacity:0;visibility:hidden;
  transition:opacity .18s ease,visibility .18s;
  font-family:var(--font,system-ui,sans-serif);
}
#jy-guard.on{opacity:1;visibility:visible}
html.jy-guard-on,html.jy-guard-on body{overflow:hidden!important}
.jg-card{
  width:min(460px,100%);padding:34px 30px 28px;text-align:center;
  border-radius:var(--radius,20px);
  background:var(--card,#151923);
  border:1px solid var(--card-border,rgba(255,255,255,.08));
  box-shadow:var(--shadow-lg,0 24px 60px rgba(0,0,0,.55));
}
.jg-lock{
  width:54px;height:54px;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
  border-radius:16px;color:var(--accent,#4d8dff);
  background:var(--accent-soft,rgba(77,141,255,.14));
}
.jg-lock svg{width:26px;height:26px}
.jg-card h2{margin:0 0 10px;font-size:19px;font-weight:650;line-height:1.4;color:var(--text-1,#f4f5f7)}
.jg-card p{margin:0;font-size:13.5px;line-height:1.75;color:var(--text-2,rgba(244,245,247,.68))}
.jg-hint{
  display:block;margin-top:18px;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-3,rgba(244,245,247,.42));
}
</style>
<style>
/* ===================== 主题变量 =====================
   站点固定深色（<html data-theme="dark">），不再有浅色皮肤，
   所以这里只保留深色一套变量。 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
         "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --maxw:1080px;
  --radius:20px;
  --accent:#4d8dff;
  --accent-soft:rgba(77,141,255,.14);
  --accent-2:#8fb8ff;                              /* 行内代码用的高亮蓝（post-body code） */
  --quote-bg:rgba(255,255,255,.05);                /* 文章引用块底色（post-body blockquote） */
  --bg:#0b0d12;
  --bg-2:#10131a;
  --text-1:#f4f5f7;
  --text-2:rgba(244,245,247,.68);
  --text-3:rgba(244,245,247,.42);
  --card:#151923;
  --card-border:rgba(255,255,255,.08);
  --chip:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --hero-fallback:linear-gradient(160deg,#10141d 0%,#1d2637 55%,#3a2e22 100%);
  --img-placeholder:linear-gradient(135deg,#232c3e,#39455e);
  /* 液态玻璃通用材质：导航 / hero 徽章 / 播放器面板 / 轻提示共用，改一处全局生效 */
  --glass-grad:linear-gradient(120deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.07) 38%,rgba(255,255,255,.12) 62%,rgba(255,255,255,.05) 100%);
  --glass-blur:blur(22px) saturate(200%) brightness(1.12);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text-1);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}

/* ===================== 悬浮胶囊导航（Apple 液态玻璃） ===================== */
.nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:100;
  display:flex;align-items:center;gap:2px;
  height:48px;padding:0 10px 0 18px;
  border-radius:999px;
  white-space:nowrap;
  max-width:calc(100vw - 24px);
  isolation:isolate;
  /* 液态玻璃基体：高透 + 折射感模糊 + 提亮 */
  background:var(--glass-grad);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:none;
  /* 液态玻璃棱边：外圈微光 + 顶部受光高光 + 底部收光 + 落影 */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  transition:box-shadow .35s ease,transform .35s ease;
}
/* 斜向流光切面：一层扫过玻璃面的柔和高光 */
.nav::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  background:linear-gradient(
    105deg,
    rgba(255,255,255,.30) 0%,
    rgba(255,255,255,.06) 22%,
    transparent 46%,
    transparent 68%,
    rgba(255,255,255,.10) 100%);
  mix-blend-mode:screen;
  opacity:.8;
}
/* 玻璃厚度感：底部内侧一道暗折射 */
.nav::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  box-shadow:inset 0 -10px 14px -12px rgba(0,0,0,.35);
}
.nav>*{position:relative;z-index:1}
.nav:hover{
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.30),
    inset 0 1.5px .5px -1px rgba(255,255,255,.8),
    inset 0 -1px .5px -1px rgba(255,255,255,.34),
    inset 0 12px 18px -12px rgba(255,255,255,.38),
    0 2px 8px rgba(6,10,25,.12),
    0 20px 48px rgba(6,10,25,.34);
}
.nav-brand{
  display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:15px;margin-right:14px;
}
.nav-brand .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.nav-link{
  padding:7px 13px;border-radius:999px;
  font-size:14px;color:var(--text-2);
  transition:color .2s,background .2s;
}
.nav-link:hover{color:var(--text-1);background:var(--chip)}
.nav-link.active{color:var(--accent);font-weight:600}
.nav-sep{width:1px;height:20px;background:rgba(255,255,255,.22);margin:0 8px;box-shadow:1px 0 0 rgba(0,0,0,.10)}
.nav-icon{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-2);font-size:14px;
  transition:color .2s,background .2s,transform .3s;
}
.nav-icon:hover{color:var(--text-1);background:var(--chip)}
.nav-icon:active{transform:scale(.9)}
.nav-icon svg{width:17px;height:17px;fill:currentColor}
@media (max-width:640px){
  .nav{gap:0;padding:0 8px}
  .nav-brand{display:none}   /* 手机端站名不显示，占位也一并去掉，内容才能左右居中 */
  .nav-link{padding:7px 9px;font-size:13px}
}
/* ===================== 视图容器与动画 ===================== */
#app{min-height:100vh}
.view{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 18px}}

/* ===================== 首页 Hero ===================== */
.hero{
  position:relative;min-height:100vh;
  display:flex;align-items:center;
  background:var(--hero-fallback);
  overflow:hidden;
}
.hero-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
  animation:heroIn 1.6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes heroIn{from{transform:scale(1.08);opacity:.4}to{transform:none;opacity:1}}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(8,12,24,.62) 0%,rgba(8,12,24,.34) 46%,rgba(8,12,24,.14) 100%),
             linear-gradient(to top,rgba(8,12,24,.42),transparent 36%);
}
.hero-inner{position:relative;z-index:2;animation:fadeUp .9s .15s cubic-bezier(.2,.7,.2,1) both}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 15px;border-radius:999px;
  /* 液态玻璃材质（同导航栏）：高透渐变 + 折射模糊 + 棱边高光 */
  background:var(--glass-grad);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:none;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  color:rgba(255,255,255,.92);
  font-size:12.5px;letter-spacing:.14em;font-weight:600;
}
.hero-badge .pulse{
  width:7px;height:7px;border-radius:50%;
  background:#35d07f;
  box-shadow:0 0 0 0 rgba(53,208,127,.5);
  animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(53,208,127,.5)}
  70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}
  100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}
}
.hero h1{
  margin:26px 0 18px;
  font-size:clamp(44px,7.5vw,84px);
  font-weight:800;letter-spacing:-.02em;color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.25);
}
.hero p{
  font-size:clamp(16px,2vw,19px);line-height:1.7;
  color:rgba(255,255,255,.86);max-width:480px;
  text-shadow:0 2px 14px rgba(0,0,0,.3);
}
.hero-actions{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;border-radius:12px;
  font-size:15px;font-weight:600;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
/* Gemini 同款彩虹光晕按钮：深色底 + 流动彩虹描边 + 彩虹外发光（形状不变） */
.btn-primary{
  position:relative;z-index:0;
  color:#fff;
  border:1.5px solid transparent;
  background:
    linear-gradient(#0b0f1a,#0b0f1a) padding-box,
    linear-gradient(115deg,#4d8dff,#b44dff,#ff5fa2,#ff8a3d,#ffd23f,#4d8dff) border-box;
  background-size:100% 100%,300% 100%;
  animation:rb-border 6s linear infinite;
}
@keyframes rb-border{
  from{background-position:0% 50%,0% 50%}
  to{background-position:0% 50%,300% 50%}
}
.btn-primary::before{
  content:"";position:absolute;inset:-3px;z-index:-1;
  border-radius:inherit;
  background:linear-gradient(115deg,#4d8dff,#b44dff,#ff5fa2,#ff8a3d,#ffd23f,#4d8dff);
  background-size:300% 100%;
  filter:blur(16px);opacity:.55;
  animation:rb-glow 6s linear infinite;
  transition:opacity .25s,filter .25s;
}
@keyframes rb-glow{
  from{background-position:0% 50%}
  to{background-position:300% 50%}
}
.btn-primary:hover{box-shadow:none}
.btn-primary:hover::before{opacity:.85;filter:blur(20px)}
.btn-ghost{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.24);
  color:#fff;backdrop-filter:blur(8px);
}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
/* 向下浏览提示：同一位置、同一点击区，按设备类型换形态
   · 电脑（有鼠标）→ 鼠标滚轮图形
   · 触屏（手机/平板）→ 向下滑动箭头（触屏用户没有滚轮，但同样需要知道可以往下翻） */
.scroll-hint{
  position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  z-index:5;cursor:pointer;display:none;place-items:center;
  color:#fff;text-align:center;
  /* 提示整体加一点投影，压过首屏的明暗渐变，任何背景上都清晰 */
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}
.sh-mouse{
  display:none;position:relative;
  width:26px;height:42px;
  border:2px solid rgba(255,255,255,.95);
  border-radius:999px;
  /* 玻璃质感填充：不透明白色衬底，深浅背景上都看得清 */
  background:rgba(255,255,255,.14);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.18),
    inset 0 8px 12px -6px rgba(255,255,255,.35);
}
.sh-mouse::before{
  content:"";position:absolute;left:50%;top:8px;
  width:4px;height:9px;margin-left:-2px;border-radius:99px;
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,.9);
  animation:wheel 1.8s ease-in-out infinite;
}
.sh-arrow{
  display:none;width:30px;height:30px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
  animation:shBob 1.8s ease-in-out infinite;
}
.sh-label{
  display:none;margin-top:2px;font-size:11.5px;letter-spacing:.08em;
  color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);
}
/* 电脑：能悬停 + 精确指针 */
@media (hover:hover) and (pointer:fine){
  .scroll-hint{display:grid}
  .sh-mouse{display:block}
}
/* 触屏：无悬停 或 粗指针 */
@media (hover:none),(pointer:coarse){
  .scroll-hint{display:grid}
  .sh-arrow,.sh-label{display:block}
}
@keyframes wheel{
  0%{transform:translateY(0);opacity:1}
  60%{transform:translateY(12px);opacity:0}
  100%{transform:translateY(0);opacity:0}
}
@keyframes shBob{
  0%,100%{transform:translateY(-3px);opacity:.65}
  50%{transform:translateY(5px);opacity:1}
}

/* ===================== 区块标题 ===================== */

.ph-tile{

.ph-tile img{

  /* 底图是内联的 24px 模糊占位（photos.json 里的 blur），图片加载完就被盖住 */
  background-size:cover;background-position:center;

}
.ph-tile:hover img{transform:scale(1.06)}
.ph-cap{

}

.ph-tile::after{

}
.ph-tile:hover::after{opacity:1}
.ph-more{

@keyframes skel{0%,100%{opacity:.55}50%{opacity:.9}}
.ph-empty{

#aboutProjects{scroll-margin-top:86px}   /* 「查看全部项目」锚点定位时给顶部悬浮导航留出空间 */
.link-more{

/* ===================== 灯箱 ===================== */
.lightbox{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(3,7,20,.9);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  align-items:center;justify-content:center;
}
.lightbox.open{display:flex;animation:fadeIn .22s ease}
/* 灯箱打开时锁住背景滚动 */
body.lb-lock{overflow:hidden}
.lightbox img{
  position:relative;z-index:1;   /* 图片必须显式压到按钮之下 */
  max-width:88vw;max-height:80vh;border-radius:16px;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  /* 注意：这里绝不能加动画 —— 切图时会先加 lb-ph（animation:none）再移除，
     animation 属性一变就会从头重播，fadeUp 的 opacity:0 起始帧会让画面闪黑一下。
     灯箱的入场淡入由 .lightbox.open 的 fadeIn 负责。 */
}
.lb-btn{
  position:absolute;z-index:2;width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.1);
  display:grid;place-items:center;color:#fff;
  transition:background .2s,transform .2s;
}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-btn:active{transform:scale(.92)}
.lb-btn svg{width:22px;height:22px}
/* 扩大箭头有效点击区：按钮外一圈 22px 的隐形热区，避免点偏误触背景关闭 */
.lb-btn::before{content:"";position:absolute;inset:-22px;border-radius:inherit}
.lb-prev{left:26px;top:50%;transform:translateY(-50%)}
.lb-next{right:26px;top:50%;transform:translateY(-50%)}
.lb-close{right:22px;top:22px}
/* :active 的 scale 不能覆盖 prev/next 的 translateY，否则按下瞬间按钮会跳位 */
.lb-prev:active{transform:translateY(-50%) scale(.92)}
.lb-next:active{transform:translateY(-50%) scale(.92)}
.lb-count{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  z-index:2;
  font-size:13px;color:rgba(255,255,255,.78);
  background:rgba(255,255,255,.1);padding:6px 14px;border-radius:999px;
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 切图时的「等待」态：模糊占位铺满占位框 + 中间转圈。
   目的：新图没解码完之前，画面上绝不会残留上一张，让人以为点错了。
   转圈延迟 150ms 才淡入 —— 命中缓存时不会闪一下白圈 */
.lightbox img.lb-ph{object-fit:cover;animation:none;filter:saturate(105%)}
/* 切图滑动过渡（stepLb 设方向后播一次）：下一张从右滑入（lb-in-r）/ 上一张从左滑入（lb-in-l）。
   注意：这两条必须放在上面 .lb-ph 规则之后 —— 切图时 img 同时带 lb-ph + lb-in-*，
   同优先级下后写的这里胜出，等摘掉 lb-ph 换清晰图时 animation 值不变、不会从头重播
   （否则又回到之前 fadeUp 那种闪黑问题）。首次打开灯箱不播滑入，由容器 fadeIn 负责。 */
@keyframes lbInL{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes lbInR{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
.lightbox img.lb-in-l,.lightbox video.lb-in-l{animation:lbInL .26s cubic-bezier(.2,.7,.2,1)}
.lightbox img.lb-in-r,.lightbox video.lb-in-r{animation:lbInR .26s cubic-bezier(.2,.7,.2,1)}
.lb-spin{
  position:absolute;z-index:2;pointer-events:none;
  width:36px;height:36px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.9);
  animation:lbSpin .8s linear infinite;
  opacity:0;transition:opacity .16s ease;
}
.lightbox.lb-busy .lb-spin{opacity:1;transition-delay:.15s}
@keyframes lbSpin{to{transform:rotate(360deg)}}
@media (max-width:640px){
  .lb-prev{left:8px}.lb-next{right:8px}
  .lb-btn{width:42px;height:42px}
}
/* 系统开了「减少动态效果」时，切图滑入也一并关闭（回退为直接换图） */
@media (prefers-reduced-motion:reduce){
  .lightbox img.lb-in-l,.lightbox img.lb-in-r,
  .lightbox video.lb-in-l,.lightbox video.lb-in-r{animation:none}
}

/* ===================== 相册：子相册卡片 / 视频与 Live Photo ===================== */

  width:100%;height:100%;object-fit:cover;display:block;

}

.ph-tile .ph-live-v{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:none;pointer-events:none;background:#000;
}
.ph-tile:hover .ph-live-v{display:block}
/* 瓷砖角标：LIVE / 视频 */
.ph-badge{
  position:absolute;left:8px;top:8px;z-index:3;
  padding:3px 9px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#fff;
  background:rgba(8,12,24,.55);backdrop-filter:blur(6px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);

}

}

}
.al-card{

  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s;
}
.al-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.al-card:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.al-cover{
  display:block;position:relative;aspect-ratio:4/3;
  background:var(--img-placeholder);
}
.al-cover img{width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center}
.al-cover video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.al-folder{display:grid;place-items:center;height:100%;font-size:34px}
.al-name{

  font-size:14px;font-weight:700;color:var(--text-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.al-count{
  display:block;margin:3px 12px 12px;
  font-size:11.5px;color:var(--text-3);
}
/* 相册页里的返回按钮（进入子相册后出现） */
.al-back{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:16px;padding:8px 18px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--text-2);
  background:var(--card);border:1px solid var(--card-border);
  transition:color .2s,background .2s,transform .2s;
}
.al-back:hover{color:var(--accent);background:var(--accent-soft)}
.al-back:active{transform:scale(.96)}
/* 灯箱：视频与动态照片控制条（仿 Windows 照片的「动态 + 声音」胶囊） */
.lightbox video{
  position:relative;z-index:1;
  max-width:88vw;max-height:80vh;border-radius:16px;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  background:#000;
  /* 同 img：不加动画，避免切视频时 fadeUp 重播闪黑（入场由容器 fadeIn 负责） */
}
.lb-motion{
  position:absolute;left:22px;top:22px;z-index:2;
  display:flex;align-items:center;gap:2px;
  height:48px;padding:0 8px;border-radius:999px;   /* 与右上角 ✕ 同高同顶，保持同一平面 */
  /* 液态玻璃胶囊（同导航栏材质，统一走 --glass 变量） */
  background:var(--glass-grad),rgba(16,20,30,.35);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.55),
    0 4px 14px rgba(6,10,25,.30);
}
.lb-mbtn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:999px;
  font-size:13px;font-weight:650;color:#fff;
  transition:background .2s,color .2s;
}
.lb-mbtn:hover{background:rgba(255,255,255,.14)}
.lb-mbtn:active{transform:scale(.95)}
.lb-mbtn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb-mbtn.on{background:var(--accent-soft);color:var(--accent)}
.lb-mic{padding:7px 10px}
.lb-msep{width:1px;height:16px;background:rgba(255,255,255,.22);flex:none}
@media (max-width:640px){
  /* 手机端：动态控制条与右上角关闭按钮同高（42px）同顶对齐（12px 边距） */
  .lb-motion{left:12px;top:12px;height:42px}

}

.about-card .tagline{font-size:14.5px;color:var(--text-3);margin:-8px 0 16px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 6px}

.steam-game{

.steam-game .steam-shade{

.steam-info h4{

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 8px rgba(0,0,0,.6);transition:color .2s;
}
.steam-game:hover .steam-info h4{color:#66c0f4}
.steam-info p{font-size:12px;color:rgba(255,255,255,.78);line-height:1.55;margin:0 0 8px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.steam-ach{display:flex;align-items:center;gap:8px}
.steam-ach-bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.steam-ach-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4d8dff,#66c0f4)}
.steam-ach span{font-size:11px;color:rgba(255,255,255,.85);font-weight:600;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.steam-sec{
  display:flex;align-items:center;gap:9px;
  margin:22px 0 0;font-size:13px;font-weight:700;color:var(--text-2);letter-spacing:.03em;
}
.steam-sec::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--accent);opacity:.7}
.steam-sec:first-of-type{margin-top:0}
/* 好友：头像胶囊 + 状态点（灰=离线 绿=在线 蓝=游戏中） */
.steam-friends{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.steam-friend{
  display:flex;align-items:center;gap:9px;padding:7px 12px 7px 7px;
  border-radius:12px;border:1px solid var(--card-border);background:var(--bg-2);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.steam-friend:hover{transform:translateY(-2px);border-color:rgba(102,192,244,.45);box-shadow:var(--shadow)}
.steam-friend.sf-off{opacity:.62}
.sf-ava{position:relative;width:30px;height:30px;flex:none}
.sf-ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--card)}
.sf-dot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg-2)}
.sf-dot.on{background:#57cb76}
.sf-dot.play{background:#66c0f4}
.sf-dot.off{background:#5b6472}
.sf-info{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.sf-info b{
  font-size:12.5px;font-weight:600;color:var(--text-1);
  max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.steam-friend:hover .sf-info b{color:#66c0f4}
.sf-info small{
  font-size:10.5px;color:#66c0f4;
  max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 友情链接（关于页底部）：自适应网格，加新朋友改站点根目录的 friends.txt 即可 */
.friends-head{display:flex;align-items:center;gap:10px}
.friends-count{
  font-size:11.5px;font-weight:700;line-height:1;
  color:var(--accent);background:var(--accent-soft);
  padding:4px 9px;border-radius:999px;
}
.friend-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(226px,1fr));
  gap:11px;margin-top:16px;
}
.friend{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:13px;
  padding:13px 15px;border-radius:16px;
  border:1px solid var(--card-border);
  background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,0) 58%),var(--bg-2);
  transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s;
}
.friend::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130px 96px at 92% -18%,var(--accent-soft),transparent 72%);
  opacity:0;transition:opacity .3s;
}
.friend:hover{
  transform:translateY(-3px);
  border-color:rgba(77,141,255,.42);
  box-shadow:0 12px 30px rgba(0,0,0,.42);
}
.friend:hover::before{opacity:1}
.friend-logo{
  position:relative;overflow:hidden;flex:none;
  width:44px;height:44px;border-radius:13px;
  display:grid;place-items:center;
  font-size:18px;font-weight:800;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(140deg,var(--accent),#8b5cf6);
  box-shadow:0 6px 16px rgba(77,141,255,.25),inset 0 0 0 1px rgba(255,255,255,.16);
  transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s;
}
.friend-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.friend:hover .friend-logo{
  transform:scale(1.07) rotate(-3deg);
  box-shadow:0 10px 24px rgba(77,141,255,.4),inset 0 0 0 1px rgba(255,255,255,.22);
}
.friend-info{min-width:0;flex:1;padding-right:12px}
.friend .friend-info h4{
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .22s;
}
.friend .friend-info p{
  font-size:12.5px;color:var(--text-3);line-height:1.5;margin:3px 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .22s;
}
.friend:hover .friend-info h4{color:var(--accent)}
.friend:hover .friend-info p{color:var(--text-2)}
.friend-arrow{
  position:absolute;top:11px;right:11px;width:13px;height:13px;
  color:var(--accent);opacity:0;transform:translate(-4px,4px);
  transition:opacity .25s,transform .25s;
}
.friend:hover .friend-arrow{opacity:1;transform:none}
/* 最后一张「交换友链」申请卡 */
.friend-apply{border-style:dashed;background:none}
.friend-apply::before{display:none}
.friend-apply .friend-logo{
  background:var(--chip);color:var(--text-2);box-shadow:none;
}
.friend-apply:hover .friend-logo{
  background:var(--accent-soft);color:var(--accent);
  transform:scale(1.07);box-shadow:none;
}
.friend-apply:hover{border-color:rgba(77,141,255,.42);box-shadow:none}
.friend-apply:hover .friend-info h4{color:var(--accent)}
.friends-sub{margin:8px 0 0;font-size:13px;color:var(--text-3)}
/* 可折叠卡片（关于页：项目 / 友情链接 / 游戏）：点标题行整行收起或展开 */
.about-card.collapsible>.coll-head{
  display:flex;align-items:center;gap:10px;   /* flex 才能让箭头 margin-left:auto 顶到卡片最右侧 */
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.coll-chev{
  width:16px;height:16px;margin-left:auto;flex:none;color:var(--text-3);
  transition:transform .25s cubic-bezier(.2,.7,.2,1),color .2s;
}
.coll-head:hover .coll-chev{color:var(--text-2)}
.about-card.collapsed .coll-chev{transform:rotate(-90deg)}
.about-card.collapsed>.coll-body{display:none}
/* 关于页手机端紧凑化：海报从“一行 1 张大图”改为“一行 3 张宫格”，全卡片收紧
   （放在本段基础样式之后，保证媒体查询里的覆盖不被层叠顺序吃掉） */
@media (max-width:640px){
  .about-card{padding:26px 16px;margin-bottom:16px;border-radius:18px}
  /* 模块标题行（GAMING · 44 · Open Steam profile → · 刷新）小屏允许换行，不再挤爆 */
  .friends-head{flex-wrap:wrap;row-gap:7px}
  .steam-refresh{margin-left:0}
  .steam-link{font-size:12px}
  /* 海报宫格：一行固定 3 张，间隙收小 */
  .steam-grid{grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
  .steam-game{border-radius:11px}
  .steam-game:hover{transform:none}           /* 触屏没有 hover，避免点击时残留上浮 */
  .steam-info{padding:8px 9px 7px}
  .steam-info h4{font-size:11.5px;margin-bottom:2px}
  .steam-info p{
    font-size:10px;margin-bottom:5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;  /* 时长信息单行截断，不再两行堆叠 */
  }
  .steam-ach{gap:5px}
  .steam-ach-bar{height:4px}
  .steam-ach span{font-size:9.5px}
  .steam-sec{margin-top:18px;font-size:12.5px}
  /* 好友胶囊收紧 */
  .steam-friends{gap:7px;margin-top:10px}
  .steam-friend{padding:5px 9px 5px 5px;border-radius:10px}
  .sf-ava{width:26px;height:26px}
  .sf-info b{font-size:11.5px;max-width:92px}
  .sf-info small{max-width:104px;font-size:9.5px}
  /* 友链卡片收紧 */
  .friend{padding:11px 12px;border-radius:13px}
  /* 项目卡片：一行 2 张小卡（原先 minmax(230px) 在手机上退化为一张占满一行） */
  .proj-grid{grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}
  .proj{padding:12px 12px 13px;border-radius:12px}
  .proj:hover{transform:none}
  .proj .ic{width:32px;height:32px;border-radius:9px;font-size:15px;margin-bottom:8px}
  .proj h4{font-size:13px;margin-bottom:3px}
  .proj p{
    font-size:11px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
}
/* ============ 博客（列表 + 文章） ============ */
.blog-year{display:flex;align-items:center;gap:14px;margin:28px 0 14px;color:var(--text-3);font-size:13px;font-weight:700;letter-spacing:.06em}
.blog-year::before{content:"";width:26px;height:2px;background:var(--accent);border-radius:2px}
.blog-year::after{content:"";flex:1;height:1px;background:var(--card-border)}
.blog-list{display:flex;flex-direction:column;gap:12px}
.post-card{
  display:flex;align-items:center;gap:16px;
  padding:14px 16px;border-radius:16px;
  border:1px solid var(--card-border);background:var(--bg-2);
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.post-card:hover{transform:translateY(-2px);border-color:rgba(77,141,255,.4);box-shadow:var(--shadow)}
.post-thumb{flex:none;width:104px;height:66px;border-radius:10px;overflow:hidden;background:var(--chip);display:grid;place-items:center;color:var(--text-3)}
.post-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.post-mid{min-width:0;flex:1}
.post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.post-title{display:block;font-size:16.5px;font-weight:750;color:var(--text-1);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.post-card:hover .post-title{color:var(--accent)}
.post-desc{display:block;font-size:13px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;color:var(--text-3);font-size:12px}
.post-side svg{width:16px;height:16px;opacity:.55;margin-top:2px}
.blog-empty{padding:60px 20px;text-align:center;color:var(--text-3);font-size:14px;line-height:2}
/* ---------- 博客骨架屏扫光（加载动画） ---------- */
#blogBody{position:relative}   /* 真实列表在骨架上层叠放淡入用 */
.skl-wrap{position:relative;overflow:hidden;transition:opacity .3s ease}
.skl-wrap.out{opacity:0;pointer-events:none}
.skl{background:var(--chip);border-radius:8px}
.skl-card{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:16px;
  border:1px solid var(--card-border);background:var(--bg-2)}
.skl-thumb{width:104px;height:66px;border-radius:10px;flex:none}          /* 与真实封面缩略图同尺寸 */
.skl-mid{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.skl-pill{height:18px;border-radius:999px;width:40%}                      /* 标签条 */
.skl-title{height:16px;border-radius:7px}                                 /* 标题条 */
.skl-desc{height:11px;border-radius:6px}                                  /* 摘要条 */
.skl-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.skl-meta{height:10px;border-radius:5px}                                  /* 日期/时长条 */
.skl-year{width:130px;height:15px;margin:10px 0 4px}                      /* 年份条 */
/* 所有骨架共用的一道斜向光带，1.5s 从左往右扫过 */
.skl-beam{position:absolute;inset:0;pointer-events:none}
.skl-beam::before{content:"";position:absolute;top:-15%;bottom:-15%;left:0;width:38%;
  background:linear-gradient(105deg,transparent 0%,rgba(122,162,255,.08) 28%,rgba(173,206,255,.22) 50%,rgba(122,162,255,.08) 72%,transparent 100%);
  transform:translateX(-140%);animation:skl-sweep 1.5s ease-in-out infinite}
@keyframes skl-sweep{to{transform:translateX(420%)}}
/* 数据到达：卡片按顺序错开 60ms 依次浮现（淡入 + 上移 8px 归位）
   填充模式必须是 backwards（只在延迟期间保持起始态），不能用 both ——
   animation 的 forwards 会一直压着 transform，把 .post-card:hover 的上浮整个吃掉 */
.rv{animation:card-in .5s cubic-bezier(.22,.61,.36,1) backwards}
@keyframes card-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  .skl-beam::before{animation:none}
  .rv{animation:none}
  .btn-primary,.btn-primary::before{animation:none}
}
/* ---------- 博客搜索框 ---------- */
.blog-search{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.bs-box{position:relative;flex:1;max-width:460px}
.bs-box>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--text-3);pointer-events:none;transition:color .2s}
.bs-box:focus-within>svg{color:var(--accent)}
#blogSearch{width:100%;padding:11px 40px;border-radius:12px;
  border:1px solid var(--card-border);background:var(--bg-2);
  color:var(--text-1);font-size:14px;font-family:inherit;outline:none;
  transition:border-color .2s,box-shadow .2s}
#blogSearch::placeholder{color:var(--text-3)}
#blogSearch:focus{border-color:rgba(77,141,255,.55);box-shadow:0 0 0 3px var(--accent-soft)}
#blogSearch::-webkit-search-cancel-button,#blogSearch::-webkit-search-decoration{-webkit-appearance:none;display:none}
#blogSearchClear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;padding:0;border:none;border-radius:50%;
  background:var(--chip);color:var(--text-2);cursor:pointer;
  display:none;place-items:center;font-size:12px;line-height:1;transition:background .2s,color .2s}
#blogSearchClear:hover{background:var(--accent-soft);color:var(--accent)}
#blogSearchClear.on{display:grid}
.bs-count{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.bs-kbd{flex:none;margin-left:auto;font-size:11.5px;color:var(--text-3);border:1px solid var(--card-border);
  border-radius:6px;padding:2px 7px;line-height:1.5;user-select:none}
mark{background:rgba(77,141,255,.30);color:var(--text-1);border-radius:3px;padding:0 1px}
.rvf{animation:card-in .2s ease backwards}   /* 筛选重绘：快速淡入，不做错峰 */
@media (max-width:560px){.bs-kbd{display:none}.blog-search{gap:8px}}
/* 文章页 */
.post-hero{position:relative;height:min(46vh,380px);background:var(--hero-fallback);overflow:hidden}
.post-hero img.post-bg{width:100%;height:100%;object-fit:cover;display:block}
.post-hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,13,18,.22) 0%,rgba(11,13,18,0) 42%,var(--bg) 100%)}
.post-back{display:inline-flex;align-items:center;gap:6px;margin:26px 0 6px;
  color:var(--text-3);font-size:13.5px;font-weight:600;transition:color .2s}
.post-back:hover{color:var(--accent)}
.post-back svg{width:15px;height:15px}
.post-head{max-width:760px;margin:0 auto 6px}
.post-head .post-tags{margin-bottom:10px}
.post-head h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:0 0 10px}
.post-head .post-sub{font-size:15px;color:var(--text-2);line-height:1.7;margin:0 0 12px}
.post-meta{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:13px;padding-bottom:18px;border-bottom:1px solid var(--card-border)}
/* 文章自动翻译：进行中提示 + 完成后的「机器翻译」标记 */
.tr-note{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12.5px}
.tr-spin{width:11px;height:11px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent);animation:trspin .8s linear infinite;flex:none}
@keyframes trspin{to{transform:rotate(360deg)}}
.tr-mt{font-size:12px;color:var(--text-3);border:1px solid var(--card-border);border-radius:999px;padding:1px 8px}
/* 翻译失败时给一个可点的「重试」——网络抖一下不必刷新整页 */
.tr-retry{font:inherit;font-size:12px;color:var(--text-2);background:none;border:1px solid var(--card-border);
  border-radius:999px;padding:1px 8px;cursor:pointer;transition:color .2s,border-color .2s}
.tr-retry:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
@media (prefers-reduced-motion:reduce){.tr-spin{animation:none}}
.post-body{max-width:760px;margin:0 auto;padding-top:8px;font-size:15.5px;line-height:1.95;color:var(--text-2)}
.post-body h2{font-size:22px;color:var(--text-1);margin:34px 0 12px;letter-spacing:-.01em}
.post-body h3{font-size:18.5px;color:var(--text-1);margin:28px 0 10px}
.post-body h4,.post-body h5{font-size:16px;color:var(--text-1);margin:22px 0 8px}
.post-body p{margin:0 0 16px}
.post-body a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.post-body img{max-width:100%;border-radius:14px;display:block;margin:18px auto;border:1px solid var(--card-border)}
.post-body blockquote{margin:18px 0;padding:12px 18px;border-left:3px solid var(--accent);
  background:var(--quote-bg);border-radius:0 12px 12px 0;color:var(--text-1)}
.post-body pre{background:#0d1017;border:1px solid var(--card-border);border-radius:14px;padding:16px 18px;overflow-x:auto;margin:18px 0}
.post-body code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;
  background:var(--chip);padding:2px 6px;border-radius:6px;color:var(--accent-2)}
.post-body pre code{background:none;padding:0;color:#cfe3ff;font-size:13px;line-height:1.7}
.post-body hr{border:none;border-top:1px solid var(--card-border);margin:26px auto;width:60%}
.post-body ul,.post-body ol{margin:0 0 16px;padding-left:24px}
/* 表格：横向可滚动，窄屏不撑破正文 */
.post-body .md-table{margin:20px 0;overflow-x:auto;border:1px solid var(--card-border);border-radius:14px}
.post-body table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.7}
.post-body th,.post-body td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--card-border);vertical-align:top}
.post-body thead th{color:var(--text-1);font-weight:600;background:var(--chip);white-space:nowrap}
.post-body tbody tr:last-child td{border-bottom:none}
.post-body li{margin-bottom:6px}
.post-end{display:flex;align-items:center;gap:14px;margin:44px auto 0;max-width:760px;color:var(--text-3);font-size:12.5px}
.post-end::before,.post-end::after{content:"";flex:1;height:1px;background:var(--card-border)}
.mail-line{margin-top:18px}
.about-card h2{font-size:26px;font-weight:780;margin-bottom:14px;letter-spacing:-.01em}
.about-card p{color:var(--text-2);line-height:1.9;font-size:15.5px;margin-bottom:12px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:26px}
.proj{
  display:block;padding:22px;border-radius:16px;
  border:1px solid var(--card-border);background:var(--bg-2);
  transition:transform .25s,box-shadow .25s;
}
.proj:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.proj .ic{
  width:42px;height:42px;border-radius:12px;margin-bottom:14px;
  display:grid;place-items:center;font-size:19px;color:#fff;
}
.proj h4{font-size:15.5px;font-weight:700;margin-bottom:6px}
.proj p{font-size:13px;color:var(--text-2);line-height:1.65;margin:0}
.read-more{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--accent);font-weight:650;font-size:14px;
}

/* ===================== 页脚 ===================== */
footer{
  border-top:1px solid var(--card-border);
  padding:34px 0 42px;margin-top:30px;
  text-align:center;color:var(--text-3);font-size:13.5px;

<!-- ============ 启动加载屏（站点就绪后淡出） ============ -->
<div id="boot" aria-hidden="true">

    <span class="boot-bar"><i></i></span>
  </div>
</div>
<script>
/* 兜底：初始化意外变慢时，启动屏也要能自己淡出，别让人对着黑屏。
   但不能太急 —— 主脚本在 body 末尾，慢网下 HTML 还没下载完它就不会执行，
   这时若把启动屏撤了，#app 里那份「静态 SEO 兜底首屏」就会裸露出来，
   看起来像打开了另一个网站。所以：等页面真正加载完（或最多 15 秒）再揭幕，
   并且主脚本一旦接管（window.__JY_READY）就立刻让位。 */
(function(){
  var t0=Date.now();
  function tick(){
    var b=document.getElementById("boot");
    if(!b||window.__JY_READY)return;                 /* 已接管 / 已移除 */
    var waited=Date.now()-t0;
    if(document.readyState!=="complete"&&waited<15000)return setTimeout(tick,300);
    if(waited<5000)return setTimeout(tick,300);
    b.classList.add("off");
  }
  setTimeout(tick,300);
})();
</script>

<script>
/* =====================================================================

/* ---------- 数据：项目 ---------- */

const PROJECTS=[

   u:"/blog/index.html",ic:"📝",c:"linear-gradient(135deg,#66c0f4,#2b6cb0)"}
];
/* ---------- 个人信息：内容在站点根目录的 profile.txt 里配置 ----------
   每行一项，字段用 | 隔开，支持的字段见 profile.txt 顶部注释。
   这里不放任何个人信息，一切以 profile.txt 为准 —— 改信息只需改配置文件。
   配置读不到（file:// 本地双击打开 / 离线 / 忘了上传 / 删了文件）时，
   关于页的个人介绍卡整体隐藏，页面其余功能不受影响。 */
let PROFILE=null;        /* 由 loadProfile() 从 profile.txt 读入 */

/* 解析 profile.txt 的行式配置（键名不区分大小写，中文英文键名都认） */
function parseProfileText(text){
  const out={hello:null,tagline:null,bios:[],avatar:"",email:"",chips:[],socials:[]};
  String(text||"").split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line||line.charAt(0)==="#")return;
    const p=line.split("|").map(s=>s.trim());
    const k=p[0].toLowerCase();
    if(k==="问候"||k==="hello"){ if(p[1]||p[2])out.hello={zh:p[1]||p[2],en:p[2]||p[1]}; }
    else if(k==="签名"||k==="tagline"){ if(p[1]||p[2])out.tagline={zh:p[1]||p[2],en:p[2]||p[1]}; }
    else if(k==="简介"||k==="bio"){ if(p[1]||p[2])out.bios.push({zh:p[1]||p[2],en:p[2]||p[1]}); }
    else if(k==="头像"||k==="avatar"){ if(p[1])out.avatar=p[1]; }
    else if(k==="邮箱"||k==="email"){ if(p[1])out.email=p[1]; }
    else if(k==="标签"||k==="chip"){ if(p[2])out.chips.push({i:p[1]||"",zh:p[2]||p[3]||"",en:p[3]||p[2]||""}); }
    else if(k==="社交"||k==="social"){ if(p[3])out.socials.push({zh:p[1]||p[2],en:p[2]||p[1],u:p[3],c:p[4]||"#8b949e"}); }
  });
  return out;
}
/* 读取个人信息配置：no-cache 保证改完配置刷新立即生效（没更新时走 304，不重复下载）。
   文件读不到或整份是空的 → PROFILE 保持 null，关于页的个人介绍卡不渲染；
   404 兜底页可能是 200 的 HTML，一并排除 */
async function loadProfile(){
  let j=null;
  try{
    const r=await fetch("profile.txt",{cache:"no-cache"});
    if(r.ok){
      const text=await r.text();
      j=/^\s*</.test(text)?null:parseProfileText(text);
    }
  }catch(e){}
  if(!j)return;
  const valid=j.hello||j.tagline||j.bios.length||j.avatar||j.email||j.chips.length||j.socials.length;
  if(!valid)return;
  PROFILE=j;
  /* 配置到达时正停在关于页 → 原地重绘（保住滚动位置，不打断浏览） */
  if(/^#\/about/.test(location.hash)){
    const root=document.documentElement,prev=root.style.scrollBehavior;
    root.style.scrollBehavior="auto";
    const y=window.scrollY;
    renderAbout();
    window.scrollTo(0,y);
    root.style.scrollBehavior=prev;
  }
}
/* ---------- 友情链接：内容在站点根目录的 friends.txt 里配置 ----------
   每行一位朋友，字段用 | 隔开，顺序固定：
     中文名|英文名|中文描述|英文描述|网址|图标地址
   图标一栏可省略；行首带 # 的是注释；「表单|网址」单独一行设置申请表单。
   加朋友直接另起一行保存即可，不用动本文件（名称/描述里别用 | 字符）。
   本文件里不放任何友链数据，一切以 friends.txt 为准 */
let FRIENDS=[];          /* 由 loadFriends() 从 friends.txt 读入 */
let FRIEND_FORM="";      /* 友链申请表单地址，来自 friends.txt 的「表单|网址」行 */
/* 解析 friends.txt 的行式配置 */
function parseFriendsText(text){
  const out={form:"",friends:[]};
  String(text||"").split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line||line.charAt(0)==="#")return;
    const p=line.split("|").map(s=>s.trim());
    if(/^(表单|form)$/i.test(p[0])){ if(p[1])out.form=p[1]; return; }
    if(p.length>=5&&p[4]){
      out.friends.push({zh:p[0]||p[1],en:p[1]||p[0],
        dzh:p[2]||p[3]||"",den:p[3]||p[2]||"",u:p[4],logo:p[5]||""});
    }
  });
  return (out.friends.length||out.form)?out:null;
}
/* 读取友链配置：no-cache 保证改完配置刷新立即生效（没更新时走 304，不重复下载）。
   配置读不到（file:// / 离线 / 忘了上传）时友链区保持隐藏，页面其余功能不受影响 */
async function loadFriends(){
  let j=null;
  try{
    const r=await fetch("friends.txt",{cache:"no-cache"});
    if(r.ok){
      const text=await r.text();
      j=/^\s*\{/.test(text)?null:parseFriendsText(text);
    }
  }catch(e){}
  if(!j)return;
  if(typeof j.form==="string"&&j.form)FRIEND_FORM=j.form;
  if(Array.isArray(j.friends)&&j.friends.length)FRIENDS=j.friends;
  /* 配置到达时正停在关于页 → 原地重绘友链区（保住滚动位置，不打断浏览） */
  if(/^#\/about/.test(location.hash)){
    const root=document.documentElement,prev=root.style.scrollBehavior;
    root.style.scrollBehavior="auto";
    const y=window.scrollY;
    renderAbout();
    window.scrollTo(0,y);
    root.style.scrollBehavior=prev;
  }
}

/* ---------- Steam 游戏模块：数据来自站点根目录的 steam.json ----------
   两条通道：
   · 部署环境优先走 /api/steam（Cloudflare Pages Function）：点模块里的手动刷新按钮时实时拉取，
     边缘缓存 5 分钟；Steam 接口不允许浏览器跨域直连，必须经自己的域名代理；
   · 实时接口不可用 / 本地 file:// 预览 → 退回静态 steam.json（GitHub Actions 每小时生成）。
   都读不到时整个模块隐藏，不影响其它区域 */
let STEAM=null;          /* 由 loadSteam() 读入 */
async function fetchSteam(){
  /* IS_LOCAL 在后面（博客区）才定义，这里调用时才求值；
     部署环境优先实时接口，失败逐级退回静态 steam.json（函数没部署/没配 Key 也不空） */
  const srcs=(typeof IS_LOCAL!=="undefined"&&IS_LOCAL)?["steam.json"]:["api/steam","steam.json"];
  for(const src of srcs){
    try{
      const r=await fetch(src,{cache:"no-cache"});
      if(!r.ok)continue;
      const ct=r.headers.get("content-type")||"";
      if(ct&&!ct.includes("json"))continue;   /* 404 兜底页可能是 200 的 HTML */
      const j=await r.json();
      if(j&&Array.isArray(j.recent)&&j.recent.length)return j;
    }catch(e){}
  }
  return null;
}
/* 数据到达时如正停在关于页 → 原地重绘游戏区（保住滚动位置，不打断浏览） */
function applySteam(j){
  STEAM=j;
  if(/^#\/about/.test(location.hash)){
    const root=document.documentElement,prev=root.style.scrollBehavior;
    root.style.scrollBehavior="auto";
    const y=window.scrollY;
    renderAbout();
    window.scrollTo(0,y);
    root.style.scrollBehavior=prev;
  }
}
async function loadSteam(){
  const j=await fetchSteam();
  if(j)applySteam(j);
}
/* 手动刷新按钮：点一下实时拉一次最新数据（接口侧有 5 分钟边缘缓存） */
async function manualSteamRefresh(btn){
  if(btn.dataset.busy)return;
  btn.dataset.busy="1";
  btn.classList.add("spinning");
  const j=await fetchSteam();
  btn.classList.remove("spinning");
  delete btn.dataset.busy;
  if(j){applySteam(j);return;}   /* 重绘后按钮是新的，无需复原状态 */
  const t=T();
  btn.title=t.about.steamRefreshFail||"";
  setTimeout(()=>{btn.title=t.about.steamRefresh;},2000);
}
/* Steam 模块的 HTML：最近玩过的游戏卡片（封面 / 时长 / 成就进度条） */
/* Steam 时长格式化：原始数据是浮点小时数（如 20.616666…），展示时保留一位小数、去掉多余的 .0 */
const fmtHours=h=>{
  const n=Number(h);
  if(!isFinite(n))return h;
  return String(Math.round(n*10)/10);
};
function steamModuleHTML(){
  const t=T(),s=STEAM;
  const sub=[];
  if(s.hours2weeks)sub.push(t.about.steamSub.replace("{h}",fmtHours(s.hours2weeks)).split(" · ")[0]);
  if(s.totalGames)sub.push((lang==="zh"?`共 ${s.totalGames} 款游戏`:`${s.totalGames} games owned`));
  const gameRow=g=>{
    const meta=[];
    if(g.hours2weeks!=null)meta.push(t.about.steamRecent.replace("{h}",fmtHours(g.hours2weeks)));
    if(g.hoursTotal!=null)meta.push(t.about.steamHours.replace("{h}",fmtHours(g.hoursTotal)));
    if(g.last)meta.push(t.about.steamLast.replace("{d}",g.last));
    const pct=(g.achEarned!=null&&g.achTotal)?Math.min(100,Math.round(g.achEarned/g.achTotal*100)):null;
    /* 封面三级兜底：竖版海报 → 横版头图 → 移除图片只留渐变底。
       兜底地址走 data-fb 交给 dataset 读，不再拼进内联脚本字符串 ——
       URL 里若带引号，直接拼会把这行 JS 截断 */
    const cover=g.cover||g.capsule||"";
    const fb=g.header||(g.appid?`https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg`:"");
    return `
    <a class="steam-game" href="https://steamcommunity.com/app/${g.appid||""}" target="_blank" rel="noopener" title="${esc(g.name)}">
      <img class="steam-bg" src="${esc(cover)}" alt="${esc(g.name)}" loading="lazy" decoding="async" data-fb="${esc(fb)}"
           onerror="if(!this.dataset.f&&this.dataset.fb){this.dataset.f=1;this.src=this.dataset.fb}else{this.remove()}">
      <div class="steam-shade"></div>
      <div class="steam-info">
        <h4>${esc(g.name)}</h4>
        ${meta.length?`<p>${esc(meta.join(" · "))}</p>`:""}
        ${pct!=null?`
        <div class="steam-ach">
          <div class="steam-ach-bar"><i style="width:${pct}%"></i></div>
          <span>${g.achEarned} / ${g.achTotal}${pct===100?" "+t.about.steamAchFull:""}</span>
        </div>`:""}
      </div>
    </a>`;
  };
  return `
  <div class="about-card collapsible" id="aboutSteam">
    <div class="friends-head coll-head" role="button" tabindex="0" aria-label="${esc(t.about.steamTitle)}">
      <div class="section-label" style="margin:0">${esc(t.about.steamTitle)}</div>

/* 语言：首次访问跟随操作系统/浏览器语言 —— 中文（zh、zh-CN、zh-TW、zh-HK…）显示中文，
   其它语言一律显示英文；用户在导航栏手动切换过以后，以本地保存的选择为准。 */
function detectLang(){
  try{
    const saved=localStorage.getItem("jy-lang");
    if(saved==="zh"||saved==="en")return saved;
  }catch(e){}
  let list=[];
  try{
    list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
  }catch(e){ list=[""]; }
  for(const raw of list){
    const l=String(raw||"").replace(/_/g,"-").toLowerCase();
    if(/^zh\b/.test(l)||l==="zh")return "zh";   /* 各种中文（含繁体、港澳台）都用中文 */
    if(/^en\b/.test(l)||l==="en")return "en";
  }
  return "en";                                   /* 其余语言统一英文 */
}
let lang=(function(){
  try{ const pre=window.__JY_LANG; if(pre==="zh"||pre==="en")return pre; }catch(e){}
  return detectLang();
})();
