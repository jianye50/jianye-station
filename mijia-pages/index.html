<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米家控制台</title>
<style>
  :root {
    --bg0: #07080b; --bg1: #0d0f14;
    --card: rgba(255,255,255,.038);
    --card-solid: #13151b;
    --stroke: rgba(255,255,255,.085);
    --stroke-hi: rgba(255,255,255,.18);
    --text: #f1f3f7; --muted: #98a0af; --faint: #5c6470;
    --accent: #ff7a1a; --accent2: #ffb257;
    --ok: #34d399; --bad: #f87171;
    --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    background: var(--bg0); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(600px 400px at 12% -5%, rgba(255,122,26,.10), transparent 60%),
      radial-gradient(700px 480px at 95% 0%, rgba(56,130,246,.08), transparent 60%),
      radial-gradient(900px 700px at 50% 115%, rgba(52,211,153,.05), transparent 60%);
  }

  /* ---------- 顶栏 ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: rgba(7,8,11,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--stroke);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #ff9d4d);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(255,122,26,.35);
  }
  .brand-mark svg { width: 18px; height: 18px; fill: #fff; }
  .brand h1 { font-size: 16px; font-weight: 650; letter-spacing: .3px; }
  .brand .sub { font-size: 11px; color: var(--faint); letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }
  .btns { display: flex; gap: 10px; align-items: center; }
  button {
    background: rgba(255,255,255,.05); color: var(--text);
    border: 1px solid var(--stroke); border-radius: var(--r-sm);
    padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit;
    transition: all .18s ease;
  }
  button:hover { border-color: var(--stroke-hi); background: rgba(255,255,255,.09); }
  button:active { transform: scale(.97); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), #ff9d4d);
    border: none; color: #fff; font-weight: 600;
    box-shadow: 0 4px 18px rgba(255,122,26,.32);
  }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--text); }

  main { max-width: 1160px; margin: 0 auto; padding: 28px 28px 80px; }
  .view { display: none; }
  .view.active { display: block; animation: fadeUp .35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- 登录 ---------- */
  .login-wrap { display: flex; justify-content: center; padding-top: 6vh; }
  .login-box {
    width: 400px; max-width: 100%; text-align: center;
    background: linear-gradient(165deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
    border: 1px solid var(--stroke); border-radius: 24px; padding: 40px 32px 32px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .login-box .brand-mark { width: 52px; height: 52px; border-radius: 15px; margin: 0 auto 18px; }
  .login-box .brand-mark svg { width: 26px; height: 26px; }
  .login-box h2 { font-size: 21px; font-weight: 650; margin-bottom: 8px; }
  .login-box .desc { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 24px; }
  input[type=password], input[type=text] {
    background: rgba(0,0,0,.35); color: var(--text);
    border: 1px solid var(--stroke); border-radius: var(--r-sm);
    padding: 11px 14px; font-size: 14px; width: 100%; margin-bottom: 12px;
    outline: none; transition: border-color .18s; font-family: inherit;
  }
  input:focus { border-color: rgba(255,122,26,.55); }
  input::placeholder { color: var(--faint); }
  #qrImg {
    width: 216px; height: 216px; border-radius: 16px; background: #fff;
    display: none; margin: 8px auto 14px; padding: 10px;
    box-shadow: 0 0 0 1px var(--stroke), 0 12px 32px rgba(0,0,0,.4);
  }
  #loginMsg { color: var(--muted); font-size: 13px; margin-top: 14px; min-height: 20px; line-height: 1.6; }

  /* ---------- 错误横幅 ---------- */
  .err-banner {
    display: none; margin-bottom: 20px; padding: 14px 18px;
    background: rgba(248,113,113,.07); border: 1px solid rgba(248,113,113,.28);
    border-radius: var(--r-md); color: #fca5a5; font-size: 13px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-all;
  }

  /* ---------- 分组与网格 ---------- */
  .room-head {
    display: flex; align-items: center; gap: 10px; margin: 26px 4px 14px;
  }
  .room-head:first-of-type { margin-top: 4px; }
  .room-head .room-name { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; color: var(--muted); }
  .room-head .room-line { flex: 1; height: 1px; background: var(--stroke); }
  .room-head .room-count { font-size: 12px; color: var(--faint); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 16px; }

  /* ---------- 设备卡片 ---------- */
  .device {
    background: linear-gradient(165deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
    border: 1px solid var(--stroke); border-radius: var(--r-lg);
    padding: 18px; transition: all .22s ease;
  }
  .device:hover { transform: translateY(-2px); border-color: var(--stroke-hi); box-shadow: 0 14px 34px rgba(0,0,0,.4); }
  .dev-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .dev-icon {
    width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.06); border: 1px solid var(--stroke);
  }
  .dev-icon svg { width: 21px; height: 21px; fill: var(--accent2); }
  .dev-title { flex: 1; min-width: 0; }
  .dev-title h3 { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-title .model { color: var(--faint); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .pill {
    flex-shrink: 0; font-size: 11px; padding: 3px 9px; border-radius: 99px;
    border: 1px solid var(--stroke); color: var(--muted); display: flex; align-items: center; gap: 5px;
  }
  .pill .pdot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .pill.on { color: var(--ok); border-color: rgba(52,211,153,.3); background: rgba(52,211,153,.07); }
  .pill.on .pdot { background: var(--ok); box-shadow: 0 0 6px rgba(52,211,153,.8); }
  .pill.off { color: var(--faint); }

  .ctls { display: flex; flex-direction: column; gap: 4px; }
  .ctl {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 0; font-size: 13px; border-bottom: 1px dashed rgba(255,255,255,.05);
  }
  .ctl:last-child { border-bottom: none; }
  .ctl > label { color: var(--muted); flex-shrink: 0; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctl input[type=range] { width: 150px; accent-color: var(--accent); cursor: pointer; }
  .ctl select {
    background: rgba(0,0,0,.35); color: var(--text); border: 1px solid var(--stroke);
    border-radius: 8px; padding: 5px 9px; max-width: 158px; font-size: 12.5px; outline: none; font-family: inherit;
  }
  .rv { font-size: 12px; color: var(--accent2); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

  .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { position: absolute; z-index: 2; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch input:disabled + span { opacity: .45; cursor: not-allowed; }
  .ctl.offline > label { opacity: .5; }
  .switch span {
    position: absolute; inset: 0; background: rgba(255,255,255,.12);
    border-radius: 26px; transition: .22s; cursor: pointer;
  }
  .switch span::before {
    content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
    left: 3px; top: 3px; background: #fff; transition: .22s; box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .switch input:checked + span { background: linear-gradient(135deg, var(--accent), #ff9d4d); box-shadow: 0 2px 12px rgba(255,122,26,.45); }
  .switch input:checked + span::before { transform: translateX(20px); }

  .dev-state {
    text-align: center; padding: 14px 0 6px; color: var(--faint); font-size: 12.5px;
  }
  .dev-state .retry {
    display: inline-block; margin-left: 8px; color: var(--accent2); cursor: pointer;
    border-bottom: 1px dashed rgba(255,178,87,.5); font-size: 12.5px;
  }

  /* 骨架屏 */
  .skel-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; }
  .skel {
    height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.11) 45%, rgba(255,255,255,.05) 65%);
    background-size: 220% 100%; animation: shimmer 1.4s infinite linear;
  }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -100% 0; } }

  /* ---------- 调试面板 ---------- */
  details.debug {
    margin-top: 40px; color: var(--muted); font-size: 13px;
    background: rgba(255,255,255,.02); border: 1px solid var(--stroke);
    border-radius: var(--r-md); padding: 14px 18px;
  }
  details.debug summary { cursor: pointer; user-select: none; letter-spacing: .5px; }
  details.debug summary:hover { color: var(--text); }
  details.debug .inner { margin-top: 12px; }
  details.debug p { margin-bottom: 8px; font-size: 12.5px; }
  details.debug textarea {
    width: 100%; background: rgba(0,0,0,.35); color: var(--text);
    border: 1px solid var(--stroke); border-radius: 8px; padding: 10px 12px;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px;
    min-height: 72px; margin: 6px 0 12px; outline: none; resize: vertical;
  }
  details.debug pre {
    margin-top: 10px; white-space: pre-wrap; word-break: break-all;
    background: rgba(0,0,0,.35); border: 1px solid var(--stroke); border-radius: 8px;
    padding: 12px; font-size: 12px; max-height: 260px; overflow: auto; display: none;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: rgba(22,24,30,.92); backdrop-filter: blur(10px);
    border: 1px solid var(--stroke-hi); color: var(--text);
    padding: 11px 22px; border-radius: 12px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 99;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 84vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty { text-align: center; color: var(--faint); padding: 60px 0; font-size: 14px; }

  @media (max-width: 640px) {
    header { padding: 12px 16px; }
    main { padding: 20px 16px 60px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .device { padding: 14px; }
    .ctl input[type=range] { width: 96px; }
    .ctl select { max-width: 108px; }
    .ctl > label { max-width: 46%; }
  }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-2v9h-5v-6H10v6H5v-9H3l9-8z"/></svg></div>
    <div><h1 data-i18n="appTitle">米家控制台</h1><div class="sub">MI HOME · WEB</div></div>
  </div>
  <div class="btns">
    <button class="ghost" id="langBtn" onclick="toggleLang()" title="切换语言 / Switch language">EN</button>
    <span id="topBtns" style="display:none; gap:10px; align-items:center">
      <button class="ghost" onclick="refreshAll()" data-i18n="refresh">↻ 刷新状态</button>
      <button class="ghost" onclick="logout()" data-i18n="logout">退出登录</button>
    </span>
  </div>
</header>
<main>

  <!-- 登录视图 -->
  <div id="viewLogin" class="view">
    <div class="login-wrap">
      <div class="login-box">
        <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-2v9h-5v-6H10v6H5v-9H3l9-8z"/></svg></div>
        <h2 data-i18n="loginTitle">扫码登录</h2>
        <p class="desc" data-i18n-html="loginDesc">使用米家 App 扫描二维码，登录后即可在网页控制设备。<br>凭证只保存在你本机浏览器，不会上传到任何第三方。</p>
        <div id="pinRow">
          <input type="password" id="pinInput" data-i18n-ph="pinPh" placeholder="访问密码（未设置可留空）">
          <button class="primary" style="width:100%;padding:11px" onclick="startLogin()" data-i18n="genQr">生成二维码</button>
        </div>
        <img id="qrImg" alt="二维码">
        <div id="loginMsg"></div>
        <div id="manualRow" style="display:none; margin-top:16px; text-align:left;">
          <input type="text" id="manualJson" data-i18n-ph="manualPh" placeholder='粘贴 {userId, serviceToken, deviceId, ssecurity} JSON'>
          <button style="width:100%" onclick="manualImport()" data-i18n="manualImport">手动导入凭证</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 设备视图 -->
  <div id="viewDevices" class="view">
    <div id="devErr" class="err-banner"></div>
    <div id="gridHost"></div>
    <details class="debug">
      <summary data-i18n="debugTitle">高级调试（自定义 API 调用）</summary>
      <div class="inner">
        <p data-i18n="debugHint">路径（如 /app/miotspec/prop/set 或 /app/miio/call）与 data JSON，将自动签名转发到米家 API：</p>
        <textarea id="dbgPath" placeholder="/app/miio/call"></textarea>
        <textarea id="dbgData" placeholder='{"did":"123","method":"get_prop","params":["power"]}'></textarea>
        <button class="primary" onclick="debugCall()" data-i18n="send">发送</button>
        <pre id="dbgOut"></pre>
      </div>
    </details>
  </div>

</main>
<div class="toast" id="toast"></div>
<script>
(function () {
  var LS_CREDS = 'mijia_creds', LS_PIN = 'mijia_pin', LS_SPEC = 'mijia_spec_v3', LS_LANG = 'mijia_lang'
  var creds = null
  try { creds = JSON.parse(localStorage.getItem(LS_CREDS)) } catch (e) {}

  // ---------- 多语言 ----------
  var lang = localStorage.getItem(LS_LANG) ||
    ((navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en')
  var I18N = {
    zh: {
      appTitle: '米家控制台', refresh: '↻ 刷新状态', logout: '退出登录',
      loginTitle: '扫码登录',
      loginDesc: '使用米家 App 扫描二维码，登录后即可在网页控制设备。<br>凭证只保存在你本机浏览器，不会上传到任何第三方。',
      pinPh: '访问密码（未设置可留空）', genQr: '生成二维码', manualPh: '粘贴 {userId, serviceToken, deviceId, ssecurity} JSON',
      manualImport: '手动导入凭证',
      genQring: '正在生成二维码...', scanHint: '请用米家 App 扫码，并在手机上确认登录',
      qrExpired: '二维码已失效，请点击「生成二维码」重新获取',
      qrFail: '二维码图片加载失败。可把下面链接发到手机上打开：',
      loginOk: '登录成功', loginFail: '登录失败：', importFail: '（可手动导入凭证）',
      jsonMiss: 'JSON 缺少字段', jsonBad: 'JSON 解析失败', importOk: '导入成功',
      loginExpired: '登录已失效，请重新扫码', pinWrong: '访问密码错误，请重新输入',
      netErr: '网络错误：',
      errNotJson: '接口返回的不是 JSON（HTTP {c}）—— 请确认 _worker.js 已随站点一起部署',
      loadingDevices: '正在加载设备...', loadedDevices: '已加载 {n} 台设备',
      homeFail: '获取家庭列表失败：', tokenHint: '\n若提示 token 失效，请点右上角「退出登录」重新扫码。',

      offlineTip: '设备当前离线，指令可能不会立即生效',

      sending: '发送指令...', setOk: '已设置', setFail: '设置失败：',
      notConfirmed: '设备未确认到状态变化，请稍后点「刷新状态」',
      refreshing: '正在刷新状态...',
      debugTitle: '高级调试（自定义 API 调用）',
      debugHint: '路径（如 /app/miotspec/prop/set 或 /app/miio/call）与 data JSON，将自动签名转发到米家 API：',
      send: '发送', needPath: '请填写路径', jsonParseFail: 'data JSON 解析失败', reqFail: '请求失败：',
      errCode: '错误码 ', notSupport: '设备不支持该属性或参数不合法', outOfRange: '取值超出范围',
      devNoResp: '设备无响应，可能离线', devBusy: '设备正忙，请稍后再试',
      devOffline: '设备离线', otherRoom: '其他', choose: '选择...', count: '{n} 台',
      unnamed: '未命名设备', switchLang: '已切换为中文'
    },
    en: {
      appTitle: 'Mi Home Console', refresh: '↻ Refresh', logout: 'Sign out',
      loginTitle: 'Sign in with QR',
      loginDesc: 'Scan the QR code with the Mi Home app to control your devices on the web.<br>Credentials are stored only in your local browser and never sent to any third party.',
      pinPh: 'Access password (leave empty if not set)', genQr: 'Generate QR code',
      manualPh: 'Paste {userId, serviceToken, deviceId, ssecurity} JSON',
      manualImport: 'Import credentials manually',
      genQring: 'Generating QR code...', scanHint: 'Scan with the Mi Home app and confirm on your phone',
      qrExpired: 'QR code expired. Click "Generate QR code" to retry',
      qrFail: 'Failed to load QR image. Open this link on your phone: ',
      loginOk: 'Signed in', loginFail: 'Sign-in failed: ', importFail: ' (you can import credentials manually)',
      jsonMiss: 'JSON is missing fields', jsonBad: 'Invalid JSON', importOk: 'Imported',
      loginExpired: 'Session expired, please sign in again', pinWrong: 'Wrong access password, try again',
      netErr: 'Network error: ',
      errNotJson: 'Response is not JSON (HTTP {c}) — check that _worker.js is deployed with the site',
      loadingDevices: 'Loading devices...', loadedDevices: 'Loaded {n} devices',
      homeFail: 'Failed to load homes: ', tokenHint: '\nIf the token expired, click "Sign out" and scan again.',
      devFail: 'Failed to load devices (home {id}): ', noDevices: 'Signed in, but no devices found in {n} home(s).',
      credExpired: 'Credentials expired (code {c}). Click "Sign out" and scan again.',
      online: 'Online', offline: 'Offline',
      offlineTip: 'Device is offline; commands may not take effect',
      noSpec: 'No miot spec for this device; use the debug panel below',
      specFail: 'Failed to load spec', retry: 'Retry', noWritable: 'No writable properties',
      sending: 'Sending...', setOk: 'Applied', setFail: 'Failed: ',
      notConfirmed: 'Device state change not confirmed. Try "Refresh" later.',
      refreshing: 'Refreshing...',
      debugTitle: 'Advanced debug (custom API calls)',
      debugHint: 'Path (e.g. /app/miotspec/prop/set or /app/miio/call) and data JSON will be signed and forwarded to the Mi API:',
      send: 'Send', needPath: 'Path required', jsonParseFail: 'Invalid data JSON', reqFail: 'Request failed: ',
      errCode: 'code ', notSupport: 'Property not supported or invalid param', outOfRange: 'Value out of range',
      devNoResp: 'Device not responding, possibly offline', devBusy: 'Device busy, try later',
      devOffline: 'Device offline', otherRoom: 'Others', choose: 'Select...', count: '{n} devices',
      unnamed: 'Unnamed device', switchLang: 'Switched to English'
    }
  }
  function tr(key) {
    var d = I18N[lang] || I18N.zh
    return d[key] !== undefined ? d[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key)
  }
  function tf(key, n) { return tr(key).replace('{n}', n) }
  function applyStaticTexts() {
    document.title = tr('appTitle')
    var list = document.querySelectorAll('[data-i18n]')
    for (var i = 0; i < list.length; i++) list[i].textContent = tr(list[i].getAttribute('data-i18n'))
    var htmls = document.querySelectorAll('[data-i18n-html]')

  // ---- spec 缓存 ----
  // v3：旧版缓存可能缺中文 comment 字段（key 升版本即整体作废），且加载时校验结构
  var specCache = {}

  try {

  // 缓存里若完全没有中文 comment（旧版缓存/旧 CDN 数据），视为失效，强制重新拉取
  function specHasZh(inst) {
    if (!inst || !Array.isArray(inst.services)) return false
    for (var i = 0; i < inst.services.length; i++) {
      var ps = inst.services[i].properties || []
      for (var j = 0; j < ps.length; j++) {
        var c = ps[j].comment
        if (c != null && String(c).trim() !== '') return true
      }
    }
    return false
  }

  function getSpec(type) {
    if (!type) return Promise.resolve(null)
    if (specCache[type]) {
      if (specHasZh(specCache[type])) return Promise.resolve(specCache[type])
      delete specCache[type]   // 旧缓存无中文，丢弃重取
    }
    if (specPending[type]) return specPending[type]   // 同型号设备并发时只请求一次
    specPending[type] = api('api/spec?type=' + encodeURIComponent(type)).then(asJson).then(function (j) {
      var inst = j.instance || (j && j.services ? j : null)   // 后端直接返回规格本体，顶层即 services
      if (inst) { specCache[type] = inst; saveSpecCache() }
      return inst
    }).catch(function () { return null }).then(function (v) {
      delete specPending[type]
      return v
    })
    return specPending[type]
  }

  // ---- spec 解析：提取可控制属性（miot-spec 格式：服务与属性各自带 iid，完整编号 = 服务iid + 属性iid） ----
  var NUM_FORMATS = ['uint8','uint16','uint32','int8','int16','int32','float','double']

  // 规格里同时有中文(comment)和英文(description)，两种语言各存一份
  function labels(o) {
    if (!o) return { zh: '', en: '' }
    var zh = o.comment == null ? '' : String(o.comment).trim()
    var en = o.description == null ? '' : String(o.description).trim()
    if (!zh) zh = en
    if (!en) en = zh
    return { zh: zh, en: en }
  }
  function labelText(lb) { return (lang === 'zh' ? lb.zh : lb.en) || lb.zh || lb.en || '' }
  function ctlName(c) { return (lang === 'zh' ? c.nameZh : c.nameEn) || c.nameZh || c.nameEn || '' }

  function isPowerCtl(c) {
    return /:property:on:/.test(c.ptype || '') || c.nameZh === '开关' || c.nameZh === '电源' || c.nameZh === '开关机'
  }

  function extractControls(inst) {
    if (!inst || !inst.services) return []
    var out = []
    inst.services.forEach(function (svc) {
      var siid = svc.iid
      ;(svc.properties || []).forEach(function (p) {
        var access = p.access || []
        if (access.indexOf('write') < 0) return
        var lb = labels(p)
        var fallback = siid + '-' + p.iid
        var ctl = {
          siid: siid, piid: p.iid,
          name: labelText(lb) || fallback,
          nameZh: lb.zh || fallback,
          nameEn: lb.en || fallback,
          ptype: p.type || '',
          readable: access.indexOf('read') >= 0
        }
        if (p.format === 'bool') {
          ctl.kind = 'bool'
        } else if (NUM_FORMATS.indexOf(p.format) >= 0) {
          var vl = p['value-list'], vr = p['value-range']
          if (vl && vl.length) {
            ctl.kind = 'enum'
            ctl.list = vl.map(function (v) {
              var lb2 = labels(v)
              return { value: v.value, textZh: lb2.zh || String(v.value), textEn: lb2.en || String(v.value) }
            })
          } else if (vr && vr.length === 3) {
            ctl.kind = 'range'
            ctl.min = vr[0]; ctl.max = vr[1]
            ctl.step = vr[2] || ((p.format === 'float' || p.format === 'double') ? 0.1 : 1)
          }
        }
        if (!ctl.kind) return
        out.push(ctl)
      })
    })
    // 排序：主开关 → 模式等下拉 → 数值滑块 → 其他布尔，保证关键操作在卡片最上面
    function rank(c) {
      if (isPowerCtl(c)) return 0
      if (c.kind === 'enum') return 1
      if (c.kind === 'range') return 2
      return 3
    }
    out.sort(function (a, b) { return rank(a) - rank(b) })
    return out.slice(0, 8)
  }

  function pickIcon(model, name) {
    var s = (model + ' ' + name).toLowerCase()
    if (s.indexOf('aircondition') >= 0 || s.indexOf('acpartner') >= 0 || s.indexOf('空调') >= 0) return 'airconditioner'
    if (s.indexOf('light') >= 0 || s.indexOf('lamp') >= 0 || s.indexOf('灯') >= 0) return 'light'
    if (s.indexOf('curtain') >= 0 || s.indexOf('窗帘') >= 0) return 'curtain'
    if (s.indexOf('fan') >= 0 || s.indexOf('风扇') >= 0) return 'fan'

    if (s.indexOf('sensor') >= 0 || s.indexOf('motion') >= 0 || s.indexOf('sensor') >= 0) return 'sensor'
    if (s.indexOf('camera') >= 0 || s.indexOf('摄像') >= 0) return 'camera'
    if (s.indexOf('router') >= 0 || s.indexOf('gateway') >= 0 || s.indexOf('网关') >= 0) return 'router'
    if (s.indexOf('tv') >= 0 || s.indexOf('电视') >= 0) return 'tv'
    if (s.indexOf('heater') >= 0 || s.indexOf('暖气') >= 0) return 'heater'
    if (s.indexOf('humidifier') >= 0 || s.indexOf('加湿') >= 0) return 'humidifier'

  var ctlMap = {}   // did -> [{siid, piid, el, kind}]

  function renderAll() {
    var host = $('gridHost')
    host.innerHTML = ''
    ctlMap = {}; idxMap = {}
    devices.forEach(function (d) { idxMap[d.did] = d })

    var hasRoom = devices.some(function (d) { return d.room })
    var groups = {}
    if (hasRoom) {
      devices.forEach(function (d) {
        var k = d.room || tr('otherRoom')
        ;(groups[k] = groups[k] || []).push(d)

      grid.className = 'grid'
      groups[room].forEach(function (d) {

      })

    })
  }

  function buildCard(d) {
    var card = document.createElement('div')
    card.className = 'device'
    var iconKey = pickIcon(d.model, d.name)
    card.innerHTML =
      '<div class="dev-head">' +
        '<div class="dev-icon">' + svgIcon(iconKey) + '</div>' +
        '<div class="dev-title"><h3>' + esc(d.name) + '</h3><div class="model">' + esc(d.model) + '</div></div>' +
        '<div class="pill ' + (d.online ? 'on' : 'off') + '"><span class="pdot"></span>' + (d.online ? tr('online') : tr('offline')) + '</div>' +
      '</div>' +
      '<div class="ctls" data-ctls="' + esc(d.did) + '">' +
        '<div class="dev-state"><div class="skel-row"><div class="skel" style="width:40%"></div><div class="skel" style="width:46px;height:22px;border-radius:99px"></div></div>' +
        '<div class="skel-row"><div class="skel" style="width:55%"></div><div class="skel" style="width:96px"></div></div></div>' +
      '</div>'

    }
    getSpec(d.specType).then(function (inst) {

      if (!inst) {

      }
      var ctls = extractControls(inst)
      if (!ctls.length) {

      box.innerHTML = ''

          c.el = inp; ctlMap[d.did].push(c)
        } else if (c.kind === 'range') {
          var wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;align-items:center;gap:8px'
          var rg = document.createElement('input'); rg.type = 'range'
          rg.min = c.min; rg.max = c.max; rg.step = c.step
          rg.disabled = !d.online
          var rv = document.createElement('span'); rv.className = 'rv'; rv.textContent = '--'
          rg.addEventListener('input', function () { rv.textContent = rg.value })
          rg.addEventListener('change', function () {
            var prev = rg.dataset.prev
            setProp(d, c, Number(rg.value), rg, prev === undefined ? undefined : Number(prev))
          })
          wrap.appendChild(rg); wrap.appendChild(rv); row.appendChild(wrap)
          c.el = rg; c.rvEl = rv; ctlMap[d.did].push(c)
        } else if (c.kind === 'enum') {
          var sel = document.createElement('select')
          sel.disabled = !d.online
          var opt0 = document.createElement('option'); opt0.value = ''; opt0.textContent = tr('choose'); sel.appendChild(opt0)
          c.list.forEach(function (v) {
            var o = document.createElement('option'); o.value = v.value; o.textContent = lang === 'zh' ? v.textZh : v.textEn; sel.appendChild(o)
          })
          sel.addEventListener('change', function () {
            if (sel.value === '') return
            var prev = sel.dataset.prev
            setProp(d, c, Number(sel.value), sel, prev === undefined ? undefined : prev)
          })
          row.appendChild(sel)
          c.el = sel; ctlMap[d.did].push(c)
        }
        box.appendChild(row)
      })
      refreshDevice(d)
    })
    return card
  }

  // 重试按钮（事件委托）
  $('gridHost').addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-retry]')
    if (!t) return
    var did = t.getAttribute('data-retry')
    var d = idxMap[did]
    if (d && d.specType) {
      delete specCache[d.specType]; saveSpecCache()
      renderAll()
    }
  })

  window.setProp = function (d, c, value, el, prev) {
    if (!creds) { toast(tr('loginExpired')); return }
    if (el) el.disabled = true
    toast(tr('sending'))

    function done() { if (el) el.disabled = !d.online }
    function revert() {
      if (!el) return
      if (el.type === 'checkbox') el.checked = !!prev
      else if (prev !== undefined && prev !== null && prev !== '') el.value = prev
    }

    miCall('/miotspec/prop/set', { params: [{ did: d.did, siid: c.siid, piid: c.piid, value: value }] })
      .then(function (j) {
        var r0 = Array.isArray(j.result) ? j.result[0] : j.result
        var ok = j.code === 0 && (!r0 || r0.code === 0)
        if (ok) { toast(tr('setOk')); confirmSet(d, c, value); return }
        var code = (r0 && r0.code !== undefined && r0.code !== 0) ? r0.code : j.code
        toast(tr('setFail') + miErrText(code, j.message === 'ok' ? '' : j.message))
        revert()
      })
      .catch(function (e) {
        toast(tr('netErr') + e.message)
        revert()
      })
      .then(done, done)
  }

  function applyCtlValue(c, value) {
    if (!c.el) return
    if (c.kind === 'bool') c.el.checked = !!value
    else if (c.kind === 'range') { c.el.value = value; if (c.rvEl) c.rvEl.textContent = String(value) }
    else if (c.kind === 'enum' && value !== null && value !== undefined) c.el.value = String(value)
    if (value !== null && value !== undefined) c.el.dataset.prev = String(value)
  }

  function sameVal(a, b) { return String(a) === String(b) }

  // 小米云端属性有 1~3 秒缓存延迟：刚下发完立刻回读会拿到旧值，把开关弹回去。
  // 所以先乐观显示，再隔几秒多次回读确认；确认期间拒绝用旧值覆盖用户刚设的状态。
  function confirmSet(d, c, value) {
    applyCtlValue(c, value)
    c.pendingValue = value
    c.pendingUntil = Date.now() + 9000
    ;[1500, 3000, 5000, 7500].forEach(function (ms) {
      setTimeout(function () { refreshDevice(d) }, ms)
    })
    // 最后兜底：以设备真实状态为准，若仍未生效则明确告知
    setTimeout(function () {
      c.pendingValue = undefined; c.pendingUntil = 0
      refreshDevice(d).then(function () {
        if (!c.el) return
        var actual = c.kind === 'bool' ? c.el.checked : c.el.value
        if (!sameVal(actual, value)) toast(tr('notConfirmed'))
      })
    }, 9500)
  }

  window.refreshAll = function () {
    if (!creds || !devices.length) return
    devices.forEach(function (d) { refreshDevice(d) })
    toast(tr('refreshing'))
  }

  function refreshDevice(d) {
    var list = ctlMap[d.did]
    if (!list || !list.length) return Promise.resolve()
    var reads = list.filter(function (c) { return c.readable }).map(function (c) {
      return { did: d.did, siid: c.siid, piid: c.piid }
    })
    if (!reads.length) return Promise.resolve()
    return miCall('/miotspec/prop/get', { params: reads.slice(0, 40) }).then(function (j) {
      if (j.code === 401 || j.code === 3) {
        showDeviceError(tr('credExpired').replace('{c}', j.code))
        return
      }
      if (j.code !== 0 || !j.result) return
      j.result.forEach(function (r) {
        if (r.code !== 0) return
        list.forEach(function (c) {
          if (c.siid !== r.siid || c.piid !== r.piid) return
          if (c.pendingValue !== undefined && Date.now() < c.pendingUntil) {
            // 还在等云端刷新，回读到旧值时不要覆盖 UI
            if (sameVal(r.value, c.pendingValue)) { c.pendingValue = undefined; c.pendingUntil = 0; applyCtlValue(c, r.value) }
            return
          }
          applyCtlValue(c, r.value)
        })
      })
    }).catch(function () {})
  }

  // ---- 调试 ----
  window.debugCall = function () {
    var path = $('dbgPath').value.trim()
    if (!path) { $('dbgOut').style.display = 'block'; $('dbgOut').textContent = tr('needPath'); return }
    path = path.replace(/^\/?app\//i, '').replace(/^\/+/, '')   // 兼容用户填 /app/miio/call 或 miio/call
    var data
    try { data = JSON.parse($('dbgData').value) } catch (e) { $('dbgOut').style.display = 'block'; $('dbgOut').textContent = tr('jsonParseFail'); return }
    api('app/' + path.replace(/^\/+/, ''), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: creds.userId, serviceToken: creds.serviceToken, deviceId: creds.deviceId, securityToken: creds.ssecurity, data: data })
    }).then(asJson).then(function (j) {
      $('dbgOut').style.display = 'block'
      $('dbgOut').textContent = JSON.stringify(j, null, 2)
    }).catch(function (e) {
      $('dbgOut').style.display = 'block'
      $('dbgOut').textContent = tr('reqFail') + e.message
    })
  }

  // ---- 启动 ----
  applyStaticTexts()
  if (creds && creds.serviceToken && creds.ssecurity) { showView('devices'); loadDevices() }
  else { showView('login') }
})()
</script>
</body>
</html>
