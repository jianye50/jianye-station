<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉴业的浏览器主页</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23141414'/%3E%3Ccircle cx='28' cy='28' r='14' fill='none' stroke='%23ffffff' stroke-width='5'/%3E%3Cpath d='M38.5 38.5L51 51' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --text: #1f1f1f;
    --subtle: #666666;
    --box-bg: #f3f3f3;
    --box-border: #e0e0e0;
    --btn-bg: #1f1f1f;
    --btn-text: #ffffff;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f;
      --text: #f3f3f3;
      --subtle: #9a9a9a;
      --box-bg: #2b2b2b;
      --box-border: #3a3a3a;
      --btn-bg: #f3f3f3;
      --btn-text: #1f1f1f;
      color-scheme: dark;
    }
  }

  /* 手动指定主题（右键菜单）：覆盖系统偏好 */
  html[data-theme="light"] {
    --bg: #ffffff;
    --text: #1f1f1f;
    --subtle: #666666;
    --box-bg: #f3f3f3;
    --box-border: #e0e0e0;
    --btn-bg: #1f1f1f;
    --btn-text: #ffffff;
    color-scheme: light;
  }

  html[data-theme="dark"] {
    --bg: #1f1f1f;
    --text: #f3f3f3;
    --subtle: #9a9a9a;
    --box-bg: #2b2b2b;
    --box-border: #3a3a3a;
    --btn-bg: #f3f3f3;
    --btn-text: #1f1f1f;
    color-scheme: dark;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: background .3s ease, color .3s ease;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    user-select: none;
    min-height: 100vh;   /* 兜底 */
    min-height: 100dvh;  /* 移动端动态视口：地址栏收起/展开时也保持真正垂直居中 */
    padding: 24px 16px;  /* 小屏或键盘弹出时防止内容贴边 */
  }

  /* 时钟 */
  #clock {
    font-size: clamp(56px, 10vw, 110px);
    font-weight: 200;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-align: center; /* 窄屏下日期比时钟宽时，时钟仍与日期居中对齐 */
  }

  #date {
    text-align: center;
    color: var(--subtle);
    font-size: 15px;
    margin-top: 14px;
    font-weight: 300;
    letter-spacing: 1px;
  }

  /* 组件显隐：右键菜单「更多 → 组件」里开关，状态存 localStorage，
     首屏内联脚本同步加类，避免时钟/日期先显示再隐藏造成闪烁 */
  html.hide-clock #clock { display: none; }
  html.hide-date #date { display: none; }
  html.hide-clock.hide-date .time-card { display: none; }

  /* 搜索框 */
  .search-wrap {
    width: min(620px, 86vw);
    position: relative;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 999px;
    padding: 6px 8px 6px 22px;
    transition: background .3s ease, border-color .3s ease, box-shadow .2s ease, transform .25s cubic-bezier(.22, 1, .36, 1);
  }

  .search-box:focus-within {
    border-color: var(--subtle);
    box-shadow: 0 4px 20px rgba(0, 0, 0, .12), 0 0 0 4px rgba(128, 128, 128, .1);
    transform: translateY(-1px);
  }

  /* 空内容提交：轻轻晃一下作为提示，不打断操作 */
  .search-box.shake { animation: search-shake .38s cubic-bezier(.36, .07, .19, .97); }

  .search-box svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: var(--subtle);
    stroke-width: 2;
    stroke-linecap: round;
    flex-shrink: 0;
  }

  /* 引擎切换按钮（原放大镜位置） */
  #engine-btn {
    border: none;
    outline: none;
    background: transparent;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: -7px;
    transition: background .2s ease;
  }

  #engine-btn:hover { background: rgba(128, 128, 128, .18); }

  /* 引擎图标位：内置引擎显示官方 logo，自定义引擎显示自填图标或默认放大镜 */
  .engine-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    user-select: none;
  }

  .engine-icon svg { width: 100%; height: 100%; display: block; }
  .engine-icon img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 5px; }
  /* Bing 官方图标是竖长比例，放大一点免得显小 */
  .engine-icon svg.bing-mark { width: auto; height: 110%; }
  /* 秘塔官方 logo 是横宽比例，按宽度撑满免得显小 */
  .engine-icon svg.metaso-mark { width: 108%; height: auto; }
  /* 默认放大镜图标留一点内边距，避免顶满 */
  .engine-icon svg.default-mark { width: 88%; height: 88%; }

  /* 搜索框内的图标规则会带上描边，品牌 logo 只填充不描边，这里覆盖掉 */
  #engine-btn svg { width: 20px; height: 20px; stroke: none; }
  #engine-btn svg.bing-mark { width: auto; height: 23px; }
  #engine-btn svg.metaso-mark { width: 22px; height: auto; }

  /* 引擎选择面板：整体纵向布局，列表区可滚动，底部“添加”常驻可见 */
  #engine-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 232px;
    max-width: min(340px, calc(100vw - 24px));
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 32px rgba(0, 0, 0, .16);
    display: none;
    flex-direction: column;
    z-index: 12;
  }

  /* 下方空间不够时改为向上展开 */
  #engine-panel.up { top: auto; bottom: calc(100% + 8px); }

  .engine-list {
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(128, 128, 128, .5) transparent;
    min-height: 0;
  }

  .engine-list::-webkit-scrollbar { width: 8px; }
  .engine-list::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, .45);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
  }

  #engine-panel.show { display: flex; }

  .engine-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
    color: var(--text);
    white-space: nowrap;
  }

  .engine-item:hover { background: var(--btn-bg); color: var(--btn-text); }
  /* 自定义长名称不撑破面板，超出部分省略 */
  .engine-item > span:nth-child(2) {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .engine-item .check { margin-left: auto; font-size: 13px; opacity: 0; padding-left: 16px; }
  .engine-item.active .check { opacity: 1; }

  /* 自定义引擎的删除按钮
     基础状态：可见（保证任何设备都能删除）。
     仅当设备确认具备「精确指针 + 支持悬停」时，才收敛为悬停显示，
     避免 hover 能力检测不确定的设备（触屏笔记本 / 无头浏览器等）按钮消失。 */
  .engine-item .del {
    margin-left: 8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
    opacity: .55;
    flex-shrink: 0;
  }

  .engine-item .del:hover { opacity: 1; background: rgba(255, 90, 90, .22); }
  .engine-item.custom .check { padding-left: 8px; }

  /* 精确鼠标设备：默认隐藏，悬停或聚焦该行时显示（保持桌面清爽） */
  @media (hover: hover) and (pointer: fine) {
    .engine-item .del { display: none; }
    .engine-item.custom:hover .del,
    .engine-item.custom:focus-within .del { display: flex; }
  }

  /* 触屏设备：常显并放大热区，方便手指点按 */
  @media (hover: none), (pointer: coarse) {
    .engine-item.custom .del {
      display: flex;
      position: relative;
      width: 28px;
      height: 28px;
      font-size: 17px;
      opacity: .6;
      margin-left: 4px;
    }
    .engine-item.custom .del::after {
      content: '';
      position: absolute;
      inset: -6px;
    }
  }

  /* 面板里的“添加自定义引擎”入口（固定在面板底部，不参与列表滚动） */
  .engine-add {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    color: var(--subtle);
    border-top: 1px solid var(--box-border);
  }

  .engine-add:hover { background: var(--btn-bg); color: var(--btn-text); }
  .engine-add .plus { font-size: 16px; width: 20px; text-align: center; }

  /* 列表仍需滚动时，底部入口上方出现渐隐，提示“下面还有引擎” */
  #engine-panel.can-scroll .engine-add {
    box-shadow: 0 -12px 14px -8px rgba(0, 0, 0, .22);
    border-top-color: transparent;
  }

  /* 自定义引擎表单（弹窗） */
  #engine-form-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  #engine-form-mask.show { display: flex; }

  #engine-form {
    width: min(420px, 100%);
    max-height: calc(100vh - 40px);
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #engine-form h3 { font-size: 17px; font-weight: 600; color: var(--text); }

  #engine-form label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--subtle);
  }

  #engine-form input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--box-border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }

  #engine-form input[type="text"]:focus { border-color: var(--subtle); }

  /* 字段下方的灰色说明（图标 URL 的填写提示） */
  .ef-hint {
    font-size: 12px;
    line-height: 1.5;
    color: var(--subtle);
    opacity: .85;
    margin: -8px 0 -2px;
  }

  #ef-msg { font-size: 12.5px; min-height: 16px; color: #e5484d; }
  #ef-msg.ok { color: #2f9e44; }

  .ef-actions { display: flex; justify-content: flex-end; gap: 10px; }

  .ef-actions button {
    border: 1px solid var(--box-border);
    background: transparent;
    color: var(--text);
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .2s ease, background .2s ease;
  }

  .ef-actions button:hover { opacity: .85; }
  .ef-actions #ef-save { background: var(--btn-bg); color: var(--btn-text); border-color: transparent; }

  /* RTL（阿拉伯语 / 希伯来语）镜像适配 */
  html[dir="rtl"] .search-box { padding: 6px 22px 6px 8px; }
  html[dir="rtl"] #engine-btn { margin-left: 0; margin-right: -7px; }
  html[dir="rtl"] #engine-panel { left: auto; right: 0; }
  html[dir="rtl"] .engine-item .check { margin-left: 0; margin-right: auto; padding-left: 0; padding-right: 16px; }
  html[dir="rtl"] .engine-item .del { margin-left: 0; margin-right: 8px; }
  html[dir="rtl"] .ef-actions { justify-content: flex-start; }
  html[dir="rtl"] .sug-item { padding: 11px 22px; }

  #search-input {
    flex: 1;
    min-width: 0; /* 关键：允许输入框自由收缩，否则固有最小宽度会把提交按钮挤出胶囊（窄屏/手机） */
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    padding: 12px 14px;
  }

  #search-input::placeholder { color: var(--subtle); }
  /* body 上有 user-select:none（避免拖动时选中文字），输入框内要恢复可选择 */
  #search-input,
  #engine-form input { -webkit-user-select: text; user-select: text; }

  /* Tab 键临时搜索提示：输入其他引擎的域名时显示在输入框右侧（Edge 同款交互） */
  #tab-hint {
    position: absolute;
    right: 56px;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    align-items: center;
    gap: 6px;
    color: var(--subtle);
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    z-index: 2;
  }
  #tab-hint.show { display: flex; }
  #tab-hint .engine-icon { width: 14px; height: 14px; }
  #tab-hint kbd {
    font-family: inherit;
    font-size: 11px;
    line-height: 1;
    border: 1px solid var(--box-border);
    background: var(--bg);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .search-box.tab-active #search-input { padding-right: 132px; }
  html[dir="rtl"] #tab-hint { right: auto; left: 56px; }
  html[dir="rtl"] .search-box.tab-active #search-input { padding-right: 14px; padding-left: 132px; }

  /* 触屏设备没有 Tab 键，提示无意义且占空间 */
  @media (hover: none), (pointer: coarse) {
    #tab-hint { display: none !important; }
    .search-box.tab-active #search-input,
    html[dir="rtl"] .search-box.tab-active #search-input { padding-right: 14px; padding-left: 14px; }
  }

  #search-btn {
    border: none;
    outline: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity .2s ease, background .3s ease, color .3s ease;
  }

  #search-btn:hover { opacity: .85; }

  /* 键盘可达性：只在键盘聚焦时显示清晰的焦点环 */
  #engine-btn:focus-visible,
  #search-btn:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }
  #ctx-menu .ctx-item:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: -2px;
    background: var(--btn-bg);
    color: var(--btn-text);
  }

  #search-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
  }

  /* 联想下拉 */
  #suggest-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 18px;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    max-height: min(52vh, 430px);
    max-height: min(52dvh, 430px);
    scrollbar-width: thin;
    scrollbar-color: rgba(128, 128, 128, .5) transparent;
    box-shadow: 0 10px 32px rgba(0, 0, 0, .16);
    display: none;
    z-index: 10;
  }

  #suggest-panel::-webkit-scrollbar { width: 8px; }
  #suggest-panel::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, .45);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
  }

  #suggest-panel.show { display: block; }

  .sug-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 22px;
    font-size: 15px;
    cursor: pointer;
    color: var(--text);
  }

  .sug-item svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: var(--subtle);
    stroke-width: 2;
    stroke-linecap: round;
    flex-shrink: 0;
  }

  .sug-item.active, .sug-item:hover { background: var(--btn-bg); color: var(--btn-text); }
  .sug-item.active svg, .sug-item:hover svg { stroke: var(--btn-text); }

  .sug-item b { font-weight: 600; }

  /* ---------- 图片 / 视频背景 ---------- */
  #bg-media {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: none;
    overflow: hidden;
    background: #111;
  }
  #bg-media.on { display: block; }
  /* 首屏低清预览：垫在全量媒体下面，避免加载期间黑屏 */
  #bg-media .bg-preview {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  #bg-media img, #bg-media video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: relative;
    z-index: 1;
  }
  /* 半透明遮罩：保证背景再花也不影响文字可读性 */
  #bg-media::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .34);
    pointer-events: none;
  }

  /* 有媒体背景时：整体玻璃拟态 + 文字反白（时钟、搜索框透明化） */
  html.bg-on {
    background: #111;
    color-scheme: dark;
    --bg: transparent;
    --text: #ffffff;
    --subtle: rgba(255, 255, 255, .76);
    --box-bg: rgba(255, 255, 255, .16);
    --box-border: rgba(255, 255, 255, .30);
    --btn-bg: #ffffff;
    --btn-text: #1f1f1f;
  }
  html.bg-on body { background: transparent; }
  html.bg-on #clock,
  html.bg-on #date { text-shadow: 0 2px 18px rgba(0, 0, 0, .35); }
  html.bg-on .search-box {
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .22);
  }
  html.bg-on .search-box:focus-within {
    border-color: rgba(255, 255, 255, .55);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .30);
  }
  html.bg-on #suggest-panel,
  html.bg-on #engine-panel {
    background: var(--box-bg);
    border-color: var(--box-border);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .22);
  }
  html.bg-on #engine-form {
    background: var(--box-bg);
    border-color: var(--box-border);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .22);
  }
  html.bg-on #tab-hint kbd {
    background: var(--box-bg);
    border-color: var(--box-border);
  }

  /* 亮色壁纸：canvas 采样平均亮度自动切换。
     白字浮在白壁纸上不可读 → 玻璃面板从白色玻璃改为深色玻璃，
     时钟/日期加强阴影，保证任意壁纸下都有足够对比度 */
  html.bg-on.bg-bright {
    --box-bg: rgba(24, 28, 40, .44);
    --box-border: rgba(255, 255, 255, .26);
    --subtle: rgba(255, 255, 255, .88);
  }
  html.bg-on.bg-bright #clock,
  html.bg-on.bg-bright #date {
    text-shadow: 0 1px 2px rgba(0, 0, 0, .62), 0 2px 14px rgba(0, 0, 0, .48), 0 4px 32px rgba(0, 0, 0, .35);
  }

  /* ---------- 右键菜单 ---------- */
  #ctx-menu {
    position: fixed;
    z-index: 120;
    min-width: 214px;
    max-width: 264px;
    padding: 6px;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 14px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, .28);
    font-size: 14px;
    color: var(--text);
    display: none;
    overflow: hidden;
    max-height: calc(100vh - 16px);
    max-height: calc(100dvh - 16px);
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(128, 128, 128, .5) transparent;
    /* 入场时从鼠标落点处展开（JS 会写入 --ctx-origin） */
    transform-origin: var(--ctx-origin, 50% 0%);
    will-change: transform, opacity;
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    backdrop-filter: blur(22px) saturate(1.3);
  }
  #ctx-menu.show { display: block; }
  /* 只有内容真的放不下时才启用滚动，避免入场动画的位移临时撑出滚动条 */
  #ctx-menu.scrollable { overflow-y: auto; }
  /* 语言列表需要更宽一点，容纳 Bahasa Indonesia 这类较长名称 */
  #ctx-menu.lang-open {
    width: min(320px, calc(100vw - 24px));
    max-width: none;
  }
  html.bg-on #ctx-menu {
    background: var(--box-bg);
    border-color: var(--box-border);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .22);
  }
  #ctx-menu .ctx-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: start;
    cursor: pointer;
  }
  #ctx-menu .ctx-item:hover,
  #ctx-menu .ctx-item:focus-visible {
    background: var(--btn-bg);
    color: var(--btn-text);
    outline: none;
  }
  #ctx-menu .ctx-item .ctx-tick {
    width: 16px;
    flex-shrink: 0;
    font-size: 12px;
    text-align: center;
    opacity: 0;
  }
  #ctx-menu .ctx-item.checked .ctx-tick { opacity: 1; }
  #ctx-menu .ctx-sep {
    height: 1px;
    background: var(--box-border);
    margin: 5px 6px;
    transform-origin: center;
  }
  /* 语言切换：主菜单入口 + 二级语言列表 */
  #ctx-menu .ctx-icon {
    width: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #ctx-menu .ctx-icon svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
  }
  #ctx-menu .ctx-lang-cur {
    margin-left: auto;
    padding-left: 8px;
    font-size: 12px;
    opacity: .68;
    white-space: nowrap;
    max-width: 108px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #ctx-menu .ctx-chev {
    margin-left: 2px;
    font-size: 15px;
    line-height: 1;
    opacity: .5;
  }
  #ctx-menu .ctx-item:hover .ctx-lang-cur { opacity: .85; }
  #ctx-menu .ctx-back {
    width: 16px;
    flex-shrink: 0;
    text-align: center;
    font-size: 18px;
    line-height: 1;
  }
  /* 语言列表用两列网格，20 种语言不必滚很久 */
  #ctx-menu .ctx-lang-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
  }
  #ctx-menu .ctx-lang-grid .ctx-item { padding: 7px 8px; gap: 6px; font-size: 13px; }
  /* 自动识别占满一整行，放在所有具体语言之前 */
  #ctx-menu .ctx-lang-grid .ctx-lang-auto { grid-column: 1 / -1; }
  #ctx-menu .ctx-lang-grid .ctx-tick { width: 12px; font-size: 11px; }
  #ctx-menu .ctx-lang-grid .ctx-item > span:last-child {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 背景调节：模糊 / 缩放 / 亮度 */
  #ctx-menu .ctx-fx { padding: 2px 12px 4px; }
  #ctx-menu .ctx-fx-row { margin-top: 10px; }
  #ctx-menu .ctx-fx-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: var(--subtle);
    margin-bottom: 3px;
    transition: color .18s ease;
  }
  #ctx-menu .ctx-fx-row:hover .ctx-fx-head { color: var(--text); }
  #ctx-menu .ctx-fx-head b {
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    display: inline-block;
    transform-origin: center;
  }
  /* 数值变化时轻轻弹一下，拖动滑块有即时反馈 */
  #ctx-menu .ctx-fx-head b.bump { animation: value-bump .28s cubic-bezier(.34, 1.56, .64, 1); }

  /* 自绘滑块：已选区间用文字色填充，进度一眼可见 */
  #ctx-menu input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 16px;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    --fx-pct: 0%;
  }
  #ctx-menu input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(to right,
      var(--text) 0 var(--fx-pct),
      rgba(128, 128, 128, .32) var(--fx-pct) 100%);
  }
  /* RTL：滑块从右往左增长，填充方向也要跟着翻转 */
  html[dir="rtl"] #ctx-menu input[type="range"]::-webkit-slider-runnable-track {
    background: linear-gradient(to left,
      var(--text) 0 var(--fx-pct),
      rgba(128, 128, 128, .32) var(--fx-pct) 100%);
  }
  #ctx-menu input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--text);
    border: 2px solid var(--box-bg);
    box-shadow: 0 1px 5px rgba(0, 0, 0, .32);
    transition: transform .16s cubic-bezier(.34, 1.56, .64, 1), box-shadow .16s ease;
  }
  #ctx-menu input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.16); }
  #ctx-menu input[type="range"]:active::-webkit-slider-thumb {
    transform: scale(1.28);
    box-shadow: 0 0 0 6px rgba(128, 128, 128, .2), 0 1px 5px rgba(0, 0, 0, .32);
  }
  /* Firefox */
  #ctx-menu input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: rgba(128, 128, 128, .32);
  }
  #ctx-menu input[type="range"]::-moz-range-progress {
    height: 4px;
    border-radius: 999px;
    background: var(--text);
  }
  #ctx-menu input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--text);
    border: 2px solid var(--box-bg);
    box-shadow: 0 1px 5px rgba(0, 0, 0, .32);
    transition: transform .16s cubic-bezier(.34, 1.56, .64, 1);
  }
  #ctx-menu input[type="range"]:hover::-moz-range-thumb { transform: scale(1.16); }

  /* 触屏：加大滑块热区，手指更容易拖动 */
  @media (hover: none), (pointer: coarse) {
    #ctx-menu input[type="range"] { height: 26px; }
    #ctx-menu input[type="range"]::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      margin-top: -7px;
    }
    #ctx-menu input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; }
  }

  /* 节日彩蛋：全屏粒子画布（pointer-events:none，不挡任何交互） */
  #festival-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  /* 节日时给时钟发光一个平滑过渡 */
  #clock { transition: text-shadow .45s ease; }
  /* 节日氛围：搜索框边框与 placeholder 用节日强调色（克制，不破坏可读性） */
  html[class*="festival-"] .search-box {
    border-color: var(--festival-accent);
    box-shadow: 0 0 0 1px var(--festival-accent), 0 10px 30px -12px var(--festival-accent);
  }
  html[class*="festival-"] #search-input::placeholder {
    color: var(--festival-accent);
    opacity: .9;
  }

  /* 轻提示（文件过大、格式不支持等） */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 36px;
    max-width: min(86vw, 520px);
    text-align: center;
    transform: translate(-50%, 14px) scale(.96);
    z-index: 200;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(20, 20, 20, .88);
    color: #fff;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .25s cubic-bezier(.22, 1, .36, 1);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* ================= 动效体系 ================= */
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(-6px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pop-up {
    from { opacity: 0; transform: translateY(12px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes item-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes icon-pop {
    0%   { opacity: 0; transform: scale(.55); }
    60%  { transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes colon-blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: .3; }
  }

  /* 右键菜单：整体从鼠标落点弹出（轻微回弹），内部条目（文字 + 滑块）一起上浮 */
  @keyframes ctx-in {
    0%   { opacity: 0; transform: translateY(10px) scale(.92); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes ctx-out {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(5px) scale(.96); }
  }
  @keyframes ctx-row-in {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ctx-sep-in {
    from { opacity: 0; transform: scaleX(.15); }
    to   { opacity: 1; transform: scaleX(1); }
  }
  @keyframes ctx-sheen {
    from { transform: translateX(-130%); }
    to   { transform: translateX(130%); }
  }
  @keyframes tick-pop {
    0%   { opacity: 0; transform: scale(.4); }
    60%  { opacity: 1; transform: scale(1.18); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes value-bump {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes search-shake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-6px); }
    40%      { transform: translateX(5px); }
    60%      { transform: translateX(-3px); }
    80%      { transform: translateX(2px); }
  }

  /* 首屏入场：时钟/日期/搜索框依次浮现 */
  .time-card { animation: fade-in .6s ease both; }
  #clock { animation: rise-in .8s cubic-bezier(.22, 1, .36, 1) .05s both; }
  #date { animation: rise-in .8s cubic-bezier(.22, 1, .36, 1) .18s both; }
  .search-wrap { animation: rise-in .8s cubic-bezier(.22, 1, .36, 1) .28s both; }
  /* 冒号缓慢呼吸，让时钟"活"起来 */
  #clock .colon { display: inline-block; animation: colon-blink 2.4s ease-in-out infinite; }

  /* 浮层弹入：联想面板 / 引擎面板 / 右键菜单 / 添加弹窗 */
  #suggest-panel.show { animation: pop-in .18s cubic-bezier(.22, 1, .36, 1) both; transform-origin: top center; }
  #engine-panel.show { animation: pop-in .18s cubic-bezier(.22, 1, .36, 1) both; transform-origin: top left; }
  #engine-panel.up.show { transform-origin: bottom left; }
  #ctx-menu.show { animation: ctx-in .36s cubic-bezier(.18, 1.22, .32, 1) both; }
  #ctx-menu.closing { animation: ctx-out .15s cubic-bezier(.4, 0, .8, .4) both; pointer-events: none; }
  #ctx-menu.closing > * { animation: none !important; }
  /* 展开时一道微光扫过玻璃面板 */
  #ctx-menu.show::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(110deg,
      transparent 30%,
      rgba(255, 255, 255, .2) 46%,
      transparent 62%);
    background: linear-gradient(110deg,
      transparent 30%,
      color-mix(in srgb, var(--text) 16%, transparent) 46%,
      transparent 62%);
    /* 默认停在屏外：动画被系统“减少动态效果”禁用时不会留下一条静态高光 */
    transform: translateX(-130%);
    animation: ctx-sheen .7s cubic-bezier(.3, .8, .4, 1) .1s both;
  }
  #engine-form-mask.show { animation: fade-in .2s ease both; }
  #engine-form-mask.show #engine-form { animation: pop-up .26s cubic-bezier(.22, 1, .36, 1) both; }

  /* 右键菜单逐块上浮：分隔线与滑块组作为整体参与，避免文字动、滑块不动 */
  #ctx-menu.show > * { animation: ctx-row-in .34s cubic-bezier(.22, 1, .36, 1) both; }
  #ctx-menu.show > :nth-child(1) { animation-delay: .04s; }
  #ctx-menu.show > :nth-child(2) { animation-delay: .06s; }
  #ctx-menu.show > :nth-child(3) { animation-delay: .08s; }
  #ctx-menu.show > :nth-child(4) { animation-delay: .1s; }
  #ctx-menu.show > :nth-child(5) { animation-delay: .12s; }
  #ctx-menu.show > :nth-child(6) { animation-delay: .14s; }
  #ctx-menu.show > :nth-child(7) { animation-delay: .16s; }
  #ctx-menu.show > :nth-child(8) { animation-delay: .18s; }
  #ctx-menu.show > :nth-child(9) { animation-delay: .2s; }
  /* 语言列表：整块淡入，避免 20 行同时位移显得晃 */
  #ctx-menu.show > .ctx-lang-grid { animation: fade-in .22s ease both; animation-delay: .06s; }
  #ctx-menu.show > .ctx-sep { animation-name: ctx-sep-in; }
  #ctx-menu.show .ctx-item.checked .ctx-tick { animation: tick-pop .34s cubic-bezier(.34, 1.56, .64, 1) .32s both; }

  /* 列表级联：面板内条目依次浮现（延迟封顶，长列表不拖沓） */
  #suggest-panel.show .sug-item,
  #engine-panel.show .engine-item,
  #engine-panel.show .engine-add { animation: item-in .24s cubic-bezier(.22, 1, .36, 1) both; }
  #suggest-panel.show .sug-item:nth-child(2),
  #engine-panel.show .engine-item:nth-child(2) { animation-delay: .03s; }
  #suggest-panel.show .sug-item:nth-child(3),
  #engine-panel.show .engine-item:nth-child(3) { animation-delay: .06s; }
  #suggest-panel.show .sug-item:nth-child(4),
  #engine-panel.show .engine-item:nth-child(4) { animation-delay: .09s; }
  #suggest-panel.show .sug-item:nth-child(n+5),
  #engine-panel.show .engine-item:nth-child(n+5) { animation-delay: .12s; }
  #engine-panel.show .engine-add { animation-delay: .12s; }

  /* 引擎图标切换：小弹跳（innerHTML 替换产生新节点时自动播放） */
  #engine-btn > * { animation: icon-pop .26s cubic-bezier(.34, 1.56, .64, 1) both; }

  /* Tab 提示浮现 */
  #tab-hint.show { animation: fade-in .18s ease both; }

  /* 背景媒体入场：淡入 + 轻微回落，切换模式/换图时不生硬 */
  @keyframes bg-in {
    from { opacity: 0; transform: scale(1.04); }
    to   { opacity: 1; transform: scale(1); }
  }
  #bg-media.on { animation: bg-in .7s cubic-bezier(.22, 1, .36, 1) both; }

  /* 微交互：按钮回弹、条目高亮过渡 */
  #engine-btn { transition: background .2s ease, transform .18s cubic-bezier(.34, 1.56, .64, 1); }
  #engine-btn:hover { transform: scale(1.08); }
  #engine-btn:active { transform: scale(.9); }
  #search-btn { transition: opacity .2s ease, background .3s ease, color .3s ease, transform .18s cubic-bezier(.34, 1.56, .64, 1); }
  #search-btn:hover { opacity: .88; transform: scale(1.07); }
  #search-btn:active { transform: scale(.93); }
  .sug-item, .engine-item, .engine-add, #ctx-menu .ctx-item { transition: background .15s ease, color .15s ease; }
  /* 右键菜单条目：悬停时文字轻轻右移，按下回弹 */
  #ctx-menu .ctx-item > span:nth-child(2) {
    transition: transform .2s cubic-bezier(.22, 1, .36, 1);
  }
  #ctx-menu .ctx-item:hover > span:nth-child(2) { transform: translateX(2px); }
  #ctx-menu .ctx-item:active > span:nth-child(2) { transform: translateX(2px) scale(.97); }
  #ctx-menu .ctx-item:active { background: var(--btn-bg); color: var(--btn-text); }
  html[dir="rtl"] #ctx-menu .ctx-chev { transform: scaleX(-1); }
  .ef-actions button { transition: opacity .2s ease, background .2s ease, transform .15s ease; }
  .ef-actions button:hover { transform: translateY(-1px); }
  .ef-actions button:active { transform: translateY(0); }

  /* 主题切换时浮层底色也平滑过渡 */
  #suggest-panel, #engine-panel, #ctx-menu, #engine-form, #tab-hint kbd {
    transition: background .3s ease, border-color .3s ease;
  }

  /* 尊重系统"减少动态效果"偏好 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    /* 扫光依赖动画移动，禁用动画后直接去掉，避免静态光带残留 */
    #ctx-menu.show::after { display: none !important; }
  }
</style>

<body>

  <!-- 图片 / 视频背景层（右键菜单里设置） -->
  <div id="bg-media" aria-hidden="true"></div>
  <script>
    /* 首屏同步预览：背景文件存在 IndexedDB，异步读取 + 大图解码有延迟，
       打开页面期间会黑屏。选背景时已缓存一张低清预览（homepage.bgpreview），
       这里同步读出立即上屏，全量背景就绪后由主脚本无缝替换 */
    (function () {
      try {
        var mode = localStorage.getItem('homepage.mode');
        if (!localStorage.getItem('homepage.bgmeta')) return;
        if (mode && mode !== 'media') return;
        var raw = localStorage.getItem('homepage.bgpreview');
        if (!raw) return;
        var media = document.getElementById('bg-media');
        var img = document.createElement('img');
        img.className = 'bg-preview';
        img.alt = '';
        img.src = raw;
        media.appendChild(img);
        media.classList.add('on');
        document.documentElement.classList.add('bg-on');
        if (localStorage.getItem('homepage.bgbright') === '1') {
          document.documentElement.classList.add('bg-bright'); // 亮壁纸：首帧就用暗色玻璃，避免闪白
        }
      } catch (err) {}
    })();
  </script>
  <script>
    /* 首屏同步应用组件显隐：与背景预览同理，主脚本执行前时钟就可能已上屏，
       这里先读 localStorage 给 html 加类，避免时钟/日期闪现后再消失 */
    (function () {
      try {
        var raw = localStorage.getItem('homepage.components');
        if (raw) {
          var s = JSON.parse(raw);
          if (s.clock === false) document.documentElement.classList.add('hide-clock');
          if (s.date === false) document.documentElement.classList.add('hide-date');
        }
      } catch (err) {}
    })();
  </script>

  <div class="time-card">
    <div id="clock">00:00</div>
    <div id="date"></div>
  </div>

  <div class="search-wrap">
    <form class="search-box" id="search-form">
      <button id="engine-btn" type="button" title="切换搜索引擎"></button>
      <input id="search-input" type="text" placeholder="搜索网页…" autocomplete="off" autofocus>
      <span id="tab-hint" aria-hidden="true"></span>
      <button id="search-btn" type="submit" title="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>
    <div id="suggest-panel"></div>
    <div id="engine-panel"></div>

  function normalizeLocale() {
    // 优先级：已保存偏好 > 浏览器语言列表 > 默认英文
    let saved = '';
    try { saved = localStorage.getItem('homepage.lang') || ''; } catch (err) {}
    const list = [saved, navigator.language]
      .concat(Array.isArray(navigator.languages) ? navigator.languages : [])
      .filter(Boolean);
    for (const raw of list) {
      // 取主语言子标签（避免 "zhx" 之类被误判为 "zh"）
      let l = String(raw).toLowerCase().split(/[-_]/)[0];
      if (l === 'zh') return 'zh';
      if (I18N[l]) return l;
    }
    return 'en'; // 未收录的语言回退英文
  }

  const LANG = normalizeLocale();
  const T = I18N[LANG] || I18N.en;

  function getAnimSeen() { try { return JSON.parse(localStorage.getItem(FESTIVAL_ANIM_KEY) || '{}') || {}; } catch (e) { return {}; } }

  function engineName(id) {
    if (T.engineNames && T.engineNames[id]) return T.engineNames[id];
    const e = engines.find(x => x.id === id);
    if (!e) return id;
    return (LANG === 'zh' ? e.zh : e.en) || e.en || id;
  }

  /* ---------- 自定义搜索引擎（存 localStorage，与内置引擎合并） ---------- */
  // 自定义图标只接受 http(s) 图片链接或 base64 内联图片，
  // 其余（javascript:、data:text/html 等）一律丢弃，避免注入执行
  function safeIconSrc(v) {
    const s = String(v == null ? '' : v).trim();
    if (!s) return '';
    if (/^data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+$/i.test(s)) return s.replace(/\s+/g, '');
    if (/^(https?:\/\/|\/\/)[^\s"'<>]+$/i.test(s)) return s;
    return '';
  }

  const CUSTOM_KEY = 'homepage.customEngines';
  let customEngines = [];
  try {
    const raw = localStorage.getItem(CUSTOM_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    // 必须是数组，且每项含 id/name/url；同时做类型与长度收敛，防止脏数据破坏渲染
    if (Array.isArray(parsed)) {
      customEngines = parsed
        // 仅接受 http(s) 网址，避免手工改坏或历史脏数据把 javascript: 之类写进跳转
        .filter(e => e && typeof e === 'object' && e.id && e.name && /^https?:\/\//i.test(String(e.url)))
        .map(e => ({
          // id 保留原值（避免失效已保存的 currentEngine），仅限制合法字符
          id: String(e.id).replace(/[^A-Za-z0-9_]/g, '').slice(0, 60),
          name: String(e.name).slice(0, 40),
          url: String(e.url).slice(0, 500),
          icon: safeIconSrc(e.icon).slice(0, 400000)
        }))
        .filter(e => e.id) // 清洗后 id 可能为空，剔除
        // 归一化后可能存在重复 id，去重
        .filter((e, i, arr) => arr.findIndex(x => x.id === e.id) === i);
    }
  } catch (err) { customEngines = []; }

  function saveCustom() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customEngines)); } catch (err) {}
  }

  // 取网址的根域名（www.douyin.com → douyin.com），用来识别“用户以前手动加过、如今已内置”的引擎
  function rootDomain(url) {
    try {
      const host = new URL(String(url).replace('%s', 'x')).hostname.toLowerCase();
      const parts = host.split('.');
      return parts.length > 2 ? parts.slice(-2).join('.') : host;
    } catch (err) { return ''; }
  }

  const builtinDomains = engines.map(e => rootDomain(e.url)).filter(Boolean);

  // 与内置引擎同域名的自定义引擎不再重复显示（例如之前手动添加的“抖音”）
  function dupOfBuiltin(eng) {
    const d = rootDomain(eng.url);
    return !!d && builtinDomains.indexOf(d) > -1;
  }

  // 内置 + 自定义的完整列表
  function allEngines() { return engines.concat(customEngines.filter(e => !dupOfBuiltin(e))); }

  function isCustom(id) { return customEngines.some(e => e.id === id); }

  const ENGINE_KEY = 'homepage.engine';
  let currentEngine = engines[0].id; // 默认必应
  try {
    const saved = localStorage.getItem(ENGINE_KEY);
    if (saved) {
      if (allEngines().some(e => e.id === saved)) {
        currentEngine = saved;
      } else {
        // 存的是被内置引擎取代的那条自定义项 → 平滑迁移到同域名的内置引擎
        const old = customEngines.find(e => e.id === saved);
        if (old) {
          const d = rootDomain(old.url);
          const hit = engines.find(e => rootDomain(e.url) === d);
          if (hit) currentEngine = hit.id;
        }
      }
    }
  } catch (err) { /* localStorage 不可用时忽略，用默认引擎 */ }

  const engineBtn = document.getElementById('engine-btn');
  const enginePanel = document.getElementById('engine-panel');

  function currentEngineObj() {
    return allEngines().find(e => e.id === currentEngine) || engines[0];
  }

  // Tab 临时搜索模式：输入其他引擎域名后按 Tab，临时改用该引擎搜索一次，
  // 不改变默认引擎；Esc、失焦或重新选择引擎时退出
  let tabMode = null;
  function activeEngineObj() { return tabMode || currentEngineObj(); }
  function engineLabelOf(eng) { return isCustom(eng.id) ? eng.name : engineName(eng.id); }

  // 默认图标：通用放大镜（纯填充，深浅色都清晰），自定义引擎没填图标时使用
  const DEFAULT_ICON = '<svg class="default-mark" viewBox="0 0 24 24" aria-hidden="true"><g fill="#9a9a9a"><path fill-rule="evenodd" d="M10.7 2.4a8.3 8.3 0 1 0 0 16.6 8.3 8.3 0 0 0 0-16.6Zm0 2.9a5.4 5.4 0 1 1 0 10.8 5.4 5.4 0 0 1 0-10.8Z"/><rect x="15.9" y="16.6" width="7.2" height="3" rx="1.5" transform="rotate(45 19.5 18.1)"/></g></svg>';

  // 内置引擎用官方 logo；自定义引擎用自填的图标地址，没填就用默认图标
  function iconHTML(eng) {
    const src = ENGINE_ICONS[eng.id] ? '' : safeIconSrc(eng.icon);
    const content = ENGINE_ICONS[eng.id] || (src ? '<img src="' + esc(src) + '" alt="">' : DEFAULT_ICON);
    return '<span class="engine-icon">' + content + '</span>';
  }

  function renderEngineBtn() {
    // 临时搜索模式下按钮与占位符显示临时引擎，否则显示默认引擎
    const eng = activeEngineObj();
    const label = engineLabelOf(eng);
    // 按钮图标直接显示当前搜索引擎的 logo
    engineBtn.innerHTML = iconHTML(eng);
    engineBtn.title = T.engineBtnTitle(label);
    engineBtn.setAttribute('aria-label', T.engineBtnLabel);
    // 临时搜索（Tab 切换）时文案明确标注“暂时”，避免误以为默认引擎被改掉
    input.placeholder = (tabMode && T.searchWithTemp) ? T.searchWithTemp(label) : T.searchWith(label);
  }

  // 自定义图标失效（链接 404、base64 损坏、混合内容被拦截）时退回默认图标
  // img 的 error 事件不冒泡，必须用捕获阶段监听
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (!img || img.tagName !== 'IMG' || !img.parentNode) return;
    if (!img.parentNode.classList || !img.parentNode.classList.contains('engine-icon')) return;
    img.parentNode.innerHTML = DEFAULT_ICON;
  }, true);

  function closeEnginePanel() {
    enginePanel.classList.remove('show');
  }

  function renderEnginePanel() {
    const items = allEngines().map(e => {
      const custom = isCustom(e.id);
      const label = custom ? e.name : engineName(e.id);
      return '<div class="engine-item' + (e.id === currentEngine ? ' active' : '') + (custom ? ' custom' : '') + '" data-id="' + esc(e.id) + '">' +
        iconHTML(e) + '<span>' + esc(label) + '</span>' +
        (custom ? '<span class="del" data-del="' + esc(e.id) + '" title="' + esc(T.btnDelete || '删除') + '">&times;</span>' : '') +
        '<span class="check">✓</span></div>';
    }).join('');
    // 底部添加入口（固定在面板底部，不随列表滚动）
    const addLabel = T.addEngine || '添加自定义搜索引擎';
    enginePanel.innerHTML = '<div class="engine-list">' + items + '</div>' +
      '<div class="engine-add" id="engine-add"><span class="plus">+</span><span>' + esc(addLabel) + '</span></div>';

    // 默认向下展开；只有当下方连 5 项都放不下、且上方明显更宽裕时才向上翻转
    enginePanel.classList.remove('up');
    enginePanel.style.maxHeight = '';
    // 面板是相对搜索框（offsetParent）定位的，必须用它的底边算可用空间
    const anchor = enginePanel.offsetParent || engineBtn.parentElement || engineBtn;
    const ar = anchor.getBoundingClientRect();
    const below = window.innerHeight - ar.bottom - 8 - 14;   // 面板顶部 = 锚点底边 + 8，底部留 14
    const above = ar.top - 8 - 14;                            // 向上展开时的可用高度
    const MIN_DOWN = 220;              // 下方至少能露出 4~5 项 + 添加入口
    const flipUp = below < MIN_DOWN && above > below + 60;
    if (flipUp) {
      enginePanel.classList.add('up');
      enginePanel.style.maxHeight = Math.max(180, Math.min(above, 560)) + 'px';
    } else {
      enginePanel.style.maxHeight = Math.max(140, Math.min(below, 560)) + 'px';
    }

    enginePanel.classList.add('show');
    // 列表超出可见区域时：高度吸附到整行（不切半行），并给底部入口加渐隐提示
    const listEl = enginePanel.querySelector('.engine-list');
    const addEl = enginePanel.querySelector('.engine-add');
    const firstItem = listEl && listEl.firstElementChild;
    if (listEl && addEl && firstItem && !enginePanel.classList.contains('up')) {
      const ih = firstItem.getBoundingClientRect().height;
      const ah = addEl.getBoundingClientRect().height;
      const top = enginePanel.getBoundingClientRect().top;
      const room = window.innerHeight - top - 2;             // 面板最多能占多高（留 2px）
      const cur = parseFloat(enginePanel.style.maxHeight) || room;
      if (ih > 0 && listEl.scrollHeight > cur - ah + 2) {
        // 尽量把被切掉的那一行补成整行，但绝不超出可用空间
        let rows = Math.round((cur - ah) / ih);
        if (rows * ih + ah > room) rows = Math.floor((room - ah) / ih);
        if (rows >= 2) enginePanel.style.maxHeight = Math.ceil(rows * ih + ah) + 'px';
        enginePanel.classList.add('can-scroll');
      } else {
        enginePanel.classList.remove('can-scroll');
      }
    }
  }

  engineBtn.addEventListener('mousedown', (e) => e.preventDefault()); // 防止输入框失焦
  engineBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (enginePanel.classList.contains('show')) closeEnginePanel();
    // 打开引擎面板前先收起联想面板，避免两个下拉叠在一起
    else { hideSuggest(); renderEnginePanel(); }
  });

  // 指针入口：按下只记录，抬起且没有位移才算“点选”。
  // 旧写法在 pointerdown 就选中并关面板，手机上一滑立刻关窗，列表根本滚不动。
  let pressInfo = null;
  const PRESS_SLOP = 10;   // 超过 10px 视为滑动，不当作点选

  enginePanel.addEventListener('pointerdown', (e) => {
    pressInfo = { x: e.clientX, y: e.clientY, id: e.pointerId, target: e.target, moved: false };
  });
  enginePanel.addEventListener('pointermove', (e) => {
    if (!pressInfo || e.pointerId !== pressInfo.id) return;
    if (Math.abs(e.clientX - pressInfo.x) > PRESS_SLOP ||
        Math.abs(e.clientY - pressInfo.y) > PRESS_SLOP) pressInfo.moved = true;
  });
  enginePanel.addEventListener('pointerup', (e) => {
    if (!pressInfo || e.pointerId !== pressInfo.id) return;
    const info = pressInfo;
    pressInfo = null;
    if (info.moved) return;                                  // 滑动 → 不选中
    if (longPressFired) { longPressFired = false; return; }   // 长按删除后不切换
    onPanelPress(info.target, e.pointerType);
  });
  enginePanel.addEventListener('pointercancel', () => { pressInfo = null; });

  // 触屏长按（删除按钮不易点时）也能删除
  let longPressTimer = null;
  let longPressFired = false;
  enginePanel.addEventListener('touchstart', (e) => {
    const item = e.target.closest('.engine-item.custom');
    if (!item || e.target.closest('.del')) return;
    longPressFired = false;
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      longPressFired = true;   // 标记已长按删除，抑制随后的点选切换
      deleteEngine(item.dataset.id);
    }, 600);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev =>
    enginePanel.addEventListener(ev, () => { clearTimeout(longPressTimer); longPressTimer = null; }, { passive: true })
  );

  // 没有 Pointer Events 的老浏览器退回 click（现代浏览器不会走到这里）
  if (!window.PointerEvent) {
    enginePanel.addEventListener('click', (e) => {
      if (longPressFired) { longPressFired = false; return; }
      onPanelPress(e.target, 'mouse');
    });
  }

  function onPanelPress(target, pointerType) {
    if (!target || !target.closest) return;
    // 删除自定义引擎
    const del = target.closest('.del');
    if (del) {
      deleteEngine(del.dataset.del);
      return;
    }
    // 打开添加表单
    if (target.closest('#engine-add')) {
      closeEnginePanel();
      openEngineForm();
      return;
    }
    const item = target.closest('.engine-item');
    if (!item) return;
    tabMode = null; // 手动选择引擎 = 退出临时搜索模式
    currentEngine = item.dataset.id;
    try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (err) {}
    renderEngineBtn();
    closeEnginePanel();
    // 触屏不主动聚焦输入框：否则键盘会立刻弹出（还会被随后的补发事件马上收回去，闪一下）
    if (pointerType !== 'touch') input.focus();
  }

  // 删除某个自定义引擎（若正被使用则回退默认引擎）
  function deleteEngine(id) {
    const listBefore = enginePanel.querySelector('.engine-list');
    const keepScroll = listBefore ? listBefore.scrollTop : 0;   // 重渲染会回到顶部，先记住位置
    customEngines = customEngines.filter(x => x.id !== id);
    saveCustom();
    if (currentEngine === id) {
      currentEngine = engines[0].id;
      try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (err) {}
      renderEngineBtn();
    }
    renderEnginePanel();
    const listAfter = enginePanel.querySelector('.engine-list');
    if (listAfter && keepScroll) listAfter.scrollTop = keepScroll;
  }

  /* ---------- 自定义引擎表单 ---------- */
  const formMask = document.getElementById('engine-form-mask');
  const efName = document.getElementById('ef-name');
  const efUrl = document.getElementById('ef-url');
  const efIcon = document.getElementById('ef-icon');
  const efMsg = document.getElementById('ef-msg');

  // 按当前语言填充表单文案（缺词条时回退英文）
  (function applyFormI18N() {
    const setText = (id, val) => { const el = document.getElementById(id); if (el && val) el.textContent = val; };
    setText('engine-form-title', T.formTitle || 'Add custom search engine');
    setText('ef-label-name', T.fieldName || 'Name');
    setText('ef-label-url', T.fieldUrl || 'Search URL (%s = keyword)');
    setText('ef-label-icon', T.fieldIcon || 'Icon URL (optional)');
    setText('ef-hint-icon', T.hintIcon || 'Image link or base64 data. Leave blank to use the default icon.');
    setText('ef-cancel', T.btnCancel || 'Cancel');
    setText('ef-save', T.btnSave || 'Save');
    efName.placeholder = T.hintExample || '';
  })();

  let formOpenedAt = 0;
  function openEngineForm() {
    efMsg.textContent = '';
    efMsg.classList.remove('ok');
    formMask.classList.add('show');
    formOpenedAt = Date.now();
    setTimeout(() => efName.focus(), 30);
  }

  function closeEngineForm() {
    formMask.classList.remove('show');
    document.getElementById('engine-form').reset();
    efMsg.textContent = '';
    efMsg.classList.remove('ok');
  }

  // 校验错误提示也跟随语言（缺失时用英文兜底）
  const ERRS = {
    zh: {
      name: '请填写名称',
      url: '网址需以 http:// 或 https:// 开头',
      ph: '网址里需要用 %s 表示关键词位置',
      dup: '已有同名引擎，请换个名称',
      domain: '该网站已有内置引擎，直接选择内置项即可',
      icon: '图标地址需是 http(s) 图片链接，或 data:image/ 开头的 base64'
    },
    en: {
      name: 'Please enter a name',
      url: 'URL must start with http:// or https://',
      ph: 'The URL must contain %s for the keyword',
      dup: 'An engine with this name already exists',
      domain: 'This site is already available as a built-in engine',
      icon: 'Icon must be an http(s) image link or a data:image/ base64 string'
    }
  };
  const E = ERRS[LANG] || ERRS.en;

  document.getElementById('engine-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = efName.value.trim();
    const url = efUrl.value.trim();
    if (!name) { efMsg.textContent = E.name; return; }
    if (!/^https?:\/\//i.test(url)) { efMsg.textContent = E.url; return; }
    if (url.indexOf('%s') < 0) { efMsg.textContent = E.ph; return; }
    // 图标可留空（用默认图标）；填了就必须是合法图片地址/base64
    const iconRaw = efIcon.value.trim();
    const icon = safeIconSrc(iconRaw);
    if (iconRaw && !icon) { efMsg.textContent = E.icon; return; }
    if (icon.length > 400000) { efMsg.textContent = E.icon; return; }
    // 名称去重：比对各语言下的所有名称（含内置引擎的多种译名）+ 已有自定义名，
    // 避免在中文界面下添加名为 "Bing" 的引擎而绕过检测
    const lower = name.toLowerCase();
    const dup = allEngines().some(x => {
      if (isCustom(x.id)) return (x.name || '').toLowerCase() === lower;
      // 内置引擎：检查它在所有语言包中的名字
      if (x.id.toLowerCase() === lower) return true;
      return Object.keys(I18N).some(lang => {
        const n = I18N[lang].engineNames && I18N[lang].engineNames[x.id];
        return n && n.toLowerCase() === lower;
      });
    });
    if (dup) { efMsg.textContent = E.dup; return; }
    // 与内置引擎同域名的自定义项会被去重隐藏，加了也不会生效，这里直接拦下
    const dom = rootDomain(url);
    if (dom && builtinDomains.indexOf(dom) > -1) { efMsg.textContent = E.domain; return; }

    const id = 'custom_' + Date.now().toString(36);
    const eng = { id: id, name: name, url: url, icon: icon };
    customEngines.push(eng);
    saveCustom();
    currentEngine = id; // 新增后直接启用
    try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (err) {}
    renderEngineBtn();
    closeEngineForm();
    input.focus();
  });

  document.getElementById('ef-cancel').addEventListener('click', closeEngineForm);
  // 触摸点按后浏览器会补发一次 mousedown；若这次补发正好落在刚弹出的遮罩上，
  // 表单会「刚打开就被关掉」——所以刚打开的头 350ms 内忽略遮罩点击。
  formMask.addEventListener('mousedown', (e) => {
    if (e.target === formMask && Date.now() - formOpenedAt > 350) closeEngineForm();
  });
  // Esc 关闭表单（表单内任何位置生效）
  formMask.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeEngineForm(); } });

  renderEngineBtn();

  /* ---------- 网址直跳：像 Edge 地址栏一样，输入明显是网址时直接打开 ---------- */
  // 常见顶级域名白名单（含 jype.top 这类新顶级域），避免把「报告.docx」之类的词误判成网址
  const COMMON_TLDS = new Set(('com,cn,net,org,gov,edu,mil,int,io,me,top,xyz,cc,co,info,biz,ai,app,dev,site,online,tech,club,vip,shop,store,space,pro,art,design,live,tv,fm,gg,gl,im,in,it,nl,se,no,fi,dk,es,pt,pl,cz,at,ch,eu,ca,au,nz,br,mx,id,th,vn,my,ph,tr,za,moe,icu,fun,wiki,ink,ltd,group,pub,link,click,one,red,blue,pink,email,blog,news,cloud,digital,center,systems,tools,network,media,games,game,rocks,wtf,lol,moe,asia,name,tel,mobi,cn.net,com.cn,net.cn,org.cn,gov.cn,edu.cn,hk,tw,mo,jp,kr,uk,us,de,fr,ru').split(','));
  function looksLikeUrl(q) {
    if (/\s/.test(q)) return false;                                   // 含空格肯定不是网址
    if (/^https?:\/\/\S+$/i.test(q)) return true;                     // 显式带协议
    if (/^localhost(?::\d+)?(?:[\/?#]\S*)?$/i.test(q)) return true;   // localhost
    if (/^\d{1,3}(?:\.\d{1,3}){3}(?::\d+)?(?:[\/?#]\S*)?$/.test(q)) return true; // IP 地址
    const host = q.split(/[\/?#]/)[0].split(':')[0];                  // 去掉路径、查询串和端口
    const labels = host.toLowerCase().split('.');
    if (labels.length < 2) return false;
    const tld = labels[labels.length - 1];
    if (!/^[a-z]{2,24}$/.test(tld) || !COMMON_TLDS.has(tld)) return false;
    // 域名部分必须是合法的 label 序列（字母数字连字符，不以连字符开头结尾）
    return labels.every(l => /^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(l));
  }

  // 补全协议后的完整网址
  function resolveUrl(q) {
    return /^https?:\/\//i.test(q) ? q : 'https://' + q;
  }
  function openUrl(q) {
    window.location.href = resolveUrl(q);
  }
  // 用当前引擎搜索（不包含网址判断——网址直跳只作为下拉框里的可选项）
  // 传 eng 参数时用指定引擎搜索，不改变默认引擎
  function doSearch(q, eng) {
    if (!q) return;
    const e = eng || activeEngineObj();
  // URL 中所有 %s 都替换为关键词（replaceAll 未兼容时用 split/join 兜底）
    const kw = encodeURIComponent(q);
    const tmpl = String(e.url || '');
    const target = tmpl.indexOf('%s') < 0 ? tmpl : tmpl.split('%s').join(kw);
    window.location.href = target;
  }
  // 执行一个联想条目（{type:'url'|'search', text}）
  function runItem(item) {
    if (!item) return;
    if (item.type === 'url') openUrl(item.text);
    else doSearch(item.text);
  }

  /* ---------- Tab 键临时搜索：输入某引擎的域名时，按 Tab 直接用它搜一次（不改默认引擎） ---------- */
  let tabEngId = null;
  const tabHintEl = document.getElementById('tab-hint');
  const engHostCache = new Map();
  function engineHost(eng) {
    if (engHostCache.has(eng.id)) return engHostCache.get(eng.id);
    let host = '';
    try {
      host = new URL(String(eng.url).replace('%s', 'x')).hostname.toLowerCase().replace(/^www\./, '');
    } catch (err) {}
    engHostCache.set(eng.id, host);
    return host;
  }
  // 引擎可接受的输入别名：内置引擎汇总所有语言包里的名字 + 常用中英文名；自定义引擎用其名称
  const aliasCache = new Map();
  function engineAliases(eng) {
    if (aliasCache.has(eng.id)) return aliasCache.get(eng.id);
    const set = new Set();
    const add = (v) => {
      if (typeof v !== 'string') return;
      const s = v.trim().toLowerCase();
      if (s.length >= 2) set.add(s);
    };
    if (isCustom(eng.id)) {
      add(eng.name);
    } else {
      add(eng.id); add(eng.zh); add(eng.en);
      Object.keys(I18N).forEach(lang => {
        const names = I18N[lang].engineNames;
        if (names) add(names[eng.id]);
      });
    }
    aliasCache.set(eng.id, set);
    return set;
  }

  function detectTabEngine(q) {
    const t = q.trim();
    if (!t) return null;
    // 1) 直接输入引擎名/别名也行（百度、google、必应、B站…），不必记域名
    const lower = t.toLowerCase();
    const byName = allEngines().find(e => e.id !== currentEngine && engineAliases(e).has(lower));
    if (byName) return byName;
    // 2) 输入该引擎的域名（含子域、地区后缀）
    if (!looksLikeUrl(t)) return null;
    let h;
    try { h = new URL(resolveUrl(t)).hostname.toLowerCase().replace(/^www\./, ''); } catch (err) { return null; }
    if (!h || h.indexOf('.') < 0) return null;
    // 后缀/前缀互配：tieba.baidu.com 匹配 baidu.com，bilibili.com 匹配 search.bilibili.com，
    // google.com.hk 匹配 google.com
    return allEngines().find(e => {
      if (e.id === currentEngine) return false; // 当前引擎不需要提示
      const eh = engineHost(e);
      if (!eh || eh.indexOf('.') < 0) return false;
      return h === eh || h.endsWith('.' + eh) || eh.endsWith('.' + h) || h.startsWith(eh + '.');
    }) || null;
  }
  function updateTabHint() {
    // 临时搜索模式下不显示 Tab 提示
    if (tabMode) {
      tabEngId = null;
      form.classList.remove('tab-active');
      tabHintEl.classList.remove('show');
      return;
    }
    const q = input.value.trim();
    const eng = detectTabEngine(q);
    tabEngId = eng ? eng.id : null;
    const on = !!eng;
    form.classList.toggle('tab-active', on);
    tabHintEl.classList.toggle('show', on);
    if (on) {
      const label = engineLabelOf(eng);
      tabHintEl.innerHTML = '<kbd>Tab</kbd>' + iconHTML(eng) + esc(T.sugSearch(label));
    }
  }
  // 退出临时搜索模式，恢复默认引擎的图标与占位符
  function exitTabMode() {
    if (!tabMode) return;
    tabMode = null;
    renderEngineBtn();
    updateTabHint();
  }
  input.addEventListener('blur', () => {
    // 失焦时收起提示并退出临时搜索模式（点击联想条目已 preventDefault 不会触发 blur）
    exitTabMode();
    tabEngId = null;
    form.classList.remove('tab-active');
    tabHintEl.classList.remove('show');
  });

  // 点击提交按钮时不要先让输入框失焦：失焦会退出 Tab 临时搜索模式，
  // 导致点箭头搜索变成用默认引擎（按回车没有这个问题）
  document.getElementById('search-btn').addEventListener('mousedown', (e) => e.preventDefault());

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) {
      // 空内容提交：晃一下提示，不打断输入
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
      input.focus();
      return;
    }
    doSearch(q);
  });
  form.addEventListener('animationend', (e) => {
    if (e.animationName === 'search-shake') form.classList.remove('shake');
  });

  /* ---------- 实时联想（JSONP，避免跨域限制） ---------- */
  let sugTimer = null;
  let sugItems = [];       // 当前联想词
  let activeIdx = -1;      // 键盘高亮索引
  let jsonpSeq = 0;        // 防止旧请求覆盖新结果
  let lastQuery = '';

  function hideSuggest() {
    // 只隐藏面板，保留 sugItems 缓存，点击搜索框时可以直接恢复显示
    panel.classList.remove('show');
    panel.innerHTML = '';
    actionItems = [];
    activeIdx = -1;
  }

  const ICON_URL_JUMP = '<svg viewBox="0 0 24 24"><path d="M7 17 17 7"></path><path d="M9 7h8v8"></path></svg>';
  const ICON_SEARCH = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>';

  let actionItems = [];    // 面板上实际展示的条目（特殊项 + 联想词），点击/回车按 type 执行

  function renderSuggest() {
    const q = input.value.trim();
    // 输入疑似网址时，在热词上方固定给出「打开网址」「用当前引擎搜索」两个选项，
    // 让用户自己决定是直跳还是搜索（联想词照常展示）；临时搜索模式下输入的是查询词，不显示
    const special = [];
    if (q && looksLikeUrl(q) && !tabMode) {
      special.push({ type: 'url', text: q });
      special.push({ type: 'search', text: q, isRaw: true });
    }
    if (!special.length && !sugItems.length) { hideSuggest(); return; }
    actionItems = special.concat(sugItems.map(s => ({ type: 'search', text: s })));
    const isUrlQ = q ? looksLikeUrl(q) : false;
    panel.innerHTML = actionItems.map((item, i) => {
      let icon = ICON_SEARCH, html;
      if (item.type === 'url') {
        // 特殊行：打开 <完整网址>
        icon = ICON_URL_JUMP;
        html = esc(T.sugOpen) + ' <b>' + esc(resolveUrl(item.text)) + '</b>';
      } else if (item.isRaw) {
        // 特殊行：<关键词> · 用当前引擎搜索
        html = '<b>' + esc(item.text) + '</b> · ' + esc(T.sugSearch(engineLabelOf(activeEngineObj())));
      } else {
        // 普通联想词：命中输入的部分加粗
        const s = item.text;
        if (q && !isUrlQ) {
          const idx = s.toLowerCase().indexOf(q.toLowerCase());
          if (idx >= 0) {
            // 在转义后的文本上按相同位置切分（esc 不改变原有字符的相对顺序，
            // 但会改变长度，故对三段分别转义后拼接更稳妥）
            html = esc(s.slice(0, idx)) + '<b>' + esc(s.slice(idx, idx + q.length)) + '</b>' + esc(s.slice(idx + q.length));
          } else {
            html = esc(s);
          }
        } else {
          html = esc(s);
        }
      }
      return '<div class="sug-item" data-i="' + i + '">' + icon + '<span>' + html + '</span></div>';
    }).join('');
    activeIdx = -1;
    panel.classList.add('show');
  }

  function setActive(i) {
    const items = panel.querySelectorAll('.sug-item');
    items.forEach(el => el.classList.remove('active'));
    activeIdx = i;
    if (i >= 0 && i < items.length) {
      items[i].classList.add('active');
      // 面板过长被滚动时，让键盘高亮项始终可见
      items[i].scrollIntoView({ block: 'nearest' });
    }
  }

  function fetchSuggest(q) {
    const seq = ++jsonpSeq;
    const cbName = '__sugCb' + seq; // 每个请求独立回调，避免并发互相污染
    const script = document.createElement('script');
    const timer = setTimeout(() => { delete window[cbName]; script.remove(); }, 3000);
    script.src = 'https://suggestion.baidu.com/su?wd=' + encodeURIComponent(q) + '&cb=' + cbName;
    script.onload = () => { clearTimeout(timer); delete window[cbName]; script.remove(); };
    script.onerror = () => { clearTimeout(timer); delete window[cbName]; script.remove(); hideSuggest(); };
    window[cbName] = function (data) {
      if (seq !== jsonpSeq) return; // 已有更新的请求，丢弃旧响应
      if (input.value.trim() !== q) return; // 输入框内容已变化（如已删空），丢弃过期响应
      // 兼容两种返回格式：{q:"..", p:false, s:[...]}（实测格式）和 [词, [...]]（旧格式）
      let arr = [];
      if (data && Array.isArray(data.s)) {
        arr = data.s;
      } else if (Array.isArray(data) && Array.isArray(data[1])) {
        arr = data[1];
      }
      sugItems = arr.filter(x => typeof x === 'string').slice(0, 8);
      renderSuggest();
    };
    document.body.appendChild(script);
  }

  input.addEventListener('focus', () => {
    closeEnginePanel(); // 聚焦搜索框时收起引擎面板，两个下拉不同时出现
    updateTabHint();
    // 点击搜索框时：有内容就恢复联想（优先用缓存，无缓存则重新请求）
    const q = input.value.trim();
    if (q) {
      if (sugItems.length || looksLikeUrl(q)) renderSuggest();
      else fetchSuggest(q);
    }
  });

  input.addEventListener('input', () => {
    closeEnginePanel(); // 开始输入时引擎面板让位给联想词
    updateTabHint();
    const q = input.value.trim();
    if (!q) {
      // 清空输入：除了隐藏面板，还要作废“迟到”的联想来源，
      // 否则删空文字后，之前请求的结果回来会把面板重新弹出来（bug 修复）
      lastQuery = '';
      clearTimeout(sugTimer); // 取消还没发出的防抖请求
      jsonpSeq++;             // 作废所有在途响应
      sugItems = [];          // 清掉旧词缓存，避免再次聚焦时显示上一个词的结果
      hideSuggest();
      return;
    }
    if (q === lastQuery) { renderSuggest(); return; } // 同词重新聚焦/输入时直接恢复
    lastQuery = q;
    // 疑似网址时立即显示「打开/搜索」两个固定选项，不等联想接口返回
    if (looksLikeUrl(q)) { sugItems = []; renderSuggest(); }
    clearTimeout(sugTimer);
    sugTimer = setTimeout(() => fetchSuggest(q), 120); // 轻微防抖
  });

  input.addEventListener('keydown', (e) => {
    // 中文/日文输入法组词中：回车、Tab、方向键都属于输入法，不要触发搜索或切引擎
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape') {
      // Esc 同时退出临时搜索模式并关闭所有弹层
      exitTabMode();
      hideSuggest(); closeEnginePanel(); return;
    }
    // Tab：输入了其他引擎的域名时进入该引擎的临时搜索模式（Edge 同款）：
    // 清空输入让你接着输入想搜的内容，回车后用该引擎搜索，不改变默认引擎
    if (e.key === 'Tab' && tabEngId) {
      e.preventDefault();
      const eng = allEngines().find(x => x.id === tabEngId);
      if (eng) {
        tabMode = eng;
        input.value = '';
        lastQuery = '';
        sugItems = [];
        hideSuggest();
        updateTabHint();
        renderEngineBtn(); // 图标与占位符切到临时引擎
        input.focus();
      }
      return;
    }
    if (!panel.classList.contains('show')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActive((activeIdx + 1) % actionItems.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActive((activeIdx - 1 + actionItems.length) % actionItems.length);
    } else if (e.key === 'Enter' && activeIdx >= 0) {
      e.preventDefault();
      runItem(actionItems[activeIdx]);
    }
  });

  panel.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.sug-item');
    if (item) {
      e.preventDefault(); // 防止 input 失焦
      runItem(actionItems[+item.dataset.i]);
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      hideSuggest();
      closeEnginePanel();
      return;
    }
    // 点在搜索框之类的地方（不是引擎面板/按钮本身）时，引擎面板也要收起
    if (!e.target.closest('#engine-panel') && !e.target.closest('#engine-btn')) closeEnginePanel();
  });

  // Esc 关闭浮层：不依赖焦点位置（焦点在按钮/面板/页面上都能关）
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (formMask.classList.contains('show')) { closeEngineForm(); e.stopPropagation(); return; }
    if (enginePanel.classList.contains('show')) { closeEnginePanel(); e.stopPropagation(); return; }
    hideSuggest();
  });

  /* ================= 外观设置：主题三态 + 图片/视频背景（右键菜单） ================= */
  const THEME_KEY = 'homepage.theme';       // 'system' | 'light' | 'dark'
  const BGMETA_KEY = 'homepage.bgmeta';     // { type:'image'|'video', name:'...' }
  const BGPREVIEW_KEY = 'homepage.bgpreview'; // 低清预览 data URL：首屏同步上屏用，防黑屏
  const BGBRIGHT_KEY = 'homepage.bgbright';   // '1' = 壁纸偏亮：用暗色玻璃保证白字可读（首帧先用缓存值）
  const root = document.documentElement;

  /* ---- 主题 ---- */
  let themeMode = 'system';
  try {
    const t = localStorage.getItem(THEME_KEY);
    if (t === 'light' || t === 'dark' || t === 'system') themeMode = t;
  } catch (err) {}

  function applyTheme(mode) {
    themeMode = mode;
    // system 时移除 data-theme，交回给 prefers-color-scheme 媒体查询
    if (mode === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    try { localStorage.setItem(THEME_KEY, mode); } catch (err) {}
  }
  applyTheme(themeMode);

  /* ---- 显示模式（四选一，互斥）：system/light/dark = 纯色主题；media = 图片/视频背景 ---- */
  const MODE_KEY = 'homepage.mode';
  let displayMode = (() => {
    try {
      const m = localStorage.getItem(MODE_KEY);
      if (m === 'system' || m === 'light' || m === 'dark' || m === 'media') return m;
      // 旧版本没有 mode 键：如果存过背景媒体，视为正在使用媒体背景
      return readBgMeta() ? 'media' : 'system';
    } catch (err) { return 'system'; }
  })();
  function saveMode() {
    try { localStorage.setItem(MODE_KEY, displayMode); } catch (err) {}
  }
  // 菜单点击：切到主题模式 → 停掉媒体背景显示（文件保留，随时可切回来）
  function setThemeMode(mode) {
    applyTheme(mode);
    displayMode = mode;
    saveMode();
    stopBgDisplay();
  }

  /* ---- 背景媒体存储（IndexedDB 存 Blob，元信息存 localStorage） ---- */
  const DB_NAME = 'homepage-bg';
  const DB_STORE = 'media';
  const BG_MAGIC = 'current';
  let bgObjectUrl = null;

  function idbOpen() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('no-idb')); return; }
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('idb-open'));
    });
  }
  function idbRun(mode, fn) {
    return idbOpen().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, mode);
      const store = tx.objectStore(DB_STORE);
      const req = fn(store);
      tx.oncomplete = () => { db.close(); resolve(req && req.result); };
      tx.onerror = () => { db.close(); reject(tx.error || new Error('idb-tx')); };
    }));
  }
  const idbPut = (blob) => idbRun('readwrite', (s) => s.put(blob, BG_MAGIC));
  const idbGet = () => idbRun('readonly', (s) => s.get(BG_MAGIC));
  const idbDel = () => idbRun('readwrite', (s) => s.delete(BG_MAGIC));

  function readBgMeta() {
    try {
      const raw = localStorage.getItem(BGMETA_KEY);
      if (!raw) return null;
      const m = JSON.parse(raw);
      return m && (m.type === 'image' || m.type === 'video') ? m : null;
    } catch (err) { return null; }
  }
  function saveBgMeta(meta) {
    try {
      if (meta) localStorage.setItem(BGMETA_KEY, JSON.stringify(meta));
      else {
        localStorage.removeItem(BGMETA_KEY);
        localStorage.removeItem(BGPREVIEW_KEY); // 预览跟着 meta 一起失效，避免残留
      }
    } catch (err) {}
  }

  const bgMedia = document.getElementById('bg-media');

  /* ---- 背景调节：模糊 / 缩放 / 亮度（持久化到 localStorage） ---- */
  const BGFX_KEY = 'homepage.bgfx';
  const BG_FX_DEFAULT = { blur: 0, scale: 100, bright: 100 };
  const BG_FX_RANGE = { blur: [0, 24, 'px'], scale: [100, 200, '%'], bright: [40, 140, '%'] };

  function readBgFx() {
    try {
      const o = JSON.parse(localStorage.getItem(BGFX_KEY) || 'null');
      return o && typeof o === 'object' ? o : null;
    } catch (err) { return null; }
  }
  const bgFx = Object.assign({}, BG_FX_DEFAULT, readBgFx() || {});
  // 数值兜底，防止手工改坏 localStorage 后样式失效
  Object.keys(BG_FX_RANGE).forEach((k) => {
    const r = BG_FX_RANGE[k];
    const v = Number(bgFx[k]);
    bgFx[k] = isFinite(v) ? Math.min(r[1], Math.max(r[0], Math.round(v))) : BG_FX_DEFAULT[k];
  });

  function saveBgFx() {
    try { localStorage.setItem(BGFX_KEY, JSON.stringify(bgFx)); } catch (err) {}
  }

  function applyBgFx() {
    // 预览图和全量媒体都要应用，过渡切换时两者视觉保持一致
    const els = bgMedia.querySelectorAll('img, video');
    const blur = bgFx.blur, scale = bgFx.scale, bright = bgFx.bright;
    // 模糊会让画面边缘渗出一圈透明，按模糊量补偿一点放大，避免出现暗边
    const s = (scale / 100) * (1 + blur / 160);
    const t = 'scale(' + s.toFixed(3) + ')';
    const f = 'blur(' + blur + 'px) brightness(' + (bright / 100) + ')';
    els.forEach((el) => {
      el.style.transformOrigin = 'center center';
      el.style.transform = t;
      el.style.filter = f;
    });
    updateBrightClass(); // 用户调亮度会影响可读性，同步重判亮/暗玻璃
  }

  /* ---- 低清预览缓存：把背景缩成 1280px JPEG 存 localStorage，下次打开同步上屏 ---- */
  function makePreviewDataUrl(el) {
    try {
      const w = el.naturalWidth || el.videoWidth;
      const h = el.naturalHeight || el.videoHeight;
      if (!w || !h) return null;
      const MAX = 1280;
      const scale = Math.min(1, MAX / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * scale));
      c.height = Math.max(1, Math.round(h * scale));
      c.getContext('2d').drawImage(el, 0, 0, c.width, c.height);
      let url = c.toDataURL('image/jpeg', 0.72);
      if (url.length > 2 * 1024 * 1024) url = c.toDataURL('image/jpeg', 0.45);
      if (url.length > 2 * 1024 * 1024) return null; // 超出预算就放弃缓存，宁缺勿溢
      return url;
    } catch (err) { return null; } // 跨域/编解码失败等情况，静默跳过
  }
  function saveBgPreview(url) {
    if (!url) return;
    try { localStorage.setItem(BGPREVIEW_KEY, url); } catch (err) {}
  }
  function paintPreviewFromCache() {
    if (bgMedia.querySelector('.bg-preview')) return;
    let raw = null;
    try { raw = localStorage.getItem(BGPREVIEW_KEY); } catch (err) {}
    if (!raw) return;
    const img = document.createElement('img');
    img.className = 'bg-preview';
    img.alt = '';
    img.src = raw;
    bgMedia.appendChild(img);
    bgMedia.classList.add('on');
    root.classList.add('bg-on');
    applyBgFx();
  }
  function clearBgPreview() {
    const p = bgMedia.querySelector('.bg-preview');
    if (p) p.remove();
    if (!bgMedia.querySelector('img, video')) {
      bgMedia.classList.remove('on');
      root.classList.remove('bg-on');
    }
  }

  /* ---- 壁纸亮度检测：亮壁纸时自动切到暗色玻璃（bg-bright），白字才看得清 ---- */
  let bgLum = null;         // 当前壁纸平均亮度 0~1（Rec.709 加权）
  let bgBrightTimer = null; // 视频背景定期复检

  function sampleLuminance(el) {
    try {
      const w = el.naturalWidth || el.videoWidth;
      const h = el.naturalHeight || el.videoHeight;
      if (!w || !h) return null;
      const c = document.createElement('canvas');
      c.width = 32;
      c.height = 32;
      const ctx = c.getContext('2d');
      ctx.drawImage(el, 0, 0, 32, 32); // 缩成 32x32 采样，开销可忽略
      const d = ctx.getImageData(0, 0, 32, 32).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) {
        sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
      }
      return sum / (d.length / 4) / 255;
    } catch (err) { return null; }
  }

  function updateBrightClass() {
    if (bgLum == null) return;
    // 叠加用户调节的亮度后再判断；0.62 / 0.48 双阈值滞回，避免临界壁纸来回切换闪烁
    const eff = bgLum * (bgFx.bright / 100);
    const isBright = root.classList.contains('bg-bright');
    if (!isBright && eff >= 0.62) root.classList.add('bg-bright');
    else if (isBright && eff < 0.48) root.classList.remove('bg-bright');
    try { localStorage.setItem(BGBRIGHT_KEY, root.classList.contains('bg-bright') ? '1' : '0'); } catch (err) {}
  }

  function refreshBgLuminance(el) {
    const lum = sampleLuminance(el);
    if (lum != null) { bgLum = lum; updateBrightClass(); }
  }

  function stopBgBrightWatch() {
    if (bgBrightTimer) { clearInterval(bgBrightTimer); bgBrightTimer = null; }
  }

  function paintBg(type, blob, fresh) {
    if (bgObjectUrl) { URL.revokeObjectURL(bgObjectUrl); bgObjectUrl = null; }
    stopBgBrightWatch();
    bgObjectUrl = URL.createObjectURL(blob);
    const oldPreview = bgMedia.querySelector('.bg-preview'); // 首屏预览，垫底续显
    bgMedia.innerHTML = '';
    let el;
    if (type === 'video') {
      el = document.createElement('video');
      el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true;
    } else {
      el = document.createElement('img');
      el.alt = '';
    }
    el.src = bgObjectUrl;
    if (oldPreview) bgMedia.appendChild(oldPreview); // 预览继续垫在底下，直到全量可显示
    bgMedia.appendChild(el);
    bgMedia.classList.add('on');
    root.classList.add('bg-on'); // 搜索框 / 时钟透明化 + 文字反白
    applyBgFx(); // 恢复上次的模糊/缩放/亮度
    // 全量媒体可显示后再撤预览，避免切换瞬间闪黑
    const dropPreview = () => { if (oldPreview && oldPreview.parentNode) oldPreview.remove(); };
    const cachePreview = () => {
      try { if (!fresh && localStorage.getItem(BGPREVIEW_KEY)) return; } catch (err) { return; }
      saveBgPreview(makePreviewDataUrl(el));
    };
    // 壁纸亮度检测：全量媒体就绪后采样（比首屏预览更准），视频还要定期复检
    const probe = () => { refreshBgLuminance(el); };
    if (type === 'video') {
      el.addEventListener('loadeddata', dropPreview, { once: true });
      el.addEventListener('loadeddata', cachePreview, { once: true });
      el.addEventListener('loadeddata', () => {
