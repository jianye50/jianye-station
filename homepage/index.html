    site: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg>',
    comp: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>',
    replay: '<svg viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.2"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>'
  };
  // 带返回箭头的视图头部（backAct 决定点了回到哪一层）
  function ctxBackHeader(backAct, label) {
    return '<button type="button" class="ctx-item ctx-lang-head" role="menuitem" data-act="' + backAct + '">' +
      '<span class="ctx-back">‹</span><span>' + esc(label) + '</span></button>';
  }
  // 带图标的可点击动作条目（无子菜单）
  function ctxActionEntry(act, icon, label) {
    return '<button type="button" class="ctx-item" role="menuitem" data-act="' + act + '">' +
      '<span class="ctx-icon">' + icon + '</span><span>' + esc(label) + '</span></button>';
  }
  // 带图标的下钻条目（右侧 › 箭头，haspopup）
  function ctxNavEntry(act, icon, label) {
    return '<button type="button" class="ctx-item" role="menuitem" aria-haspopup="menu" data-act="' + act + '">' +
      '<span class="ctx-icon">' + icon + '</span><span>' + esc(label) + '</span>' +
      '<span class="ctx-chev" style="margin-left:auto">›</span></button>';
  }
  // 主菜单里的「更多」入口
  function moreEntryHTML() {
    const t = moreText();
    return ctxNavEntry('more', CTX_ICONS.more, t.more);
  }
  // 二级视图：分享 / 访问作者小站 / 组件
  function renderCtxMoreMenu() {
    const t = moreText();
    ctxMenu.classList.remove('lang-open');
    ctxMenu.innerHTML =
      ctxBackHeader('more:back', t.more) +
      '<div class="ctx-sep"></div>' +
      ctxActionEntry('more:share', CTX_ICONS.share, t.share) +
      ctxActionEntry('more:site', CTX_ICONS.site, t.site) +
      '<div class="ctx-sep"></div>' +
      ctxItem('festival', t.festival, festivalEnabled, false) +
      (activeFestival && festivalEnabled && !reducedMotion && !fRunning && animPlayedThisYear(activeFestival.id, new Date().getFullYear()) ? ctxActionEntry('festival:replay', CTX_ICONS.replay, t.replayAnim) : '') +
      '<div class="ctx-sep"></div>' +
      ctxNavEntry('comp', CTX_ICONS.comp, t.components);
    ctxMenu.scrollTop = 0;
    syncCtxScroll();
  }
  // 三级视图：组件显示开关（时钟 / 日期）
  function renderCtxCompMenu() {
    const t = moreText();
    ctxMenu.classList.remove('lang-open');
    ctxMenu.innerHTML =
      ctxBackHeader('comp:back', t.components) +
      '<div class="ctx-sep"></div>' +
      ctxItem('comp:clock', t.clock, compState.clock, false) +
      ctxItem('comp:date', t.date, compState.date, false);
    ctxMenu.scrollTop = 0;
    syncCtxScroll();
  }

  function paintFxTrack(r) {
    const range = BG_FX_RANGE[r.dataset.fx];
    if (!range) return;
    const pct = (Number(r.value) - range[0]) / (range[1] - range[0]) * 100;
    r.style.setProperty('--fx-pct', pct.toFixed(2) + '%');
  }

  let ctxCloseTimer = null;
  let ctxAnchor = { x: 0, y: 0 };

  // 按锚点摆放菜单：用布局尺寸（入场 scale 不会影响 offsetWidth/Height）
  function placeCtxMenu() {
    const pad = 8;
    const mw = ctxMenu.offsetWidth;
    const mh = ctxMenu.offsetHeight;
    const left = Math.max(pad, Math.min(ctxAnchor.x, window.innerWidth - mw - pad));
    const top = Math.max(pad, Math.min(ctxAnchor.y, window.innerHeight - mh - pad));
    ctxMenu.style.left = left + 'px';
    ctxMenu.style.top = top + 'px';
    // 从鼠标落点处展开，而不是永远从左上角
    ctxMenu.style.setProperty('--ctx-origin', (ctxAnchor.x - left) + 'px ' + (ctxAnchor.y - top) + 'px');
  }

  // 用 offsetTop/offsetHeight 计算真实内容高度：这两个值不受入场动画的
  // translateY 影响，因此不会出现“动画时先闪一下滚动条、展开后又消失”
  function syncCtxScroll() {
    if (!ctxOpen) return;
    const padBottom = parseFloat(getComputedStyle(ctxMenu).paddingBottom) || 0;
    let contentH = 0;
    for (let i = 0; i < ctxMenu.children.length; i++) {
      const el = ctxMenu.children[i];
      contentH = Math.max(contentH, el.offsetTop + el.offsetHeight);
    }
    ctxMenu.classList.toggle('scrollable', contentH + padBottom > ctxMenu.clientHeight + 1);
  }

  function openCtxMenu(x, y) {
    clearTimeout(ctxCloseTimer);
    ctxAnchor = { x: x, y: y };
    // 重新打开时重置状态，让入场动画从头播放（避免菜单还开着时再次右键没有动效）
    ctxMenu.classList.remove('show', 'closing');
    renderCtxMenu();
    void ctxMenu.offsetWidth;
    ctxMenu.classList.add('show');
    ctxMenu.setAttribute('aria-hidden', 'false');
    ctxOpen = true;
    placeCtxMenu();
    syncCtxScroll();
  }

  function closeCtxMenu() {
    if (!ctxOpen) return;
    ctxOpen = false;
    ctxMenu.setAttribute('aria-hidden', 'true');
    // 尊重“减少动态效果”：直接收起，不做退场动画
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      ctxMenu.classList.remove('show', 'closing');
      return;
    }
    ctxMenu.classList.add('closing');
    clearTimeout(ctxCloseTimer);
    ctxCloseTimer = setTimeout(() => {
      ctxMenu.classList.remove('show', 'closing');
    }, 180);
  }

  document.addEventListener('contextmenu', (e) => {
    // 输入框里也接管，保持网页内体验统一
    e.preventDefault();
    // 添加引擎的表单是模态的，浮动菜单不应盖在它上面
    if (formMask.classList.contains('show')) return;
    hideSuggest();
    closeEnginePanel();
    openCtxMenu(e.clientX, e.clientY);
  });

  ctxMenu.addEventListener('click', (e) => {
    const btn = e.target.closest('.ctx-item');
    if (!btn) return;
    const act = btn.dataset.act || '';
    // 语言二级视图：进入 / 返回都不关闭菜单
    if (act === 'lang') {
      e.stopPropagation(); // 重渲染后 target 会脱离 DOM，不能让它冒泡到“点击外部关闭”的监听
      renderCtxLangMenu();
      placeCtxMenu();
      return;
    }
    if (act === 'lang:back') {
      e.stopPropagation();
      renderCtxMenu();
      placeCtxMenu();
      syncCtxScroll();
      return;
    }
    if (act === 'lang:auto') {
      e.stopPropagation();
      try { localStorage.removeItem('homepage.lang'); } catch (err) {}
      location.reload(); // 清掉偏好，回到跟随浏览器
      return;
    }
    if (act.indexOf('lang:') === 0) {
      e.stopPropagation();
      const id = act.slice(5);
      if (I18N[id]) {
        try { localStorage.setItem('homepage.lang', id); } catch (err) {}
        location.reload(); // 整页文案与阅读方向都需要切换，直接重载最稳
      }
      return;
    }
    // 节日彩蛋：即时切换，不关闭菜单，重绘「更多」视图以更新勾选（停留在当前视图）
    if (act === 'festival') {
      e.stopPropagation();
      festivalEnabled = !festivalEnabled;
      saveFestivalEnabled();
      refreshFestival(new Date());
      renderCtxMoreMenu();
      placeCtxMenu();
      syncCtxScroll();
      return;
    }
    // 再看一遍动画特效：立即重播当前节日动画（不清标记，下次打开仍只展示文案+光效）
    if (act === 'festival:replay') {
      e.stopPropagation();
      if (activeFestival && activeFestival.effects && activeFestival.effects.particles) {
        startParticles(activeFestival.effects.particles, activeFestival.effects.accent);
      }
      closeCtxMenu();
      return;
    }
    // 「更多」二级视图：进入 / 返回不关闭菜单
    if (act === 'more') {
      e.stopPropagation();
      renderCtxMoreMenu();
      placeCtxMenu();
      return;
    }
    if (act === 'more:back') {
      e.stopPropagation();
      renderCtxMenu();
      placeCtxMenu();
      syncCtxScroll();
      return;
    }
    // 「组件」三级视图：进入 / 返回不关闭菜单
    if (act === 'comp') {
      e.stopPropagation();
      renderCtxCompMenu();
      placeCtxMenu();
      return;
    }
    if (act === 'comp:back') {
      e.stopPropagation();
      renderCtxMoreMenu();
      placeCtxMenu();
      return;
    }
    // 分享：优先调用系统原生分享，不支持时复制链接，最后回退打开页面
    if (act === 'more:share') {
      e.stopPropagation();
      const shareData = { title: document.title, url: SHARE_URL };
      if (navigator.share) {
        // navigator.share 需在用户手势同步上下文调用，右键点击满足
        navigator.share(shareData).catch(() => { /* 用户取消或失败，静默 */ });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(SHARE_URL)
          .then(() => toast('🔗 ' + SHARE_URL))
          .catch(() => window.open(SHARE_URL, '_blank', 'noopener,noreferrer'));
      } else {
        window.open(SHARE_URL, '_blank', 'noopener,noreferrer');
      }
      closeCtxMenu();
      return;
    }
    if (act === 'more:site') {
      e.stopPropagation();
      window.open(SITE_URL, '_blank', 'noopener,noreferrer');
      closeCtxMenu();
      return;
    }
    // 组件开关：即时生效且不关闭菜单，方便连续切换
    if (act === 'comp:clock' || act === 'comp:date') {
      e.stopPropagation();
      toggleComp(act.slice(5)); // 'clock' 或 'date'
      renderCtxCompMenu();
      placeCtxMenu();
      syncCtxScroll();
      return;
    }
    if (act.indexOf('theme:') === 0) {
      setThemeMode(act.slice(6));
    } else if (act === 'bg:media') {
      if (displayMode === 'media') {
        bgFileInput.click(); // 已在媒体模式 → 打开选择器换一个文件
      } else {
        // 从主题切回媒体模式：有存过的文件直接恢复显示，没有才弹选择器
        showStoredBg().then(ok => {
          if (ok) { displayMode = 'media'; saveMode(); }
          else bgFileInput.click();
        });
      }
    } else if (act === 'fx:reset') {
      Object.keys(BG_FX_DEFAULT).forEach((k) => { bgFx[k] = BG_FX_DEFAULT[k]; });
      applyBgFx();
      saveBgFx();
    }
    closeCtxMenu();
  });

  // 拖动滑块：实时生效 + 持久化（不重渲染菜单，避免拖动被打断）
  ctxMenu.addEventListener('input', (e) => {
    const r = e.target;
    const key = r && r.dataset ? r.dataset.fx : '';
    if (!key || !BG_FX_RANGE[key]) return;
    bgFx[key] = Number(r.value);
    paintFxTrack(r);
    const out = ctxMenu.querySelector('[data-val="' + key + '"]');
    if (out) {
      out.textContent = r.value + BG_FX_RANGE[key][2];
      // 重启数值弹跳动画（强制回流，连续拖动每次都有反馈）
      out.classList.remove('bump');
      void out.offsetWidth;
      out.classList.add('bump');
    }
    applyBgFx();
    saveBgFx();
  });

  document.addEventListener('click', (e) => {
    // 菜单内部交互可能重渲染内容，target 已脱离文档时不能当成“点了外面”
    if (e.target && e.target.closest && e.target.closest('#ctx-menu')) return;
    if (e.target instanceof Node && !e.target.isConnected) return;
    closeCtxMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && ctxOpen) { closeCtxMenu(); e.stopPropagation(); }
  }, true);
  window.addEventListener('resize', () => { closeCtxMenu(); closeEnginePanel(); });
  window.addEventListener('blur', closeCtxMenu);
</script>
</body>
</html>
