<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户VIP状态查询｜Jianye</title>
<style>
:root{
    --bg:#0b0d13;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.10);
    --text:#eef0f6;
    --muted:#9aa1b5;
    --accent:#4f7cff;
    --accent2:#8b5cf6;
    --green:#4ade80;
    --red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
html,body{height:100%;}
body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    overflow-x:hidden;
    position:relative;
}

/* 背景光斑 */
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 14s ease-in-out infinite;}
.orb1{width:420px;height:420px;background:#3b63e8;top:-120px;left:-100px;}
.orb2{width:380px;height:380px;background:#7c3aed;bottom:-120px;right:-90px;animation-delay:-7s;}
@keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(40px,30px) scale(1.08);}
}
/* 细网格 */
body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 75%);
}

.wrap{
    position:relative;z-index:1;
    width:100%;max-width:460px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:40px 32px 32px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
    animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes fadeUp{
    from{opacity:0;transform:translateY(24px);}
    to{opacity:1;transform:translateY(0);}
}

.head{text-align:center;margin-bottom:30px;animation:fadeUp .6s .05s cubic-bezier(.22,1,.36,1) both;}
.logo{
    width:46px;height:46px;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;
    border-radius:14px;font-size:22px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 22px rgba(79,124,255,.35);
}
.head h1{
    font-size:24px;font-weight:700;letter-spacing:.5px;
    background:linear-gradient(90deg,#fff,#c8d2ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
}
.head .sub{margin-top:8px;font-size:13px;color:var(--muted);}

.form-item{margin-bottom:18px;animation:fadeUp .6s .12s cubic-bezier(.22,1,.36,1) both;}
.form-item:nth-of-type(2){animation-delay:.18s;}
label{display:block;margin-bottom:8px;font-size:13px;color:var(--muted);letter-spacing:.3px;}

.field{position:relative;}
input[type="text"],input[type="password"]{
    width:100%;
    padding:14px 16px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-size:15px;
    outline:none;
    transition:border-color .25s,box-shadow .25s,background .25s;
}
input::placeholder{color:#6b7286;}
input:focus{
    border-color:var(--accent);
    background:rgba(79,124,255,.06);
    box-shadow:0 0 0 4px rgba(79,124,255,.15);
}

.btn{
    position:relative;
    width:100%;
    padding:14px;
    border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-size:15px;font-weight:600;letter-spacing:.5px;
    cursor:pointer;
    transition:transform .2s,box-shadow .2s,filter .2s;
    box-shadow:0 10px 24px rgba(79,124,255,.30);
    animation:fadeUp .6s .24s cubic-bezier(.22,1,.36,1) both;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(79,124,255,.42);filter:brightness(1.06);}
.btn:active{transform:translateY(0) scale(.98);}
.btn:disabled{opacity:.7;cursor:not-allowed;transform:none;}
.btn .spin{
    display:inline-block;width:15px;height:15px;margin-right:8px;vertical-align:-2px;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
    animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.msg-error{
    margin-top:18px;padding:13px 15px;
    background:rgba(248,113,113,.10);
    border:1px solid rgba(248,113,113,.25);
    border-radius:12px;color:var(--red);font-size:14px;
}
.msg-error.shake{animation:shake .4s ease;}
@keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(5px);}
}

.card-info{
    margin-top:22px;padding:22px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    border-radius:16px;
}
.card-info.show{animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;}
@keyframes cardIn{
    from{opacity:0;transform:translateY(16px) scale(.98);}
    to{opacity:1;transform:translateY(0) scale(1);}
}
.card-info h4{font-size:16px;margin-bottom:14px;color:#fff;}
.info-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);
    animation:rowIn .45s both;
}
.info-row:last-child{border-bottom:none;}
.info-row:nth-child(2){animation-delay:.05s;}
.info-row:nth-child(3){animation-delay:.10s;}
.info-row:nth-child(4){animation-delay:.15s;}
.info-row:nth-child(5){animation-delay:.20s;}
@keyframes rowIn{from{opacity:0;transform:translateX(10px);}to{opacity:1;transform:translateX(0);}}
.label-text{color:var(--muted);font-size:14px;}
.value-text{font-size:14px;font-weight:500;}

.tag{display:inline-block;padding:4px 12px;border-radius:8px;font-size:13px;font-weight:600;}
.vip-tag{background:rgba(74,222,128,.14);color:var(--green);box-shadow:0 0 16px rgba(74,222,128,.15) inset;}
.normal-tag{background:rgba(255,255,255,.08);color:var(--muted);}
.expired-tag{background:rgba(248,113,113,.14);color:var(--red);}

@media (max-width:480px){
    .wrap{padding:32px 22px 24px;border-radius:18px;}
    .head h1{font-size:21px;}
}
</style>
</head>
<body>
<div class="orbs"><span class="orb orb1"></span><span class="orb orb2"></span></div>

<main class="wrap">
    <header class="head">
        <div class="logo">◆</div>
        <h1>用户VIP状态查询</h1>
        <p class="sub">登录以查看你的会员状态</p>
    </header>

    <div class="form-item">
        <label>用户名称</label>
        <div class="field"><input type="text" id="username" placeholder="请输入用户名" autocomplete="off"></div>
    </div>
    <div class="form-item">
        <label>密码</label>
        <div class="field"><input type="password" id="password" placeholder="请输入密码"></div>
    </div>

    <button class="btn" id="submitBtn" onclick="searchUser()">查询用户信息</button>

    <div id="errBox" class="msg-error" hidden></div>

    <section id="resultBox" class="card-info" hidden>
        <h4>查询结果</h4>
        <div class="info-row">
            <span class="label-text">用户名</span>
            <span class="value-text" id="r-name"></span>
        </div>
        <div class="info-row">
            <span class="label-text">VIP状态</span>
            <span id="r-vip"></span>
        </div>
        <div class="info-row">
            <span class="label-text">VIP到期时间</span>
            <span class="value-text" id="r-expire"></span>
        </div>
        <div class="info-row">
            <span class="label-text">备注</span>
            <span class="value-text" id="r-note"></span>
        </div>
    </section>
</main>

<script>
// 与 hash.html 保持一致：盐值、迭代次数、算法都不能改，否则校验失败
const SALT = 'jype-top-salt-2026';
const ITERATIONS = 100000;

// 单向哈希：PBKDF2-SHA256，无法从结果反推原密码
async function hashPassword(password){
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveBits']
    );
    const bits = await crypto.subtle.deriveBits(
        {name:'PBKDF2', salt:enc.encode(SALT), iterations:ITERATIONS, hash:'SHA-256'},
        keyMaterial, 256
    );
    return btoa(String.fromCharCode(...new Uint8Array(bits)));
}

function parseDate(str){
    const parts = str.trim().split(/[-/]/);
    if(parts.length !== 3) return null;
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10) - 1;
    const d = parseInt(parts[2], 10);
    if(isNaN(y) || isNaN(m) || isNaN(d)) return null;
    return new Date(y, m, d);
}

function showError(msg){
    const errBox = document.getElementById('errBox');
    errBox.innerText = msg;
    errBox.hidden = false;
    errBox.classList.remove('shake');
    void errBox.offsetWidth; // 重启动画
    errBox.classList.add('shake');
}

async function searchUser(){
    const nameInput = document.getElementById('username').value.trim();
    const passInput = document.getElementById('password').value;
    const errBox = document.getElementById('errBox');
    const resultBox = document.getElementById('resultBox');
    const btn = document.getElementById('submitBtn');
    errBox.hidden = true;
    resultBox.hidden = true;

    if(!nameInput || !passInput){
        showError("请输入用户名和密码");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>查询中…';

    try{
        const res = await fetch('./users.txt');
        const text = await res.text();
        const lines = text.split('\n');
        let target = null;

        for(let line of lines){
            line = line.trim();
            if(!line || line.startsWith('#')) continue; // 跳过注释和空行
            const arr = line.split('|');
            if(arr[0].trim() === nameInput){
                target = {
                    username: arr[0].trim(),
                    hash: arr[1]?.trim() || '',
                    vip: arr[2]?.trim() || '普通用户',
                    expire: arr[3]?.trim() || '',
                    note: arr[4]?.trim() || '无'
                };
                break;
            }
        }

        if(!target){
            showError("用户名或密码错误");
            return;
        }

        const inputHash = await hashPassword(passInput);
        if(inputHash !== target.hash){
            showError("用户名或密码错误");
            return;
        }

        const today = new Date();
        const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const expireDate = target.expire ? parseDate(target.expire) : null;
        const isPermanent = target.expire === '永久';
        const isExpired = !isPermanent && expireDate !== null && expireDate < today0;

        let vipHtml;
        if(target.vip !== 'VIP'){
            vipHtml = '<span class="tag normal-tag">普通用户</span>';
        }else if(isPermanent){
            vipHtml = '<span class="tag vip-tag">永久VIP</span>';
        }else if(isExpired){
            vipHtml = '<span class="tag expired-tag">已过期</span>';
        }else{
            vipHtml = '<span class="tag vip-tag">VIP会员</span>';
        }

        document.getElementById('r-name').innerText = target.username;
        document.getElementById('r-vip').innerHTML = vipHtml;
        document.getElementById('r-expire').innerText = target.expire || '无';
        document.getElementById('r-note').innerText = target.note || '无';
        resultBox.hidden = false;
        resultBox.classList.add('show');
    }catch(e){
        showError("配置文件读取失败，请检查部署环境");
    }finally{
        btn.disabled = false;
        btn.innerText = "查询用户信息";
    }
}

// 回车提交
document.getElementById('password').addEventListener('keydown', e => {
    if(e.key === 'Enter') searchUser();
});
</script>
</body>
</html>
