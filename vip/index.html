<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<meta name="robots" content="noindex,nofollow">
<title>VIP 查询 · 鉴业の小站</title>
<style>
/* =====================================================================
 * 鉴业VIP查询系统 · 用户查询页
 * 设计语言完全对齐「鉴业の小站」主站：
 *   深色底 + 液态玻璃卡片 + #4d8dff 主色 + 彩虹流光主按钮
 * ===================================================================== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
         "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --radius:20px;
  --accent:#4d8dff;
  --accent-soft:rgba(77,141,255,.14);
  --bg:#0b0d12;
  --bg-2:#10131a;
  --text-1:#f4f5f7;
  --text-2:rgba(244,245,247,.68);
  --text-3:rgba(244,245,247,.42);
  --card:#151923;
  --card-border:rgba(255,255,255,.08);
  --ok:#3dd68c;
  --danger:#ff5d5d;
  --gold:#ffd23f;
  /* 液态玻璃通用材质（与主站同款） */
  --glass-grad:linear-gradient(120deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.07) 38%,rgba(255,255,255,.12) 62%,rgba(255,255,255,.05) 100%);
  --glass-blur:blur(22px) saturate(200%) brightness(1.12);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text-1);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  /* 背景双光斑：主站 hero 的氛围感，纯装饰固定不动 */
  background-image:
    radial-gradient(900px 500px at 85% -10%,rgba(77,141,255,.12),transparent 60%),
    radial-gradient(700px 460px at -10% 110%,rgba(180,77,255,.10),transparent 60%);
  background-attachment:fixed;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#fff}

/* ===================== 液态玻璃胶囊导航（主站同款） ===================== */
.nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:100;
  display:flex;align-items:center;gap:10px;
  height:48px;padding:0 18px;
  border-radius:999px;white-space:nowrap;
  max-width:calc(100vw - 24px);
  isolation:isolate;
  background:var(--glass-grad);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  transition:box-shadow .35s ease;
}
.nav:hover{
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.30),
    inset 0 1.5px .5px -1px rgba(255,255,255,.8),
    inset 0 -1px .5px -1px rgba(255,255,255,.34),
    0 14px 42px rgba(6,10,25,.34);
}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.nav-brand .dot{
  width:9px;height:9px;border-radius:99px;
  background:var(--accent);
  box-shadow:0 0 10px rgba(77,141,255,.9);
  animation:dotPulse 2.4s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.45}}
.nav-link{
  font-size:13px;font-weight:600;color:var(--text-2);
  padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  transition:background .2s,color .2s,transform .2s;
}
.nav-link:hover{background:rgba(255,255,255,.18);color:var(--text-1);transform:translateY(-1px)}

/* ===================== 主体 ===================== */
.wrap{
  max-width:520px;margin:0 auto;
  padding:120px 20px 60px;
  animation:fadeUp .6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
/* 区块标题（主站同款：左侧小横线） */
.section-label{
  display:flex;align-items:center;gap:14px;
  font-size:12.5px;font-weight:700;letter-spacing:.22em;
  color:var(--text-2);text-transform:uppercase;
  margin-bottom:14px;
}
.section-label::before{
  content:"";width:34px;height:2.5px;border-radius:99px;
  background:var(--accent);
}
h1{font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:.01em;margin-bottom:8px}
.subtitle{font-size:15px;line-height:1.7;color:var(--text-2);margin-bottom:28px}

/* ===================== 玻璃卡片 ===================== */
.card{
  border-radius:var(--radius);
  background:var(--glass-grad);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.18),
    inset 0 1.5px .5px -1px rgba(255,255,255,.5),
    0 14px 38px rgba(6,10,25,.28);
  padding:26px 24px;
}
.form-card{margin-bottom:18px}
.form-card.shake{animation:shake .4s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(3px)}
}

/* ===================== 表单控件 ===================== */
.field{margin-bottom:16px}
.field label{
  display:block;font-size:13px;font-weight:600;
  color:var(--text-2);margin-bottom:7px;letter-spacing:.02em;
}
.inp{
  width:100%;padding:12px 14px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:var(--text-1);font-size:15px;
  font-family:inherit;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.inp::placeholder{color:var(--text-3)}
.inp:focus{
  outline:none;border-color:rgba(77,141,255,.55);
  box-shadow:0 0 0 3px var(--accent-soft);
  background:rgba(255,255,255,.09);
}
/* 密码框 + 小眼睛 */
.pwd-wrap{position:relative}
.pwd-wrap .inp{padding-right:44px}
.eye{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:10px;
  display:grid;place-items:center;
  color:var(--text-3);transition:color .2s,background .2s;
}
.eye:hover{color:var(--text-1);background:rgba(255,255,255,.10)}
.eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eye .eye-off-line{display:none}
.eye.off .eye-open{display:none}
.eye.off .eye-off-line{display:block}

/* 主按钮：主站同款彩虹流光描边 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 26px;border-radius:12px;
  font-size:15px;font-weight:600;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-primary{
  position:relative;z-index:0;width:100%;
  color:#fff;
  border:1.5px solid transparent;
  background:
    linear-gradient(#0b0f1a,#0b0f1a) padding-box,
    linear-gradient(115deg,#4d8dff,#b44dff,#ff5fa2,#ff8a3d,#ffd23f,#4d8dff) border-box;
  background-size:100% 100%,300% 100%;
  animation:rb-border 6s linear infinite;
}
@keyframes rb-border{
  from{background-position:0% 50%,0% 50%}
  to{background-position:0% 50%,300% 50%}
}
.btn-primary::before{
  content:"";position:absolute;inset:-3px;z-index:-1;
  border-radius:inherit;
  background:linear-gradient(115deg,#4d8dff,#b44dff,#ff5fa2,#ff8a3d,#ffd23f,#4d8dff);
  background-size:300% 100%;
  filter:blur(16px);opacity:.55;
  animation:rb-glow 6s linear infinite;
  transition:opacity .25s,filter .25s;
}
@keyframes rb-glow{
  from{background-position:0% 50%}
  to{background-position:300% 50%}
}
.btn-primary:hover::before{opacity:.85;filter:blur(20px)}
.btn-primary:disabled{cursor:wait;opacity:.75;transform:none}
.btn-primary:disabled::before{opacity:.25}

/* 错误提示（统一话术，不泄露是账号还是密码的问题） */
.err{
  display:none;margin-top:14px;padding:11px 14px;
  border-radius:12px;font-size:13.5px;font-weight:600;
  color:var(--danger);
  background:rgba(255,93,93,.10);
  border:1px solid rgba(255,93,93,.25);
}
.err.show{display:block;animation:fadeUp .3s ease both}

/* ===================== 查询结果卡 ===================== */
.result{display:none}
.result.show{display:block;animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
.r-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.avatar{
  width:52px;height:52px;border-radius:16px;flex:none;
  display:grid;place-items:center;
  font-size:22px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#4d8dff,#b44dff);
  box-shadow:0 6px 18px rgba(77,141,255,.35);
}
.r-name{font-size:18px;font-weight:800}
.r-sub{font-size:12.5px;color:var(--text-3);margin-top:2px}
.r-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 13px;border-radius:999px;
  font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  color:var(--text-2);
}
.badge .bd{width:7px;height:7px;border-radius:99px;background:currentColor}
.badge.ok{color:var(--ok);background:rgba(61,214,140,.10);border-color:rgba(61,214,140,.28)}
.badge.gold{
  color:#14110a;background:linear-gradient(115deg,#ffd23f,#ff9f43,#ffe98a);
  border-color:rgba(255,210,63,.5);
  box-shadow:0 3px 14px rgba(255,190,63,.3);
}
.badge.gold .bd{background:#14110a}
.badge.expired{color:var(--danger);background:rgba(255,93,93,.10);border-color:rgba(255,93,93,.28)}
.badge.plain{color:var(--text-3)}
/* 信息行 */
.rows{display:grid;gap:0;border-radius:14px;overflow:hidden;
  background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.07)}
.row{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:12px 15px;font-size:14px;
}
.row+.row{border-top:1px solid rgba(255,255,255,.06)}
.row .k{color:var(--text-3);font-size:12.5px;flex:none;font-weight:600}
.row .v{color:var(--text-1);font-weight:600;text-align:right;word-break:break-all}
.row .v.danger{color:var(--danger)}
.row .v.gold{
  background:linear-gradient(115deg,#ffd23f,#ff9f43);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.r-note{
  margin-top:14px;padding:12px 15px;border-radius:14px;
  font-size:13.5px;line-height:1.7;color:var(--text-2);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  white-space:pre-wrap;word-break:break-all;
}
.r-note:empty{display:none}
.r-note .nk{color:var(--text-3);font-size:12px;font-weight:700;letter-spacing:.08em;display:block;margin-bottom:4px}

/* ===================== 页脚 / Toast ===================== */
footer{
  text-align:center;padding:30px 0 36px;
  font-size:12.5px;color:var(--text-3);
}
footer a{color:var(--text-2);border-bottom:1px dashed rgba(255,255,255,.2)}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  z-index:200;padding:11px 20px;border-radius:999px;
  font-size:13.5px;font-weight:600;color:#fff;
  background:var(--glass-grad);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 14px 38px rgba(6,10,25,.35);
  opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 减少动效偏好：全部关掉（主站同款习惯） */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .wrap{animation:none}
}
@media (max-width:420px){
  .wrap{padding-top:104px}
  .card{padding:22px 18px}
}
</style>
</head>
<body>

<!-- 液态玻璃胶囊导航 -->
<nav class="nav">
  <span class="nav-brand"><span class="dot"></span>鉴业のVIP查询</span>
  <a class="nav-link" href="admin.html">管理入口</a>
</nav>

<main class="wrap">
  <div class="section-label">VIP Query</div>
  <h1>VIP 状态查询</h1>
  <p class="subtitle">输入你的账号与密码，查询会员类型、到期时间与备注信息。<br>账号或密码任一不对都会得到同样的提示，放心尝试。</p>

  <!-- 登录 / 查询表单 -->
  <form class="card form-card" id="loginForm" autocomplete="off">
    <div class="field">
      <label for="username">用户名</label>
      <input class="inp" id="username" type="text" placeholder="请输入用户名" spellcheck="false" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <div class="pwd-wrap">
        <input class="inp" id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
        <button type="button" class="eye" id="eyeBtn" aria-label="显示或隐藏密码">
          <svg viewBox="0 0 24 24">
            <path class="eye-open" d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/>
            <circle class="eye-open" cx="12" cy="12" r="2.8"/>
            <path class="eye-off-line" d="M4 4l16 16"/>
            <path class="eye-off-line" d="M2.5 12s3.5-6.5 9.5-6.5c1.8 0 3.4.6 4.8 1.4M21.5 12s-3.5 6.5-9.5 6.5c-1.8 0-3.4-.6-4.8-1.4"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="btn btn-primary" id="btnQuery" type="submit">查 询</button>
    <div class="err" id="err">账号或密码错误</div>
  </form>

  <!-- 查询结果（验证通过才显示） -->
  <section class="card result" id="result" aria-live="polite">
    <div class="r-head">
      <div class="avatar" id="rAvatar">V</div>
      <div>
        <div class="r-name" id="rName">—</div>
        <div class="r-sub" id="rSub">—</div>
      </div>
    </div>
    <div class="r-badges" id="rBadges"></div>
    <div class="rows" id="rRows"></div>
    <div class="r-note" id="rNote"></div>
  </section>
</main>

<footer>鉴业の小站 · 纯前端 VIP 查询系统 · <a href="admin.html">管理员入口</a></footer>
<div class="toast" id="toast"></div>

<script src="cipher.js"></script>
<script>
/* =====================================================================
 * 用户查询页逻辑
 * ---------------------------------------------------------------------
 * 流程：读取 vip.txt → 按用户名找行 → 解密密文 → 比对密码 → 渲染结果
 * 任何一环失败（用户名不存在 / 密文坏 / 密码不对）→ 统一提示「账号或密码错误」
 *
 * ⚠ 密钥必须与 admin.html 顶部的完全一致，改的时候两个文件一起改！
 * ===================================================================== */
const JY_SECRET = "jianye-vip-secret-2026";   /* ← 与 admin.html 保持一致，请改成你自己的 */

/* ---------- 小工具 ---------- */
const $ = id => document.getElementById(id);
let toastTimer = 0;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function showErr(){
  $("err").textContent = "账号或密码错误";   /* 统一话术，永远这一句 */
  $("err").classList.add("show");
  const card = $("loginForm");
  card.classList.remove("shake");
  void card.offsetWidth;                     /* 重新触发抖动动画 */
  card.classList.add("shake");
}
function hideErr(){ $("err").classList.remove("show"); }

/* ---------- 密码小眼睛 ---------- */
$("eyeBtn").addEventListener("click", () => {
  const inp = $("password");
  const off = inp.type === "text";
  inp.type = off ? "password" : "text";
  $("eyeBtn").classList.toggle("off", !off);
});

/* ---------- 配置文件读取与解析 ----------
 * vip.txt 每行：用户名|JY1.xxxxx   # 开头为注释，空行跳过 */
async function loadDB(){
  const r = await fetch("vip.txt", { cache: "no-cache" });
  if (!r.ok) throw new Error("config-not-found");
  const text = await r.text();
  if (/^\s*</.test(text)) throw new Error("config-not-found");   /* 404 兜底页等 */
  const list = [];
  for (let line of text.split(/\r?\n/)){
    line = line.trim();
    if (!line || line.charAt(0) === "#") continue;
    const i = line.indexOf("|");
    if (i < 1) continue;
    list.push({ user: line.slice(0, i).trim(), cipher: line.slice(i + 1).trim() });
  }
  return list;
}

/* ---------- VIP 状态判定 ----------
 * 永久VIP（t=permanent）→ 永不过期
 * 限时VIP（t=time）     → 到期时间过后自动判为已过期
 * 普通用户（t=none）    → 无 VIP */
function judgeVIP(d){
  const now = new Date();
  const st = { perm: false, active: false, expired: false, expText: "", remain: null };
  if (d.t === "permanent"){
    st.perm = true; st.active = true;
    st.expText = "永久有效";
  } else if (d.t === "time" && d.e){
    const exp = new Date(d.e + "T23:59:59");
    st.expText = d.e;
    if (now > exp){ st.expired = true; }
    else {
      st.active = true;
      st.remain = Math.max(1, Math.ceil((exp - now) / 86400000));
    }
  }
  return st;
}

/* ---------- 徽章与结果渲染 ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function render(d, issuedText){
  const st = judgeVIP(d);
  $("rName").textContent = d.u;
  $("rSub").textContent = "签发于 " + issuedText;
  $("rAvatar").textContent = (d.u || "?").trim().charAt(0).toUpperCase() || "?";

  /* 状态徽章：永久VIP（金） / 有效VIP（绿） / 已过期（红） / 普通用户（灰） */
  const badges = [];
  if (st.perm)        badges.push('<span class="badge gold"><span class="bd"></span>永久 VIP</span>');
  else if (st.active) badges.push('<span class="badge ok"><span class="bd"></span>VIP 生效中</span>');
  else if (st.expired)badges.push('<span class="badge expired"><span class="bd"></span>VIP 已过期</span>');
  else                badges.push('<span class="badge plain"><span class="bd"></span>普通用户</span>');
  if (st.active && !st.perm && st.remain !== null)
    badges.push('<span class="badge ok"><span class="bd"></span>剩余 ' + st.remain + ' 天</span>');
  if (st.expired) badges.push('<span class="badge plain">已失效</span>');
  $("rBadges").innerHTML = badges.join("");

  /* 信息行 */
  const rows = [];
  rows.push('<div class="row"><span class="k">会员类型</span><span class="v">' +
    (st.perm ? '<span class="gold">永久 VIP</span>' : (d.t === "time" ? "限时 VIP" : "普通用户")) + '</span></div>');
  rows.push('<div class="row"><span class="k">到期时间</span><span class="v' +
    (st.expired ? " danger" : (st.perm ? " gold" : "")) + '">' +
    esc(st.expText || "—") + '</span></div>');
  rows.push('<div class="row"><span class="k">当前状态</span><span class="v' +
    (st.expired ? " danger" : (st.active && st.perm ? " gold" : (st.active ? "" : ""))) + '">' +
    (st.perm ? "永久有效，无需续期"
      : st.active ? "有效（剩 " + st.remain + " 天）"
      : st.expired ? "已于 " + esc(st.expText) + " 过期"
      : "未开通 VIP") + '</span></div>');
  $("rRows").innerHTML = rows.join("");

  /* 备注（有才显示） */
  $("rNote").innerHTML = d.n
    ? '<span class="nk">备注 NOTE</span>' + esc(d.n)
    : "";
  $("result").classList.add("show");
  $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------- 提交查询 ---------- */
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  hideErr();
  const u = $("username").value.trim();
  const p = $("password").value;
  if (!u || !p){ showErr(); return; }

  const btn = $("btnQuery");
  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = "查询中…";
  try {
    const db = await loadDB();
    /* 用户名不区分大小写匹配；密码严格比对 */
    const hit = db.find(x => x.user.toLowerCase() === u.toLowerCase());
    if (!hit) throw new Error("no-user");
    const d = JYCipher.decrypt(hit.cipher, JY_SECRET);   /* 密钥/校验不对会抛错 */
    if (String(d.u).toLowerCase() !== u.toLowerCase() || String(d.p) !== p) throw new Error("mismatch");

    const issued = d.i ? new Date(d.i).toLocaleDateString("zh-CN") : "未知";
    render(d, issued);
    toast("验证通过，欢迎回来，" + d.u);
  } catch (err){
    $("result").classList.remove("show");
    if (err && (err.message === "config-not-found" || err.name === "TypeError")){
      /* 配置文件没读到属于环境问题，如实提示，不冒充「账号密码错误」 */
      $("err").textContent = "配置文件读取失败：请通过 HTTP 方式访问本页（如本地起个静态服务器），并确认 vip.txt 与页面同目录";
      $("err").classList.add("show");
    } else {
      showErr();   /* 其余一切失败 → 统一「账号或密码错误」 */
    }
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
});
</script>
</body>
</html>
