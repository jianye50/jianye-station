<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>用户VIP状态查询 | Jianye</title>
<style>
:root{
  --bg:#080a10;
  --line:rgba(255,255,255,.09);
  --text:#eef1f8;
  --muted:#8b93a8;
  --blue:#4f7cff;
  --violet:#8b5cf6;
  --green:#37d67a;
  --red:#ff5f6d;
}
*{margin:0;padding:0;box-sizing:border-box;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
body{
  min-height:100vh;display:grid;place-items:center;padding:28px 18px;
  background:var(--bg);color:var(--text);overflow-x:hidden;position:relative;
  -webkit-font-smoothing:antialiased;
}
/* ---------- 背景 ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg i{position:absolute;border-radius:50%;filter:blur(110px);}
.bg i:nth-child(1){width:520px;height:520px;background:#2f4fd4;opacity:.42;top:-180px;left:-140px;animation:drift1 18s ease-in-out infinite;}
.bg i:nth-child(2){width:460px;height:460px;background:#7b2ff7;opacity:.34;bottom:-190px;right:-120px;animation:drift2 22s ease-in-out infinite;}
.bg i:nth-child(3){width:320px;height:320px;background:#0fb6a8;opacity:.16;top:45%;left:60%;animation:drift1 26s ease-in-out infinite reverse;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(60px,44px) scale(1.12);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-52px,-38px) scale(1.1);}}
.bg::after{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 20%,transparent 78%);
          mask-image:radial-gradient(circle at 50% 42%,#000 20%,transparent 78%);
}
/* ---------- 卡片 ---------- */
.wrap{
  position:relative;z-index:1;width:100%;max-width:452px;
  padding:42px 34px 34px;border-radius:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.028));
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09);
  animation:in .7s cubic-bezier(.16,1,.3,1) both;
}
.wrap::before{
  content:"";position:absolute;inset:-1px;border-radius:26px;z-index:-1;
  background:linear-gradient(140deg,rgba(79,124,255,.55),transparent 42%,transparent 62%,rgba(139,92,246,.5));
  opacity:.5;filter:blur(1px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
  animation:ring 9s linear infinite;
}
@keyframes ring{0%{opacity:.25;}50%{opacity:.6;}100%{opacity:.25;}}
@keyframes in{from{opacity:0;transform:translateY(26px) scale(.985);}to{opacity:1;transform:none;}}

/* ---------- 头部 ---------- */
.head{text-align:center;margin-bottom:32px;animation:up .6s .06s cubic-bezier(.16,1,.3,1) both;}
.mark{
  width:52px;height:52px;margin:0 auto 16px;border-radius:16px;
  display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--violet));
  box-shadow:0 12px 28px rgba(79,124,255,.4),inset 0 1px 0 rgba(255,255,255,.4);
  font-size:23px;animation:pulse 3.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 12px 28px rgba(79,124,255,.35),inset 0 1px 0 rgba(255,255,255,.4);}
  50%{box-shadow:0 12px 38px rgba(139,92,246,.55),inset 0 1px 0 rgba(255,255,255,.4);}}
.head h1{
  font-size:25px;font-weight:700;letter-spacing:.6px;
  background:linear-gradient(96deg,#fff 30%,#b6c6ff 70%,#dcc8ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.head p{margin-top:9px;font-size:13px;color:var(--muted);letter-spacing:.3px;}
@keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* ---------- 表单 ---------- */
.field{margin-bottom:19px;animation:up .6s cubic-bezier(.16,1,.3,1) both;}
.field:nth-of-type(1){animation-delay:.13s;}
.field:nth-of-type(2){animation-delay:.19s;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:9px;letter-spacing:.4px;}
.inp{
  width:100%;padding:15px 16px 15px 44px;font-size:15px;color:var(--text);
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;
  outline:none;transition:border-color .28s,box-shadow .28s,background .28s;
}
.inp::placeholder{color:#616a80;}
.inp:focus{
  border-color:rgba(79,124,255,.85);background:rgba(79,124,255,.08);
  box-shadow:0 0 0 4px rgba(79,124,255,.14),0 0 24px rgba(79,124,255,.12);
}
.box{position:relative;}
.box .ico{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:15px;opacity:.55;pointer-events:none;transition:opacity .28s,transform .28s;
}
.inp:focus+.ico,.box:focus-within .ico{opacity:.95;}

.btn{
  width:100%;padding:15px;margin-top:8px;border:0;border-radius:14px;cursor:pointer;
  font-size:15px;font-weight:600;letter-spacing:.7px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  box-shadow:0 12px 28px rgba(79,124,255,.32);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,filter .22s;
  animation:up .6s .25s cubic-bezier(.16,1,.3,1) both;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(79,124,255,.44);filter:brightness(1.07);}
.btn:active{transform:translateY(0) scale(.985);}
.btn:disabled{opacity:.72;cursor:not-allowed;transform:none;filter:none;}
.btn::after{
  content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-18deg);animation:sheen 3.6s ease-in-out infinite;
}
@keyframes sheen{0%{left:-60%;}55%{left:130%;}100%{left:130%;}}
.spinner{
  display:inline-block;width:14px;height:14px;margin-right:9px;vertical-align:-2px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;
  animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- 提示 ---------- */
.err{
  margin-top:18px;padding:13px 15px;font-size:13.5px;border-radius:13px;
  color:#ffb4ba;background:rgba(255,95,109,.09);border:1px solid rgba(255,95,109,.28);
  display:none;
}
.err.on{display:block;animation:shake .45s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes shake{
  10%,90%{transform:translateX(-2px);}
  25%,75%{transform:translateX(5px);}
  45%,55%{transform:translateX(-7px);}
  60%{transform:translateX(6px);}
}

/* ---------- 结果 ---------- */
.card{
  margin-top:22px;border-radius:18px;overflow:hidden;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  max-height:0;opacity:0;transform:translateY(10px);
  transition:max-height .55s cubic-bezier(.16,1,.3,1),opacity .4s,transform .45s,margin .4s;
}
.card.open{max-height:420px;opacity:1;transform:none;}
.card-top{
  display:flex;align-items:center;gap:11px;padding:17px 18px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:linear-gradient(90deg,rgba(79,124,255,.12),transparent 70%);
}
.avatar{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  font-size:15px;font-weight:700;color:#fff;
  background:linear-gradient(140deg,var(--blue),var(--violet));
  box-shadow:0 6px 16px rgba(79,124,255,.3);
}
.card-top .who{font-size:15.5px;font-weight:600;}
.card-top .who small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;}
.row{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 18px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.055);
  opacity:0;transform:translateX(12px);
}
.card.open .row{animation:rowin .45s cubic-bezier(.16,1,.3,1) both;}
.card.open .row:nth-child(3){animation-delay:.06s;}
.card.open .row:nth-child(4){animation-delay:.12s;}
.card.open .row:nth-child(5){animation-delay:.18s;}
.card.open .row:nth-child(6){animation-delay:.24s;}
@keyframes rowin{to{opacity:1;transform:none;}}
.row:last-child{border-bottom:0;}
.row .k{color:var(--muted);}
.row .v{font-weight:500;}

.tag{padding:5px 13px;border-radius:9px;font-size:12.5px;font-weight:600;letter-spacing:.3px;}
.t-vip{color:var(--green);background:rgba(55,214,122,.13);border:1px solid rgba(55,214,122,.28);box-shadow:0 0 18px rgba(55,214,122,.14);}
.t-perm{color:#ffd166;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.3);box-shadow:0 0 18px rgba(255,209,102,.15);}
.t-exp{color:var(--red);background:rgba(255,95,109,.11);border:1px solid rgba(255,95,109,.28);}
.t-normal{color:var(--muted);background:rgba(255,255,255,.07);border:1px solid var(--line);}

@media(max-width:420px){
  .wrap{padding:34px 22px 26px;border-radius:20px;}
  .head h1{font-size:21.5px;}
  .inp{padding-left:42px;}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<main class="wrap">
  <header class="head">
    <div class="mark">◆</div>
    <h1>用户VIP状态查询</h1>
    <p>登录以查看你的会员状态</p>
  </header>

  <div class="field">
    <label>用户名称</label>
    <div class="box"><input class="inp" id="username" placeholder="请输入用户名" autocomplete="off"><span class="ico">◍</span></div>
  </div>

  <div class="field">
    <label>密码</label>
    <div class="box"><input class="inp" id="password" type="password" placeholder="请输入密码"><span class="ico">⌘</span></div>
  </div>

  <button class="btn" id="btn" onclick="searchUser()">查询用户信息</button>

  <div class="err" id="err"></div>

  <section class="card" id="card">
    <div class="card-top">
      <div class="avatar" id="ava">A</div>
      <div class="who"><span id="r-user">用户名</span><small>查询结果</small></div>
    </div>
    <div class="row"><span class="k">VIP状态</span><span class="v" id="r-vip"></span></div>
    <div class="row"><span class="k">VIP到期时间</span><span class="v" id="r-exp"></span></div>
    <div class="row"><span class="k">备注</span><span class="v" id="r-note"></span></div>
  </section>
</main>

<script>
/* ===== 必须与 hash.html 完全一致，否则解密失败 ===== */
const SALT = 'jype-top-salt-2026';
const ITERATIONS = 100000;

function b64ToBytes(b64){
  const bin = atob(b64.replace(/\s+/g,''));
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function deriveKey(password){
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    'raw', enc.encode(password + SALT), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:enc.encode(SALT), iterations:ITERATIONS, hash:'SHA-256'},
    material, {name:'AES-GCM', length:256}, false, ['decrypt']
  );
}

/* 解密失败（密码错误）返回 null */
async function decryptPayload(b64, password){
  try{
    const raw = b64ToBytes(b64);
    const iv = raw.slice(0, 12);
    const data = raw.slice(12);
    const key = await deriveKey(password);
    const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
    return JSON.parse(new TextDecoder().decode(buf));
  }catch(e){
    return null;
  }
}

function parseDate(str){
  const p = String(str).trim().split(/[-/.]/);
  if(p.length !== 3) return null;
  const y = parseInt(p[0],10), m = parseInt(p[1],10) - 1, d = parseInt(p[2],10);
  if([y,m,d].some(isNaN)) return null;
  return new Date(y, m, d, 23, 59, 59); // 到期日当天仍有效
}

function showError(msg){
  const err = document.getElementById('err');
  err.textContent = msg;
  err.classList.remove('on');
  void err.offsetWidth;
  err.classList.add('on');
}

function statusTag(vip, expire){
  const v = String(vip||'').trim();
  const e = String(expire||'').trim();
  if(v.toUpperCase() !== 'VIP'){
    return '<span class="tag t-normal">' + (v || '普通用户') + '</span>';
  }
  if(e === '永久' || e === '永久VIP'){
    return '<span class="tag t-perm">永久VIP</span>';
  }
  const d = parseDate(e);
  if(d && d < new Date()){
    return '<span class="tag t-exp">已过期</span>';
  }
  return '<span class="tag t-vip">VIP会员</span>';
}

async function searchUser(){
  const name = document.getElementById('username').value.trim();
  const pwd  = document.getElementById('password').value;
  const err  = document.getElementById('err');
  const card = document.getElementById('card');
  const btn  = document.getElementById('btn');

  err.classList.remove('on');
  card.classList.remove('open');

  if(!name || !pwd){
    showError('用户名和密码不能为空');
    return;
  }

  btn.disabled = true;
  const oldText = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span>验证中…';

  try{
    const res = await fetch('./users.txt', {cache:'no-store'});
    if(!res.ok) throw new Error('read fail');
    const text = await res.text();

    let cipher = null;
    for(const rawLine of text.split(/\r?\n/)){
      const line = rawLine.trim();
      if(!line || line.startsWith('#')) continue;
      const parts = line.split('|');
      if(parts[0].trim() === name){
        cipher = (parts[1] || '').trim();
        break;
      }
    }

    if(!cipher){
      showError('用户名或密码错误');
      return;
    }

    const info = await decryptPayload(cipher, pwd);
    if(!info){
      showError('用户名或密码错误');
      return;
    }

    const uname = info.username || name;
    document.getElementById('r-user').textContent = uname;
    document.getElementById('ava').textContent = uname.slice(0,1).toUpperCase();
    document.getElementById('r-vip').innerHTML = statusTag(info.vip, info.expire);
    document.getElementById('r-exp').textContent = String(info.expire||'').trim() || '无';
    document.getElementById('r-note').textContent = String(info.note||'').trim() || '无';
    card.classList.add('open');
  }catch(e){
    showError('配置文件读取失败，请确认已通过 http(s) 访问并存在 users.txt');
  }finally{
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

document.getElementById('password').addEventListener('keydown', e=>{
  if(e.key === 'Enter') searchUser();
});
document.getElementById('username').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('password').focus();
});
</script>
</body>
</html>
