<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户VIP状态查询｜Jianye</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif;}
body{
    background:#12141a;
    color:#e8e8ed;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.wrap{
    width:100%;
    max-width:480px;
    background:#1b1e27;
    border-radius:14px;
    padding:36px 30px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
}
.title{
    text-align:center;
    font-size:24px;
    margin-bottom:28px;
    color:#ffffff;
}
.form-item{margin-bottom:20px;}
label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#b0b4c0;
}
input[type="text"]{
    width:100%;
    padding:13px 16px;
    background:#272b36;
    border:1px solid #333846;
    border-radius:8px;
    color:#fff;
    font-size:16px;
    outline:none;
}
input:focus{border-color:#4080ff;}
button{
    width:100%;
    padding:13px;
    background:#2563eb;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}
button:hover{background:#1d4ed8;}
.msg-error{
    margin-top:16px;
    padding:12px;
    background:#381e23;
    border-radius:8px;
    color:#f8a0a8;
}
.card-info{
    margin-top:22px;
    padding:20px;
    background:#222733;
    border-radius:10px;
}
.card-info h4{
    font-size:18px;
    margin-bottom:14px;
}
.info-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #2e3442;
}
.info-row:last-child{border-bottom:none;}
.label-text{color:#a1a6b8;}
.vip-tag{
    display:inline-block;
    padding:3px 10px;
    border-radius:4px;
    background:#0e422e;
    color:#4ade80;
}
.normal-tag{
    background:#2c313f;
    color:#b0b4c0;
}
.expired-tag{
    background:#3a2025;
    color:#f8a0a8;
}
</style>
</head>
<body>
<div class="wrap">
    <h2 class="title">用户VIP状态查询</h2>
    <div class="form-item">
        <label>输入用户名称</label>
        <input type="text" id="username" placeholder="请输入要查询的用户名">
    </div>
    <button onclick="searchUser()">查询用户信息</button>

    <div id="errBox" class="msg-error" style="display:none;"></div>
    <div id="resultBox" class="card-info" style="display:none;">
        <h4>查询结果</h4>
        <div class="info-row">
            <span class="label-text">用户名</span>
            <span id="r-name"></span>
        </div>
        <div class="info-row">
            <span class="label-text">VIP状态</span>
            <span id="r-vip"></span>
        </div>
        <div class="info-row">
            <span class="label-text">VIP到期时间</span>
            <span id="r-expire"></span>
        </div>
        <div class="info-row">
            <span class="label-text">备注</span>
            <span id="r-note"></span>
        </div>
    </div>
</div>

<script>
// 把 2026-9-01 / 2026-09-01 解析成当天 0 点的日期，避免时区偏差
function parseDate(str){
    const parts = str.trim().split(/[-/]/);
    if(parts.length !== 3) return null;
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10) - 1;
    const d = parseInt(parts[2], 10);
    if(isNaN(y) || isNaN(m) || isNaN(d)) return null;
    return new Date(y, m, d);
}

async function searchUser(){
    const nameInput = document.getElementById('username').value.trim();
    const errBox = document.getElementById('errBox');
    const resultBox = document.getElementById('resultBox');
    errBox.style.display = 'none';
    resultBox.style.display = 'none';

    if(!nameInput){
        errBox.innerText = "请输入用户名称";
        errBox.style.display = 'block';
        return;
    }

    const res = await fetch('./users.txt');
    const text = await res.text();
    const lines = text.split('\n');
    let target = null;

    for(let line of lines){
        line = line.trim();
        if(!line) continue;
        const arr = line.split('|');
        const uName = arr[0].trim();
        if(uName === nameInput){
            target = {
                username: arr[0].trim(),
                vip: arr[1]?.trim() || '普通用户',
                expire: arr[2]?.trim() || '',
                note: arr[3]?.trim() || '无'
            };
            break;
        }
    }

    if(!target){
        errBox.innerText = "未找到该用户";
        errBox.style.display = 'block';
        return;
    }

    // 判断状态：先看到期时间是否已过期
    const today = new Date();
    const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const expireDate = target.expire ? parseDate(target.expire) : null;
    const isExpired = expireDate !== null && expireDate < today0;

    let vipHtml;
    if(target.vip !== 'VIP'){
        vipHtml = '<span class="normal-tag">普通用户</span>';
    }else if(isExpired){
        vipHtml = '<span class="expired-tag">已过期</span>';
    }else{
        vipHtml = '<span class="vip-tag">VIP会员</span>';
    }

    document.getElementById('r-name').innerText = target.username;
    document.getElementById('r-vip').innerHTML = vipHtml;
    document.getElementById('r-expire').innerText = target.expire || '无';
    document.getElementById('r-note').innerText = target.note;
    resultBox.style.display = 'block';
}
</script>
</body>
</html>
