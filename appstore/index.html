<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>鉴业软件商店</title>
  <meta name="description" content="鉴业软件商店 · 精选 Windows 软件，直接下载官方安装包">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234d8dff'/%3E%3Cpath d='M20 26h24v18a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V26zm-2-8h28a2 2 0 0 1 2 2v4H16v-4a2 2 0 0 1 2-2zm14-4a3 3 0 0 1 3 3v1h-6v-1a3 3 0 0 1 3-3z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/app.css?v=20261117d">
</head>
<body>

  <!-- 滚动进度条 -->
  <div class="progress" id="progress" aria-hidden="true"><span></span></div>

  <!-- 悬浮胶囊导航（含搜索） -->
  <nav class="nav">
    <span class="nav-brand"><i class="nav-dot"></i>鉴业软件商店</span>
    <span class="nav-sep"></span>
    <div class="nav-search">
      <svg class="nav-search__ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="搜索软件名称、分类或厂商…" autocomplete="off" spellcheck="false">
      <button id="searchClear" class="nav-search__clear" type="button" aria-label="清空" hidden>&times;</button>
    </div>
    <span class="nav-sep nav-sep--tail"></span>
    <a class="nav-link" href="https://jype.top" target="_blank" rel="noopener">鉴业の小站 ↗</a>
  </nav>

  <main class="wrap">

    <header class="head">
      <span class="section-label">SOFTWARE STORE</span>
      <h1 class="title">鉴业软件商店</h1>
      <p class="sub">精选 Windows 软件 · 直接下载官方安装包</p>

      <div class="chips" id="catChips"></div>
    </header>

    <!-- 结果计数 -->
    <div class="meta" id="meta" hidden>
      <span id="metaCount"></span>
    </div>

    <!-- 软件列表 -->
    <div id="grid" class="grid" hidden></div>
    <div class="more-wrap" id="moreWrap" hidden>
      <button class="btn-more" id="moreBtn" type="button">加载更多</button>
    </div>

    <!-- 骨架屏 -->
    <div class="skeleton" id="skeleton">
      <div class="sk-grid">
        <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
        <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
      </div>
    </div>

    <!-- 空态 -->
    <div class="statebox" id="empty" hidden>
      <div class="statebox__ico">🔍</div>
      <h2>没有找到相关软件</h2>
      <p>换个关键词试试，或者清除筛选条件。</p>
      <button class="btn-ghost" id="emptyReset" type="button">清除搜索与筛选</button>
    </div>

    <!-- 错误态 -->
    <div class="statebox" id="error" hidden>
      <div class="statebox__ico">⚠️</div>
      <h2>数据加载失败</h2>
      <p id="errorMsg">网络异常，请稍后重试。</p>
      <button class="btn-primary" id="retryBtn" type="button">重新加载</button>
    </div>
  </main>

  <footer class="foot">
    <p>由 <a href="https://jype.top" target="_blank" rel="noopener">鉴业</a> 构建 · 安装包均来自软件官方发行渠道</p>
  </footer>

  <!-- 软件详情 -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__mask" id="sheetMask"></div>
    <div class="sheet__panel" role="dialog" aria-modal="true">
      <button class="sheet__close" id="sheetClose" type="button" aria-label="关闭">&times;</button>
      <div class="sheet__body" id="sheetBody"></div>
    </div>
  </div>

  <!-- 截图灯箱 -->
  <div class="lb" id="lightbox" hidden>
    <div class="lb__mask" data-lb-close></div>
    <button class="lb__nav lb__nav--prev" id="lbPrev" type="button" aria-label="上一张">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <figure class="lb__stage"><img id="lbImg" alt="" draggable="false"></figure>
    <button class="lb__nav lb__nav--next" id="lbNext" type="button" aria-label="下一张">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    </button>
    <div class="lb__bar">
      <span class="lb__count" id="lbCount"></span>
      <button class="lb__close" id="lbClose" type="button" aria-label="关闭">&times;</button>
    </div>
  </div>

  <!-- 回到顶部 -->
  <button class="to-top" id="toTop" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <div class="toast" id="toast" hidden></div>

  <script src="assets/js/app.js?v=20261117d"></script>
</body>
</html>
